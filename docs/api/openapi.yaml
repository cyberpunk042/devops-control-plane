  /api/tab-mesh/restart-chrome:
    post:
      operationId: restart_chrome
      summary: Orchestrated Chrome restart for CDP activation.
      tags:
        - tab_mesh
      description: >-
        1. Reads the user's email from the selected Chrome profile
        2. Schedules a background PS1 script: wait 2s, kill Chrome, relaunch
        3. Returns immediately with the email so the frontend can guide sign-in
        
        Chrome opens with a fresh debug profile + the admin panel URL.
        The user signs in with their Google account to restore sync data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_dir:
                  type: string
                  default: Default
                return_url:
                  type: string
                  default: 'http://127.0.0.1:8000'
                port:
                  type: integer
                  default: 9222
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Not running under WSL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Could not detect Windows user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

