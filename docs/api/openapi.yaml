paths:
  /:
    get:
      operationId: dashboard
      summary: Render the main dashboard.
      tags:
        - pages
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /api/artifacts/{name}/publishable:
    get:
      operationId: publishable_artifacts
      summary: List publishable files and available publish options for a target.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/{name}/release-notes:
    get:
      operationId: release_notes_preview
      summary: Generate release notes preview for a target.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/artifacts/build/{name}/stream:
    post:
      operationId: build_stream
      summary: Build an artifact target with SSE streaming output.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/builders:
    get:
      operationId: list_builders
      summary: List available artifact builders.
      tags:
        - artifacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/artifacts/detect:
    post:
      operationId: detect_targets
      summary: Auto-detect buildable artifact targets from project structure.
      tags:
        - artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_path:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/makefile/evolution:
    get:
      operationId: makefile_evolution
      summary: Analyze Makefile for operability issues and propose evolution.
      tags:
        - artifacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/artifacts/makefile/patch:
    post:
      operationId: makefile_patch
      summary: Apply remediation patches to the Makefile.
      tags:
        - artifacts
      description: >-
        Request body:
        {
        "apply_remediation": true,     # Apply venv prefix changes
        "add_targets": ["build", ...]  # Add proposed targets
        }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apply_remediation:
                  type: boolean
                  default: false
                add_targets:
                  type: array
                  default: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No Makefile found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/publish/{name}/stream:
    post:
      operationId: publish_stream
      summary: Publish an artifact with SSE streaming output.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publish_target:
                  type: string
                  default: github-release
                version:
                  type: string
                  default: ''
                release_notes:
                  type: string
                  default: ''
                tag_name:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/artifacts/publish/capabilities:
    get:
      operationId: publish_capabilities
      summary: Detect available publishing tools and auth.
      tags:
        - artifacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/artifacts/targets:
    get:
      operationId: list_targets
      summary: List all artifact targets with build status.
      tags:
        - artifacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

    post:
      operationId: create_target
      summary: Add a new artifact target.
      tags:
        - artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: ''
                kind:
                  type: string
                  default: local
                builder:
                  type: string
                  default: makefile
                description:
                  type: string
                  default: ''
                build_target:
                  type: string
                  default: ''
                build_cmd:
                  type: string
                  default: ''
                output_dir:
                  type: string
                  default: dist/
                modules:
                  type: array
                  default: []
                config:
                  type: object
                  default: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Target name is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Error 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/targets/{name}:
    delete:
      operationId: delete_target
      summary: Remove an artifact target.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    put:
      operationId: modify_target
      summary: Update an existing artifact target.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/targets/{name}/status:
    get:
      operationId: target_build_status
      summary: Get the last build status for a target.
      tags:
        - artifacts
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/artifacts/workflow/generate:
    post:
      operationId: workflow_generate
      summary: Generate and write the release.yml workflow file.
      tags:
        - artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publish_targets
              properties:
                publish_targets:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/artifacts/workflow/preview:
    get:
      operationId: workflow_preview
      summary: 'Preview the generated release.yml content (does NOT write).'
      tags:
        - artifacts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit:
    get:
      operationId: api_audit
      summary: 'Recent audit log entries (CLI operations from audit.ndjson).'
      tags:
        - api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/activity:
    get:
      operationId: api_audit_activity
      summary: 'Recent audit scan activity (DevOps + Audit tab scans).'
      tags:
        - api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/check-deps:
    post:
      operationId: audit_check_deps
      summary: Check if system packages are installed.
      tags:
        - audit
      description: >-
        Request body:
        {"packages": ["libssl-dev", "pkg-config"]}
        or with explicit pm:
        {"packages": ["openssl-devel"], "pkg_manager": "dnf"}
        
        If pkg_manager is not provided, auto-detects from system profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pkg_manager
              properties:
                packages:
                  type: array
                  default: []
                pkg_manager:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/check-updates:
    post:
      operationId: audit_check_updates
      summary: Check installed tools for version info.
      tags:
        - audit
      description: >-
        Request body (optional):
        {"tools": ["ruff", "docker"]}
        
        Response:
        {"updates": [{"tool": "ruff", "installed": true, "version": "0.5.1", ...}]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tools
              properties:
                tools:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/clients:
    get:
      operationId: audit_clients
      summary: audit_clients
      tags:
        - audit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/code-health:
    get:
      operationId: audit_code_health
      summary: 'L2: Code quality metrics — health scores, hotspots, naming.'
      tags:
        - audit
      description: >-
        Returns cached data instantly, or {"needs_scan": true} on cold
        cache.  Explicit ?bust forces synchronous recompute.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/data-status:
    post:
      operationId: audit_data_status
      summary: Check freshness of a data pack.
      tags:
        - audit
      description: >-
        Request body:
        {"pack_id": "spacy-en-core-web-sm"}
        
        Response:
        {"stale": true, "schedule": "weekly", "age_seconds": 604900, ...}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pack_id:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No pack_id specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/data-usage:
    get:
      operationId: audit_data_usage
      summary: Report disk usage of all known data pack directories.
      tags:
        - audit
      description: >-
        Response:
        {"packs": [{"type": "spacy", "path": "...", "size_bytes": N, "size_human": "1.2G"}, ...]}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/dependencies:
    get:
      operationId: audit_dependencies
      summary: audit_dependencies
      tags:
        - audit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/install-cache/artifacts:
    post:
      operationId: audit_cache_artifacts
      summary: Load cached artifact manifest for a tool.
      tags:
        - audit
      description: >-
        Request body:
        {"tool": "kubectl"}
        
        Response:
        {"step_id": {...artifact info...}} or null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No tool specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-cache/clear:
    post:
      operationId: audit_cache_clear
      summary: Clear cached artifacts for a tool or all tools.
      tags:
        - audit
      description: >-
        Request body:
        {"tool": "kubectl"}   — clear one tool
        {}                     — clear all
        
        Response:
        {"ok": true, "cleared": "kubectl"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/install-cache/status:
    get:
      operationId: audit_cache_status
      summary: Return summary of cached install artifacts.
      tags:
        - audit
      description: >-
        Response:
        {"cache_dir": "...", "tools": {"kubectl": {"files": 3, "size_mb": 12.3}},
        "total_size_mb": 45.6}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/install-plan:
    post:
      operationId: audit_install_plan
      summary: Generate an ordered install plan for a tool.
      tags:
        - audit
      description: >-
        Request body:
        {"tool": "cargo-outdated"}
        — or with choice answers (Phase 4 two-pass) —
        {"tool": "docker", "answers": {"variant": "docker-ce"}}
        
        Response:
        Plan dict with steps, or error if tool can't be installed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  default: {}
                tool:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No tool specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-plan/archive:
    post:
      operationId: audit_archive_plan
      summary: Archive a completed/cancelled plan.
      tags:
        - audit
      description: >-
        Request body:
        {"plan_id": "abc123..."}
        
        Response:
        {"ok": true, "plan_id": "abc123...", "status": "archived"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No plan_id specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-plan/cache:
    post:
      operationId: audit_cache_plan
      summary: Pre-download plan artifacts for offline installation.
      tags:
        - audit
      description: >-
        Request body:
        {"tool": "cargo-audit", "answers": {}}
        
        Response:
        {"ok": true, "cached_count": 3, "total_size_mb": 12.3,
        "download_estimates": {"10 Mbps": "2s", ...}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  default: {}
                tool:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No tool specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-plan/cancel:
    post:
      operationId: audit_cancel_plan
      summary: Cancel an interrupted/failed plan.
      tags:
        - audit
      description: >-
        Request body:
        {"plan_id": "abc123..."}
        
        Response:
        {"ok": true, "plan_id": "abc123...", "status": "cancelled"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No plan_id specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Error 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-plan/execute:
    post:
      operationId: audit_execute_plan
      summary: Execute an install plan with SSE streaming.
      tags:
        - audit
      description: >-
        Resolves a plan for the requested tool, then executes each step
        in order, streaming progress events to the client.
        
        Request body:
        {"tool": "cargo-audit", "sudo_password": "...", "answers": {}}
        
        SSE events:
        {"type": "step_start", "step": 0, "label": "..."}
        {"type": "log", "step": 0, "line": "..."}
        {"type": "step_done", "step": 0}
        {"type": "step_failed", "step": 0, "error": "..."}
        {"type": "done", "ok": true, "message": "..."}
        {"type": "done", "ok": false, "error": "..."}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sudo_password:
                  type: string
                  default: ''
                answers:
                  type: object
                  default: {}
                tool:
                  type: string
                  default: ''
      responses:
        '200':
          description: Streaming response
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: No tool specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-plan/execute-sync:
    post:
      operationId: audit_execute_plan_sync
      summary: 'Execute an install plan synchronously (non-streaming).'
      tags:
        - audit
      description: >-
        For CLI callers and batch operations. Returns a single JSON
        response when all steps are complete — no SSE stream.
        
        Request body:
        {"tool": "cargo-audit", "sudo_password": "...", "answers": {}}
        
        Response:
        {"ok": true, "tool": "cargo-audit", "steps_completed": 3, ...}
        or
        {"ok": false, "error": "...", "step": 1, ...}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sudo_password:
                  type: string
                  default: ''
                answers:
                  type: object
                  default: {}
                tool:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No tool specified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/audit/install-plan/pending:
    get:
      operationId: audit_pending_plans
      summary: 'Return a list of resumable (paused/failed) plans.'
      tags:
        - audit
      description: >-
        Response:
        {"plans": [{"plan_id": "...", "tool": "...", "status": "failed",
        "completed_steps": [...], "steps": [...]}]}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object

  /api/audit/install-plan/resume:
    post:
      operationId: audit_resume_plan
      summary: Resume a paused or failed installation plan via SSE.
      tags:
        - audit
      description: >-
        Request body:
        {"plan_id": "abc123...", "sudo_password": "..."}
        
        SSE events: same as /audit/install-plan/execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sudo_password:
                  type: string
                  default: ''
                plan_id:
                  type: string
                  default: ''
      responses:
        '200':
          description: Streaming response
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: No plan_id specified
          content:
            application/json:
