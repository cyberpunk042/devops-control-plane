  /api/tab-mesh/discover-target:
    post:
      operationId: discover_target
      summary: 'Discover a tab''s Chrome target ID by matching its mesh tab ID.'
      tags:
        - tab_mesh
      description: >-
        The requesting tab must set ``window.__meshTabId`` before calling.
        The backend evaluates that expression on candidate CDP targets
        to find the exact match.
        
        Request body::
        
        { "meshTabId": "abc-123", "url": "http://localhost:8000/" }
        
        Returns::
        
        { "chromeTargetId": "CHROME-TARGET-ID" }
        { "chromeTargetId": null, "reason": "..." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - meshTabId
              properties:
                meshTabId:
                  type: string
                url:
                  type: string
                  default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Error 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/tab-mesh/focus:
    post:
      operationId: focus_tab
      summary: Focus a browser tab via CDP.
      tags:
        - tab_mesh
      description: >-
        Accepts EITHER a direct Chrome target ID (preferred, exact) or
        a URL pattern fallback::
        
        { "targetId": "CHROME-TARGET-ID" }          # exact
        { "urlPattern": "/pages/site/docs/", ... }   # fallback
        
        Returns::
        
        { "success": true, "url": "...", "targetId": "..." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetId
                - excludeUrl
              properties:
                targetId:
                  type: string
                urlPattern:
                  type: string
                  default: /
                excludeUrl:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '503':
          description: Error 503
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

