  /pages/site/{segment}/:
    get:
      operationId: serve_pages_site
      summary: Serve built pages output as a static site.
      tags:
        - pages
      description: >-
        This is the integrated hosting — the built output is served
        directly by Flask at a stable URL. No random ports, no
        separate processes, works after restart.
        
        Handles:
        - Direct file requests (CSS, JS, images, etc.)
        - SPA fallback: if the file doesn't exist but an index.html
        exists in the requested directory, serve that instead
        (needed for Docusaurus client-side routing)
      parameters:
        - name: segment
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File download

  /pages/site/{segment}/{filepath}:
    get:
      operationId: serve_pages_site
      summary: Serve built pages output as a static site.
      tags:
        - pages
      description: >-
        This is the integrated hosting — the built output is served
        directly by Flask at a stable URL. No random ports, no
        separate processes, works after restart.
        
        Handles:
        - Direct file requests (CSS, JS, images, etc.)
        - SPA fallback: if the file doesn't exist but an index.html
        exists in the requested directory, serve that instead
        (needed for Docusaurus client-side routing)
      parameters:
        - name: segment
          in: path
          required: true
          schema:
            type: string
        - name: filepath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File download

  /sw.js:
    get:
      operationId: service_worker
      summary: Serve the Tab Mesh service worker at the root scope.
      tags:
        - pages
      description: >-
        The SW must be at ``/sw.js`` (not ``/static/sw.js``) so that
        ``navigator.serviceWorker.register('/sw.js', { scope: '/' })``
        places it at the root scope, giving it control over all pages
        on this origin (admin panel + Docusaurus sites).
      responses:
        '200':
          description: File download
