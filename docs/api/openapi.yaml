  /api/tab-mesh/cdp-remediate:
    post:
      operationId: cdp_remediate
      summary: Apply Chrome debugging flags to selected shortcuts.
      tags:
        - tab_mesh
      description: >-
        For each shortcut:
        1. If ``keep_backup`` is true (default), clones the original to
        ``Chrome - OLD.lnk`` with clean args and normal icon (chrome.exe,4)
        — unless a backup already exists.
        2. Modifies the main shortcut: adds debug args + sets dev icon
        (chrome.exe,8).
        
        Request body::
        
        {
        "shortcuts": ["taskbar", "desktop", "start_menu_global"],
        "profile_dir": "Default",
        "port": 9222,
        "keep_backup": true
        }
        
        Returns::
        
        {
        "results": {
        "taskbar": {
        "shortcut_ok": true,
        "backup_ok": true,
        "backup_skipped": false
        },
        ...
        },
        "requires_restart": true
        }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shortcuts:
                  type: array
                  default: []
                profile_dir:
                  type: string
                  default: Default
                port:
                  type: integer
                  default: 9222
                keep_backup:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Not running under WSL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Could not detect Windows user
          content:
            application/json:
              schema:
                type: object
