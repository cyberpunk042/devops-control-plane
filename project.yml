version: 1
name: devops-control-plane
description: A general-purpose project control plane for DevOps automation
repository: github.com/cyberpunk042/devops-control-plane
owners:
- name: Cyberpunk 042
  github: cyberpunk042
domains:
- library
- ops
- docs
environments:
- default: true
  description: New development
  name: development
- default: false
  description: Production environment
  name: production
modules:
- description: Domain models, services, and engine
  domain: library
  name: core
  path: src/core
  stack: python-lib
- description: Tool bindings for git, docker, etc.
  domain: library
  name: adapters
  path: src/adapters
  stack: python-lib
- description: Click-based CLI interface
  domain: ops
  name: cli
  path: src/ui/cli
  stack: python-cli
  version_plan:
    target: '3.8'
    date: Now
    checklist:
    - label: Update requires-python in pyproject.toml
      description: Change >=3.8 to >=3.8 to widen compatibility range
      id: edit_pyproject_requires_python:db166491
      done: true
    - label: Scan for features not available in Python 3.8
      description: Find code patterns that require a newer Python than 3.8
      id: scan_incompatible_features:40877a0f
      done: true
    - label: Add __future__ annotations import where needed
      description: Enable PEP 604 (X | Y) and PEP 585 (builtin generics) syntax on
        older Python via deferred evaluation
      id: add_future_annotations:7135c841
      done: true
    - label: Review and fix incompatible syntax patterns
      description: Shows each incompatible code pattern with its location, explanation,
        and rewrite guide. Fixable patterns marked with 🔧, manual rewrites with ⚠️.
      id: guide_incompatible_syntax:8605570c
      done: true
    - label: Check all dependencies support Python 3.8
      description: Verify Requires-Python of all dependencies includes 3.8
      id: check_dep_compat_pypi:8dc1652e
      done: true
    - label: Install pinned dependency versions
      description: Run pip install to apply the version constraints from requirements.txt
      id: run_pip_install:a0b91f99
      done: true
    - label: Update CI pipeline to include Python 3.8
      description: Add Python 3.8 to CI test matrix to ensure ongoing compatibility
      id: update_ci_matrix:8254cd35
      done: true
    - label: Scaffold module test structure
      description: Generate test files (smoke tests, import checks, conftest) if none
        exist
      id: scaffold_module_tests:f7464fa9
      done: true
    - label: Generate compatibility tests
      description: Auto-generate import verification, API, version floor, and dependency
        tests
      id: generate_smart_tests:20aa5daa
      done: true
    - label: Add integration tests to parent tests/ directory
      description: Generate a test file in the root tests/ that verifies this module
        works at project level
      id: scaffold_parent_tests:8e425cc7
      done: true
    - label: Set up test environment for Python 3.8
      description: Create a venv with the target Python version and install dependencies
      id: setup_test_env:054d2bf4
      done: true
    - label: Run isolated tests on Python 3.8
      description: Execute the module test suite using the target Python venv
      id: run_isolated_tests:3293dc6c
      done: true
    - label: Re-scan module and verify new floor
      description: Confirm the platform detects the updated floor after all changes
      id: rescan_module:df9a68e9
      done: true
    - label: Run test suite against Python 3.8
      description: Verify all tests pass on the target version
      id: manual:fcdc20c3
      done: true
- description: Flask admin web interface
  domain: ops
  name: web
  path: src/ui/web
  stack: python-flask
  version_plan:
    target: '3.8'
    date: Now
    checklist:
    - label: Scan for features not available in Python 3.8
      description: Find code patterns that require a newer Python than 3.8
      id: scan_incompatible_features:995e13a0
      done: true
    - label: Add __future__ annotations import where needed
      description: Enable PEP 604 (X | Y) and PEP 585 (builtin generics) syntax on
        older Python via deferred evaluation
      id: add_future_annotations:1d8dad4d
      done: true
    - label: Review and fix incompatible syntax patterns
      description: Shows each incompatible code pattern with its location, explanation,
        and rewrite guide. Fixable patterns marked with 🔧, manual rewrites with ⚠️.
      id: guide_incompatible_syntax:14fa75df
      done: true
    - label: Check all dependencies support Python 3.8
      description: Verify Requires-Python of all dependencies includes 3.8
      id: check_dep_compat_pypi:0ed4ffee
      done: true
    - label: Generate module pyproject.toml
      description: Create a pyproject.toml with requires-python and dependency declarations
      id: generate_module_toml:548f883d
      done: true
    - label: Update CI pipeline to include Python 3.8
      description: Add Python 3.8 to CI test matrix to ensure ongoing compatibility
      id: update_ci_matrix:2cdf1c2b
      done: true
    - label: Scaffold module test structure
      description: Generate test files (smoke tests, import checks, conftest) if none
        exist
      id: scaffold_module_tests:7041a070
      done: true
    - label: Generate compatibility tests
      description: Auto-generate import verification, API, version floor, and dependency
        tests
      id: generate_smart_tests:e5193c8a
      done: true
    - label: Add integration tests to parent tests/ directory
      description: Generate a test file in the root tests/ that verifies this module
        works at project level
      id: scaffold_parent_tests:b5f6b1cd
      done: true
    - label: Set up test environment for Python 3.8
      description: Create a venv with the target Python version and install dependencies
      id: setup_test_env:711cb6c6
      done: true
    - label: Run isolated tests on Python 3.8
      description: Execute the module test suite using the target Python venv
      id: run_isolated_tests:25fd8a93
    - label: Re-scan module and verify new floor
      description: Confirm the platform detects the updated floor after all changes
      id: rescan_module:f03fa0fb
- description: Project documentation
  domain: docs
  name: docs
  path: docs
  stack: markdown
content_folders:
- docs
smart_folders:
- name: code-docs
  label: Code Documentation
  target: code-docs
  sources:
  - path: src/
    pattern: '**/README.md'
external:
  ci: github-actions
pages:
  segments:
  - name: docs
    source: docs
    builder: docusaurus
    path: /docs
    auto: true
    config: {}
  - name: code-docs
    source: code-docs
    builder: docusaurus
    path: /code-docs
    auto: true
    config: {}
artifacts:
  targets:
  - name: local-install
    kind: local
    builder: makefile
    build_target: install
    description: Editable pip install on this machine
    modules:
    - core
    - adapters
    - cli
    - web
    config: {}
  - name: quality-check
    kind: local
    builder: makefile
    description: Run all checks (lint + types + test)
    build_target: check
    build_cmd: ''
    output_dir: dist/
    modules: []
    config: {}
  - name: clean
    kind: local
    builder: makefile
    description: Remove build artifacts and caches
    build_target: clean
    build_cmd: ''
    output_dir: dist/
    modules: []
    config: {}
  - name: pip-package
    kind: package
    builder: pip
    description: Build pip wheel/sdist from pyproject.toml
    build_target: ''
    build_cmd: .venv/bin/python -m build
    output_dir: dist/
    modules: []
    config: {}
  - name: container
    kind: container
    builder: docker
    description: Build Docker container image
    build_target: ''
    build_cmd: docker build -t devops-control-plane .
    output_dir: dist/
    modules: []
    config:
      tag: ''
      dockerfile: Dockerfile
scripts:
  root: scripts
  template_source: auto
  default_output: scripts/output
  history:
    max_runs: 100
    persist_output: true
  execution:
    default_timeout: 300
    parallel: false
    venv_python: auto
web:
  port: 8000
  fallback_ports:
  - 8001
  - 8002
  - 8080
  - 8888
  - 9000
  host: 127.0.0.1
kubernetes:
  _services:
  - name: cli
    kind: Deployment
    image: ghcr.io/cyberpunk042/devops-control-plane-cli:latest
    envVars: []
    resources: null
    companions: []
    dependencies: []
    port: '8000'
    replicas: '2'
    serviceType: ClusterIP
    strategy: RollingUpdate
    maxSurge: '1'
    maxUnavailable: '1'
    readinessProbe:
      type: http
      initialDelaySeconds: 5
      periodSeconds: 5
      path: /health
      port: 8000
      extra: 3
    livenessProbe:
      type: http
      initialDelaySeconds: 10
      periodSeconds: 15
      path: /health
      port: 8000
      extra: 3
    volumes: []
    initContainers: []
    sidecars: []
  - name: web
    kind: Deployment
    image: ghcr.io/cyberpunk042/devops-control-plane-web:latest
    envVars: []
    resources: null
    companions: []
    dependencies:
    - mysql
    port: '8001'
    replicas: '2'
    serviceType: ClusterIP
    strategy: RollingUpdate
    maxSurge: '1'
    maxUnavailable: '1'
    readinessProbe:
      type: http
      initialDelaySeconds: 5
      periodSeconds: 5
      path: /health
      port: 8001
      extra: 3
    livenessProbe:
      type: http
      initialDelaySeconds: 10
      periodSeconds: 15
      path: /health
      port: 8001
      extra: 3
    volumes: []
    initContainers:
    - name: wait-for-http
      image: curlimages/curl:latest
      command: sh -c
    sidecars:
    - name: config-reloader
      image: jimmidyson/configmap-reload:v0.13
      command: ''
      nativeSidecar: true
    mesh:
      provider: istio
      proxyCpuRequest: 100m
      proxyCpuLimit: 500m
      proxyMemRequest: 128Mi
      proxyMemLimit: 256Mi
      excludeInbound: ''
      excludeOutbound: ''
      logLevel: warning
  _infraDecisions:
  - name: mysql
    kind: StatefulSet
    image: mysql:8
    port: '3306'
    envVars:
    - key: MYSQL_DATABASE
      type: variable
      value: ${MYSQL_DATABASE}
      varName: ${MYSQL_DATABASE}
      createInVault: true
      newValue: ''
    - key: MYSQL_PASSWORD
      type: secret
      value: ${MYSQL_PASSWORD}
      varName: ${MYSQL_PASSWORD}
      createInVault: true
      newValue: ''
    - key: MYSQL_ROOT_PASSWORD
      type: secret
      value: ${MYSQL_ROOT_PASSWORD}
      varName: ${MYSQL_ROOT_PASSWORD}
      createInVault: true
      newValue: ''
    - key: MYSQL_USER
      type: variable
      value: ${MYSQL_USER}
      varName: ${MYSQL_USER}
      createInVault: true
      newValue: ''
    volumes: []
  namespace: devops-control-plane-development
  output_dir: k8s/
  ingress: false
  skaffold: true
  skaffold_config:
    deploy_method: kustomize
    tag_policy: gitCommit
    profiles:
    - dev-from-local
    - local
    - development
    - production
    port_forward: true
    file_sync: false
    server_side_apply: false
    post_deploy_verify: true
    pre_deploy: []
    post_deploy: []
  helm_chart: true
  helm_config:
    chart_name: ''
    chart_dir: charts/
    chart_version: 0.1.0
    app_version: 1.0.0
    description: ''
    env_values: true
    helmignore: true
  _savedAt: '2026-02-23T23:40:29.064889+00:00'
  _version: 1
