<script>
// ═══════════════════════════════════════════════════════════════
// Git Auth — SSH/HTTPS credential management
//
// Uses standalone overlays (z-index: 100000) instead of the
// generic modalOpen() to avoid destroying whatever modal is
// currently open (Test Recorder, Plans, etc).
//
// Boot flow:
//   checkGitAuth()  — always probes auth status; shows modal
//                     only if pref sshPassphrasePrompt !== 'on-demand'
//
// On-demand flow:
//   ensureGitAuth() — returns a Promise that resolves to true
//                     when auth is ready.  Shows the modal if
//                     needed and waits for the user to provide
//                     credentials.  Call this BEFORE any
//                     operation that hits the git remote
//                     (git sync, chat, etc.).
// ═══════════════════════════════════════════════════════════════

let _gitAuthStatus = null;
let _ensureAuthResolve = null;  // set when ensureGitAuth() is waiting
let _gitAuthContext = null;     // 'event' when triggered by auth:needed SSE
let _gitAuthModalOpen = false;  // true while the auth modal is displayed

const _GIT_AUTH_OVERLAY_ID = 'git-auth-overlay';
const _GIT_AUTH_Z_INDEX = 100000;  // NOTHING goes above this

/** Close the auth overlay and clean up state. */
function _gitAuthCloseOverlay() {
  const ol = document.getElementById(_GIT_AUTH_OVERLAY_ID);
  if (ol) ol.remove();
  _gitAuthModalOpen = false;
}

async function checkGitAuth() {
  try {
    _gitAuthStatus = storeGet('git-auth') || await api('/git/auth-status');
    if (_gitAuthStatus.ok) return;

    // Check user preference — should we prompt on boot?
    const promptPref = prefsGet('sshPassphrasePrompt');  // 'always' | 'on-demand'

    if (_gitAuthStatus.needs === 'ssh_passphrase') {
      if (promptPref === 'on-demand') {
        // User opted out of boot prompts — skip, but status is cached
        // so ensureGitAuth() can trigger the modal later when needed.
        return;
      }
      showGitAuthModal('ssh');
    } else if (_gitAuthStatus.needs === 'https_credentials') {
      showGitAuthModal('https');
    }
  } catch (e) {
    // Silently ignore — auth check is best-effort
  }
}

/**
 * Ensure git auth is ready before a network operation.
 * Returns a Promise<boolean>.
 *   - true  → auth is OK, proceed
 *   - false → user cancelled / auth still broken
 *
 * If auth needs credentials, shows the modal and waits.
 */
function ensureGitAuth() {
  // Already good
  if (_gitAuthStatus && _gitAuthStatus.ok) return Promise.resolve(true);

  // Need to show modal — return a promise that resolves when the user
  // successfully unlocks (or cancels).
  return new Promise((resolve) => {
    _ensureAuthResolve = resolve;

    if (!_gitAuthStatus) {
      // Status not fetched yet — fetch first, then decide
      api('/git/auth-status').then(status => {
        _gitAuthStatus = status;
        if (status.ok) { _ensureAuthResolve = null; resolve(true); return; }
        if (status.needs === 'ssh_passphrase') showGitAuthModal('ssh');
        else if (status.needs === 'https_credentials') showGitAuthModal('https');
        else { _ensureAuthResolve = null; resolve(false); }
      }).catch(() => { _ensureAuthResolve = null; resolve(false); });
    } else if (_gitAuthStatus.needs === 'ssh_passphrase') {
      showGitAuthModal('ssh');
    } else if (_gitAuthStatus.needs === 'https_credentials') {
      showGitAuthModal('https');
    } else {
      _ensureAuthResolve = null;
      resolve(false);
    }
  });
}

function showGitAuthModal(type, context) {
  if (_gitAuthModalOpen) return;
  _gitAuthModalOpen = true;
  _gitAuthContext = context || null;
  const status = _gitAuthStatus || {};
  const keyName = status.ssh_key || 'SSH key';
  const remoteUrl = status.remote_url || 'origin';

  // Remove any existing auth overlay
  const existing = document.getElementById(_GIT_AUTH_OVERLAY_ID);
  if (existing) existing.remove();

  // Create standalone overlay — NOT modalOpen()
  const overlay = document.createElement('div');
  overlay.id = _GIT_AUTH_OVERLAY_ID;
  overlay.style.cssText = [
    'position:fixed', 'inset:0', 'z-index:' + _GIT_AUTH_Z_INDEX,
    'display:flex', 'align-items:center', 'justify-content:center',
    'background:rgba(0,0,0,0.6)',
    'backdrop-filter:blur(6px)', '-webkit-backdrop-filter:blur(6px)',
  ].join(';');

  // Close on backdrop click
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
      _gitAuthModalOpen = false;
      if (_ensureAuthResolve) { _ensureAuthResolve(false); _ensureAuthResolve = null; }
      overlay.remove();
    }
  });

  // Close on Escape
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      document.removeEventListener('keydown', escHandler);
      _gitAuthModalOpen = false;
      if (_ensureAuthResolve) { _ensureAuthResolve(false); _ensureAuthResolve = null; }
      overlay.remove();
    }
  };
  document.addEventListener('keydown', escHandler);

  if (type === 'ssh') {
    // Current pref state — pre-check the checkbox if already on-demand
    const currentPref = prefsGet('sshPassphrasePrompt');
    const checked = currentPref === 'on-demand' ? ' checked' : '';

    // Context-aware explainer
    const explainer = context === 'event'
      ? '<strong>⚠️ Git operation blocked</strong><br>'
        + 'A git network operation was attempted but your SSH key is not '
        + 'unlocked. Please enter your passphrase below, then retry your '
        + 'operation or refresh the page.'
      : '<strong>🔒 SSH Secure Mode detected</strong><br>'
        + 'Your SSH key is <em>passphrase-protected</em>, which is the recommended '
        + 'security configuration. Some features (Git sync, remote operations) '
        + 'require access to the remote repository through this key. '
        + 'Please enter your passphrase so we can unlock it for this session.';

    overlay.innerHTML = `
      <div style="background:var(--bg-card,#1e1e2e);border:1px solid var(--border,#333);
                  border-radius:12px;max-width:440px;width:90%;
                  box-shadow:0 16px 64px rgba(0,0,0,0.5)">
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:var(--space-lg,16px) var(--space-xl,20px);
                    border-bottom:1px solid var(--border-subtle,#2a2a3a)">
          <span style="font-size:1rem;font-weight:600;color:var(--text-primary,#e0e0e0)">
            🔑 SSH Key Passphrase Required
          </span>
          <button onclick="_gitAuthSkip()"
                  style="background:none;border:none;color:var(--text-muted,#888);
                         font-size:1.1rem;cursor:pointer;padding:4px">✕</button>
        </div>
        <div style="padding:var(--space-xl,20px);font-size:0.85rem;color:var(--text-primary,#e0e0e0)">
          <div style="padding:0.6rem 0.75rem;background:var(--accent-glow,rgba(99,102,241,0.08));
                      border:1px solid var(--accent,#6366f1);border-radius:var(--radius-sm,6px);
                      margin-bottom:var(--space-md,12px);font-size:0.78rem;line-height:1.5">
            ${explainer}
          </div>
          <p style="color:var(--text-muted,#888);margin-bottom:0.5rem;font-size:0.78rem">
            Key: <strong>${esc(keyName)}</strong>
          </p>
          <code style="display:block;padding:0.5rem;background:var(--surface-raised,#252535);
                       border-radius:var(--radius-sm,6px);margin-bottom:var(--space-md,12px);
                       font-size:0.78rem;word-break:break-all">${esc(remoteUrl)}</code>
          <label style="font-weight:500;font-size:0.78rem;display:block;margin-bottom:0.3rem">
            SSH Key Passphrase
          </label>
          <input type="password" id="git-auth-passphrase" class="form-input"
                 placeholder="Enter passphrase for ${esc(keyName)}"
                 style="width:100%;margin-bottom:0.5rem"
                 onkeydown="if(event.key==='Enter')submitGitAuthSSH()">
          <p id="git-auth-error" style="color:#f87171;font-size:0.75rem;min-height:1rem"></p>
          <label style="display:flex;align-items:center;gap:0.4rem;
                        font-size:0.75rem;color:var(--text-muted,#888);
                        cursor:pointer;margin-top:0.25rem">
            <input type="checkbox" id="git-auth-no-startup"${checked}>
            Don\u2019t ask on startup \u2014 only prompt when required by an operation
          </label>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:var(--space-md,12px) var(--space-xl,20px);
                    border-top:1px solid var(--border-subtle,#2a2a3a)">
          <span></span>
          <div style="display:flex;gap:var(--space-sm,8px)">
            <button onclick="_gitAuthSkip()" class="btn btn-ghost"
                    style="font-size:0.82rem">Skip</button>
            <button id="git-auth-unlock-btn" onclick="submitGitAuthSSH()"
                    class="btn btn-primary" style="font-size:0.82rem">Unlock →</button>
          </div>
        </div>
      </div>`;

    document.body.appendChild(overlay);
    // Focus the input
    setTimeout(() => {
      const inp = document.getElementById('git-auth-passphrase');
      if (inp) inp.focus();
    }, 100);

  } else if (type === 'https') {
    overlay.innerHTML = `
      <div style="background:var(--bg-card,#1e1e2e);border:1px solid var(--border,#333);
                  border-radius:12px;max-width:440px;width:90%;
                  box-shadow:0 16px 64px rgba(0,0,0,0.5)">
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:var(--space-lg,16px) var(--space-xl,20px);
                    border-bottom:1px solid var(--border-subtle,#2a2a3a)">
          <span style="font-size:1rem;font-weight:600;color:var(--text-primary,#e0e0e0)">
            🔐 Git Credentials Required
          </span>
          <button onclick="_gitAuthSkip()"
                  style="background:none;border:none;color:var(--text-muted,#888);
                         font-size:1.1rem;cursor:pointer;padding:4px">✕</button>
        </div>
        <div style="padding:var(--space-xl,20px);font-size:0.85rem;color:var(--text-primary,#e0e0e0)">
          <p style="color:var(--text-muted,#888);margin-bottom:var(--space-md,12px)">
            Your git remote uses HTTPS and requires authentication:
          </p>
          <code style="display:block;padding:0.5rem;background:var(--surface-raised,#252535);
                       border-radius:var(--radius-sm,6px);margin-bottom:var(--space-md,12px);
                       font-size:0.78rem;word-break:break-all">${esc(remoteUrl)}</code>
          <label style="font-weight:500;font-size:0.78rem;display:block;margin-bottom:0.3rem">
            Personal Access Token (PAT)
          </label>
          <input type="password" id="git-auth-token" class="form-input"
                 placeholder="ghp_xxxxxxxxxxxx"
                 style="width:100%;margin-bottom:0.5rem"
                 onkeydown="if(event.key==='Enter')submitGitAuthHTTPS()">
          <p id="git-auth-error" style="color:#f87171;font-size:0.75rem;min-height:1rem"></p>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;
                    padding:var(--space-md,12px) var(--space-xl,20px);
                    border-top:1px solid var(--border-subtle,#2a2a3a)">
          <span></span>
          <div style="display:flex;gap:var(--space-sm,8px)">
            <button onclick="_gitAuthSkip()" class="btn btn-ghost"
                    style="font-size:0.82rem">Skip</button>
            <button id="git-auth-save-btn" onclick="submitGitAuthHTTPS()"
                    class="btn btn-primary" style="font-size:0.82rem">Save →</button>
          </div>
        </div>
      </div>`;

    document.body.appendChild(overlay);
    setTimeout(() => {
      const inp = document.getElementById('git-auth-token');
      if (inp) inp.focus();
    }, 100);
  }
}

/** Handle "Skip" — close overlay + resolve on-demand waiters with false. */
function _gitAuthSkip() {
  // Save checkbox pref if it was checked
  _saveNoStartupPref();
  _gitAuthCloseOverlay();
  if (_ensureAuthResolve) {
    _ensureAuthResolve(false);
    _ensureAuthResolve = null;
  }
}

/** Save the "Don't ask on startup" checkbox state as a preference. */
function _saveNoStartupPref() {
  const cb = document.getElementById('git-auth-no-startup');
  if (cb) {
    prefsSet('sshPassphrasePrompt', cb.checked ? 'on-demand' : 'always');
  }
}

async function submitGitAuthSSH() {
  const inp = document.getElementById('git-auth-passphrase');
  const errEl = document.getElementById('git-auth-error');
  if (!inp) return;

  const passphrase = inp.value;
  if (!passphrase) {
    if (errEl) errEl.textContent = 'Passphrase is required';
    return;
  }

  // Disable button while processing
  const btn = document.getElementById('git-auth-unlock-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Unlocking...'; }

  try {
    const result = await api('/git/auth-ssh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passphrase: passphrase }),
    });

    if (result.ok) {
      // Save checkbox preference before closing
      _saveNoStartupPref();

      _gitAuthCloseOverlay();
      const toastMsg = _gitAuthContext === 'event'
        ? '🔓 SSH key unlocked — retry your operation or refresh'
        : '🔓 SSH key unlocked — git sync is ready';
      toast(toastMsg, 'success');
      _gitAuthStatus = { ok: true };
      _gitAuthContext = null;

      // Resolve any ensureGitAuth() waiter
      if (_ensureAuthResolve) {
        _ensureAuthResolve(true);
        _ensureAuthResolve = null;
      }
    } else {
      if (errEl) errEl.textContent = result.error || 'Authentication failed';
      inp.value = '';
      inp.focus();
    }
  } catch (e) {
    if (errEl) errEl.textContent = e.message || 'Failed to authenticate';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Unlock \u2192'; }
  }
}

async function submitGitAuthHTTPS() {
  const inp = document.getElementById('git-auth-token');
  const errEl = document.getElementById('git-auth-error');
  if (!inp) return;

  const token = inp.value.trim();
  if (!token) {
    if (errEl) errEl.textContent = 'Token is required';
    return;
  }

  const btn = document.getElementById('git-auth-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  try {
    const result = await api('/git/auth-https', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token }),
    });

    if (result.ok) {
      _gitAuthCloseOverlay();
      toast('\uD83D\uDD10 Git credentials saved — sync is ready', 'success');
      _gitAuthStatus = { ok: true };

      if (_ensureAuthResolve) {
        _ensureAuthResolve(true);
        _ensureAuthResolve = null;
      }
    } else {
      if (errEl) errEl.textContent = result.error || 'Authentication failed';
    }
  } catch (e) {
    if (errEl) errEl.textContent = e.message || 'Failed to store credentials';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Save \u2192'; }
  }
}

// ═══════════════════════════════════════════════════════════════
// Git Identity Modal — user.name / user.email
// Uses its own standalone overlay (z-index 100000) — never modalOpen()
// ═══════════════════════════════════════════════════════════════

const _GIT_IDENTITY_OVERLAY_ID = 'git-identity-overlay';
let _gitIdentityModalOpen = false;

function _gitIdentityCloseOverlay() {
  const ol = document.getElementById(_GIT_IDENTITY_OVERLAY_ID);
  if (ol) ol.remove();
  _gitIdentityModalOpen = false;
}

function showGitIdentityModal() {
  if (_gitIdentityModalOpen) return;
  _gitIdentityModalOpen = true;

  // Remove any existing identity overlay
  const existing = document.getElementById(_GIT_IDENTITY_OVERLAY_ID);
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = _GIT_IDENTITY_OVERLAY_ID;
  overlay.style.cssText = [
    'position:fixed', 'inset:0', 'z-index:' + _GIT_AUTH_Z_INDEX,
    'display:flex', 'align-items:center', 'justify-content:center',
    'background:rgba(0,0,0,0.6)',
    'backdrop-filter:blur(6px)', '-webkit-backdrop-filter:blur(6px)',
  ].join(';');

  // Close on backdrop click
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) _gitIdentityCloseOverlay();
  });

  // Close on Escape
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      document.removeEventListener('keydown', escHandler);
      _gitIdentityCloseOverlay();
    }
  };
  document.addEventListener('keydown', escHandler);

  overlay.innerHTML = `
    <div style="background:var(--bg-card,#1e1e2e);border:1px solid var(--border,#333);
                border-radius:12px;max-width:440px;width:90%;
                box-shadow:0 16px 64px rgba(0,0,0,0.5)">
      <div style="display:flex;align-items:center;justify-content:space-between;
                  padding:var(--space-lg,16px) var(--space-xl,20px);
                  border-bottom:1px solid var(--border-subtle,#2a2a3a)">
        <span style="font-size:1rem;font-weight:600;color:var(--text-primary,#e0e0e0)">
          👤 Git Identity Setup
        </span>
        <button onclick="_gitIdentityCancel()"
                style="background:none;border:none;color:var(--text-muted,#888);
                       font-size:1.1rem;cursor:pointer;padding:4px">✕</button>
      </div>
      <div style="padding:var(--space-xl,20px)">
        <div style="max-width:420px;margin:0 auto">
          <div style="text-align:center;margin-bottom:var(--space-md,12px)">
            <div style="font-size:2rem;margin-bottom:var(--space-xs,4px)">👤</div>
            <h3 style="margin:0;font-weight:700;color:var(--text,#e0e0e0)">Git Identity Required</h3>
            <p style="margin:var(--space-xs,4px) 0 0;font-size:0.82rem;color:var(--text-muted,#888)">
              Git needs your name and email to create commits.<br>
              This is used for the chat sync and ledger features.
            </p>
          </div>

          <div style="display:flex;flex-direction:column;gap:var(--space-sm,8px)">
            <label style="font-size:0.82rem;font-weight:600;color:var(--text,#e0e0e0)">
              Name
              <input type="text" id="git-identity-name"
                     placeholder="Your Name"
                     style="width:100%;margin-top:4px;padding:8px 10px;
                            background:var(--bg-secondary,#252535);border:1px solid var(--border,#333);
                            border-radius:var(--radius-sm,6px);color:var(--text,#e0e0e0);
                            font-size:0.88rem">
            </label>
            <label style="font-size:0.82rem;font-weight:600;color:var(--text,#e0e0e0)">
              Email
              <input type="email" id="git-identity-email"
                     placeholder="you@example.com"
                     style="width:100%;margin-top:4px;padding:8px 10px;
                            background:var(--bg-secondary,#252535);border:1px solid var(--border,#333);
                            border-radius:var(--radius-sm,6px);color:var(--text,#e0e0e0);
                            font-size:0.88rem">
            </label>
          </div>

          <div id="git-identity-error" style="color:var(--error,#f87171);font-size:0.78rem;
               margin-top:var(--space-xs,4px);min-height:1.2em"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;
                  padding:var(--space-md,12px) var(--space-xl,20px);gap:var(--space-sm,8px);
                  border-top:1px solid var(--border-subtle,#2a2a3a)">
        <button onclick="_gitIdentityCancel()" class="btn btn-ghost"
                style="font-size:0.82rem">Cancel</button>
        <button id="git-identity-save" onclick="_gitIdentitySave()"
                class="btn btn-primary" style="font-size:0.82rem">
          Save →
        </button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
}

function _gitIdentityCancel() {
  _gitIdentityCloseOverlay();
}

async function _gitIdentitySave() {
  const nameEl = document.getElementById('git-identity-name');
  const emailEl = document.getElementById('git-identity-email');
  const errEl = document.getElementById('git-identity-error');
  const btn = document.getElementById('git-identity-save');
  const name = (nameEl?.value || '').trim();
  const email = (emailEl?.value || '').trim();

  if (!name || !email) {
    if (errEl) errEl.textContent = 'Both name and email are required';
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  if (errEl) errEl.textContent = '';

  try {
    const result = await apiPost('/git/identity', { name, email });
    if (result.ok) {
      _gitIdentityCloseOverlay();
      toast('👤 Git identity configured — ' + name + ' <' + email + '>', 'success');
    } else {
      if (errEl) errEl.textContent = result.error || 'Failed to set identity';
    }
  } catch (e) {
    if (errEl) errEl.textContent = e.message || 'Request failed';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Save →'; }
  }
}
</script>
