<script>
// ── Timeline tab — JS engine ────────────────────────────────────────
//
// State model, REST fetch + cursor pagination, SSE live entries,
// filter pipeline, rendering pipeline, left navigator.
//
// No global namespace pollution — all identifiers prefixed with _tl.

// ── State ────────────────────────────────────────────────────────────

const _tlState = {
  // Data (from store — single source of truth)
  allEntries:       [],   // full entry list from timeline.data
  _filteredEntries: [],   // after client-side filter
  _renderedCount:   0,    // how many rendered so far (client-side pagination)
  hasMore:          true,

  // Filters
  sources:     [],      // string[] — empty = all
  statuses:    [],
  severities:  [],
  locality:    null,    // null | "local" | "shared"
  envs:        [],
  modules:     [],
  chainFilter: null,    // chain_id filter (when user selects a chain)
  dateFrom:    null,    // unix epoch lower bound (calendar jump)
  dateTo:      null,    // unix epoch upper bound (calendar jump)
  sortBy:      'ts',
  sortDir:     'desc',
  q:           '',

  // Rendered state
  lastDate:    null,

  // Navigator
  navMode:     'chains',  // chains | domains | calendar
  navChains:   [],        // raw chains from /api/timeline/chains
  navDomains:  {},        // by_source facet for source filter menu
  navAdapters: {},        // by_adapter facet for domains tree (adapter → source → subtype)
  navCalendar: [],        // per-day counts from /api/timeline/calendar
  navFilter:   '',        // chain search filter text
};

let _tlNavActiveChain = null;
let _tlSearchTimer    = null;

// ── URL state persistence ────────────────────────────────────────────
// Full UI state lives in the URL hash:
//   #debugging/timeline/{navMode}/{selection}?src=...&status=...&sev=...&sort=...&q=...&loc=...
// This allows page refresh, back/forward, and link sharing to restore the exact view.

function _tlPushState() {
  const navMode   = _tlState.navMode || 'chains';
  let selection = '';
  if (navMode === 'chains' && _tlState.chainFilter) selection = _tlState.chainFilter;
  else if (navMode === 'calendar' && _tlState.dateFrom) {
    const d = new Date(_tlState.dateFrom * 1000);
    selection = d.toISOString().slice(0, 10); // YYYY-MM-DD
  }
  else if (navMode === 'domains' && _tlState.sources.length === 1) selection = _tlState.sources[0];

  let path = `debugging/timeline/${navMode}`;
  if (selection) path += '/' + selection;

  // Build query params for filters
  const params = new URLSearchParams();
  if (_tlState.sources.length)    params.set('src',    _tlState.sources.join(','));
  if (_tlState.statuses.length)   params.set('status', _tlState.statuses.join(','));
  if (_tlState.severities.length) params.set('sev',    _tlState.severities.join(','));
  if (_tlState.locality)          params.set('loc',    _tlState.locality);
  if (_tlState.q)                 params.set('q',      _tlState.q);
  const sortVal = `${_tlState.sortBy}:${_tlState.sortDir}`;
  if (sortVal !== 'ts:desc')      params.set('sort',   sortVal);

  const qs = params.toString();
  const newHash = `#${path}${qs ? '?' + qs : ''}`;

  if (typeof _debugViewMode !== 'undefined') _debugViewMode['timeline'] = navMode;
  try { sessionStorage.setItem('_debugLastSubView_timeline', navMode); } catch(_) {}

  if (location.hash !== newHash) {
    history.pushState({ tab: path, depth: (window._navDepth || 0) }, '', newHash);
    if (typeof _navDepth !== 'undefined') _navDepth++;
  }
}

function _tlRestoreState(subView, subParts) {
  // subView = navMode (chains/domains/calendar), subParts = ['timeline', navMode, selection?]
  // Query params parsed from hash
  const hashFull = location.hash.slice(1);
  const qIdx = hashFull.indexOf('?');
  const qs = qIdx >= 0 ? new URLSearchParams(hashFull.slice(qIdx + 1)) : null;

  // Restore nav mode
  if (subView && ['chains', 'domains', 'calendar'].includes(subView)) {
    _tlState.navMode = subView;
  }

  // Restore selection from path segment
  const selection = (subParts && subParts.length > 2) ? subParts[2] : null;
  if (selection) {
    if (_tlState.navMode === 'chains') {
      _tlState.chainFilter = selection;
      _tlNavActiveChain    = selection;
    } else if (_tlState.navMode === 'calendar') {
      const d = new Date(selection + 'T00:00:00Z');
      if (!isNaN(d.getTime())) {
        _tlState.dateFrom = d.getTime() / 1000;
        _tlState.dateTo   = _tlState.dateFrom + 86400;
      }
    } else if (_tlState.navMode === 'domains') {
      _tlState.sources = [selection];
    }
  }

  // Restore filters from query params
  if (qs) {
    const src = qs.get('src');
    if (src) _tlState.sources = src.split(',').filter(Boolean);
    const status = qs.get('status');
    if (status) _tlState.statuses = status.split(',').filter(Boolean);
    const sev = qs.get('sev');
    if (sev) _tlState.severities = sev.split(',').filter(Boolean);
    const loc = qs.get('loc');
    if (loc) _tlState.locality = loc;
    const q = qs.get('q');
    if (q) _tlState.q = q;
    const sort = qs.get('sort');
    if (sort) {
      const [by, dir] = sort.split(':');
      if (by) _tlState.sortBy = by;
      if (dir) _tlState.sortDir = dir;
    }
  }

  // Sync UI controls with restored state
  _tlSyncControlsFromState();
}

function _tlSyncControlsFromState() {
  // Locality toggle
  document.querySelectorAll('#timeline-locality-toggle button').forEach(b => {
    b.classList.toggle('active', b.id === ('tl-loc-' + (_tlState.locality || 'all')));
  });
  // Sort dropdown
  const sortEl = document.getElementById('timeline-sort');
  if (sortEl) sortEl.value = `${_tlState.sortBy}:${_tlState.sortDir}`;
  // Search input
  const searchEl = document.getElementById('timeline-search');
  if (searchEl && _tlState.q) searchEl.value = _tlState.q;
  // Nav mode buttons
  document.querySelectorAll('.timeline-nav-modes button').forEach(b => {
    b.classList.toggle('active', b.id === `tl-nav-mode-${_tlState.navMode}`);
  });
  const searchWrap = document.getElementById('tl-nav-chain-search-wrap');
  if (searchWrap) searchWrap.style.display = _tlState.navMode === 'chains' ? '' : 'none';
  // Active filter pills
  _tlUpdateActivePills();
}

// ── Helpers ──────────────────────────────────────────────────────────

function _tlEsc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
    .replace(/`/g,'&#96;').replace(/\$/g,'&#36;');
}

function _tlFormatTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function _tlDateLabel(d) {
  const today     = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const target    = new Date(d); target.setHours(0,0,0,0);
  const dateStr   = d.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
  if (target.getTime() === today.getTime())     return `TODAY \u2014 ${dateStr}`;
  if (target.getTime() === yesterday.getTime()) return `YESTERDAY \u2014 ${dateStr}`;
  return dateStr;
}

const _TL_ADAPTER_LABELS = {
  scan_activity:  'Scan Activity',
  cli_ops:        'CLI Operations',
  git_log:        'Git History',
  ledger_runs:    'Ledger Runs',
  ledger_audits:  'Ledger Audits',
  chat:           'Chat',
};
function _tlAdapterLabel(adapter) {
  return _TL_ADAPTER_LABELS[adapter] || adapter;
}

function _tlChainLabel(chainId) {
  if (!chainId) return '';
  const c = _tlState.navChains.find(x => x.chain_id === chainId);
  if (c && c.summary) return c.summary.substring(0, 60);
  return chainId.substring(0, 16) + '…';
}

// ── Rendering ────────────────────────────────────────────────────────

function _tlMaybeDateHeader(entry) {
  const d   = new Date(entry.ts * 1000);
  const key = d.toDateString();
  if (key === _tlState.lastDate) return '';
  _tlState.lastDate = key;
  return `<div class="timeline-date-header">${_tlDateLabel(d)}</div>`;
}

function _tlRenderDetail(entry) {
  if (!entry.detail || typeof entry.detail !== 'object') return '<em>No detail</em>';
  const rows = Object.entries(entry.detail).map(([k, v]) =>
    `<div><span style="color:var(--text-muted);min-width:80px;display:inline-block">${_tlEsc(k)}</span>
          <span style="color:var(--text-secondary)">${_tlEsc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</span></div>`
  ).join('');
  const meta = [];
  if (entry.hostname) meta.push(`host: ${_tlEsc(entry.hostname)}`);
  if (entry.os)       meta.push(`os: ${_tlEsc(entry.os)}`);
  if (entry.ref)      meta.push(`ref: ${_tlEsc(entry.ref)}`);
  const metaHtml = meta.length ? `<div style="margin-top:4px;color:var(--text-muted);font-size:0.65rem">${meta.join(' · ')}</div>` : '';
  return rows + metaHtml;
}

function _tlRenderEntry(entry, idx) {
  const statusIcon  = { ok:'●', warning:'◑', attention:'⚠', failed:'✕' }[entry.status] ?? '●';
  const statusColor = {
    ok:'var(--success)', warning:'var(--warning)',
    attention:'var(--warning)', failed:'var(--error)',
  }[entry.status] ?? 'var(--text-muted)';
  const localityIcon  = entry.locality === 'shared' ? '⇡' : '⬡';
  const localityColor = entry.locality === 'shared' ? 'var(--accent)' : 'var(--text-muted)';

  const chainBadge = entry.chain_id
    ? `<span class="tl-chain-badge" title="Part of a chain"
             onclick="event.stopPropagation();_tlNavSelectChain('${_tlEsc(entry.chain_id)}')">🔗</span>`
    : '';

  const chainFooter = entry.chain_role === 'terminal' && entry.chain_id ? `
    <div class="tl-chain-footer">
      ↳ chain: <em>${_tlEsc(_tlChainLabel(entry.chain_id))}</em>
      <button onclick="event.stopPropagation();_tlNavSelectChain('${_tlEsc(entry.chain_id)}')"
              class="tl-chain-view-btn">view chain</button>
    </div>` : '';

  const isChainMember  = !!entry.chain_id;
  const chainRoleClass = entry.chain_role ? `tl-chain-${entry.chain_role}` : '';
  const srcClass       = `tl-source-${(entry.source || '').toLowerCase()}`;
  const sevBadge       = entry.severity
    ? `<span class="tl-severity tl-sev-${entry.severity}">${entry.severity}</span>` : '';
  const subtype        = entry.subtype
    ? `<span class="tl-subtype">${_tlEsc(entry.subtype)}</span>` : '';
  const envStr         = (entry.env || []).join(' → ');
  const envBadge       = envStr ? `<span class="tl-env">${_tlEsc(envStr)}</span>` : '';

  return `
<div class="timeline-entry ${chainRoleClass} ${isChainMember ? 'tl-in-chain' : ''}"
     id="tl-entry-${idx}"
     data-chain="${_tlEsc(entry.chain_id ?? '')}"
     data-chain-role="${_tlEsc(entry.chain_role ?? '')}"
     style="border-left:3px solid ${statusColor}">

  <div class="timeline-entry-header" onclick="_tlToggleDetail(${typeof idx === 'number' ? idx : "'" + _tlEsc(String(idx)) + "'"})">
    <span class="tl-status" style="color:${statusColor}">${statusIcon}</span>
    <span class="tl-locality" style="color:${localityColor}">${localityIcon}</span>
    <span class="tl-source-badge ${srcClass}">${_tlEsc(entry.source)}</span>
    ${subtype}
    <span class="tl-summary">${_tlEsc(entry.summary)}</span>
    ${sevBadge}
    ${chainBadge}
    <span class="tl-time" title="${_tlEsc(String(entry.ts))}">${_tlFormatTime(entry.ts)}</span>
    ${envBadge}
    <button class="tl-raw-btn" onclick="event.stopPropagation();_tlToggleRaw(${typeof idx === 'number' ? idx : "'" + _tlEsc(String(idx)) + "'"})"
            title="Raw JSON">{ }</button>
  </div>

  <div id="tl-detail-${idx}" class="timeline-entry-detail" style="display:none">
    ${_tlRenderDetail(entry)}
  </div>

  <div id="tl-raw-${idx}" class="timeline-entry-raw" style="display:none">
    <pre></pre>
  </div>

  ${chainFooter}
</div>`;
}

function _tlToggleDetail(idx) {
  const el = document.getElementById(`tl-detail-${idx}`);
  const raw = document.getElementById(`tl-raw-${idx}`);
  if (!el) return;
  if (el.style.display === 'none') {
    el.style.display = '';
    if (raw) raw.style.display = 'none';
  } else {
    el.style.display = 'none';
  }
}

function _tlToggleRaw(idx) {
  const el = document.getElementById(`tl-raw-${idx}`);
  if (!el) return;
  if (el.style.display === 'none') {
    // Populate raw JSON on first open (safe — no template literal)
    const pre = el.querySelector('pre');
    if (pre && !pre.textContent) {
      const entries = _tlState._filteredEntries || _tlState.allEntries || [];
      const entry = entries[idx] || entries.find(function(e) { return e.id === idx; });
      if (entry) {
        pre.textContent = JSON.stringify(entry, null, 2);
      }
    }
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

// ── Store integration ────────────────────────────────────────────────
// Follows the proven double-cache pattern:
//   1. storeGet('timeline') — instant from __INITIAL_STATE__
//   2. api('/timeline/data') — cold start fallback
//   3. SSE cache:done → storeSet('timeline') — live updates
//
// All data (entries, facets, chains, calendar) comes from ONE object.
// Filtering, sorting, and pagination happen client-side.

storeRegister('timeline', _tlOnData);

function _tlOnData(data) {
  // Store raw data — single source of truth
  _tlState.allEntries  = data.entries  || [];
  _tlState.navChains   = data.chains   || [];
  _tlState.navDomains  = (data.facets || {}).by_source || {};
  _tlState.navAdapters = (data.facets || {}).by_adapter || {};
  _tlState.navCalendar = data.calendar || [];

  // Build filter menus from facets (always consistent — same population)
  const facets = data.facets || {};
  _tlBuildSourceMenu(facets.by_source || {});
  _tlBuildStatusMenu(facets.by_status || {});
  _tlBuildSeverityMenu(facets.by_severity || {});

  // Render navigator
  _tlNavRender();

  // Apply current filters and render entry list
  _tlRenderFiltered();
}

function _tlRenderFiltered() {
  // Filter client-side from allEntries
  let filtered = _tlState.allEntries.filter(_tlPassesFilter);

  // Sort
  filtered = _tlSortEntries(filtered);

  // Reset list
  _tlState.lastDate = null;
  const list = document.getElementById('timeline-list');
  list.innerHTML = '';

  if (!filtered.length) {
    document.getElementById('timeline-empty').style.display = '';
    document.getElementById('timeline-loading').style.display = 'none';
    _tlPushState();
    return;
  }
  document.getElementById('timeline-empty').style.display = 'none';

  // Render (paginated client-side — show first 100, sentinel loads more)
  _tlState._filteredEntries = filtered;
  _tlState._renderedCount   = 0;
  _tlRenderNextBatch();

  // Persist full UI state to URL
  _tlPushState();
}

function _tlRenderNextBatch() {
  const BATCH = 100;
  const filtered = _tlState._filteredEntries || [];
  const start    = _tlState._renderedCount || 0;
  const end      = Math.min(start + BATCH, filtered.length);
  if (start >= filtered.length) {
    _tlState.hasMore = false;
    return;
  }

  const batch = filtered.slice(start, end);
  const list  = document.getElementById('timeline-list');
  const html  = batch.map((e, i) =>
    _tlMaybeDateHeader(e) + _tlRenderEntry(e, start + i)
  ).join('');
  list.insertAdjacentHTML('beforeend', html);

  _tlState._renderedCount = end;
  _tlState.hasMore = end < filtered.length;
  document.getElementById('timeline-loading').style.display = 'none';
}

function _tlSortEntries(entries) {
  const by  = _tlState.sortBy;
  const dir = _tlState.sortDir;
  const mult = dir === 'desc' ? -1 : 1;

  return [...entries].sort((a, b) => {
    let va, vb;
    if (by === 'ts') {
      va = a.ts || 0; vb = b.ts || 0;
    } else if (by === 'severity') {
      const ord = { critical: 0, high: 1, medium: 2, low: 3 };
      va = ord[a.severity] ?? 99; vb = ord[b.severity] ?? 99;
    } else if (by === 'status') {
      const ord = { failed: 0, attention: 1, warning: 2, ok: 3 };
      va = ord[a.status] ?? 99; vb = ord[b.status] ?? 99;
    } else if (by === 'source') {
      va = a.source || ''; vb = b.source || '';
      return mult * va.localeCompare(vb);
    } else {
      va = a.ts || 0; vb = b.ts || 0;
    }
    return mult * (va - vb);
  });
}

// ── Scroll observer ──────────────────────────────────────────────────

function _tlInitScrollObserver() {
  const sentinel = document.getElementById('timeline-sentinel');
  if (!sentinel) return;
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && _tlState.hasMore) {
      _tlRenderNextBatch();
    }
  }, { rootMargin: '200px' });
  observer.observe(sentinel);
}

// ── Live SSE entries ─────────────────────────────────────────────────
// Individual entries arrive via SSE timeline:entry.
// Each one is added to state, filtered, and prepended to the list if it passes.

let _tlLiveBatch = [];
let _tlLiveTimer = null;

function _tlOnLiveEntry(entry) {
  _tlLiveBatch.push(entry);
  clearTimeout(_tlLiveTimer);
  _tlLiveTimer = setTimeout(_tlFlushLive, 800);
}

function _tlFlushLive() {
  if (!_tlLiveBatch.length) return;
  const batch = [..._tlLiveBatch];
  _tlLiveBatch = [];

  for (const entry of batch) {
    // Add to master state
    _tlState.allEntries.unshift(entry);
  }

  // Filter the batch
  const visible = batch.filter(_tlPassesFilter);
  if (!visible.length) return;

  // Prepend to rendered list
  const savedLastDate = _tlState.lastDate;
  _tlState.lastDate = null;
  const list = document.getElementById('timeline-list');
  const html = visible.map((e, i) =>
    _tlMaybeDateHeader(e) + _tlRenderEntry(e, 'live-' + Date.now() + '-' + i)
  ).join('');
  _tlState.lastDate = savedLastDate;

  list.insertAdjacentHTML('afterbegin', html);

  // Highlight animation
  list.querySelectorAll('.timeline-entry:not(.tl-new-done)').forEach(el => {
    el.classList.add('tl-new');
    setTimeout(() => { el.classList.remove('tl-new'); el.classList.add('tl-new-done'); }, 1600);
  });
}

// ── Filter pipeline ──────────────────────────────────────────────────

function _tlPassesFilter(entry) {
  // Hide index infrastructure noise unless explicitly shown
  if (!_tlState._showInfra) {
    var ref = entry.ref || '';
    var adp = entry.adapter || '';
    if (adp === 'index' || ref.startsWith('index.')) return false;
  }
  // Domain filter (from side panel domain click)
  if (_tlState._domainFilter && (entry.adapter || '') !== _tlState._domainFilter) return false;
  if (_tlState.sources.length && !_tlState.sources.includes(entry.source)) return false;
  if (_tlState.statuses.length && !_tlState.statuses.includes(entry.status)) return false;
  if (_tlState.severities.length && !_tlState.severities.includes(entry.severity || 'none')) return false;
  if (_tlState.locality && entry.locality !== _tlState.locality) return false;
  if (_tlState.chainFilter) {
    var cf = _tlState.chainFilter;
    var ecid = entry.chain_id || '';
    if (ecid === cf) {
      // Exact match — always pass
    } else if (cf.indexOf(':') > 0 && cf.startsWith(ecid + ':')) {
      // Domain sub-chain (e.g. cf="cycle-xxx:audit", ecid="cycle-xxx")
      // Only match if entry's adapter/domain matches the suffix
      var domain = cf.split(':').pop();
      if ((entry.adapter || '') !== domain) return false;
    } else {
      return false;
    }
  }
  if (_tlState.dateFrom != null && entry.ts < _tlState.dateFrom) return false;
  if (_tlState.dateTo != null && entry.ts >= _tlState.dateTo) return false;
  if (_tlState.q) {
    const needle = _tlState.q.toLowerCase();
    const hay = [entry.summary, entry.subtype, entry.ref, entry.source].join(' ').toLowerCase();
    if (!hay.includes(needle)) return false;
  }
  return true;
}

function _tlApplyCheckFilter(axis, value, checked) {
  const arr = _tlState[axis + 's'] || _tlState[axis + 'es'] || _tlState[axis.replace(/y$/, 'ies')] || _tlState[axis];
  if (!Array.isArray(arr)) return;
  if (checked) { if (!arr.includes(value)) arr.push(value); }
  else          { const i = arr.indexOf(value); if (i >= 0) arr.splice(i, 1); }
  _tlUpdateActivePills();
  _tlRenderFiltered();
}

function _tlSetLocality(val) {
  _tlState.locality = val;
  document.querySelectorAll('#timeline-locality-toggle button').forEach(b => {
    b.classList.toggle('active', b.id === ('tl-loc-' + (val || 'all')));
  });
  _tlUpdateActivePills();
  _tlRenderFiltered();
}

function _tlApplySort() {
  const v = document.getElementById('timeline-sort').value;
  const [by, dir] = v.split(':');
  _tlState.sortBy  = by;
  _tlState.sortDir = dir;
  _tlRenderFiltered();
}

function _tlSearchDebounce() {
  clearTimeout(_tlSearchTimer);
  _tlSearchTimer = setTimeout(() => {
    _tlState.q = document.getElementById('timeline-search').value;
    _tlRenderFiltered();
  }, 400);
}

function _tlUpdateActivePills() {
  const container = document.getElementById('timeline-active-filters');
  if (!container) return;
  const pills = [];
  _tlState.sources.forEach(s => pills.push({label: `src:${s}`, clear: () => {
    _tlState.sources = _tlState.sources.filter(x => x !== s);
    _tlUpdateActivePills(); _tlRenderFiltered();
  }}));
  _tlState.statuses.forEach(s => pills.push({label: `status:${s}`, clear: () => {
    _tlState.statuses = _tlState.statuses.filter(x => x !== s);
    _tlUpdateActivePills(); _tlRenderFiltered();
  }}));
  _tlState.severities.forEach(s => pills.push({html: `<span class="tl-severity tl-sev-${s}">${s}</span>`, clear: () => {
    _tlState.severities = _tlState.severities.filter(x => x !== s);
    _tlUpdateActivePills(); _tlRenderFiltered();
  }}));
  if (_tlState.chainFilter) pills.push({label: `chain:…${_tlState.chainFilter.slice(-8)}`, clear: () => {
    _tlState.chainFilter = null; _tlNavActiveChain = null;
    _tlUpdateActivePills(); _tlRenderFiltered(); _tlNavRender();
  }});
  const pillsHtml = pills.map((p, i) =>
    `<span class="tl-filter-pill">${p.html || _tlEsc(p.label)}
       <button onclick="_tlClearPill(${i})" style="border:none;background:none;cursor:pointer;font-size:0.7rem;padding:0 2px">✕</button>
     </span>`
  ).join('');
  const resetBtn = pills.length > 1
    ? `<button onclick="_tlResetAllFilters()" class="btn btn-sm btn-ghost" style="font-size:0.62rem;padding:1px 6px;margin-left:4px" title="Clear all filters">✕ Clear all</button>`
    : '';
  container.innerHTML = pillsHtml + resetBtn;
  container._pills = pills; // store for onclick

  // Reflect active selections on filter button labels
  function _tlFilterLabel(base, arr) {
    if (!arr.length) return base + ' ▾';
    if (arr.length <= 2) return arr.join(', ') + ' ▾';
    return base + ' (' + arr.length + ') ▾';
  }
  const srcBtn = document.getElementById('timeline-source-btn');
  if (srcBtn) { srcBtn.textContent = _tlFilterLabel('Sources', _tlState.sources);
                srcBtn.classList.toggle('active', _tlState.sources.length > 0); }

// Tracks which chain nodes are expanded in the navigator
const _tlNavExpanded = new Set();

function _isInfraChain(c) {
  var cid = c.chain_id;
  return cid.endsWith(':index');
}

function _tlNavRenderChains() {
  var allFiltered = _tlState.navChains.filter(function(c) {
    return !_tlState.navFilter || (c.summary || c.chain_id).toLowerCase().includes(_tlState.navFilter);
  });

  var mainChains = allFiltered.filter(function(c) { return !_isInfraChain(c); });
  var infraChains = allFiltered.filter(_isInfraChain);

  if (!mainChains.length && !infraChains.length) return '<div style="padding:8px 12px;font-size:0.66rem;color:var(--text-muted)">No chains found</div>';

  function _renderChainItem(c) {
    const isExpanded = _tlNavExpanded.has(c.chain_id);
    const label      = (c.summary || c.chain_id || '').substring(0, 50);
    const srcs       = (c.sources || []).join(' · ');
    const chevron    = c.members && c.members.length ? (isExpanded ? '▾' : '▸') : '';

    const membersHtml = (isExpanded && c.members && c.members.length)
      ? `<div class="tl-nav-chain-members" onclick="event.stopPropagation()">${
          c.entry_count > 50
            ? _tlRenderChainFlat(c.members, c.chain_id)
            : _tlRenderChainTree(c.members, c.chain_id)
        }</div>`
      : '';

    return `
<div class="tl-nav-chain" style="cursor:pointer"
     onclick="_tlNavToggleChain('${_tlEsc(c.chain_id)}')">
  <div class="tl-nav-chain-header" style="user-select:none">
    <span style="font-size:0.6rem;color:var(--text-muted);width:10px">${chevron}</span>
    <span style="flex:1;display:flex;align-items:center;gap:4px;overflow:hidden">
      <span>📎</span>
      <span class="tl-nav-chain-label" title="${_tlEsc(c.chain_id)}">${_tlEsc(label)}</span>
    </span>
    <span class="tl-nav-chain-count">${c.entry_count}</span>
    <span onclick="event.stopPropagation();_tlNavSelectChain('${_tlEsc(c.chain_id)}')"
          title="Filter timeline to this chain"
          style="cursor:pointer;font-size:0.58rem;color:var(--text-muted);padding:0 4px">🔍</span>
  </div>
  <div style="padding:0 8px 2px 24px;font-size:0.6rem;color:var(--text-muted)">${_tlEsc(srcs)}</div>
  ${membersHtml}
</div>`;
  }

  var html = mainChains.map(_renderChainItem).join('');

  if (infraChains.length) {
    var infraExpanded = _tlState._showInfra;
    html += `<div style="margin-top:8px;border-top:1px solid var(--border-color);padding-top:4px">
      <button onclick="_tlToggleInfra()" class="btn btn-sm btn-ghost"
              style="font-size:0.58rem;padding:1px 8px;width:100%;text-align:left;opacity:0.7">
        ${infraExpanded ? '▾' : '▸'} Infrastructure (${infraChains.length})
      </button>
      ${infraExpanded ? infraChains.map(_renderChainItem).join('') : ''}
    </div>`;
  }

  return html;
}

let _tlToggleBusy = false;
function _tlNavToggleChain(chainId) {
  if (_tlToggleBusy) { console.warn('[TL] toggle re-entry blocked'); return; }
  _tlToggleBusy = true;
  try {
    // Expand/collapse
    if (_tlNavExpanded.has(chainId)) _tlNavExpanded.delete(chainId);
    else _tlNavExpanded.add(chainId);
    // Select/deselect (toggle) — single render pass
    if (_tlState.chainFilter === chainId) {
      _tlNavActiveChain    = null;
      _tlState.chainFilter = null;
    } else {
      _tlNavActiveChain    = chainId;
      _tlState.chainFilter = chainId;
    }
    _tlState.dateFrom = null;
    _tlState.dateTo   = null;
    _tlUpdateActivePills();
    _tlRenderFiltered();
    _tlNavRender();
  } finally {
    _tlToggleBusy = false;
  }
}

// Track how many members are shown per chain
const _tlChainShown = {};

function _tlChainLoadMore(chainId) {
  _tlChainShown[chainId] = (_tlChainShown[chainId] || 50) + 100;
  _tlNavRender();
}

function _tlRenderChainFlat(members, chainId) {
  // Flat chronological list for large chains (e.g., git history)
  const MAX_SHOW = _tlChainShown[chainId] || 50;
  const shown = members.slice(0, MAX_SHOW);
  let html = shown.map(m => {
    const sIcon = { ok:'●', warning:'◑', attention:'⚠', failed:'✕' }[m.status] ?? '●';
    const sCol  = { ok:'var(--success)', warning:'var(--warning)',
                    attention:'var(--warning)', failed:'var(--error)' }[m.status] ?? 'var(--text-muted)';
    const lIcon = m.locality === 'shared' ? '⇡' : '⬡';
    const lCol  = m.locality === 'shared' ? 'var(--accent)' : 'var(--text-muted)';
    const sub   = m.subtype === 'merge' ? '<span style="font-size:0.52rem;color:var(--accent)">MERGE</span> ' : '';
    return `<div class="tl-nav-member" style="cursor:pointer"
                 onclick="event.stopPropagation();_tlScrollToEntry('${_tlEsc(m.id)}')">
      <span style="color:${sCol}">${sIcon}</span>
      <span style="color:${lCol};font-size:0.58rem">${lIcon}</span>
      <span class="tl-source-badge tl-source-${_tlEsc((m.source||'').toLowerCase())}"
            style="font-size:0.52rem">${_tlEsc((m.source||'').toUpperCase())}</span>
      ${sub}<span class="tl-nav-member-summary">${_tlEsc(m.summary)}</span>
      <span class="tl-nav-member-time">${_tlFormatTime(m.ts)}</span>
    </div>`;
  }).join('');
  if (members.length > MAX_SHOW) {
    const remaining = members.length - MAX_SHOW;
    html += `<div style="padding:4px 8px">
      <button onclick="_tlChainLoadMore('${_tlEsc(chainId)}')"
              class="btn btn-sm btn-ghost"
              style="font-size:0.58rem;padding:2px 8px;width:100%;text-align:center">
        Load more (${remaining} remaining)
      </button></div>`;
  }
  return html;
}

function _tlRenderChainTree(members, chainId) {
  // Build tree from chain_parent_ref
  // Roots: members with chain_role=origin or no chain_parent_ref
  // Children: members whose chain_parent_ref matches another member's id or ref
  const byRef = {};
  for (const m of members) {
    if (m.id) byRef[m.id] = m;
    // Also index by the ref portion of the id (e.g., operation_id)
    const refPart = m.id ? m.id.split(':').slice(1).join(':') : null;
    if (refPart) byRef[refPart] = m;
  }

  const roots = members.filter(m =>
    m.chain_role === 'origin' || !m.chain_parent_ref
  );
  // Non-roots that aren't claimed by any parent go to roots too
  const childSet = new Set();
  for (const m of members) {
    if (m.chain_parent_ref && m.chain_role !== 'origin') childSet.add(m);
  }

  function childrenOf(parent) {
    const parentRef = parent.id ? parent.id.split(':').slice(1).join(':') : null;
    return members.filter(m =>
      m !== parent && m.chain_parent_ref && m.chain_role !== 'origin' &&
      (m.chain_parent_ref === parent.id ||
       (parentRef && m.chain_parent_ref === parentRef))
    );
  }

  function renderNode(m, depth, isLast) {
    const sIcon = { ok:'●', warning:'◑', attention:'⚠', failed:'✕' }[m.status] ?? '●';
    const sCol  = { ok:'var(--success)', warning:'var(--warning)',
                    attention:'var(--warning)', failed:'var(--error)' }[m.status] ?? 'var(--text-muted)';
    const lIcon = m.locality === 'shared' ? '⇡' : '⬡';
    const lCol  = m.locality === 'shared' ? 'var(--accent)' : 'var(--text-muted)';
    const roleLabel = m.chain_role ? `[${m.chain_role.toUpperCase()}]` : '';
    const connector = depth === 0 ? '' : (isLast ? '└─ ' : '├─ ');
    const indent = depth * 16;

    let html = `<div class="tl-nav-member" style="padding-left:${indent}px;cursor:pointer"
                     onclick="event.stopPropagation();_tlScrollToEntry('${_tlEsc(m.id)}')">
      <span style="font-size:0.58rem;color:var(--text-muted);font-family:monospace">${connector}</span>
      <span style="color:${sCol}">${sIcon}</span>
      <span style="color:${lCol};font-size:0.58rem">${lIcon}</span>
      <span class="tl-source-badge tl-source-${_tlEsc((m.source||'').toLowerCase())}"
            style="font-size:0.52rem">${_tlEsc((m.source||'').toUpperCase())}</span>
      <span class="tl-nav-member-summary">${_tlEsc(m.summary)}</span>
      <span class="tl-nav-member-time">${_tlFormatTime(m.ts)}</span>
      <span style="font-size:0.52rem;color:var(--text-muted)">${roleLabel}</span>
    </div>`;

    if (depth < 10) { // cap depth to prevent stack overflow
      const children = childrenOf(m);
      children.forEach((child, i) => {
        html += renderNode(child, depth + 1, i === children.length - 1);
      });
    }
    return html;
  }

  // If no clear roots found, just use the first member as root
  const actualRoots = roots.length ? roots : [members[0]];
  return actualRoots.map((r, i) => renderNode(r, 0, i === actualRoots.length - 1)).join('');
}

// Tracks which nodes are expanded in domains tree
const _tlDomainExpanded = new Set();

function _tlNavRenderDomains() {
  const adapters = _tlState.navAdapters; // {adapter: {subtype: count}}
  const adapterNames = Object.keys(adapters).sort();
  if (!adapterNames.length) return `<div style="padding:8px 12px;font-size:0.66rem;color:var(--text-muted)">No domains</div>`;

  return adapterNames.map(adapter => {
    const subtypes = adapters[adapter]; // {subtype: count}
    const adapterCount = Object.values(subtypes).reduce((s, c) => s + c, 0);
    const adapterExp = _tlDomainExpanded.has(adapter);

    let subtypesHtml = '';
    if (adapterExp) {
      const subKeys = Object.keys(subtypes).sort();
      subtypesHtml = subKeys.map(sub => {
        const subLabel = sub || '(default)';
        const subCount = subtypes[sub];
        const subKey = `${adapter}:${sub}`;
        const subExp = _tlDomainExpanded.has(subKey);

        // Leaf entries: find matching entries from allEntries
        let entriesHtml = '';
        if (subExp) {
          const matching = _tlState.allEntries.filter(e =>
            e.adapter === adapter && (e.subtype || '') === sub
          );
          entriesHtml = `<div style="padding-left:20px">` +
            matching.slice(0, 50).map(e => {
              const statusIcon = { ok:'●', warning:'◑', attention:'⚠', failed:'✕' }[e.status] ?? '●';
              const statusColor = { ok:'var(--success)', warning:'var(--warning)',
                attention:'var(--warning)', failed:'var(--error)' }[e.status] ?? 'var(--text-muted)';
              return `<div class="tl-nav-chain" style="padding:1px 0;cursor:pointer"
                           onclick="event.stopPropagation();_tlScrollToEntry('${_tlEsc(e.id)}')"
                           title="${_tlEsc(e.id)}">
                <div class="tl-nav-chain-header" style="padding:2px 8px">
                  <span style="color:${statusColor};font-size:0.58rem">${statusIcon}</span>
                  <span class="tl-nav-chain-label" style="font-size:0.6rem;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_tlEsc(e.summary)}</span>
                  <span style="font-size:0.56rem;color:var(--text-muted);flex-shrink:0">${_tlFormatTime(e.ts)}</span>
                </div>
              </div>`;
            }).join('') +
            (matching.length > 50 ? `<div style="font-size:0.58rem;color:var(--text-muted);padding:2px 8px">+${matching.length - 50} more</div>` : '') +
            `</div>`;
        }

        return `<div style="padding-left:12px">
          <div class="tl-nav-chain">
            <div class="tl-nav-chain-header" style="user-select:none">
              <span style="font-size:0.6rem;color:var(--text-muted);width:10px;cursor:pointer"
                    onclick="event.stopPropagation();_tlDomainToggle('${_tlEsc(subKey)}')">${subExp ? '▾' : '▸'}</span>
              <span class="tl-nav-chain-label" style="flex:1;font-size:0.64rem;cursor:pointer"
                    onclick="_tlDomainToggle('${_tlEsc(subKey)}')">${_tlEsc(subLabel)}</span>
              <span class="tl-nav-chain-count">${subCount}</span>
            </div>
          </div>
          ${entriesHtml}
        </div>`;
      }).join('');
    }

    return `<div class="tl-nav-chain">
      <div class="tl-nav-chain-header" style="user-select:none;cursor:pointer"
           onclick="_tlDomainToggle('${_tlEsc(adapter)}')">
        <span style="font-size:0.6rem;color:var(--text-muted);width:10px">${adapterExp ? '▾' : '▸'}</span>
        <span style="font-weight:600;font-size:0.66rem;flex:1">${_tlEsc(_tlAdapterLabel(adapter))}</span>
        <span class="tl-nav-chain-count">${adapterCount}</span>
      </div>
      ${subtypesHtml}
    </div>`;
  }).join('');
}

function _tlDomainToggle(key) {
  if (_tlDomainExpanded.has(key)) {
    _tlDomainExpanded.delete(key);
  } else {
    _tlDomainExpanded.add(key);
    // Also expand the first child subtype
    var adapters = _tlState.navAdapters || {};
    var subtypes = adapters[key];
    if (subtypes && typeof subtypes === 'object') {
      var firstSub = Object.keys(subtypes)[0];
      if (firstSub) {
        var subKey = key + ':' + firstSub;
        _tlDomainExpanded.add(subKey);
      }
    }
    // Select the first leaf entry (filter by this domain's source)
    _tlDomainFilter(key);
  }
  _tlNavRender();
}

function _tlDomainFilter(adapter) {
  // Filter entries by adapter (domain) — not by source
  // Use a custom domain filter instead of the source filter
  if (_tlState._domainFilter === adapter) {
    _tlState._domainFilter = null;
  } else {
    _tlState._domainFilter = adapter;
  }
  _tlUpdateActivePills();
  _tlRenderFiltered();
}

function _tlScrollToEntry(entryId) {
  const filtered = _tlState._filteredEntries || [];

  // Find the entry's index in the filtered list
  const idx = filtered.findIndex(e => e.id === entryId);
  if (idx < 0) {
    // Entry not in current filter — clear filters and retry
    _tlResetAllFilters();
    const retryIdx = (_tlState._filteredEntries || []).findIndex(e => e.id === entryId);
    if (retryIdx < 0) return; // truly not in data
    _tlScrollToEntryAtIndex(retryIdx, entryId);
    return;
  }
  _tlScrollToEntryAtIndex(idx, entryId);
}

function _tlScrollToEntryAtIndex(idx, entryId) {
  // Render batches until this index is visible
  while ((_tlState._renderedCount || 0) <= idx && _tlState.hasMore) {
    _tlRenderNextBatch();
  }

  // Find the DOM element by its id attribute (tl-entry-{idx})
  const el = document.getElementById(`tl-entry-${idx}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('tl-chain-hover');
    setTimeout(() => el.classList.remove('tl-chain-hover'), 2000);
  }
}

// Tracks which year/month nodes are expanded in calendar tree
const _tlCalExpanded = new Set();
let _tlCalInitDone = false;

function _tlNavRenderCalendar() {
  // Auto-expand current year and month on first render
  if (!_tlCalInitDone && _tlState.navCalendar.length) {
    _tlCalInitDone = true;
    const now = new Date();
    const curYear  = String(now.getFullYear());
    const curMonth = String(now.getMonth() + 1).padStart(2, '0');
    _tlCalExpanded.add(curYear);
    _tlCalExpanded.add(`${curYear}-${curMonth}`);
  }
  const days = _tlState.navCalendar;
  if (!days.length) return `<div style="padding:8px 12px;font-size:0.66rem;color:var(--text-muted)">No data</div>`;

  // Group by year → month → days
  const byYear = {};
  for (const d of days) {
    const [year, month] = d.date.split('-');
    if (!byYear[year]) byYear[year] = {};
    if (!byYear[year][month]) byYear[year][month] = [];
    byYear[year][month].push(d);
  }

  const years = Object.keys(byYear).sort().reverse();
  return years.map(year => {
    const monthKeys = Object.keys(byYear[year]).sort().reverse();
    const yearCount = monthKeys.reduce((sum, mk) =>
      sum + byYear[year][mk].reduce((s, d) => s + d.count, 0), 0);
    const yearHasFailure = monthKeys.some(mk =>
      byYear[year][mk].some(d => d.has_failure));
    const yearExp = _tlCalExpanded.has(year);
    const yearActive = _tlState.dateFrom != null &&
      _tlState.dateFrom === new Date(`${year}-01-01T00:00:00Z`).getTime() / 1000;

    let monthsHtml = '';
    if (yearExp) {
      monthsHtml = monthKeys.map(month => {
        const monthDays = byYear[year][month];
        const monthCount = monthDays.reduce((s, d) => s + d.count, 0);
        const monthHasFailure = monthDays.some(d => d.has_failure);
        const mk = `${year}-${month}`;
        const monthExp = _tlCalExpanded.has(mk);
        const monthLabel = new Date(Number(year), Number(month) - 1, 1)
          .toLocaleDateString([], { month: 'long' });
        const monthActive = _tlState.dateFrom != null &&
          _tlState.dateFrom === new Date(`${year}-${month}-01T00:00:00Z`).getTime() / 1000;

        let daysHtml = '';
        if (monthExp) {
          daysHtml = `<div style="padding-left:16px">` + monthDays.map(d => {
            const dayNum = d.date.split('-')[2];
            const dotColor = d.has_failure ? 'var(--error)' : 'var(--success)';
            const dayActive = _tlState.dateFrom != null &&
              _tlState.dateFrom === new Date(d.date + 'T00:00:00Z').getTime() / 1000 &&
              (_tlState.dateTo - _tlState.dateFrom) < 86401;
            return `<div class="tl-cal-row ${dayActive ? 'tl-nav-chain--active' : ''}"
                         onclick="_tlJumpToDate('${_tlEsc(d.date)}')"
                         title="${_tlEsc(d.date)} — ${d.count} entries">
              <span class="tl-cal-dot" style="background:${dotColor}"></span>
              <span class="tl-cal-day">${dayNum}</span>
              <span class="tl-cal-count">${d.count}</span>
            </div>`;
          }).join('') + `</div>`;
        }

        const monthDot = monthHasFailure ? 'var(--error)' : 'var(--success)';
        return `<div style="padding-left:12px">
          <div class="tl-nav-chain ${monthActive ? 'tl-nav-chain--active' : ''}" style="user-select:none">
            <div class="tl-nav-chain-header">
              <span style="font-size:0.6rem;color:var(--text-muted);width:10px;cursor:pointer"
                    onclick="event.stopPropagation();_tlCalToggle('${_tlEsc(mk)}')">${monthExp ? '▾' : '▸'}</span>
              <span class="tl-cal-dot" style="background:${monthDot};flex-shrink:0"></span>
              <span class="tl-nav-chain-label" style="flex:1;cursor:pointer"
                    onclick="_tlJumpToMonth('${_tlEsc(year)}','${_tlEsc(month)}')">${_tlEsc(monthLabel)}</span>
              <span class="tl-nav-chain-count">${monthCount}</span>
            </div>
          </div>
          ${daysHtml}
        </div>`;
      }).join('');
    }

    const yearDot = yearHasFailure ? 'var(--error)' : 'var(--success)';
    return `<div class="tl-nav-chain ${yearActive ? 'tl-nav-chain--active' : ''}">
      <div class="tl-nav-chain-header" style="user-select:none">
        <span style="font-size:0.6rem;color:var(--text-muted);width:10px;cursor:pointer"
              onclick="event.stopPropagation();_tlCalToggle('${_tlEsc(year)}')">${yearExp ? '▾' : '▸'}</span>
        <span class="tl-cal-dot" style="background:${yearDot};flex-shrink:0"></span>
        <span style="font-weight:600;font-size:0.68rem;flex:1;cursor:pointer"
              onclick="_tlJumpToYear('${_tlEsc(year)}')">${_tlEsc(year)}</span>
        <span class="tl-nav-chain-count">${yearCount}</span>
      </div>
      ${monthsHtml}
    </div>`;
  }).join('');
}

function _tlCalToggle(key) {
  if (_tlCalExpanded.has(key)) _tlCalExpanded.delete(key);
  else _tlCalExpanded.add(key);
  _tlNavRender();
}

function _tlJumpToDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  const from = d.getTime() / 1000;
  // Toggle: if same date already active, clear
  if (_tlState.dateFrom === from && (_tlState.dateTo - _tlState.dateFrom) < 86401) {
    _tlState.dateFrom = null;
    _tlState.dateTo   = null;
  } else {
    _tlState.dateFrom = from;
    _tlState.dateTo   = from + 86400;
  }
  _tlState.chainFilter = null;
  _tlNavActiveChain    = null;
  _tlRenderFiltered();
  _tlNavRender();
}

function _tlJumpToMonth(year, month) {
  const from = new Date(`${year}-${month}-01T00:00:00Z`).getTime() / 1000;
  const nextMonth = Number(month) === 12
    ? new Date(`${Number(year)+1}-01-01T00:00:00Z`).getTime() / 1000
    : new Date(`${year}-${String(Number(month)+1).padStart(2,'0')}-01T00:00:00Z`).getTime() / 1000;
  // Toggle
  if (_tlState.dateFrom === from && _tlState.dateTo === nextMonth) {
    _tlState.dateFrom = null;
    _tlState.dateTo   = null;
  } else {
    _tlState.dateFrom = from;
    _tlState.dateTo   = nextMonth;
    _tlCalExpanded.add(year);
    _tlCalExpanded.add(`${year}-${month}`);
  }
  _tlState.chainFilter = null;
  _tlNavActiveChain    = null;
  _tlRenderFiltered();
  _tlNavRender();
}

function _tlJumpToYear(year) {
  const from = new Date(`${year}-01-01T00:00:00Z`).getTime() / 1000;
  const to   = new Date(`${Number(year)+1}-01-01T00:00:00Z`).getTime() / 1000;
  // Toggle
  if (_tlState.dateFrom === from && _tlState.dateTo === to) {
    _tlState.dateFrom = null;
    _tlState.dateTo   = null;
  } else {
    _tlState.dateFrom = from;
    _tlState.dateTo   = to;
    _tlCalExpanded.add(year);
  }
  _tlState.chainFilter = null;
  _tlNavActiveChain    = null;
  _tlRenderFiltered();
  _tlNavRender();
}

function _tlNavHoverChain(chainId) {
  // Skip hover highlight for large chains (performance)
  if (chainId) {
    const chain = _tlState.navChains.find(c => c.chain_id === chainId);
    if (chain && chain.entry_count > 50) return;
  }
  document.querySelectorAll('.timeline-entry').forEach(el => {
    el.classList.toggle('tl-chain-hover', chainId !== null && el.dataset.chain === chainId);
  });
}

function _tlNavSelectChain(chainId) {
  // Toggle: if already filtering this chain, clear it
  if (_tlState.chainFilter === chainId) {
    _tlNavActiveChain    = null;
    _tlState.chainFilter = null;
  } else {
    _tlNavActiveChain    = chainId;
    _tlState.chainFilter = chainId;
  }
  _tlState.dateFrom    = null;
  _tlState.dateTo      = null;
  _tlUpdateActivePills();
  _tlRenderFiltered();
  _tlNavRender();
}

function _tlNavSelectChainAndExpand(chainId) {
  _tlNavSelectChain(chainId);
  // Also expand the chain to show members
  if (_tlState.chainFilter === chainId) {
    _tlNavExpanded.add(chainId);
    _tlNavRender();
  }
}

function _tlFilterBySource(src) {
  const idx = _tlState.sources.indexOf(src);
  if (idx >= 0) {
    _tlState.sources.splice(idx, 1);  // toggle off
  } else {
    _tlState.sources.push(src);       // toggle on
  }
  _tlUpdateActivePills();
  _tlRenderFiltered();
  _tlNavRender();
}

function _tlNavScrollTo(chainId) {
  // No-op — scroll sync highlighting removed (caused false matches)
}

// ── Resize handle ────────────────────────────────────────────────────

let _tlResizeStartX = 0, _tlResizeStartW = 0;

function _tlNavResizeStart(e) {
  const panel = document.getElementById('timeline-nav-panel');
  _tlResizeStartX = e.clientX;
  _tlResizeStartW = panel.offsetWidth;
  document.addEventListener('mousemove', _tlNavResizeMove);
  document.addEventListener('mouseup',   _tlNavResizeEnd);
  e.preventDefault();
}

function _tlNavResizeMove(e) {
  const panel = document.getElementById('timeline-nav-panel');
  const dx    = e.clientX - _tlResizeStartX;
  const nw    = Math.max(140, Math.min(400, _tlResizeStartW + dx));
  panel.style.width = nw + 'px';
}

function _tlNavResizeEnd() {
  document.removeEventListener('mousemove', _tlNavResizeMove);
  document.removeEventListener('mouseup',   _tlNavResizeEnd);
  const panel = document.getElementById('timeline-nav-panel');
  try { localStorage.setItem('tl-nav-width', panel.style.width); } catch (_) {}
}

// ── Scroll sync ──────────────────────────────────────────────────────

function _tlSyncNavFromScroll() {
  if (_tlState.navMode !== 'chains') return;
  const entries = document.querySelectorAll('.timeline-entry[data-chain]');
  const mid = window.scrollY + window.innerHeight / 2;
  let closest = null, closestDist = Infinity;
  entries.forEach(el => {
    const dist = Math.abs(el.getBoundingClientRect().top - mid);
    if (dist < closestDist) { closest = el; closestDist = dist; }
  });
  if (closest) _tlNavScrollTo(closest.dataset.chain);
}

// ── Init ─────────────────────────────────────────────────────────────

function _tlInit() {
  // Restore nav width
  try {
    const w = localStorage.getItem('tl-nav-width');
    if (w) {
      const panel = document.getElementById('timeline-nav-panel');
      if (panel) panel.style.width = w;
    }
  } catch (_) {}

  _tlInitScrollObserver();

  // Store pattern: try storeGet first (instant from __INITIAL_STATE__),
  // fall back to API fetch (cold start)
  const cached = storeGet('timeline');
  if (cached) {
    _tlOnData(cached);
  } else {
    api('/timeline/data').then(data => {
      storeSet('timeline', data);
    }).catch(err => {
      console.error('[TL] data fetch error', err);
    });
  }

  // Scroll sync (throttled)
  let _tlScrollTimer = null;
  const main = document.getElementById('timeline-main');
  if (main) {
    main.addEventListener('scroll', () => {
      clearTimeout(_tlScrollTimer);
      _tlScrollTimer = setTimeout(_tlSyncNavFromScroll, 150);
    });
  }
}

// _tlInit is called by debugSwitchMode('timeline') in _debugging.html.
// Guard against double-init (e.g., user switches to History mode twice).
let _tlInitDone = false;
const _tlInitOrig = _tlInit;
_tlInit = function() {
  if (_tlInitDone) return;
  _tlInitDone = true;
  _tlInitOrig();
};
</script>
