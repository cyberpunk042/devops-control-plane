<script>
    // ─────────────────────────────────────────────────────────────────
    //  _settings.html
    //  User preferences: UI scale, density, theme, preview mode
    //  Persisted in localStorage('dcp_prefs') as JSON
    //  Included by: dashboard.html (Jinja2 include)
    // ─────────────────────────────────────────────────────────────────

    // ── Default preferences ─────────────────────────────────────────
    const _PREFS_KEY = 'dcp_prefs';
    const _PREFS_DEFAULTS = {
        theme: 'dark',
        uiScale: 'default',      // compact | default | comfortable | large
        density: 'normal',       // dense | normal | spacious
        previewMode: 'modal',    // modal | forward
        assistantGuide: true,    // assistant side panel
        sshPassphrasePrompt: 'always',  // 'always' | 'on-demand'
        devMode: true,                   // owner can disable dev tools
    };

    // ── Scale profiles ──────────────────────────────────────────────
    const _SCALE_PROFILES = {
        compact:     { label: 'Compact',     rootPx: 12.75, icon: '🔍' },
        default:     { label: 'Default',     rootPx: 15,    icon: '📐' },
        comfortable: { label: 'Comfortable', rootPx: 16.5,  icon: '👓' },
        large:       { label: 'Large',       rootPx: 18.75, icon: '🔎' },
    };

    // ── Density profiles ────────────────────────────────────────────
    const _DENSITY_PROFILES = {
        dense:   { label: 'Dense',   xs: '0.15rem', sm: '0.3rem',  md: '0.7rem',  lg: '1rem',   xl: '1.4rem', xxl: '2rem'   },
        normal:  { label: 'Normal',  xs: '0.25rem', sm: '0.5rem',  md: '1rem',    lg: '1.5rem', xl: '2rem',   xxl: '3rem'   },
        spacious:{ label: 'Spacious',xs: '0.35rem', sm: '0.65rem', md: '1.25rem', lg: '1.85rem',xl: '2.5rem', xxl: '3.5rem' },
    };

    // ── Preference helpers ──────────────────────────────────────────

    function prefsLoad() {
        try {
            const raw = localStorage.getItem(_PREFS_KEY);
            if (raw) return { ..._PREFS_DEFAULTS, ...JSON.parse(raw) };
        } catch (_) {}
        return { ..._PREFS_DEFAULTS };
    }

    function prefsSave(prefs) {
        localStorage.setItem(_PREFS_KEY, JSON.stringify(prefs));
    }

    function prefsGet(key) {
        return prefsLoad()[key] ?? _PREFS_DEFAULTS[key];
    }

    function prefsSet(key, value) {
        const prefs = prefsLoad();
        prefs[key] = value;
        prefsSave(prefs);
    }

    // ── Apply functions ─────────────────────────────────────────────

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
    }

    function applyScale(profileKey) {
        const profile = _SCALE_PROFILES[profileKey] || _SCALE_PROFILES.default;
        document.documentElement.style.fontSize = profile.rootPx + 'px';
    }

    function applyDensity(profileKey) {
        const profile = _DENSITY_PROFILES[profileKey] || _DENSITY_PROFILES.normal;
        const root = document.documentElement.style;
        root.setProperty('--space-xs',  profile.xs);
        root.setProperty('--space-sm',  profile.sm);
        root.setProperty('--space-md',  profile.md);
        root.setProperty('--space-lg',  profile.lg);
        root.setProperty('--space-xl',  profile.xl);
        root.setProperty('--space-2xl', profile.xxl);
    }

    function applyAllPrefs() {
        const prefs = prefsLoad();
        applyTheme(prefs.theme);
        applyScale(prefs.uiScale);
        applyDensity(prefs.density);
    }

    // ── Settings panel toggle ───────────────────────────────────────

    function toggleSettingsPanel() {
        const panel = document.getElementById('settings-panel');
        if (!panel) return;
        const isOpen = panel.classList.contains('open');
        if (isOpen) {
            panel.classList.remove('open');
        } else {
            _renderSettingsPanel();
            panel.classList.add('open');
        }
    }

    function _renderSettingsPanel() {
        const body = document.getElementById('settings-panel-body');
        if (!body) return;
        const prefs = prefsLoad();

        let html = '';

        // ── Row 1: Theme + File Preview ─────────────────────────
        html += `<div class="settings-row">
            <div class="settings-group">
                <div class="settings-label">Theme</div>
                <div class="settings-btn-group">
                    <button class="settings-btn ${prefs.theme === 'dark' ? 'active' : ''}"
                        onclick="_prefSetTheme('dark')">🌙 Dark</button>
                    <button class="settings-btn ${prefs.theme === 'light' ? 'active' : ''}"
                        onclick="_prefSetTheme('light')">☀️ Light</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">File Preview</div>
                <div class="settings-btn-group">
                    <button class="settings-btn ${prefs.previewMode === 'modal' ? 'active' : ''}"
                        onclick="_prefSetPreviewMode('modal')">🔍 Modal</button>
                    <button class="settings-btn ${prefs.previewMode === 'forward' ? 'active' : ''}"
                        onclick="_prefSetPreviewMode('forward')">➡️ Nav</button>
                </div>
            </div>
        </div>`;

        // ── UI Scale (full width — 4 options) ───────────────────
        html += `<div class="settings-group">
            <div class="settings-label">UI Scale</div>
            <div class="settings-btn-group">`;
        for (const [key, prof] of Object.entries(_SCALE_PROFILES)) {
            html += `<button class="settings-btn ${prefs.uiScale === key ? 'active' : ''}"
                onclick="_prefSetScale('${key}')" title="${prof.rootPx}px root">${prof.icon} ${prof.label}</button>`;
        }
        html += `</div></div>`;

        // ── Density (full width — 3 options) ────────────────────
        html += `<div class="settings-group">
            <div class="settings-label">Density</div>
            <div class="settings-btn-group">`;
        for (const [key, prof] of Object.entries(_DENSITY_PROFILES)) {
            const icons = { dense: '▪️', normal: '◾', spacious: '⬛' };
            html += `<button class="settings-btn ${prefs.density === key ? 'active' : ''}"
                onclick="_prefSetDensity('${key}')">${icons[key] || '◾'} ${prof.label}</button>`;
        }
        html += `</div></div>`;

        // ── Row 2: Assistant Guide + conditional options ─────────
        html += `<div class="settings-row">`;

        // Assistant Guide
        html += `<div class="settings-group">
            <div class="settings-label">✨ Assistant Guide</div>
            <div class="settings-btn-group">
                <button class="settings-btn ${prefs.assistantGuide ? 'active' : ''}"
                    onclick="_prefSetAssistantGuide(true)">On</button>
                <button class="settings-btn ${!prefs.assistantGuide ? 'active' : ''}"
                    onclick="_prefSetAssistantGuide(false)">Off</button>
            </div>
        </div>`;

        // SSH Passphrase or Dev Mode (second column)
        const sshSecure = typeof _gitAuthStatus !== 'undefined'
            && _gitAuthStatus
            && _gitAuthStatus.remote_type === 'ssh'
            && (_gitAuthStatus.needs === 'ssh_passphrase' || _gitAuthStatus.ssh_key);

        if (sshSecure) {
            const p = prefs.sshPassphrasePrompt || 'always';
            html += `<div class="settings-group">
                <div class="settings-label">🔒 SSH Prompt</div>
                <div class="settings-btn-group">
                    <button class="settings-btn ${p === 'always' ? 'active' : ''}"
                        onclick="_prefSetSshPrompt('always')">Startup</button>
                    <button class="settings-btn ${p === 'on-demand' ? 'active' : ''}"
                        onclick="_prefSetSshPrompt('on-demand')">On Demand</button>
                </div>
            </div>`;
        } else if (window._devModeStatus && window._devModeStatus.is_owner) {
            const dm = prefs.devMode !== false;
            html += `<div class="settings-group">
                <div class="settings-label">🔧 Dev Mode</div>
                <div class="settings-btn-group">
                    <button class="settings-btn ${dm ? 'active' : ''}"
                        onclick="_prefSetDevMode(true)">On</button>
                    <button class="settings-btn ${!dm ? 'active' : ''}"
                        onclick="_prefSetDevMode(false)">Off</button>
                </div>
            </div>`;
        } else {
            html += `<div class="settings-group"></div>`; // empty cell
        }
        html += `</div>`;

        // ── Dev Mode as separate row if SSH was shown above ──────
        if (sshSecure && window._devModeStatus && window._devModeStatus.is_owner) {
            const dm = prefs.devMode !== false;
            html += `<div class="settings-group">
                <div class="settings-label">🔧 Dev Mode</div>
                <div class="settings-hint">Stage debugger and developer tools</div>
                <div class="settings-btn-group">
                    <button class="settings-btn ${dm ? 'active' : ''}"
                        onclick="_prefSetDevMode(true)">On</button>
                    <button class="settings-btn ${!dm ? 'active' : ''}"
                        onclick="_prefSetDevMode(false)">Off</button>
                </div>
            </div>`;
        }

        // ── Server Section ──────────────────────────────────────
        html += `<div style="border-top:1px solid var(--border-subtle);margin:0.5rem 0 0.35rem;padding-top:0.4rem">
            <div class="settings-label" style="font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Server</div>
        </div>`;

        // Placeholder for async server settings
        html += `<div id="server-settings-section" style="min-height:30px">
            <div class="settings-hint" style="opacity:0.5">Loading…</div>
        </div>`;

        body.innerHTML = html;

        // Fetch server settings asynchronously
        _loadServerSettingsSection();
    }

    // ── Preference setters (called by settings UI) ──────────────

    function _prefSetTheme(theme) {
        prefsSet('theme', theme);
        applyTheme(theme);
        _renderSettingsPanel();
    }

    function _prefSetScale(scale) {
        prefsSet('uiScale', scale);
        applyScale(scale);
        _renderSettingsPanel();
    }

    function _prefSetDensity(density) {
        prefsSet('density', density);
        applyDensity(density);
        _renderSettingsPanel();
    }

    function _prefSetPreviewMode(mode) {
        prefsSet('previewMode', mode);
        _renderSettingsPanel();
    }

    function _prefSetAssistantGuide(enabled) {
        prefsSet('assistantGuide', enabled);
        if (window._assistant) {
            enabled ? window._assistant.enable() : window._assistant.disable();
        }
        _renderSettingsPanel();
    }

    function _prefSetSshPrompt(mode) {
        prefsSet('sshPassphrasePrompt', mode);
        _renderSettingsPanel();
    }

    /**
     * Fetch server settings and status, render the Server section.
     */
    async function _loadServerSettingsSection() {
        const container = document.getElementById('server-settings-section');
        if (!container) return;

        try {
            const [settingsResp, statusResp] = await Promise.all([
                fetch('/api/server/settings'),
                fetch('/api/server/status'),
            ]);
            if (!settingsResp.ok) throw new Error(`HTTP ${settingsResp.status}`);
            const settings = await settingsResp.json();
            const status = statusResp.ok ? await statusResp.json() : {};

            // Cache for use by _prefViewLog
            window._lastServerSettings = settings;

            const peekOn = settings.peek_index_enabled !== false;
            const host = status.host || '127.0.0.1';
            const port = status.port || '?';
            const pid = status.pid || '?';
            const uptime = status.uptime_s ? _formatUptime(status.uptime_s) : '—';

            const logOn = settings.file_logging_enabled === true;
            const logPath = settings.file_logging_path || '.state/web.log';

            let html = '';

            // ── Status line (compact) ──
            html += `<div class="settings-hint" style="font-family:var(--font-mono,monospace);font-size:0.72rem;line-height:1.4;margin-bottom:0.4rem">
                🖥️ <strong>${host}:${port}</strong> · PID ${pid} · up ${uptime}
            </div>`;

            // ── Config + Restart row ──
            html += `<div class="settings-group">
                <div class="settings-btn-group">
                    <button class="settings-btn"
                        onclick="_prefOpenConfig()">
                        📝 project.yml
                    </button>
                    <button class="settings-btn" id="server-restart-btn"
                        onclick="_prefRestartServer()" style="color:var(--clr-warning,#f59e0b)">
                        ⚡ Restart
                    </button>
                </div>
            </div>`;

            // ── Peek & Index + File Logging row ──
            html += `<div class="settings-row">
                <div class="settings-group">
                    <div class="settings-label">🔍 Peek & Index</div>
                    <div class="settings-btn-group">
                        <button class="settings-btn ${peekOn ? 'active' : ''}"
                            onclick="_prefSetServerPeekIndex(true)">On</button>
                        <button class="settings-btn ${!peekOn ? 'active' : ''}"
                            onclick="_prefSetServerPeekIndex(false)">Off</button>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-label">📋 File Logging</div>
                    <div class="settings-btn-group">
                        <button class="settings-btn ${logOn ? 'active' : ''}"
                            onclick="_prefSetFileLogging(true)">On</button>
                        <button class="settings-btn ${!logOn ? 'active' : ''}"
                            onclick="_prefSetFileLogging(false)">Off</button>
                        ${logOn ? '<button class="settings-btn" onclick="_prefViewLog()" title="View log file">👁️</button>' : ''}
                    </div>
                    ${logOn ? '<div class="settings-hint" style="margin-top:0.15rem;cursor:pointer;text-decoration:underline dotted" onclick="_prefViewLog()">' + esc(logPath) + '</div>' : ''}
                </div>
            </div>`;

            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = `<div class="settings-hint" style="color:var(--text-muted)">Could not load server settings</div>`;
        }
    }

    /** Format uptime seconds into a human-readable string. */
    function _formatUptime(seconds) {
        if (seconds < 60) return `${Math.round(seconds)}s`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${Math.round(seconds % 60)}s`;
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        return `${h}h ${m}m`;
    }

    /** Toggle file logging (takes effect immediately, no restart). */
    async function _prefSetFileLogging(enabled) {
        try {
            await fetch('/api/server/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_logging_enabled: enabled }),
            });
        } catch (_) {}
        _loadServerSettingsSection();
    }

    /** Open the log file in a modal preview. */
    function _prefViewLog() {
        // Close settings panel
        var settingsPanel = document.querySelector('.settings-panel.open');
        if (settingsPanel) settingsPanel.classList.remove('open');

        // Read the log path from the last loaded settings, fallback to default
        const logPath = window._lastServerSettings?.file_logging_path || '.state/web.log';
        if (typeof openFileInModal === 'function') {
            openFileInModal(logPath);
        }
    }

    /** Open project.yml in a preview modal. */
    function _prefOpenConfig() {
        // Close settings panel
        var settingsPanel = document.querySelector('.settings-panel.open');
        if (settingsPanel) settingsPanel.classList.remove('open');

        // Open in modal preview (project.yml is at project root, not inside a content folder)
        if (typeof openFileInModal === 'function') {
            openFileInModal('project.yml');
        }
    }

    /** Manual restart button → show confirmation modal first. */
    async function _prefRestartServer() {
        // Show confirmation modal
        _showRestartConfirmModal();
    }

    /** Show a confirmation modal before restarting the server. */
    function _showRestartConfirmModal() {
        // Remove any existing modal
        var existing = document.getElementById('restart-confirm-modal');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.id = 'restart-confirm-modal';
        overlay.style.cssText = [
            'position:fixed', 'inset:0', 'z-index:99999',
            'display:flex', 'align-items:center', 'justify-content:center',
            'background:rgba(0,0,0,0.6)',
            'backdrop-filter:blur(4px)', '-webkit-backdrop-filter:blur(4px)',
            'animation:fadeIn 0.2s ease',
        ].join(';');

        overlay.innerHTML = `
            <div style="
                background:var(--bg-card, #1e1e2e);
                border:1px solid var(--border, #333);
                border-radius:12px;
                padding:2rem;
                max-width:380px;
                width:calc(100% - 2rem);
                text-align:center;
                color:var(--text-primary, #e0e0e0);
                font-family:var(--font-sans, system-ui, sans-serif);
                box-shadow:0 24px 48px rgba(0,0,0,0.5);
            ">
                <div style="font-size:2rem;margin-bottom:0.75rem">🔄</div>
                <h3 style="margin:0 0 0.5rem;font-size:1rem;font-weight:600">
                    Restart Admin Panel?
                </h3>
                <p style="
                    color:var(--text-muted, #888);
                    font-size:0.82rem;
                    line-height:1.5;
                    margin:0 0 1.25rem;
                ">
                    The server will restart with the latest <code style="
                        font-size:0.78rem;background:rgba(255,255,255,0.08);
                        padding:0.1em 0.35em;border-radius:3px
                    ">project.yml</code> settings.
                    The page will auto-refresh when ready.
                </p>
                <div style="display:flex;gap:0.5rem;justify-content:center">
                    <button id="restart-confirm-cancel" style="
                        background:var(--bg-input,#2a2a3e);color:var(--text-secondary,#aaa);
                        border:1px solid var(--border-subtle,#333);border-radius:8px;
                        padding:0.5rem 1.2rem;font-size:0.82rem;font-weight:500;
                        cursor:pointer;transition:opacity 0.2s;font-family:inherit
                    ">Cancel</button>
                    <button id="restart-confirm-go" style="
                        background:var(--clr-warning,#f59e0b);color:#000;
                        border:none;border-radius:8px;
                        padding:0.5rem 1.2rem;font-size:0.82rem;font-weight:600;
                        cursor:pointer;transition:opacity 0.2s;font-family:inherit
                    ">⚡ Restart Now</button>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        // Click outside to cancel
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
        });

        document.getElementById('restart-confirm-cancel').addEventListener('click', function() {
            overlay.remove();
        });

        document.getElementById('restart-confirm-go').addEventListener('click', function() {
            overlay.remove();
            _doServerRestart();
        });
    }

    /**
     * Execute the actual server restart — no confirmation.
     * Used by the confirmation modal and the imminent notification.
     */
    async function _doServerRestart() {
        // Close settings panel if open
        var settingsPanel = document.querySelector('.settings-panel.open');
        if (settingsPanel) settingsPanel.classList.remove('open');

        try {
            await fetch('/api/server/restart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
            });
        } catch (_) {
            // Expected — server dies immediately
        }

        // Show reconnection overlay and start polling
        _showReconnectionOverlay();
    }

    // Expose for cross-script access (e.g. config_changed banner in _notifications.html)
    window._doServerRestart = _doServerRestart;

    /** Full-screen overlay while waiting for the server to come back. */
    function _showReconnectionOverlay() {
        var existing = document.getElementById('reconnect-overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.id = 'reconnect-overlay';
        overlay.style.cssText = [
            'position:fixed', 'inset:0', 'z-index:999999',
            'display:flex', 'flex-direction:column',
            'align-items:center', 'justify-content:center',
            'background:rgba(0,0,0,0.85)',
            'backdrop-filter:blur(8px)', '-webkit-backdrop-filter:blur(8px)',
            'color:#fff', 'font-family:var(--font-sans, system-ui, sans-serif)',
        ].join(';');

        overlay.innerHTML = `
            <div style="text-align:center">
                <div style="font-size:2.5rem;margin-bottom:0.75rem;animation:pulse 1.2s infinite">🔄</div>
                <div style="font-size:1rem;font-weight:600;margin-bottom:0.5rem">
                    Server Restarting…
                </div>
                <div id="reconnect-status" style="
                    font-size:0.82rem;color:rgba(255,255,255,0.6);
                    margin-bottom:1.5rem;
                ">Waiting for server to come back</div>
                <div class="spinner" style="margin:0 auto"></div>
            </div>
        `;

        document.body.appendChild(overlay);

        // Start polling for reconnection
        _pollForReconnection();
    }

    /** Poll the server until it's back, then refresh. */
    function _pollForReconnection() {
        var currentOrigin = location.origin;
        var attempts = 0;
        var maxAttempts = 40; // ~60 seconds

        var interval = setInterval(async function() {
            attempts++;
            var statusEl = document.getElementById('reconnect-status');
            if (statusEl) {
                statusEl.textContent = 'Attempt ' + attempts + '/' + maxAttempts + '…';
            }

            try {
                var resp = await fetch(currentOrigin + '/api/server/status', {
                    signal: AbortSignal.timeout(2000),
                });
                if (resp.ok) {
                    clearInterval(interval);
                    var data = await resp.json();

                    // Check if port changed
                    var newPort = data.port;
                    var currentPort = parseInt(location.port, 10) || 80;
                    if (newPort && newPort !== currentPort) {
                        // Port changed — redirect to the new URL
                        var newUrl = location.protocol + '//' + location.hostname + ':' + newPort + location.pathname + location.hash;
                        if (statusEl) statusEl.textContent = 'Port changed → redirecting to :' + newPort + '…';
                        setTimeout(function() { location.href = newUrl; }, 500);
                    } else {
                        if (statusEl) statusEl.textContent = 'Server is back — refreshing…';
                        setTimeout(function() { location.reload(); }, 500);
                    }
                }
            } catch (_) {
                // Server still down — keep polling
            }

            if (attempts >= maxAttempts) {
                clearInterval(interval);
                var statusEl2 = document.getElementById('reconnect-status');
                if (statusEl2) {
                    statusEl2.innerHTML = 'Server did not come back after ' + maxAttempts + ' attempts.<br>' +
                        '<button onclick="location.reload()" style="' +
                            'margin-top:1rem;background:var(--accent,#6366f1);color:#fff;border:none;' +
                            'border-radius:8px;padding:0.5rem 1.2rem;font-size:0.82rem;cursor:pointer' +
                        '">🔄 Retry Manually</button>';
                }
            }
        }, 1500);
    }

    function _prefSetDevMode(enabled) {
        prefsSet('devMode', enabled);
        // Re-run dev mode logic to update badge + body attribute
        if (window._devModeStatus) {
            window._devModeStatus.dev_mode = window._devModeStatus.is_owner && enabled;
            const badge = document.getElementById('dev-mode-badge');
            if (badge) badge.style.display = enabled ? '' : 'none';
            if (enabled) {
                document.body.setAttribute('data-dev-mode', 'true');
            } else {
                document.body.removeAttribute('data-dev-mode');
            }
        }
        _renderSettingsPanel();
    }

    /**
     * Toggle the server-side Peek & Index feature.
     * Sends a PUT to /api/server/settings and prompts for restart.
     */
    async function _prefSetServerPeekIndex(enabled) {
        try {
            const resp = await fetch('/api/server/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ peek_index_enabled: enabled }),
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const result = await resp.json();

            // Re-render the server section
            _loadServerSettingsSection();

            // Prompt restart if the setting actually changed
            if (result.needs_restart) {
                const action = enabled ? 'enabled' : 'disabled';
                if (typeof toast === 'function') {
                    toast(`Peek & Index ${action} — restart required`, 'info', 5000);
                }
            }
        } catch (e) {
            if (typeof toast === 'function') {
                toast('Failed to save server setting', 'error', 3000);
            }
        }
    }

    // ── Migration from legacy localStorage('theme') ─────────────
    (function _migrateTheme() {
        const legacy = localStorage.getItem('theme');
        if (legacy && !localStorage.getItem(_PREFS_KEY)) {
            const prefs = { ..._PREFS_DEFAULTS, theme: legacy };
            prefsSave(prefs);
            localStorage.removeItem('theme');
        }
    })();

    // ── Apply on load (immediate — before DOMContentLoaded) ─────
    applyAllPrefs();

    // ── Close panel on outside click ────────────────────────────────
    // NOTE: We cannot use panel.contains(e.target) because
    // _renderSettingsPanel() replaces innerHTML, destroying the clicked
    // button before this handler runs. Instead we stop propagation from
    // inside the panel so the document handler never fires for those clicks.
    document.addEventListener('click', (e) => {
        const panel = document.getElementById('settings-panel');
        const gear = document.getElementById('settings-gear');
        if (!panel || !gear) return;
        // If the click was on the gear icon itself (toggle), let toggleSettingsPanel handle it
        if (gear === e.target || gear.contains(e.target)) {
            // Exclude clicks on the panel itself (it's nested inside gear)
            if (panel.contains(e.target)) return;
            return;
        }
        panel.classList.remove('open');
    });

    // Stop propagation for clicks inside the settings panel so they
    // don't reach the outside-click handler above.
    document.addEventListener('DOMContentLoaded', () => {
        const panel = document.getElementById('settings-panel');
        if (panel) {
            panel.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }
    });
</script>
