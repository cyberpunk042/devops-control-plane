                        html += '<span style="color:var(--text-muted);font-style:italic">idle</span>';
                        html += '</div>';
                    }
                }
                html += '</div>';
            }

            // Recent activity log (scrollable)
            if (hasLog) {
                html += '<div style="font-size:0.64rem;color:var(--text-muted);margin-bottom:4px">Recent activity:</div>';
                html += '<div id="status-worker-log" style="max-height:180px;overflow-y:auto;border:1px solid var(--border-subtle,rgba(148,163,184,0.08));border-radius:4px">';

                // Show newest first
                const logReversed = [..._statusWorkerLog].reverse();
                for (const entry of logReversed) {
                    const ok = entry.ok;
                    const icon = ok ? '✓' : '✗';
                    const iconColor = ok ? '#34d399' : '#ef4444';
                    const priName = priNames[entry.priority] || 'P' + entry.priority;
                    const priColor = priColors[entry.priority] || 'var(--text-muted)';
                    const elapsed = entry.elapsed_ms != null ? entry.elapsed_ms + 'ms' : '—';
                    const elColor = (entry.elapsed_ms || 0) > 5000 ? '#ef4444' : (entry.elapsed_ms || 0) > 1000 ? '#f59e0b' : '#34d399';
                    const szC = entry.size === 3 ? '#ef4444' : entry.size === 2 ? '#f59e0b' : 'var(--text-muted)';
                    const ago = Math.round((now - entry.ts) / 1000);
                    const agoStr = ago < 60 ? ago + 's ago' : Math.round(ago / 60) + 'm ago';

                    html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid var(--border-subtle,rgba(148,163,184,0.04));font-size:0.64rem">';
                    html += '<span style="color:' + iconColor + ';font-weight:600;min-width:12px">' + icon + '</span>';
                    html += '<span style="font-weight:600;color:#818cf8;min-width:18px">W' + entry.worker_id + '</span>';
                    html += '<span style="flex:1;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + entry.path + '</span>';
                    html += '<span style="padding:0 3px;border-radius:3px;background:' + priColor + '18;color:' + priColor + ';font-weight:500;font-size:0.56rem">' + priName + '</span>';
                    html += '<span style="color:' + szC + ';font-size:0.56rem">' + entry.size + 'u</span>';
                    html += '<span style="min-width:42px;text-align:right;color:' + elColor + ';font-weight:500">' + elapsed + '</span>';
                    html += '<span style="min-width:38px;text-align:right;color:var(--text-muted);font-size:0.58rem">' + agoStr + '</span>';
                    html += '</div>';
                }

                html += '</div>';
            }

            html += '</div>';

            // Auto-refresh timer for live elapsed updates when workers active
            if (anyActive && _statusVisible) {
                if (!_statusRender._workerTimer) {
                    _statusRender._workerTimer = setInterval(() => {
                        const c = document.getElementById('debug-mediator-status');
                        if (c && _statusVisible) _statusRender(c);
                        else { clearInterval(_statusRender._workerTimer); _statusRender._workerTimer = null; }
                    }, 500);
                }
            } else if (_statusRender._workerTimer) {
                clearInterval(_statusRender._workerTimer);
                _statusRender._workerTimer = null;
            }
        }

        // ── Tier Pipeline ────────────────────────────────────
        const tierKeys = Object.keys(_statusTiers);
        if (tierKeys.length > 0) {
            html += '<div style="background:var(--bg-secondary);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px">';
            html += '<div style="font-weight:600;font-size:0.74rem;color:var(--text-primary);margin-bottom:8px">🏗 Dispatch Tiers</div>';
            html += '<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">';
            for (const tk of tierKeys) {
                const t = _statusTiers[tk];
                const tDone = t.status === 'done';
                const tRunning = t.status === 'running';
                const bgColor = tDone ? 'rgba(52,211,153,0.12)' : tRunning ? 'rgba(129,140,248,0.12)' : 'rgba(148,163,184,0.08)';
                const fgColor = tDone ? '#34d399' : tRunning ? '#818cf8' : 'var(--text-muted)';
                const icon = tDone ? '✓' : tRunning ? '⏳' : '○';
                const elapsed = tDone && t.elapsed_ms ? ' · ' + t.elapsed_ms + 'ms' : '';
                html += '<div style="background:' + bgColor + ';color:' + fgColor + ';padding:3px 10px;border-radius:8px;font-size:0.68rem;font-weight:500">';
                html += icon + ' ' + tk + ' (' + t.count + ')' + elapsed;
                html += '</div>';
                // Arrow between tiers
                if (tk !== tierKeys[tierKeys.length - 1]) {
                    html += '<span style="color:var(--text-muted);font-size:0.6rem">→</span>';
                }
            }
            html += '</div>';
            html += '</div>';
        }

        // Per-node rows grouped by domain
        const domains = {};
        for (const p of allPaths) {
            const d = p.split('.')[0];
            if (!domains[d]) domains[d] = [];
            domains[d].push(p);
        }

        for (const [domain, paths] of Object.entries(domains).sort()) {
            const domainDone = paths.filter(p => _statusNodes[p].status === 'done').length;
            const domainColor = domainDone === paths.length ? '#34d399' : domainDone === 0 ? 'var(--text-muted)' : '#f59e0b';
            html += '<div style="margin-bottom:8px">';
            html += '<div style="font-weight:600;color:' + domainColor + ';margin-bottom:3px;font-size:0.72rem">' + domain + ' (' + domainDone + '/' + paths.length + ')</div>';

            for (const p of paths) {
                const n = _statusNodes[p];
                const name = p.split('.').slice(1).join('.');
                let icon, color, detail;

                switch (n.status) {
                    case 'computing':
                        icon = '⏳'; color = '#818cf8'; detail = 'computing...';
                        break;
                    case 'done':
                        icon = '✅'; color = '#34d399';
                        detail = '';
                        if (n.elapsed_ms != null) detail += n.elapsed_ms + 'ms';
                        if (n.entries != null) detail += (detail ? ' · ' : '') + n.entries + ' entries';
                        if (!detail) detail = 'cached';
                        break;
                    case 'failed':
                        icon = '❌'; color = '#ef4444';
                        detail = n.error ? n.error.substring(0, 80) : 'error';
                        if (n.elapsed_ms != null) detail = n.elapsed_ms + 'ms · ' + detail;
                        break;
                    default:
                        // Check if this is a peek/symbols node that's intentionally disabled
                        if ((p === 'index.symbols' || p === 'index.peek')
                            && _configData && _configData.peek_symbols_enabled === false) {
                            icon = '🚫'; color = '#6b7280'; detail = 'disabled (Peek & Symbols off)';
                        } else {
                            icon = '⬜'; color = 'var(--text-muted)'; detail = 'pending';
                        }
                }

                const diagEntry = _mediatorDiagData && _mediatorDiagData.entries && _mediatorDiagData.entries[p];
                const nSz = (diagEntry && diagEntry.size) || 1;
                const szC = nSz === 3 ? '#ef4444' : nSz === 2 ? '#f59e0b' : 'var(--text-muted)';

                html += '<div style="display:flex;align-items:center;gap:8px;padding:2px 8px;border-bottom:1px solid var(--border-subtle)">';
                html += '<span style="min-width:16px">' + icon + '</span>';
                html += '<span style="flex:1;color:' + color + '">' + name + '</span>';
                html += '<span style="color:' + szC + ';font-size:0.62rem;min-width:14px;text-align:center" title="weight ' + nSz + '">' + nSz + '</span>';
                html += '<span style="color:var(--text-muted);font-size:0.64rem;text-align:right">' + detail + '</span>';
                html += '</div>';
            }
            html += '</div>';
        }

        html += '</div>';

        // Save scroll position of worker log before replacing DOM
        const logEl = container.querySelector('#status-worker-log');
        const savedScroll = logEl ? logEl.scrollTop : 0;

        container.innerHTML = html;

        // Restore scroll position
        const newLogEl = container.querySelector('#status-worker-log');
        if (newLogEl && savedScroll > 0) newLogEl.scrollTop = savedScroll;
    }

    async function _mediatorShowConfig() {

    async function _configSave(patch) {
        try {
            const resp = await fetch('/api/mediator/config', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patch),
            });
            const result = await resp.json();
            _configData = result.config || _configData;
            if (result.needs_restart) _configNeedsRestart = true;
            const c = document.getElementById('debug-mediator-config');
            if (c) _configRender(c);
        } catch (e) {
            console.error('[Config] save failed:', e);
        }
    }

    async function _configRestart() {
        // Show restarting overlay
        const banner = document.getElementById('config-restart-banner');
        if (banner) banner.innerHTML = '<span style="color:#f59e0b;font-weight:600">⟳ Restarting server... page will reload automatically.</span>';

        try { await fetch('/api/server/restart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); } catch (e) { /* expected — server is dying */ }

        // Poll until server is back, then reload
        _configNeedsRestart = false;
        const poll = setInterval(async () => {
            try {
                const r = await fetch('/api/mediator/config', { signal: AbortSignal.timeout(2000) });
                if (r.ok) {
                    clearInterval(poll);
                    window.location.reload();
                }
            } catch (e) { /* still down, keep polling */ }
        }, 1000);
    }

    async function _configDispatchTier(tierName) {

        const tierData = _statusTiers || {};
        const tier = tierData[tierName];

        try {
            await fetch('/api/mediator/dispatch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths: tier.paths }),

    async function _configTogglePeekSymbols(enabled) {
        try {
            const resp = await fetch('/api/server/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ peek_index_enabled: enabled }),
            });
            if (resp.ok) {
                // Update local config data immediately
                if (_configData) _configData.peek_symbols_enabled = enabled;
                const action = enabled ? 'enabled' : 'disabled';
                if (typeof toast === 'function') {
                    toast('Peek & Symbols ' + action, 'info', 3000);
                }
                // When enabling, dispatch the peek/symbols nodes for immediate recompute
                if (enabled) {
                    apiPost('/mediator/dispatch', { paths: ['index.peek', 'index.symbols'] }).catch(() => {});
                }
                // Re-render all affected views
                if (_mediatorDiagData) {
                    _mediatorRenderSummary(_mediatorDiagData);
                    _mediatorRenderTree(_mediatorDiagData);
                }
                // Re-render config panel if visible
                if (_configVisible) _mediatorShowConfig();
                // Re-render detail if a peek/symbols node is selected
                if (_mediatorSelectedPath === 'index.symbols' || _mediatorSelectedPath === 'index.peek') {
                    _mediatorSelectNode(_mediatorSelectedPath);
                }
            }
        } catch (e) {
            console.error('[Config] toggle peek/symbols failed:', e);
        }
    }

    // Mirrors the backend tier path definitions so we can show
    // node counts even before a dispatch cycle fires SSE events.
    const _cfgTierPathDefs = {
        'T1:visible': new Set([
            'devops.git', 'devops.ci', 'devops.packages',
            'devops.quality', 'devops.docs', 'devops.dns',
        ]),
        'T2:infra': new Set([
            'devops.docker', 'devops.k8s', 'devops.terraform',
            'devops.env', 'devops.github',
        ]),
        'T3:heavy': new Set([
            'devops.security', 'devops.testing',
        ]),
        'T4:index': new Set([
            'index.symbols', 'index.peek', 'index.delta',
            'index.stats', 'index.view', 'index.classify',
        ]),
        'T5:aggregate': new Set([
            'devops.status',
        ]),
        'T6:deep': new Set([
            'audit.system_deep', 'audit.l2_structure',
            'audit.l2_quality', 'audit.l2_repo',
            'audit.l2_risks', 'audit.scores_enriched',
        ]),
    };
    // Dynamic prefix tiers: T1 also gets catalog.*, T2 gets github.*,
    // T5 gets posture.* and audit L0/L1
    const _cfgTierPrefixes = {
        'T1:visible': ['catalog.'],
        'T2:infra': ['github.'],

    function _configSeedTiers() {
        // Only seed if _statusTiers is empty (no SSE cycle has fired yet)
        if (Object.keys(_statusTiers).length > 0) return;
        const diag = _mediatorDiagData;
        if (!diag || !diag.entries) return;
        const allPaths = Object.keys(diag.entries);
        const assigned = new Set();

        for (const [tierKey, pathSet] of Object.entries(_cfgTierPathDefs)) {
            const paths = [];
            for (const p of allPaths) {
                if (pathSet.has(p)) { paths.push(p); assigned.add(p); continue; }
                // Check prefixes
                const prefixes = _cfgTierPrefixes[tierKey] || [];
                for (const pfx of prefixes) {
                    if (p.startsWith(pfx)) { paths.push(p); assigned.add(p); break; }
                }
            }
            if (paths.length > 0 || pathSet.size > 0) {
                _statusTiers[tierKey] = {
                    status: 'idle',
                    paths: paths,
                    count: paths.length,
                    elapsed_ms: null,
                };
            }
        }
    }

        // Table header

                statusBadge = '<span style="color:#22c55e">✓ done' + elapsed + '</span>';
            } else if (tier.status === 'waiting') {
                statusBadge = '<span style="color:var(--text-muted)">○ waiting</span>';
            } else if (tier.status === 'idle') {
                statusBadge = '<span style="color:var(--text-muted)">○ idle</span>';

            // Action button depends on status

    function _configRenderLive(container) {
        const diag = _mediatorDiagData;
        const wq = diag && diag.work_queue;

        // ── 1. Per-worker rows ──────────────────────────────────
        const liveEl = container.querySelector('#config-workers-live');
        if (liveEl && wq) {
            const nw = wq.workers || 4;
            const wa = wq.workers_activity || {};
            let whtml = '';

            // Compute per-worker aggregate stats from log
            const workerStats = {};
            for (const e of (_statusWorkerLog || [])) {
                const wid = e.worker_id != null ? e.worker_id : '?';
                if (!workerStats[wid]) workerStats[wid] = { tasks: 0, totalMs: 0, ok: 0 };
                workerStats[wid].tasks++;
                workerStats[wid].totalMs += (e.elapsed_ms || 0);
                if (e.ok) workerStats[wid].ok++;
            }

            for (let i = 0; i < nw; i++) {
                const wInfo = wa[String(i)];
                const active = wInfo && wInfo.path;
                const dot = active ? '🟢' : '⚪';
                const statusStr = active ? wInfo.path : 'idle';
                const ws = workerStats[i] || { tasks: 0, totalMs: 0, ok: 0 };
                const avgMs = ws.tasks > 0 ? Math.round(ws.totalMs / ws.tasks) : 0;
                const okPct = ws.tasks > 0 ? Math.round((ws.ok / ws.tasks) * 100) : 100;

                whtml += '<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid rgba(148,163,184,0.04);font-size:0.7rem">';
                whtml += '<span style="min-width:28px;font-weight:600">W' + i + '</span>';
                whtml += '<span>' + dot + ' alive</span>';
                whtml += '<span style="flex:1;color:' + (active ? 'var(--text-primary)' : 'var(--text-muted)') + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + (active ? wInfo.path : '') + '">' + statusStr + '</span>';
                whtml += '<span style="' + _cfgMuted + ';min-width:60px">tasks: ' + ws.tasks + '</span>';
                whtml += '<span style="' + _cfgMuted + ';min-width:60px">avg: ' + avgMs + 'ms</span>';
                whtml += '<span style="color:' + (okPct === 100 ? '#22c55e' : '#ef4444') + ';font-weight:600;min-width:50px">ok: ' + okPct + '%</span>';
                whtml += '</div>';
            }

            liveEl.innerHTML = whtml;
        } else if (liveEl) {
            liveEl.innerHTML = '<div style="' + _cfgMuted + '">Waiting for work queue data...</div>';
        }

        // ── 1b. Semaphore + Queue + Web Reqs stats ──────────────
        const statsEl = container.querySelector('#config-workers-stats');
        if (statsEl && wq) {
            const cap = wq.semaphore_capacity || 6;
            const used = wq.semaphore_used || 0;
            const avail = wq.semaphore_available || 0;
            const pending = wq.pending || 0;
            const webActive = wq.web_requests_active || 0;
            const yieldFlag = wq.yield_flag;

            // Track peak
            if (used > _configPeakUsed) _configPeakUsed = used;
            _configUsedSamples.push(used);
            if (_configUsedSamples.length > 100) _configUsedSamples.shift();
            const avgUsed = _configUsedSamples.length > 0
                ? (_configUsedSamples.reduce((a, b) => a + b, 0) / _configUsedSamples.length).toFixed(1)
                : '0';

            let shtml = '';

            // Semaphore bar
            const pct = cap > 0 ? Math.round((used / cap) * 100) : 0;
            const barColor = pct > 80 ? '#ef4444' : pct > 50 ? '#f59e0b' : '#22c55e';
            shtml += '<div style="margin:10px 0 8px">';
            shtml += '<div style="display:flex;justify-content:space-between;margin-bottom:3px">';
            shtml += '<span style="' + _cfgLabel + '">Semaphore</span>';
            shtml += '<span style="' + _cfgMuted + '">' + used + '/' + cap + ' used</span>';
            shtml += '</div>';
            shtml += '<div style="height:8px;background:rgba(148,163,184,0.1);border-radius:4px;overflow:hidden">';
            shtml += '<div style="width:' + pct + '%;height:100%;background:' + barColor + ';border-radius:4px;transition:width 0.3s"></div>';
            shtml += '</div></div>';

            // Queue depth — count by priority if possible
            // We get total pending from wq, breakdown from log of pending items
            shtml += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px">';
            shtml += '<span style="' + _cfgLabel + '">Queue Depth</span>';
            shtml += '<span style="' + _cfgVal + '">' + pending + ' pending</span>';

            // Priority breakdown from worker activity
            const priCounts = { 0: 0, 1: 0, 2: 0, 3: 0 };
            // Can't get exact queue breakdown from diag — show as 0 when idle
            shtml += '<span style="' + _cfgMuted + '">';
            shtml += priCounts[0] + ' CRIT  ' + priCounts[1] + ' HIGH  ' + priCounts[2] + ' NORM  ' + priCounts[3] + ' LOW';
            shtml += '</span>';
            shtml += '</div>';

            // Web reqs + yield
            shtml += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">';
            shtml += '<span style="' + _cfgLabel + '">Web Reqs</span>';
            shtml += '<span style="' + _cfgVal + '">' + webActive + ' active</span>';
            shtml += '<span style="' + _cfgMuted + '">yield flag: ' + (yieldFlag ? 'on' : 'off') + '</span>';
            shtml += '</div>';

            statsEl.innerHTML = shtml;
        }

    }

</script>
