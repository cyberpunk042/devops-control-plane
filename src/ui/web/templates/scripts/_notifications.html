<script>
// ═══════════════════════════════════════════════════════════════════
//  _notifications.html — Notification & Error Log panel
//
//  Panel DOM injection, toggle, rendering, badges,
//  SSE real-time updates, error interception, cross-tab sync.
// ═══════════════════════════════════════════════════════════════════

var _notifPanelOpen = false;
var _notifActiveTab = 'notifications'; // 'notifications' | 'errors'

// ── Panel DOM injection ─────────────────────────────────────────

function _injectNotifPanel() {
    if (document.getElementById('notif-panel')) return;

    var panel = document.createElement('div');
    panel.id = 'notif-panel';
    panel.className = 'notif-panel';
    panel.innerHTML =
        '<div class="notif-panel-header">' +
            '<span class="notif-panel-title">🔔 Notifications</span>' +
            '<button class="notif-panel-close" onclick="_toggleNotifPanel()">✕</button>' +
        '</div>' +
        '<div class="notif-tab-bar">' +
            '<button class="notif-tab active" data-tab="notifications" ' +
                'onclick="_switchNotifTab(\'notifications\')">🔔 Notifications</button>' +
            '<button class="notif-tab" data-tab="errors" ' +
                'onclick="_switchNotifTab(\'errors\')">⚠️ Errors' +
                '<span class="notif-tab-count" id="notif-error-tab-count" style="display:none">0</span>' +
            '</button>' +
        '</div>' +
        '<div class="notif-tab-content active" id="notif-content-notifications">' +
            '<div class="notif-list" id="notif-list"></div>' +
        '</div>' +
        '<div class="notif-tab-content" id="notif-content-errors">' +
            '<div class="notif-list" id="error-list"></div>' +
        '</div>';

    document.body.appendChild(panel);
}

// ── Toggle panel ────────────────────────────────────────────────

function _toggleNotifPanel() {
    _notifPanelOpen = !_notifPanelOpen;

    var panel = document.getElementById('notif-panel');
    if (!panel) {
        _injectNotifPanel();
        panel = document.getElementById('notif-panel');
    }

    if (_notifPanelOpen) {
        panel.classList.add('open');
        _loadNotifPanelData();
    } else {
        panel.classList.remove('open');
    }
}

// ── Tab switching ───────────────────────────────────────────────

function _switchNotifTab(tab) {
    _notifActiveTab = tab;

    // Update tab bar buttons
    var bar = document.querySelector('.notif-tab-bar');
    if (bar) {
        var tabs = bar.querySelectorAll('.notif-tab');
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
        }
    }

    // Update content panes
    var panes = document.querySelectorAll('.notif-tab-content');
    for (var j = 0; j < panes.length; j++) {
        panes[j].classList.toggle('active',
            panes[j].id === 'notif-content-' + tab);
    }

    // If switching to errors tab, acknowledge errors
    if (tab === 'errors') {
        _ackErrors();
    }
}

// ── Data loading ────────────────────────────────────────────────

function _loadNotifPanelData() {
    _loadNotifications();
    _loadErrors();
}

function _loadNotifications() {
    var list = document.getElementById('notif-list');
    if (!list) return;

    api('/notifications')
        .then(function(data) {
            if (!data || !data.notifications) return;
            _renderNotifications(data.notifications);
            _updateNotifBadge(data.unread_count || 0);
        })
        .catch(function() {
            // Silent — badge stays stale
        });
}

function _loadErrors(page) {
    var list = document.getElementById('error-list');
    if (!list) return;

    var p = page || 1;
    api('/errors?page=' + p + '&per_page=20')
        .then(function(data) {
            if (!data) return;
            _renderErrors(data.errors || [], data.total || 0, data.page || 1, data.pages || 1);
            _updateErrorBadge(data.unacked_count || 0);
        })
        .catch(function() {
            // Silent
        });
}

function _ackErrors() {
    api('/errors/ack', { method: 'POST' })
        .then(function() {
            _updateErrorBadge(0);
        })
        .catch(function() {});
}

// ── Rendering ───────────────────────────────────────────────────

function _notifIcon(type) {
    // Handle prefixed types (e.g. missing_dep:pytesseract → missing_dep)
    var baseType = type && type.indexOf(':') > -1 ? type.split(':')[0] : type;
    var icons = {
        'cdp_suggestion': '🔌',
        'session_expiring': '⏰',
        'vault_locked': '🔒',
        'chat_message': '💬',
        'port_fallback': '🔀',
        'config_changed': '⚙️',
        'missing_dep': '📦',
        'wsl_channel_upgrade': '🚀',
        'wsl_channel_setup': '⚡',
        'wsl_hostname_resolution': '🌐',
        'wsl_firewall_rule': '🛡️',
        'wsl_curl_exe_missing': '🔧',
        'wsl_networking_mode': 'ℹ️',
    };
    return icons[baseType] || '📋';
}

function _timeAgo(ts) {
    var diff = (Date.now() / 1000) - ts;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
}

function _renderNotifications(notifications) {
    var list = document.getElementById('notif-list');
    if (!list) return;

    if (!notifications.length) {
        list.innerHTML =
            '<div class="notif-empty">' +
                '<div class="notif-empty-icon">🔔</div>' +
                'No notifications' +
            '</div>';
        return;
    }

    var html = '';
    for (var i = 0; i < notifications.length; i++) {
        var n = notifications[i];

        // Determine if this notification type is actionable (clickable body)
        var actionAttr = '';
        var actionHint = '';
        var cursorStyle = '';
        if (n.type === 'port_fallback' && n.meta && n.meta.config_path) {
            actionAttr = ' data-action-type="open-config" data-config-path="' + _esc(n.meta.config_path) + '"';
            actionHint = '<div class="notif-item-action-hint">Click to configure →</div>';
            cursorStyle = ' style="cursor:pointer"';
        } else if (n.meta && n.meta.action === 'install_dependency' && n.meta.recipe_id) {
            actionAttr = ' data-action-type="install-dependency"'
                + ' data-recipe-id="' + _esc(n.meta.recipe_id) + '"'
                + ' data-recipe-label="' + _esc(n.meta.recipe_label || n.meta.recipe_id) + '"';
            actionHint = '<div class="notif-item-action-hint">Click to install →</div>';
            cursorStyle = ' style="cursor:pointer"';
        } else if (n.type && n.type.indexOf('wsl_') === 0 && n.meta && n.meta.action_tab) {
            actionAttr = ' data-action-type="navigate-tab"'
                + ' data-action-tab="' + _esc(n.meta.action_tab) + '"'
                + ' data-action-hash="' + _esc(n.meta.action_hash || '') + '"';
            actionHint = '<div class="notif-item-action-hint">Click to open setup →</div>';
            cursorStyle = ' style="cursor:pointer"';
        }

        html +=
            '<div class="notif-item" data-id="' + n.id + '" data-type="' + _esc(n.type) + '"' + actionAttr + '>' +
                '<div class="notif-item-icon">' + _notifIcon(n.type) + '</div>' +
                '<div class="notif-item-body"' + cursorStyle +
                    ' onclick="_notifItemAction(this.parentElement)">' +
                    '<div class="notif-item-title">' + _esc(n.title) + '</div>' +
                    '<div class="notif-item-message">' + _esc(n.message) + '</div>' +
                    actionHint +
                    '<div class="notif-item-time">' + _timeAgo(n.created_at) + '</div>' +
                '</div>' +
                '<div class="notif-item-actions">' +
                    '<button class="notif-item-btn" onclick="_dismissNotif(\'' + n.id + '\')">✓</button>' +
                    '<button class="notif-item-btn danger" onclick="_deleteNotif(\'' + n.id + '\')">✕</button>' +
                '</div>' +
            '</div>';
    }

    list.innerHTML = html;
}

function _renderErrors(errors, total, page, pages) {
    var list = document.getElementById('error-list');
    if (!list) return;

    if (!errors.length) {
        list.innerHTML =
            '<div class="notif-empty">' +
                '<div class="notif-empty-icon">✅</div>' +
                'No errors logged' +
            '</div>';
        return;
    }

    var html = '';
    for (var i = 0; i < errors.length; i++) {
        var e = errors[i];
        var levelIcon = e.level === 'warning' ? '⚠️' : '🔴';
        html +=
            '<div class="error-item" onclick="_toggleErrorDetail(this)">' +
                '<div class="error-item-header">' +
                    '<span class="error-item-level">' + levelIcon + '</span>' +
                    '<span class="error-item-message">' + _esc(e.message) + '</span>' +
                '</div>' +
                '<div class="error-item-meta">' +
                    '<span>' + e.source + '</span>' +
                    (e.endpoint ? '<span>' + _esc(e.endpoint) + '</span>' : '') +
                    '<span>' + _timeAgo(e.ts) + '</span>' +
                '</div>' +
                (e.detail ?
                    '<div class="error-item-expand">▸ details</div>' +
                    '<div class="error-item-detail">' + _esc(e.detail) + '</div>'
                    : '') +
            '</div>';
    }

    // Load more button
    if (page < pages) {
        html +=
            '<button class="notif-load-more" onclick="_loadErrors(' + (page + 1) + ')">' +
                'Load more (' + (total - page * 20) + ' remaining)' +
            '</button>';
    }

    // If appending (page > 1), append; otherwise replace
    if (page > 1) {
        // Remove old load-more button first
        var oldBtn = list.querySelector('.notif-load-more');
        if (oldBtn) oldBtn.remove();
        list.insertAdjacentHTML('beforeend', html);
    } else {
        list.innerHTML = html;
    }
}

function _toggleErrorDetail(el) {
    el.classList.toggle('expanded');
    var expand = el.querySelector('.error-item-expand');
    if (expand) {
        expand.textContent = el.classList.contains('expanded') ? '▾ details' : '▸ details';
    }
}

// ── Badge updates ───────────────────────────────────────────────

function _updateNotifBadge(count) {
    var badge = document.getElementById('notif-count-badge');
    if (!badge) return;
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = '';
    } else {
        badge.style.display = 'none';
    }
}

function _updateErrorBadge(count) {
    var dot = document.getElementById('notif-error-dot');
    if (dot) {
        dot.style.display = count > 0 ? '' : 'none';
    }

    var tabCount = document.getElementById('notif-error-tab-count');
    if (tabCount) {
        if (count > 0) {
            tabCount.textContent = count;
            tabCount.style.display = '';
        } else {
            tabCount.style.display = 'none';
        }
    }
}

// ── Notification actions ────────────────────────────────────────

function _dismissNotif(id) {
    api('/notifications/dismiss', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id }),
    }).then(function() {
        var el = document.querySelector('.notif-item[data-id="' + id + '"]');
        if (el) el.remove();
        _loadNotifications();
    }).catch(function() {});
}

function _deleteNotif(id) {
    api('/notifications/' + id, { method: 'DELETE' })
        .then(function() {
            var el = document.querySelector('.notif-item[data-id="' + id + '"]');
            if (el) el.remove();
            _loadNotifications();
        }).catch(function() {});
}

// ── Notification click actions (actionable types) ───────────────

function _notifItemAction(itemEl) {
    if (!itemEl) return;
    var actionType = itemEl.getAttribute('data-action-type');
    if (!actionType) return; // not actionable

    var notifId = itemEl.getAttribute('data-id');

    switch (actionType) {
        case 'open-config':
            var configPath = itemEl.getAttribute('data-config-path') || 'project.yml';
            if (typeof openFileInModal === 'function') {
                openFileInModal(configPath);
            }
            if (_notifPanelOpen) _toggleNotifPanel();
            if (notifId) _dismissNotif(notifId);
            break;

        case 'install-dependency':
            var recipeId = itemEl.getAttribute('data-recipe-id');
            var recipeLabel = itemEl.getAttribute('data-recipe-label') || recipeId;
            if (recipeId && typeof installWithPlan === 'function') {
                if (_notifPanelOpen) _toggleNotifPanel();
                installWithPlan(recipeId, recipeLabel, {
                    onComplete: function() {
                        toast('✅ Dependency installed! Re-record the assertion to see OCR results.', 'success');
                        if (notifId) _dismissNotif(notifId);
                    },
                });
            }
            break;

        case 'navigate-tab':
            var actionTab = itemEl.getAttribute('data-action-tab');
            var actionHash = itemEl.getAttribute('data-action-hash') || '';
            if (_notifPanelOpen) _toggleNotifPanel();

            // WSL Channel: open a functional modal with WSL Channel setup
            if (actionTab === 'wsl-channel') {
                if (typeof modalOpen === 'function') {
                    modalOpen({
                        title: '🔌 WSL Channel Setup',
                        body: '<div id="wsl-channel-modal-body" style="min-height:200px">' +
                            '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:0.76rem">' +
                                '<div style="font-size:1.5rem;margin-bottom:8px">🔍</div>' +
                                'Scanning WSL channel…' +
                            '</div>' +
                        '</div>',
                        size: 'wide',
                        footerButtons: [
                            { label: 'Close', cls: 'btn-secondary', onclick: 'modalClose()' },
                        ],
                    });
                    // Render WSL channel into the modal body
                    if (typeof _meshShowWslChannel === 'function') {
                        _meshShowWslChannel('wsl-channel-modal-body');
                    }
                }
                break;
            }

            // Generic: navigate to hash / activate tab
            if (actionHash) {
                window.location.hash = actionHash;
            }
            // If there's a specific tab activator, try it
            if (actionTab && typeof _activateTab === 'function') {
                _activateTab(actionTab);
            }
            break;
    }
}

// ── HTML escaping ───────────────────────────────────────────────

function _esc(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════════════
//  Phase 5: SSE listeners, error interception, cross-tab sync
// ═══════════════════════════════════════════════════════════════════

// ── SSE event listeners ─────────────────────────────────────────
//
// The SSE dispatch in _event_stream.html emits DOM CustomEvents
// for notification/error events.  We listen here — fully decoupled
// from the SSE connection logic.

var _seenNotifIds = {};  // dedup: prevent double-counting from SSE replays

document.addEventListener('sse:notification:new', function(e) {
    var notif = e.detail && e.detail.data;
    if (!notif) return;

    // Deduplicate: multiple SSE connections can deliver the same event
    var nid = notif.id || '';
    if (nid && _seenNotifIds[nid]) return;
    if (nid) _seenNotifIds[nid] = true;

    // Update badge: increment count
    var badge = document.getElementById('notif-count-badge');
    var current = badge ? parseInt(badge.textContent, 10) || 0 : 0;
    _updateNotifBadge(current + 1);

    // If panel is open on notifications tab, prepend the new item
    if (_notifPanelOpen && _notifActiveTab === 'notifications') {
        _loadNotifications();
    }

    // ── Imminent notification types: auto-display ──
    if (notif.type === 'port_fallback' && notif.meta) {
        _showPortFallbackBanner(notif.meta, notif.id);
    }
    if (notif.type === 'config_changed') {
        _showConfigChangedBanner(notif);
    }
    // Missing dependency — auto-trigger install modal
    if (notif.meta && notif.meta.action === 'install_dependency' && notif.meta.recipe_id) {
        setTimeout(function() {
            if (typeof installWithPlan === 'function') {
                installWithPlan(notif.meta.recipe_id, notif.meta.recipe_label || notif.meta.recipe_id, {
                    onComplete: function() {
                        toast('✅ Dependency installed! Re-record the assertion to see OCR results.', 'success');
                        if (notif.id) _dismissNotif(notif.id);
                    },
                });
            }
        }, 400);
    }

    // WSL channel setup — auto-open a consent modal on reception
    if (notif.type === 'wsl_channel_setup') {
        setTimeout(function() {
            if (typeof modalOpen !== 'function') return;
            modalOpen({
                title: '⚡ CDP Channel Setup',
                replace: false,  // Stack on top — don't destroy user's modal
                body:
                    '<div style="padding:0.5rem 0;font-size:0.85rem;line-height:1.6;color:var(--text,#e0e0e0)">' +
                        '<p style="margin:0 0 1rem">' +
                            'No fast channel to Chrome detected. The system is using ' +
                            'the <strong>curl.exe fallback</strong> (~260ms/call).' +
                        '</p>' +
                        '<p style="margin:0 0 1rem">' +
                            'Port forwarding is the recommended setup for WSL2. ' +
                            'It creates persistent rules so Chrome is reachable ' +
                            'at ~5ms — <strong>50× faster</strong>.' +
                        '</p>' +
                        '<p style="margin:0;color:var(--text-muted,#999);font-size:0.78rem">' +
                            'This requires a one-time admin prompt (UAC) to create ' +
                            'netsh portproxy rules. The rules persist across reboots.' +
                        '</p>' +
                    '</div>',
                size: 'normal',
                footerButtons: [
                    { label: 'Later', cls: 'btn-secondary', onclick: 'modalClose()' },
                    { label: 'More Options', cls: 'btn-secondary', onclick: '_wslChannelSetupMore()' },
                    { label: 'Set Up Port Forwarding', cls: 'btn-primary', onclick: '_wslChannelSetupAccept()' },
                ],
            });
        }, 600);
    }

    // WSL interop — only toast for success confirmations, NOT discovery alerts.
    // Discovery alerts (firewall_rule, channel_upgrade, etc.) stay in the
    // notification panel badge. The consent modal is the entry point, not toasts.
    if (notif.type === 'wsl_channel_active') {
        toast(notif.title + ' — ' + (notif.message || '').substring(0, 120), 'success', 6000);
    }

    // Cross-tab sync: broadcast to other tabs
    _notifBroadcast({ type: 'notif:new', notif: notif });
});

document.addEventListener('sse:notification:dismissed', function(e) {
    var key = e.detail && e.detail.key;
    if (!key) return;

    // Remove from DOM if present
    var el = document.querySelector('.notif-item[data-id="' + key + '"]');
    if (el) el.remove();

    // Decrement badge
    var badge = document.getElementById('notif-count-badge');
    var current = badge ? parseInt(badge.textContent, 10) || 0 : 0;
    _updateNotifBadge(Math.max(0, current - 1));

    _notifBroadcast({ type: 'notif:dismissed', id: key });
});

document.addEventListener('sse:notification:deleted', function(e) {
    var key = e.detail && e.detail.key;
    if (!key) return;

    var el = document.querySelector('.notif-item[data-id="' + key + '"]');
    if (el) el.remove();

    var badge = document.getElementById('notif-count-badge');
    var current = badge ? parseInt(badge.textContent, 10) || 0 : 0;
    _updateNotifBadge(Math.max(0, current - 1));

    _notifBroadcast({ type: 'notif:deleted', id: key });
});

document.addEventListener('sse:error:new', function(e) {
    var errData = e.detail && e.detail.data;
    if (!errData) return;

    // Pulse the error dot
    _updateErrorBadge(1); // show dot — exact count isn't critical

    // If panel is open on errors tab, reload + auto-ack
    if (_notifPanelOpen && _notifActiveTab === 'errors') {
        _loadErrors();
        _ackErrors();
    }

    _notifBroadcast({ type: 'notif:error', error: errData });
});

// ── Frontend error interception ─────────────────────────────────
//
// Capture unhandled JS errors and promise rejections.
// Report them to the server for centralized logging.
// Uses a simple dedup to avoid flooding: same message within 5s
// is suppressed.

var _lastReportedError = '';
var _lastReportedErrorTs = 0;

function _reportFrontendError(message, detail, endpoint) {
    // Dedup: skip if same message within 5 seconds
    var now = Date.now();
    if (message === _lastReportedError && now - _lastReportedErrorTs < 5000) {
        return;
    }
    _lastReportedError = message;
    _lastReportedErrorTs = now;

    // Don't use api() here — it could trigger its own error interception.
    // Use raw fetch to avoid recursion.
    try {
        fetch('/api/errors', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: message,
                detail: detail || '',
                endpoint: endpoint || location.hash || location.pathname,
            }),
        }).catch(function() {
            // Can't report error about error reporting. Just swallow.
        });
    } catch (_) {
        // Truly last resort — swallow completely
    }
}

// Global error handler
window.addEventListener('error', function(event) {
    var msg = event.message || 'Unknown error';
    var detail = '';
    if (event.filename) {
        detail = event.filename + ':' + event.lineno + ':' + event.colno;
    }
    _reportFrontendError(msg, detail);
});

// Unhandled promise rejection handler
window.addEventListener('unhandledrejection', function(event) {
    var msg = 'Unhandled rejection';
    var detail = '';
    if (event.reason) {
        msg = event.reason.message || String(event.reason);
        detail = event.reason.stack || '';
    }
    _reportFrontendError(msg, detail);
});


// ── Cross-tab sync via BroadcastChannel ─────────────────────────
//
// Reuses the existing 'devops-tab-mesh' channel.
// Messages are prefixed with 'notif:' to avoid collision with
// tab mesh messages (join, roster, ping, state, navigate, etc.).
//
// We don't create a new BroadcastChannel — we hook into the
// existing _meshBC from _tab_mesh.html.  If it's not available
// (e.g. Pages site), we fall back to a dedicated channel.

var _notifBC = null;

function _notifInitBC() {
    if (_notifBC) return;
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            _notifBC = new BroadcastChannel('devops-notif-sync');
            _notifBC.onmessage = _notifHandleBCMessage;
        }
    } catch (_) {
        // BroadcastChannel not available — no cross-tab sync
    }
}

function _notifBroadcast(msg) {
    if (!_notifBC) return;
    try {
        _notifBC.postMessage(msg);
    } catch (_) {
        // Channel might be closed
    }
}

function _notifHandleBCMessage(e) {
    var msg = e.data;
    if (!msg || !msg.type) return;

    switch (msg.type) {
        case 'notif:new':
            // Another tab received a new notification via SSE
            var bcNotif = msg.notif || {};
            var bcNid = bcNotif.id || '';
            if (bcNid && _seenNotifIds[bcNid]) break;  // already counted via SSE
            if (bcNid) _seenNotifIds[bcNid] = true;

            var badge = document.getElementById('notif-count-badge');
            var current = badge ? parseInt(badge.textContent, 10) || 0 : 0;
            _updateNotifBadge(current + 1);
            if (_notifPanelOpen && _notifActiveTab === 'notifications') {
                _loadNotifications();
            }
            break;

        case 'notif:dismissed':
        case 'notif:deleted':
            var el = document.querySelector('.notif-item[data-id="' + msg.id + '"]');
            if (el) el.remove();
            var badge2 = document.getElementById('notif-count-badge');
            var curr2 = badge2 ? parseInt(badge2.textContent, 10) || 0 : 0;
            _updateNotifBadge(Math.max(0, curr2 - 1));
            break;

        case 'notif:error':
            _updateErrorBadge(1);
            if (_notifPanelOpen && _notifActiveTab === 'errors') {
                _loadErrors();
            }
            break;

        case 'notif:acked':
            _updateErrorBadge(0);
            break;
    }
}

// ═══════════════════════════════════════════════════════════════════
//  WSL Channel Setup — consent modal handlers
// ═══════════════════════════════════════════════════════════════════

/**
 * User accepted port forwarding setup from the consent modal.
 * Calls the existing /tab-mesh/wsl-start-tunnel endpoint.
 */
function _wslChannelSetupAccept() {
    // Update modal to show progress
    if (typeof modalOpen === 'function') {
        modalOpen({
            title: '⚡ CDP Channel Setup',
            body:
                '<div style="text-align:center;padding:2rem;color:var(--text-muted,#999);font-size:0.85rem">' +
                    '<div style="font-size:1.5rem;margin-bottom:8px">⏳</div>' +
                    'Setting up port forwarding…<br>' +
                    '<span style="font-size:0.78rem">An admin prompt (UAC) may appear on Windows.</span>' +
                '</div>',
            size: 'normal',
            footerButtons: [],
        });
    }

    api('/tab-mesh/wsl-start-tunnel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port: 9222 }),
    }).then(function(result) {
        if (result && result.ok) {
            // Invalidate CDP warm cache and re-warm so any open modal updates
            if (typeof _cdpWarmResult !== 'undefined') { _cdpWarmResult = null; }
            if (typeof _plansWarmCdp === 'function') { setTimeout(_plansWarmCdp, 500); }
            // Dismiss the notification
            api('/notifications').then(function(data) {
                if (data && data.notifications) {
                    for (var i = 0; i < data.notifications.length; i++) {
                        if (data.notifications[i].type === 'wsl_channel_setup') {
                            _dismissNotif(data.notifications[i].id);
                            break;
                        }
                    }
                }
            }).catch(function() {});

            modalOpen({
                title: '⚡ CDP Channel Setup',
                body:
                    '<div style="text-align:center;padding:2rem;font-size:0.85rem">' +
                        '<div style="font-size:1.5rem;margin-bottom:8px">✅</div>' +
                        '<strong style="color:var(--clr-success,#22c55e)">Port forwarding is active!</strong><br>' +
                        '<span style="color:var(--text-muted,#999);font-size:0.78rem">' +
                            'Chrome is now reachable at ~5ms (was ~260ms).' +
                        '</span>' +
                    '</div>',
                size: 'normal',
                footerButtons: [
                    { label: 'Done', cls: 'btn-primary', onclick: 'modalClose()' },
                ],
            });
        } else {
            var errMsg = (result && result.error) || 'Unknown error';
            modalOpen({
                title: '⚡ CDP Channel Setup',
                body:
                    '<div style="padding:0.5rem 0;font-size:0.85rem;color:var(--text,#e0e0e0)">' +
                        '<p style="margin:0 0 1rem;color:var(--clr-danger,#ef4444)">' +
                            'Setup failed: ' + _esc(errMsg) +
                        '</p>' +
                        '<p style="margin:0;color:var(--text-muted,#999);font-size:0.78rem">' +
                            'You can try again from Tab Mesh → WSL Channel Setup, ' +
                            'or set up portproxy rules manually.' +
                        '</p>' +
                    '</div>',
                size: 'normal',
                footerButtons: [
                    { label: 'Close', cls: 'btn-secondary', onclick: 'modalClose()' },
                ],
            });
        }
    }).catch(function(err) {
        modalOpen({
            title: '⚡ CDP Channel Setup',
            body:
                '<div style="padding:0.5rem 0;font-size:0.85rem;color:var(--clr-danger,#ef4444)">' +
                    'Request failed. The server may be restarting.' +
                '</div>',
            size: 'normal',
            footerButtons: [
                { label: 'Close', cls: 'btn-secondary', onclick: 'modalClose()' },
            ],
        });
    });
}

/**
 * User wants more options — open the full WSL Channel Setup panel.
 */
function _wslChannelSetupMore() {
    if (typeof modalOpen === 'function') {
        modalOpen({
            title: '🔌 WSL Channel Setup',
            body: '<div id="wsl-channel-modal-body" style="min-height:200px">' +
                '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:0.76rem">' +
                    '<div style="font-size:1.5rem;margin-bottom:8px">🔍</div>' +
                    'Scanning WSL channel…' +
                '</div>' +
            '</div>',
            size: 'wide',
            footerButtons: [
                { label: 'Close', cls: 'btn-secondary', onclick: 'modalClose()' },
            ],
        });
        if (typeof _meshShowWslChannel === 'function') {
            _meshShowWslChannel('wsl-channel-modal-body');
        }
    }
}

// ═══════════════════════════════════════════════════════════════════
//  Imminent Notifications — auto-display for critical notification types
// ═══════════════════════════════════════════════════════════════════

/**
 * Show the port fallback banner — imminent, non-intrusive, actionable.
 *
 * @param {object} meta  - { preferred_port, actual_port, host, config_path }
 * @param {string} notifId - notification ID for server-side dismiss
 */
function _showPortFallbackBanner(meta, notifId) {
    // Already showing? Don't double-render.
    if (document.getElementById('port-fallback-banner')) return;

    // Check dismissal tracking
    var dismissKey = 'dcp_fallback_dismissed:' + meta.preferred_port + '→' + meta.actual_port;
    if (localStorage.getItem(dismissKey)) return;

    var banner = document.createElement('div');
    banner.id = 'port-fallback-banner';
    banner.style.cssText = [
        'position:fixed',
        'bottom:1.5rem',
        'right:1.5rem',
        'z-index:9998',
        'max-width:420px',
        'width:calc(100% - 3rem)',
        'background:var(--surface-elevated, #1e1e2e)',
        'border:1px solid var(--clr-warning, #f59e0b)',
        'border-radius:12px',
        'padding:1.25rem 1.5rem',
        'box-shadow:0 12px 40px rgba(0,0,0,0.5)',
        'font-family:var(--font-sans, system-ui, sans-serif)',
        'color:var(--text, #e0e0e0)',
        'animation:slideIn 0.35s ease-out',
    ].join(';');

    var panelUrl = 'http://' + (meta.host || '127.0.0.1') + ':' + meta.actual_port;

    banner.innerHTML =
        '<div style="display:flex;align-items:flex-start;gap:0.75rem">' +
            '<div style="font-size:1.6rem;line-height:1;flex-shrink:0">🔀</div>' +
            '<div style="flex:1;min-width:0">' +
                '<div style="font-weight:600;font-size:0.9rem;margin-bottom:0.35rem;color:var(--clr-warning,#f59e0b)">' +
                    'Admin Panel on Fallback Port' +
                '</div>' +
                '<div style="font-size:0.82rem;line-height:1.5;color:var(--text-muted,#aaa);margin-bottom:0.85rem">' +
                    'Port ' + meta.preferred_port +
                    (meta.occupant_name
                        ? ' held by <strong style="color:var(--text,#e0e0e0)">' + meta.occupant_name + '</strong>' +
                          (meta.occupant_pid ? ' (PID ' + meta.occupant_pid + ')' : '')
                        : ' was occupied') +
                    ' — DCP running on ' +
                    '<strong style="color:var(--text,#e0e0e0)">' + meta.actual_port + '</strong>. ' +
                    'Update <code style="font-size:0.78rem;background:rgba(255,255,255,0.08);padding:0.1em 0.35em;border-radius:3px">' +
                    meta.config_path + '</code> or free port ' + meta.preferred_port + '.' +
                '</div>' +
                '<div style="display:flex;gap:0.5rem;flex-wrap:wrap">' +
                    '<button id="fallback-accept-btn" style="' +
                        'background:var(--clr-success,#22c55e);color:#fff;border:none;border-radius:6px;' +
                        'padding:0.4rem 0.85rem;font-size:0.78rem;font-weight:500;cursor:pointer;' +
                        'transition:opacity 0.2s' +
                    '" onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">' +
                        '✅ Accept :' + meta.actual_port +
                    '</button>' +
                    '<button id="fallback-configure-btn" style="' +
                        'background:var(--accent,#6366f1);color:#fff;border:none;border-radius:6px;' +
                        'padding:0.4rem 0.85rem;font-size:0.78rem;font-weight:500;cursor:pointer;' +
                        'transition:opacity 0.2s' +
                    '" onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">' +
                        '� Configure Port' +
                    '</button>' +
                    '<button id="fallback-dismiss-btn" style="' +
                        'background:transparent;color:var(--text-muted,#888);border:1px solid var(--border-subtle,#333);border-radius:6px;' +
                        'padding:0.4rem 0.85rem;font-size:0.78rem;font-weight:500;cursor:pointer;' +
                        'transition:opacity 0.2s' +
                    '" onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">' +
                        '✕ Dismiss' +
                    '</button>' +
                '</div>' +
            '</div>' +
        '</div>';

    document.body.appendChild(banner);

    // ── Button handlers ──
    var acceptBtn = document.getElementById('fallback-accept-btn');
    if (acceptBtn) {
        acceptBtn.addEventListener('click', async function() {
            acceptBtn.textContent = '⏳ Saving…';
            acceptBtn.disabled = true;
            try {
                var resp = await fetch('/api/server/accept-port', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port: meta.actual_port }),
                });
                if (resp.ok) {
                    _dismissPortFallbackBanner(dismissKey, notifId);
                    // Offer restart so the new port config takes effect
                    if (typeof _showRestartConfirmModal === 'function') {
                        _showRestartConfirmModal();
                    }
                } else {
                    acceptBtn.textContent = '❌ Failed';
                }
            } catch (_) {
                acceptBtn.textContent = '❌ Error';
            }
        });
    }

    var configBtn = document.getElementById('fallback-configure-btn');
    if (configBtn) {
         configBtn.addEventListener('click', function() {
            // Open project.yml in modal preview (root-level file)
            if (typeof openFileInModal === 'function') {
                openFileInModal(meta.config_path || 'project.yml');
            }
            _dismissPortFallbackBanner(dismissKey, notifId);
        });
    }

    var dismissBtn = document.getElementById('fallback-dismiss-btn');
    if (dismissBtn) {
        dismissBtn.addEventListener('click', function() {
            _dismissPortFallbackBanner(dismissKey, notifId);
        });
    }
}

/** Remove the banner + track dismissal. */
function _dismissPortFallbackBanner(dismissKey, notifId) {
    // Track in localStorage so it doesn't come back for this port combo
    localStorage.setItem(dismissKey, Date.now().toString());

    // Dismiss the server-side notification too
    if (notifId) {
        _dismissNotif(notifId);
    }

    // Animate out
    var banner = document.getElementById('port-fallback-banner');
    if (banner) {
        banner.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        banner.style.opacity = '0';
        banner.style.transform = 'translateX(20px)';
        setTimeout(function() { banner.remove(); }, 300);
    }
}

/** Boot-time check: if the server is in fallback mode, show the banner. */
function _checkPortFallbackOnBoot() {
    var _promise = storeGet('server-status')
        ? Promise.resolve(storeGet('server-status'))
        : api('/server/status');
    _promise
        .then(function(data) {
            if (!data || !data.fallback_mode) return;

            var meta = {
                preferred_port: data.preferred_port,
                actual_port: data.actual_port,
                host: data.host || '127.0.0.1',
                config_path: data.config_path || 'project.yml',
            };

            // Find the notification ID from active notifications
            api('/notifications')
                .then(function(ndata) {
                    var notifId = '';
                    if (ndata && ndata.notifications) {
                        for (var i = 0; i < ndata.notifications.length; i++) {
                            if (ndata.notifications[i].type === 'port_fallback') {
                                notifId = ndata.notifications[i].id;
                                break;
                            }
                        }
                    }
                    _showPortFallbackBanner(meta, notifId);
                })
                .catch(function() {
                    _showPortFallbackBanner(meta, '');
                });
        })
        .catch(function() {});
}

/**
 * Show a config-changed banner — imminent, prominent restart offer.
 * No confirmation modal — user just saved project.yml, they're "at the gate".
 *
 * @param {object} notif - the notification object
 */
function _showConfigChangedBanner(notif) {
    // Already showing?
    if (document.getElementById('config-changed-banner')) return;

    // Check session-level dismissal (reset on page reload)
    if (sessionStorage.getItem('dcp_config_changed_dismissed')) return;

    var fileName = (notif.meta && notif.meta.file) || 'project.yml';

    var banner = document.createElement('div');
    banner.id = 'config-changed-banner';
    banner.style.cssText = [
        'position:fixed',
        'bottom:1.5rem',
        'right:1.5rem',
        'z-index:9998',
        'max-width:420px',
        'width:calc(100% - 3rem)',
        'background:var(--surface-elevated, #1e1e2e)',
        'border:1px solid var(--accent, #6366f1)',
        'border-radius:12px',
        'padding:1.25rem 1.5rem',
        'box-shadow:0 12px 40px rgba(0,0,0,0.5)',
        'font-family:var(--font-sans, system-ui, sans-serif)',
        'color:var(--text, #e0e0e0)',
        'animation:slideIn 0.35s ease-out',
    ].join(';');

    banner.innerHTML =
        '<div style="display:flex;align-items:flex-start;gap:0.75rem">' +
            '<div style="font-size:1.6rem;line-height:1;flex-shrink:0">\u2699\ufe0f</div>' +
            '<div style="flex:1;min-width:0">' +
                '<div style="font-weight:600;font-size:0.9rem;margin-bottom:0.35rem;color:var(--accent,#6366f1)">' +
                    'Configuration Updated' +
                '</div>' +
                '<div style="font-size:0.82rem;line-height:1.5;color:var(--text-muted,#aaa);margin-bottom:0.85rem">' +
                    '<code style="font-size:0.78rem;background:rgba(255,255,255,0.08);padding:0.1em 0.35em;border-radius:3px">' +
                    fileName + '</code> was saved. ' +
                    'Restart now to apply your changes.' +
                '</div>' +
                '<div style="display:flex;gap:0.5rem;flex-wrap:wrap">' +
                    '<button id="config-restart-btn" style="' +
                        'background:var(--clr-warning,#f59e0b);color:#000;border:none;border-radius:6px;' +
                        'padding:0.45rem 1rem;font-size:0.82rem;font-weight:600;cursor:pointer;' +
                        'transition:opacity 0.2s;font-family:inherit' +
                    '" onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">' +
                        '\u26a1 Restart Now' +
                    '</button>' +
                    '<button id="config-dismiss-btn" style="' +
                        'background:transparent;color:var(--text-muted,#888);border:1px solid var(--border-subtle,#333);border-radius:6px;' +
                        'padding:0.45rem 1rem;font-size:0.82rem;font-weight:500;cursor:pointer;' +
                        'transition:opacity 0.2s;font-family:inherit' +
                    '" onmouseover="this.style.opacity=\'0.85\'" onmouseout="this.style.opacity=\'1\'">' +
                        '\u2715 Dismiss' +
                    '</button>' +
                '</div>' +
            '</div>' +
        '</div>';

    document.body.appendChild(banner);

    // ── Button handlers ──
    document.getElementById('config-restart-btn').addEventListener('click', function() {
        _removeConfigChangedBanner(notif.id);
        // Direct restart — no confirmation modal, user is "at the gate"
        if (window._doServerRestart) {
            window._doServerRestart();
        }
    });

    document.getElementById('config-dismiss-btn').addEventListener('click', function() {
        _removeConfigChangedBanner(notif.id);
    });
}

/** Remove config-changed banner + track dismissal. */
function _removeConfigChangedBanner(notifId) {
    sessionStorage.setItem('dcp_config_changed_dismissed', '1');

    // Dismiss server-side notification
    if (notifId) _dismissNotif(notifId);

    var banner = document.getElementById('config-changed-banner');
    if (banner) {
        banner.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        banner.style.opacity = '0';
        banner.style.transform = 'translateX(20px)';
        setTimeout(function() { banner.remove(); }, 300);
    }
}

// ── Boot ────────────────────────────────────────────────────────

(async function _notifBoot() {
    // Wait for batch prefetch so storeGet() has data
    try { await window.__batchReady; } catch (_) {}

    // Fetch initial badge counts (or use batch-prefetched data)
    var _batchBadge = storeGet('notifications-badge');
    if (_batchBadge) {
        _updateNotifBadge(_batchBadge.notification_count || 0);
        _updateErrorBadge(_batchBadge.error_count || 0);
    } else {
        api('/notifications/badge')
            .then(function(data) {
                if (!data) return;
                _updateNotifBadge(data.notification_count || 0);
                _updateErrorBadge(data.error_count || 0);
            })
            .catch(function() {});
    }

    // Initialize cross-tab sync
    _notifInitBC();

    // Check for port fallback on page load (catch-up)
    _checkPortFallbackOnBoot();
})();
</script>
