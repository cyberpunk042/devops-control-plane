<script>
/* Dependencies — Graph view (E10) + Impact dialog (C6).
   Public: _depRenderGraphView(), _depShowImpact(eco, pkg, ver)
*/

// ═══════════════════════════════════════════════════════════════
//  C7: Graph view
// ═══════════════════════════════════════════════════════════════

let _depGraphData = null;
let _depFullGraphData = null;
let _depGraphMode = 'svg';  // 'svg' or 'table'

async function _depRenderGraphView() {
    const tree = document.getElementById('dep-tree-panel');
    const right = document.getElementById('dep-right-panel');
    if (!right) return;

    if (tree) tree.style.display = 'none';
    right.innerHTML = '<div class="dep-loading">◌ Building dependency graph...</div>';

    try {
        // Fetch full dep graph (with sub-deps) + shared deps in parallel
        const venv = _depActiveTarget || '';
        const venvParam = venv ? '?venv=' + encodeURIComponent(venv) : '';

        const [fullGraph, sharedGraph] = await Promise.all([
            api('/dependencies/dep-graph' + venvParam),
            api('/dependencies/graph'),
        ]);
        _depFullGraphData = fullGraph;
        _depGraphData = sharedGraph;

        _depDrawGraphContainer(right);
    } catch (e) {
        right.innerHTML = `<div class="dep-empty"><div class="dep-empty-title" style="color:var(--error)">Failed to load graph</div><div class="dep-empty-hint">${esc(e.message)}</div></div>`;
    }
}

function _depDrawGraphContainer(container) {
    const fg = _depFullGraphData || {};
    let h = `<div style="padding:var(--space-sm) var(--space-lg)">`;

    // Summary + view toggle
    h += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-md)">`;
    h += `<div style="font-size:0.75rem;color:var(--text-secondary)">`;
    h += `<strong>${fg.declared_count || 0}</strong> declared · `;
    h += `<strong>${fg.total_count || 0}</strong> total · `;
    h += `<strong style="color:var(--text-muted)">${fg.transitive_count || 0}</strong> transitive`;
    h += `</div>`;
    h += `<div style="display:flex;gap:2px;background:var(--bg-inset);border-radius:6px;padding:2px">`;
    h += `<button class="dep-tab${_depGraphMode === 'svg' ? ' active' : ''}" onclick="_depGraphMode='svg';_depDrawGraphContainer(document.getElementById('dep-right-panel'))" style="font-size:0.64rem;padding:0.15rem 0.5rem">Visual</button>`;
    h += `<button class="dep-tab${_depGraphMode === 'table' ? ' active' : ''}" onclick="_depGraphMode='table';_depDrawGraphContainer(document.getElementById('dep-right-panel'))" style="font-size:0.64rem;padding:0.15rem 0.5rem">Table</button>`;
    h += `</div>`;
    h += `</div>`;

    // View content
    h += `<div id="dep-graph-content">`;
    h += `</div>`;

    h += `</div>`;
    container.innerHTML = h;

    // Render the selected view
    const content = document.getElementById('dep-graph-content');
    if (_depGraphMode === 'svg') {
        _depDrawSvgGraph(content, fg);
    } else {
        _depDrawTableGraph(content, fg, _depGraphData);
    }
}

function _depDrawSvgGraph(container, data) {
    const nodes = data.nodes || [];
    const edges = data.edges || [];

    if (!nodes.length) {
        container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:var(--space-lg)">No packages to visualize</div>';
        return;
    }

    // Layout: declared packages on top row, transitive below
    // Force-directed is overkill — use a layered approach
    const declared = nodes.filter(n => n.declared);
    const transitive = nodes.filter(n => !n.declared);

    const nodeW = 120, nodeH = 28, padX = 15, padY = 15;
    const gapX = 10, gapY = 50;

    // Top row: declared packages
    const topCols = Math.min(declared.length, 8);
    const topRowCount = Math.ceil(declared.length / topCols);

    // Bottom rows: transitive packages
    const botCols = Math.min(transitive.length, 10);
    const botRowCount = transitive.length ? Math.ceil(transitive.length / botCols) : 0;

    const W = Math.max(topCols, botCols) * (nodeW + gapX) + padX * 2;
    const topH = topRowCount * (nodeH + gapY);
    const midGap = 60;
    const botH = botRowCount * (nodeH + gapY);
    const H = padY + topH + midGap + botH + padY;

    // Position nodes
    const pos = {};

    declared.forEach((n, i) => {
        const col = i % topCols;
        const row = Math.floor(i / topCols);
        pos[n.id.toLowerCase()] = {
            x: padX + col * (nodeW + gapX),
            y: padY + row * (nodeH + gapY),
            declared: true,
        };
    });

    transitive.forEach((n, i) => {
        const col = i % botCols;
        const row = Math.floor(i / botCols);
        pos[n.id.toLowerCase()] = {
            x: padX + col * (nodeW + gapX),
            y: padY + topH + midGap + row * (nodeH + gapY),
            declared: false,
        };
    });

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    svg += `<style>
        .gn rect{rx:4;cursor:pointer;transition:all 0.15s}
        .gn:hover rect{stroke:#818cf8;stroke-width:2}
        .gn text{font-size:9px;font-family:inherit;pointer-events:none}
        .ge{fill:none;stroke-width:1;opacity:0.4}
    </style>`;

    // Draw edges first (behind nodes)
    for (const e of edges) {
        const src = pos[e.source.toLowerCase()];
        const tgt = pos[e.target.toLowerCase()];
        if (!src || !tgt) continue;
        const x1 = src.x + nodeW / 2, y1 = src.y + nodeH;
        const x2 = tgt.x + nodeW / 2, y2 = tgt.y;
        const my = (y1 + y2) / 2;
        svg += `<path class="ge" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" stroke="${src.declared ? '#818cf8' : 'var(--border-subtle)'}"/>`;
    }

    // Separator line between declared and transitive
    if (transitive.length) {
        const sepY = padY + topH + midGap / 2;
        svg += `<line x1="0" y1="${sepY}" x2="${W}" y2="${sepY}" stroke="var(--border-subtle)" stroke-dasharray="4,4"/>`;
        svg += `<text x="${padX}" y="${sepY - 5}" fill="var(--text-muted)" font-size="9" font-family="inherit">▼ transitive sub-dependencies</text>`;
    }

    // Draw nodes
    for (const n of nodes) {
        const p = pos[n.id.toLowerCase()];
        if (!p) continue;
        const fill = n.declared ? 'var(--bg-card)' : 'var(--bg-inset)';
        const stroke = n.declared ? 'var(--accent)' : 'var(--border-subtle)';
        const textColor = n.declared ? 'var(--text-primary)' : 'var(--text-secondary)';
        const groupColors = { main:'', dev:'#a78bfa', web:'#60a5fa', ocr:'#fb923c', transitive:'var(--text-muted)' };
        const gc = groupColors[n.group] || '';
        const label = n.label.length > 16 ? n.label.slice(0, 15) + '…' : n.label;

        svg += `<g class="gn">`;
        svg += `<rect x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" fill="${fill}" stroke="${stroke}" stroke-width="${n.declared ? 1.5 : 1}"/>`;
        svg += `<text x="${p.x + 5}" y="${p.y + 12}" fill="${textColor}">${_se(label)}</text>`;
        if (n.version) svg += `<text x="${p.x + 5}" y="${p.y + 22}" fill="var(--text-muted)" font-size="7">${_se(n.version)}</text>`;
        if (gc) svg += `<rect x="${p.x + nodeW - 4}" y="${p.y}" width="4" height="${nodeH}" fill="${gc}" rx="0" ry="0" opacity="0.6"/>`;
        svg += `</g>`;
    }

    svg += `</svg>`;

    // Legend
    let legend = `<div style="display:flex;align-items:center;gap:var(--space-md);margin-top:var(--space-sm);font-size:0.62rem;color:var(--text-muted);flex-wrap:wrap">`;
    legend += `<span><span style="display:inline-block;width:10px;height:10px;border:1.5px solid var(--accent);border-radius:2px;vertical-align:middle"></span> declared</span>`;
    legend += `<span><span style="display:inline-block;width:10px;height:10px;border:1px solid var(--border-subtle);border-radius:2px;background:var(--bg-inset);vertical-align:middle"></span> transitive</span>`;
    legend += `<span style="color:#818cf8">── dependency link</span>`;
    legend += `<span><span style="display:inline-block;width:4px;height:10px;background:#a78bfa;border-radius:1px;vertical-align:middle"></span> dev</span>`;
    legend += `<span><span style="display:inline-block;width:4px;height:10px;background:#60a5fa;border-radius:1px;vertical-align:middle"></span> web</span>`;
    legend += `<span><span style="display:inline-block;width:4px;height:10px;background:#fb923c;border-radius:1px;vertical-align:middle"></span> ocr</span>`;
    legend += `</div>`;

    // Wrap SVG in pan/zoom container
    let wrapper = '';
    wrapper += `<div style="position:relative">`;
    // Controls
    wrapper += `<div style="position:absolute;top:var(--space-xs);right:var(--space-xs);display:flex;gap:2px;z-index:1">`;
    wrapper += `<button onclick="_depGraphZoom(1.2)" style="width:26px;height:26px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;font-size:0.82rem;display:flex;align-items:center;justify-content:center" title="Zoom in">+</button>`;
    wrapper += `<button onclick="_depGraphZoom(0.8)" style="width:26px;height:26px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;font-size:0.82rem;display:flex;align-items:center;justify-content:center" title="Zoom out">−</button>`;
    wrapper += `<button onclick="_depGraphReset()" style="width:26px;height:26px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;font-size:0.72rem;display:flex;align-items:center;justify-content:center" title="Reset view">⟲</button>`;
    wrapper += `</div>`;
    // SVG viewport
    wrapper += `<div id="dep-graph-viewport" style="overflow:hidden;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);height:500px;cursor:grab;background:var(--bg-inset)">`;
    wrapper += `<div id="dep-graph-transform" style="transform-origin:0 0;transition:transform 0.1s ease">${svg}</div>`;
    wrapper += `</div>`;
    wrapper += `</div>`;

    container.innerHTML = wrapper + legend;

    // Init pan/zoom state
    _depGraphInitPanZoom();
}

function _depDrawTableGraph(container, fullData, sharedData) {
    const data = sharedData || {};
    const modules = data.modules || [];
    const edges = data.edges || [];
    const shared = data.shared || [];

    if (!modules.length && !(fullData?.nodes?.length)) {
        container.innerHTML = '<div class="dep-empty"><div class="dep-empty-title">No modules detected.</div></div>';
        return;
    }

    const fg = fullData || {};
    const allNodes = fg.nodes || [];
    const allEdges = fg.edges || [];
    const declaredNodes = allNodes.filter(n => n.declared);
    const transitiveNodes = allNodes.filter(n => !n.declared);

    let h = `<div style="overflow:auto">`;

    // ── All packages table (declared + transitive) ────
    h += `<div style="margin-bottom:var(--space-lg)">`;
    h += `<div style="font-size:0.75rem;font-weight:600;color:var(--text-primary);margin-bottom:var(--space-sm)">All packages (${allNodes.length})</div>`;

    if (allNodes.length) {
        h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.3rem">`;
        for (const n of allNodes) {
            const isDeclared = n.declared;
            const groupColors = { main:'', dev:'rgba(167,139,250,0.15)', web:'rgba(96,165,250,0.15)', ocr:'rgba(251,146,60,0.15)', transitive:'var(--bg-inset)' };
            const bg = groupColors[n.group] || (isDeclared ? '' : 'var(--bg-inset)');
            const border = isDeclared ? 'var(--accent)' : 'var(--border-subtle)';
            // Count edges from this node
            const reqCount = allEdges.filter(e => e.source.toLowerCase() === n.id.toLowerCase()).length;
            const reqByCount = allEdges.filter(e => e.target.toLowerCase() === n.id.toLowerCase()).length;

            h += `<div style="display:flex;align-items:center;gap:0.3rem;padding:0.25rem 0.4rem;border:1px solid ${border};border-radius:4px;font-size:0.66rem;${bg ? 'background:' + bg : ''}">`;
            h += `<span style="color:var(--text-primary);font-weight:${isDeclared ? '600' : '400'};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_se(n.label)}</span>`;
            if (n.version) h += `<span style="font-family:var(--font-mono);font-size:0.58rem;color:var(--text-muted)">${_se(n.version)}</span>`;
            if (reqCount) h += `<span style="font-size:0.56rem;color:#818cf8" title="${reqCount} dependencies">↓${reqCount}</span>`;
            if (reqByCount) h += `<span style="font-size:0.56rem;color:var(--text-muted)" title="required by ${reqByCount}">↑${reqByCount}</span>`;
            if (n.group && n.group !== 'main' && n.group !== 'transitive') h += `<span class="dep-node-group" data-group="${_se(n.group)}" style="font-size:0.5rem">${_se(n.group)}</span>`;
            if (!isDeclared) h += `<span style="font-size:0.5rem;color:var(--text-muted);font-style:italic">transitive</span>`;
            h += `</div>`;
        }
        h += `</div>`;
    }
    h += `</div>`;

    // ── Shared deps + module cards (existing) ─────────
    h += `<div>`;

    // Summary bar
    h += `<div style="display:flex;align-items:center;gap:var(--space-md);margin-bottom:var(--space-md);font-size:0.72rem;color:var(--text-muted)">`;
    h += `<span>${modules.length} modules</span>`;
    h += `<span>${data.total_packages} packages</span>`;
    h += `<span>${data.total_shared} shared across modules</span>`;
    h += `</div>`;

    // Group shared deps by ecosystem for cleaner display
    const sharedByEco = {};
    for (const s of shared) {
        if (!sharedByEco[s.ecosystem]) sharedByEco[s.ecosystem] = [];
        sharedByEco[s.ecosystem].push(s);
    }

    // ── Module cards row ──────────────────────────────
    h += `<div style="display:flex;gap:var(--space-md);margin-bottom:var(--space-lg);flex-wrap:wrap">`;
    for (const m of modules) {
        const ecoIcons = { pip:'🐍', npm:'📦', go:'🔷', cargo:'🦀' };
        const icon = ecoIcons[m.ecosystem] || '📦';
        const edgeCount = edges.filter(e => e.source === m.id).length;
        const sharedCount = shared.filter(s => s.consumers.includes(m.id)).length;
        const uniqueCount = edgeCount - sharedCount;

        h += `<div style="flex:1;min-width:200px;border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-md);background:var(--bg-card)">`;
        h += `<div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm)">`;
        h += `<span style="font-size:1.1rem">${icon}</span>`;
        h += `<div>`;
        h += `<div style="font-size:0.82rem;font-weight:600;color:var(--text-primary)">${_se(m.label)}</div>`;
        h += `<div style="font-size:0.64rem;color:var(--text-muted)">${_se(m.ecosystem)}</div>`;
        h += `</div>`;
        h += `</div>`;
        h += `<div style="display:flex;gap:var(--space-md);font-size:0.68rem">`;
        h += `<div><span style="color:var(--text-muted)">Total:</span> <strong>${edgeCount}</strong></div>`;
        h += `<div><span style="color:var(--text-muted)">Unique:</span> <strong>${uniqueCount}</strong></div>`;
        h += `<div><span style="color:var(--text-muted)">Shared:</span> <strong style="color:#818cf8">${sharedCount}</strong></div>`;
        h += `</div>`;
        h += `</div>`;
    }
    h += `</div>`;

    // ── Shared dependencies by ecosystem ──────────────
    if (shared.length === 0) {
        h += `<div style="text-align:center;padding:var(--space-lg);color:var(--text-muted);font-size:0.78rem">No shared dependencies across modules</div>`;
    } else {
        for (const [eco, deps] of Object.entries(sharedByEco)) {
            const ecoIcons = { pip:'🐍', npm:'📦', go:'🔷', cargo:'🦀' };
            const icon = ecoIcons[eco] || '📦';

            h += `<div style="margin-bottom:var(--space-md)">`;
            h += `<div style="font-size:0.75rem;font-weight:600;color:var(--text-primary);margin-bottom:var(--space-sm);display:flex;align-items:center;gap:var(--space-xs)">`;
            h += `<span>${icon}</span> Shared ${_se(eco)} packages (${deps.length})`;
            h += `</div>`;

            // Table of shared deps
            h += `<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden">`;

            // Header
            h += `<div style="display:flex;gap:0.5rem;padding:0.3rem 0.5rem;background:var(--bg-inset);font-size:0.62rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em">`;
            h += `<span style="flex:2">Package</span>`;
            h += `<span style="flex:1">Shared by</span>`;
            h += `<span style="flex:2">Modules</span>`;
            h += `<span style="flex:1">Conflict</span>`;
            h += `</div>`;

            for (const s of deps) {
                const statusColors = { current:'var(--success)', outdated:'var(--warning)', deprecated:'var(--error)' };
                const sColor = statusColors[s.status] || 'var(--text-muted)';

                h += `<div style="display:flex;gap:0.5rem;padding:0.35rem 0.5rem;font-size:0.7rem;border-top:1px solid var(--border-subtle);align-items:center">`;
                h += `<span style="flex:2;display:flex;align-items:center;gap:0.3rem">`;
                h += `<span style="color:${sColor};font-size:0.65rem">●</span>`;
                h += `<span style="color:var(--text-primary);font-weight:500">${_se(s.package)}</span>`;
                h += `</span>`;
                h += `<span style="flex:1;color:#818cf8;font-weight:600">${s.shared_by}×</span>`;
                h += `<span style="flex:2;font-size:0.64rem;color:var(--text-secondary)">${s.consumer_labels.map(l => _se(l)).join(' · ')}</span>`;
                h += `<span style="flex:1">`;
                if (s.conflict) {
                    h += `<span style="color:var(--warning);font-size:0.64rem">⚡ version conflict</span>`;
                } else {
                    h += `<span style="color:var(--success);font-size:0.64rem">✓ aligned</span>`;
                }
                h += `</span>`;
                h += `</div>`;
            }

            h += `</div>`;
            h += `</div>`;
        }
    }

    // ── Unique packages per module ─────────────────────
    h += `<div style="margin-top:var(--space-md)">`;
    h += `<div style="font-size:0.75rem;font-weight:600;color:var(--text-primary);margin-bottom:var(--space-sm)">Unique packages per module</div>`;
    h += `<div style="display:flex;gap:var(--space-md);flex-wrap:wrap">`;

    const sharedPkgNames = new Set(shared.map(s => s.package));

    for (const m of modules) {
        const moduleEdges = edges.filter(e => e.source === m.id);
        const uniqueEdges = moduleEdges.filter(e => !sharedPkgNames.has(e.target));

        if (!uniqueEdges.length) continue;

        h += `<div style="flex:1;min-width:200px">`;
        h += `<div style="font-size:0.68rem;font-weight:500;color:var(--text-secondary);margin-bottom:var(--space-xs)">${_se(m.label)} (${uniqueEdges.length} unique)</div>`;
        for (const e of uniqueEdges) {
            const sc = { current:'var(--success)', outdated:'var(--warning)', deprecated:'var(--error)' };
            const ec = sc[e.status] || 'var(--text-muted)';
            h += `<div style="font-size:0.64rem;padding:0.1rem 0;display:flex;gap:0.3rem;align-items:center">`;
            h += `<span style="color:${ec};font-size:0.58rem">●</span>`;
            h += `<span style="color:var(--text-secondary)">${_se(e.target)}</span>`;
            if (e.group && e.group !== 'main') h += `<span class="dep-node-group" data-group="${_se(e.group)}" style="font-size:0.5rem">${_se(e.group)}</span>`;
            h += `</div>`;
        }
        h += `</div>`;
    }

    h += `</div>`;
    h += `</div>`;

    // Legend
    h += `<div style="display:flex;align-items:center;gap:var(--space-md);margin-top:var(--space-md);padding-top:var(--space-sm);border-top:1px solid var(--border-subtle);font-size:0.64rem;color:var(--text-muted)">`;
    h += `<span><span style="color:var(--success)">●</span> current</span>`;
    h += `<span><span style="color:var(--warning)">●</span> outdated</span>`;
    h += `<span><span style="color:var(--error)">●</span> deprecated</span>`;
    h += `<span><span style="color:#818cf8">N×</span> shared count</span>`;
    h += `<span>⚡ version conflict</span>`;
    h += `</div>`;

    h += `</div>`;
    container.innerHTML = h;
}

function _se(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Pan / Zoom ───────────────────────────────────────────────

let _dgScale = 1, _dgPanX = 0, _dgPanY = 0;
let _dgDragging = false, _dgStartX = 0, _dgStartY = 0;

function _depGraphInitPanZoom() {
    const vp = document.getElementById('dep-graph-viewport');
    if (!vp) return;

    _dgScale = 1; _dgPanX = 0; _dgPanY = 0;
    _depGraphApply();

    // Mouse wheel zoom
    vp.addEventListener('wheel', function(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        // Zoom toward mouse position
        const rect = vp.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const newScale = Math.max(0.2, Math.min(5, _dgScale * delta));
        // Adjust pan to zoom toward mouse
        _dgPanX = mx - (mx - _dgPanX) * (newScale / _dgScale);
        _dgPanY = my - (my - _dgPanY) * (newScale / _dgScale);
        _dgScale = newScale;
        _depGraphApply(false);
    }, { passive: false });

    // Mouse drag pan
    vp.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        _dgDragging = true;
        _dgStartX = e.clientX - _dgPanX;
        _dgStartY = e.clientY - _dgPanY;
        vp.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', function(e) {
        if (!_dgDragging) return;
        _dgPanX = e.clientX - _dgStartX;
        _dgPanY = e.clientY - _dgStartY;
        _depGraphApply(false);
    });
    window.addEventListener('mouseup', function() {
        if (_dgDragging) {
            _dgDragging = false;
            const vp = document.getElementById('dep-graph-viewport');
            if (vp) vp.style.cursor = 'grab';
        }
    });

    // Touch support
    let _dgTouchStart = null;
    vp.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            _dgTouchStart = { x: e.touches[0].clientX - _dgPanX, y: e.touches[0].clientY - _dgPanY };
        }
    }, { passive: true });
    vp.addEventListener('touchmove', function(e) {
        if (_dgTouchStart && e.touches.length === 1) {
            _dgPanX = e.touches[0].clientX - _dgTouchStart.x;
            _dgPanY = e.touches[0].clientY - _dgTouchStart.y;
            _depGraphApply(false);
        }
    }, { passive: true });
    vp.addEventListener('touchend', function() { _dgTouchStart = null; });
}

function _depGraphApply(animate) {
    const el = document.getElementById('dep-graph-transform');
    if (!el) return;
    el.style.transition = animate !== false ? 'transform 0.15s ease' : 'none';
    el.style.transform = `translate(${_dgPanX}px,${_dgPanY}px) scale(${_dgScale})`;
}

function _depGraphZoom(factor) {
    const vp = document.getElementById('dep-graph-viewport');
    if (!vp) return;
    const rect = vp.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    const newScale = Math.max(0.2, Math.min(5, _dgScale * factor));
    _dgPanX = cx - (cx - _dgPanX) * (newScale / _dgScale);
    _dgPanY = cy - (cy - _dgPanY) * (newScale / _dgScale);
    _dgScale = newScale;
    _depGraphApply(true);
}

function _depGraphReset() {
    _dgScale = 1; _dgPanX = 0; _dgPanY = 0;
    _depGraphApply(true);
}

// ═══════════════════════════════════════════════════════════════
//  C6: Impact dialog
// ═══════════════════════════════════════════════════════════════

async function _depShowImpact(eco, pkg, toVer) {
    try {
        const d = await api(`/dependencies/impact?ecosystem=${encodeURIComponent(eco)}&package=${encodeURIComponent(pkg)}&to_version=${encodeURIComponent(toVer||'latest')}`);
        if (d.shared_by <= 1) return true;

        return new Promise(resolve => {
            const rc = { low:'var(--success)', medium:'var(--warning)', high:'var(--error)' };
            const el = document.createElement('div');
            el.className = 'dep-overlay';
            el.style.zIndex = '1001';
            el.innerHTML = `
            <div class="dep-modal" style="max-width:480px;padding:var(--space-xl)">
                <div style="font-size:0.9rem;font-weight:600;margin-bottom:var(--space-sm)">⚠ Impact Analysis</div>
                <div style="font-size:0.78rem;margin-bottom:var(--space-md)">
                    Updating <strong>${esc(pkg)}</strong> ${esc(d.from_version)} → ${esc(d.to_version)}
                </div>
                <div style="font-size:0.75rem;line-height:1.6;color:var(--text-secondary);margin-bottom:var(--space-md)">
                    <div>Shared by <strong>${d.shared_by}</strong> modules:</div>
                    ${d.affected_labels.map(l => '<div style="padding-left:1rem">\u2022 ' + esc(l) + '</div>').join('')}
                    <div style="margin-top:var(--space-xs)">Risk: <span style="color:${rc[d.risk]||'var(--text-muted)'};font-weight:600">${d.risk.toUpperCase()}</span>${d.breaking ? ' (breaking)' : ''}</div>
                </div>
                <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:var(--space-md)">${esc(d.detail)}</div>
                <div style="display:flex;gap:var(--space-sm);justify-content:flex-end">
                    <button class="btn btn-sm btn-ghost" id="dep-impact-no">Cancel</button>
                    <button class="btn btn-sm" id="dep-impact-yes">Proceed</button>
                </div>
            </div>`;
            document.body.appendChild(el);
            el.querySelector('#dep-impact-no').onclick = () => { el.remove(); resolve(false); };
            el.querySelector('#dep-impact-yes').onclick = () => { el.remove(); resolve(true); };
            el.onclick = (e) => { if (e.target === el) { el.remove(); resolve(false); } };
        });
    } catch (e) { return true; }
}

</script>
