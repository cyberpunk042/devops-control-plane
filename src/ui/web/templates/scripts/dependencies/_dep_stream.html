<script>
/* Dependencies — SSE streaming client.
   Public: depRunOperation(scope, action, opts) → abort fn
           depAbortOperation()
*/

let _depAbort = null;
let _depRunning = false;
let _depTimerId = null;

function _depSetRunning(on) {
    _depRunning = on;
    const c = document.getElementById('dep-cancel-btn');
    if (c) c.style.display = on ? '' : 'none';
    const btns = document.getElementById('dep-action-buttons');
    if (btns) for (const b of btns.querySelectorAll('button:not(#dep-cancel-btn)')) b.disabled = on;
}

function depAbortOperation() {
    if (_depAbort) { try { _depAbort.abort(); } catch(_){} _depAbort = null; }
    if (_depTimerId) { clearInterval(_depTimerId); _depTimerId = null; }
    _depSetRunning(false);
}

function depRunOperation(scope, action, opts) {
    opts = opts || {};
    depAbortOperation();

    const term = document.getElementById('dep-terminal');
    const status = document.getElementById('dep-op-status');
    const progress = document.getElementById('dep-op-progress');
    const progressBar = progress?.parentElement;
    if (!term || !status) return () => {};

    term.textContent = '';
    if (progress) progress.textContent = '';
    if (progressBar) progressBar.setAttribute('data-status', 'running');
    status.textContent = '⏳ Starting...';

    _depAbort = new AbortController();
    _depSetRunning(true);

    const t0 = performance.now();
    _depTimerId = setInterval(() => {
        const el = document.getElementById('dep-elapsed');
        if (el) el.textContent = '⏱ ' + ((performance.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);

    // Batched rendering
    const buf = [];
    let scheduled = false;
    function addLine(text, cls) {
        buf.push({ text, cls });
        if (!scheduled) { scheduled = true; requestAnimationFrame(flush); }
    }
    function flush() {
        scheduled = false;
        if (!buf.length) return;
        const frag = document.createDocumentFragment();
        for (const { text, cls } of buf) {
            const d = document.createElement('div');
            d.textContent = text;
            if (cls) d.className = cls;
            frag.appendChild(d);
        }
        buf.length = 0;
        term.appendChild(frag);
        term.scrollTop = term.scrollHeight;
    }

    let resolved = 0, warns = 0, errs = 0;
    const warnList = [];
    const errList = [];
    const resolvedPkgs = [];  // {name, version} of packages that were resolved
    function updateProgress() {
        if (!progress) return;
        const p = [resolved + ' resolved'];
        if (warns) p.push(warns + ' ⚠');
        if (errs) p.push(errs + ' ✗');
        progress.textContent = p.join(' · ');
    }

    function done(opStatus) {
        if (_depTimerId) { clearInterval(_depTimerId); _depTimerId = null; }
        _depSetRunning(false);
        if (progressBar) progressBar.setAttribute('data-status', opStatus || '');

        // Update local installed state from what we observed in the stream
        if (opStatus === 'ok' && typeof _depTargetInstalled === 'object') {
            if (action === 'clean') {
                const pkgNames = opts.packages || [];
                for (const name of pkgNames) {
                    delete _depTargetInstalled[name.toLowerCase()];
                }
            } else {
                for (const rp of resolvedPkgs) {
                    if (rp.name && rp.version) {
                        _depTargetInstalled[rp.name.toLowerCase()] = rp.version;
                    }
                }
            }

            // Save terminal output before re-rendering
            const termEl = document.getElementById('dep-terminal');
            const savedTerminal = termEl ? termEl.innerHTML : '';
            const savedProgress = document.getElementById('dep-op-progress')?.innerHTML || '';
            const savedStatus = document.getElementById('dep-op-status')?.innerHTML || '';

            // Re-render tree + panels with fresh state — preserve focused package
            if (typeof _depRenderTree === 'function') _depRenderTree(_depTree);
            if (_depSelectedPkg && typeof _depRenderOpPanel === 'function') {
                _depRenderOpPanel(_depSelectedScope);
            } else if (typeof _depUpdateOpForSelection === 'function') {
                _depUpdateOpForSelection();
            }
            if (_depSelectedPkg && typeof _depRenderIntel === 'function') _depRenderIntel(_depSelectedPkg);
            else if (_depSelectedScope && typeof _depRenderEcoOverview === 'function') _depRenderEcoOverview(_depSelectedScope);

            // Restore terminal output (it was wiped by _depRenderOpPanel)
            const newTermEl = document.getElementById('dep-terminal');
            if (newTermEl && savedTerminal) newTermEl.innerHTML = savedTerminal;
            const newProgress = document.getElementById('dep-op-progress');
            if (newProgress && savedProgress) newProgress.innerHTML = savedProgress;
            const newStatus = document.getElementById('dep-op-status');
            if (newStatus && savedStatus) newStatus.innerHTML = savedStatus;

            // Update the dashboard card
            if (typeof cardStore === 'function') cardStore('dep-card-data', null);
            if (typeof _depLoadCard === 'function') _depLoadCard();
        }

        // Show remediation if warnings/errors
        if ((warnList.length || errList.length) && typeof _depRenderRemediation === 'function') {
            _depRenderRemediation(warnList, errList);
        }
    }

    function handle(evt) {
        switch (evt.type) {
            case 'snapshot_created':
                addLine('📸 ' + (evt.message || 'Snapshot created'), 'dep-line-info');
                break;
            case 'operation_start':
                addLine('$ ' + (evt.command || ''), 'dep-line-cmd');
                status.textContent = '⏳ Running...';
                break;
            case 'log':
                addLine(evt.line || '', '');
                break;
            case 'package_resolved':
                addLine('  ✓ ' + (evt.package || '') + ' ' + (evt.version || ''), 'dep-line-ok');
                resolved += (evt.count || 1);
                if (evt.package) resolvedPkgs.push({ name: evt.package, version: evt.version || '' });
                updateProgress();
                break;
            case 'warning':
                addLine('  ⚠ ' + (evt.message || ''), 'dep-line-warn');
                warns++;
                warnList.push({ message: evt.message || '', category: evt.category || '', package: evt.package || '' });
                updateProgress();
                break;
            case 'error':
                if (evt.severity === 'error') {
                    addLine('  ✗ ' + (evt.message || ''), 'dep-line-err');
                    errs++;
                    errList.push({ message: evt.message || '', category: evt.category || '', package: evt.package || '' });
                    updateProgress();
                }
                break;
            case 'progress':
                if (progress) progress.textContent = evt.message || '';
                break;
            case 'operation_done':
            case 'rollback_done': {
                flush();
                const ok = evt.status === 'ok';
                const dur = ((evt.duration_ms || 0) / 1000).toFixed(1);
                status.innerHTML = ok
                    ? `<span style="color:var(--success)">✅ ${esc(evt.message || 'Done')} — ${dur}s</span>`
                    : `<span style="color:var(--error)">❌ ${esc(evt.message || 'Failed')}</span>`;
                done(ok ? 'ok' : 'error');
                break;
            }
            case 'batch_start':
                status.textContent = '⏳ Batch: ' + (evt.detail?.ecosystems?.length || '?') + ' ecosystems';
                break;
            case 'batch_done': {
                flush();
                const ok = evt.status === 'ok';
                const dur = ((evt.duration_ms || 0) / 1000).toFixed(1);
                status.innerHTML = ok
                    ? `<span style="color:var(--success)">✅ ${esc(evt.message || 'Done')} — ${dur}s</span>`
                    : `<span style="color:var(--error)">❌ ${esc(evt.message || 'Failed')}</span>`;
                done(ok ? 'ok' : 'error');
                break;
            }
            case 'rollback_start':
                addLine('⏪ ' + (evt.message || 'Restoring...'), 'dep-line-info');
                break;
        }
    }

    // Fetch streaming
    fetch('/api/dependencies/' + action + '/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope, ...opts }),
        signal: _depAbort.signal,
    }).then(resp => {
        if (!resp.ok) { status.innerHTML = `<span style="color:var(--error)">❌ Server ${resp.status}</span>`; done(); return; }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        function read() {
            reader.read().then(({ done: eof, value }) => {
                if (eof) { flush(); if (_depRunning) { status.textContent = '⚠ Stream ended'; done(); } return; }
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const raw of lines) {
                    if (!raw.startsWith('data: ')) continue;
                    try { handle(JSON.parse(raw.slice(6))); } catch(e) {}
                }
                read();
            }).catch(err => {
                if (err.name === 'AbortError') status.textContent = '⛔ Aborted';
                else status.innerHTML = `<span style="color:var(--error)">⚠ ${esc(err.message)}</span>`;
                done();
            });
        }
        read();
    }).catch(err => {
        if (err.name !== 'AbortError') status.innerHTML = `<span style="color:var(--error)">⚠ ${esc(err.message)}</span>`;
        done();
    });

    return depAbortOperation;
}

</script>
