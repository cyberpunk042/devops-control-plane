<script>
/* Dependencies — Modal shell + Scope Tree + Operations + Version Intel + Snapshots.
   Entry point: depOpenModal() from dashboard 📦 click.
*/

// ═══════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════

let _depTree = null;
let _depSelectedScope = null;
let _depSelectedPkg = null;
let _depExpanded = new Set();
let _depSnapshots = [];
let _depActiveTab = 'tree';
let _depActiveTarget = null;
let _depTargetInstalled = {};
let _depInstalledLoaded = false;
let _depLastTerminal = '';
let _depSearchQuery = '';
let _depCheckedPkgs = new Set(); // Unified: all checked package IDs (pkg-level only)

// ── State persistence ────────────────────────────────────────
function _depSaveState() {
    try {
        sessionStorage.setItem('dep-state', JSON.stringify({
            expanded: Array.from(_depExpanded),
            scope: _depSelectedScope,
            target: _depActiveTarget,
            tab: _depActiveTab,
            search: _depSearchQuery,
            checked: Array.from(_depCheckedPkgs),
        }));
    } catch (e) { /* quota exceeded — ignore */ }
}
function _depRestoreState() {
    try {
        const raw = sessionStorage.getItem('dep-state');
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.expanded) _depExpanded = new Set(s.expanded);
        if (s.scope) _depSelectedScope = s.scope;
        if (s.target) _depActiveTarget = s.target;
        if (s.tab) _depActiveTab = s.tab;
        if (s.search) _depSearchQuery = s.search;
        if (s.checked) _depCheckedPkgs = new Set(s.checked);
    } catch (e) { /* corrupt — ignore */ }
}

// CSS is in admin.css (dep-overlay, dep-modal, dep-node, etc.)

// ═══════════════════════════════════════════════════════════════
//  E2: Modal open / close
// ═══════════════════════════════════════════════════════════════

async function depOpenModal(initialScope, initialAction) {
    const old = document.getElementById('dep-modal');
    if (old) old.remove();

    // Restore state from previous session (unless explicit scope given)
    if (!initialScope) _depRestoreState();

    const el = document.createElement('div');
    el.className = 'dep-overlay';
    el.id = 'dep-modal';
    el.onclick = (e) => { if (e.target === el) depCloseModal(); };
    el.innerHTML = `
    <div class="dep-modal">
        <div class="dep-header">
            <div class="dep-header-left">
                <h3>📦 Manage Dependencies</h3>
                <div class="dep-tab-bar">
                    <button class="dep-tab active" id="dep-tab-tree" onclick="_depSwitchTab('tree')">Tree</button>
                    <button class="dep-tab" id="dep-tab-graph" onclick="_depSwitchTab('graph')">Graph</button>
                </div>
                <span class="dep-elapsed" id="dep-elapsed"></span>
            </div>
            <div style="display:flex;align-items:center;gap:var(--space-sm)">
                <button onclick="_depBustModal()" title="Refresh all data" style="font-size:0.75rem;cursor:pointer;background:none;border:none;color:var(--text-muted);padding:0.2rem">🔄</button>
                <button class="dep-close" onclick="depCloseModal()" title="Close (Esc)">✕</button>
            </div>
        </div>
        <div class="dep-target-bar" id="dep-target-bar" style="display:none"></div>
        <div class="dep-body" id="dep-body">
            <div class="dep-tree-panel" id="dep-tree-panel">
                <div class="dep-loading">◌ Loading dependency tree...</div>
            </div>
            <div class="dep-right-panel" id="dep-right-panel">
                <div class="dep-op-panel" id="dep-op-panel">
                    <div style="color:var(--text-muted);font-size:0.82rem;line-height:1.8">
                        Select an ecosystem or package in the tree to begin.<br>
                        <span style="font-size:0.72rem">Or check ecosystems and use Global scope for batch operations.</span>
                    </div>
                </div>
                <div class="dep-detail-panel" id="dep-detail-panel"></div>
            </div>
        </div>
        <div class="dep-snapshot-bar" id="dep-snapshot-bar">
            ▶ Snapshots: loading...
        </div>
    </div>`;
    document.body.appendChild(el);

    // Escape to close
    el._escHandler = (e) => { if (e.key === 'Escape') depCloseModal(); };
    document.addEventListener('keydown', el._escHandler);

    try {
        // Use cached tree if available, otherwise fetch
        const data = _depCardTree || await api('/dependencies/tree');
        _depTree = data;

        // Auto-select scope if provided (from card click)
        if (initialScope) {
            _depSelectedScope = initialScope;
            _depExpanded.add(initialScope);  // Auto-expand the selected ecosystem
        } else if (data.children && data.children.length === 1) {
            // Single ecosystem — auto-select it
            _depSelectedScope = data.children[0].id;
            _depExpanded.add(data.children[0].id);
        }

        // Load installed packages BEFORE rendering tree
        // so _depPkgState has data and doesn't show everything as ❌
        try {
            _depTargetInstalled = await api('/dependencies/installed');
            _depInstalledLoaded = true;
        } catch (e) {
            // Installed data not available — tree will show ◌ instead of ❌
            _depTargetInstalled = {};
            _depInstalledLoaded = false;
        }

        _depRenderTree(data);
        _depLoadSnapshots();
        await _depLoadTargets();

        // If scope was pre-selected, render its panels
        if (_depSelectedScope) {
            _depRenderOpPanel(_depSelectedScope);
            _depRenderEcoOverview(_depSelectedScope);
        }

        // Auto-trigger action if requested (from card quick action)
        if (initialAction && _depSelectedScope) {
            setTimeout(() => _depDoAction(initialAction), 300);
        }

        // Restore last terminal output if reopening
        if (_depLastTerminal && _depSelectedScope) {
            const term = document.getElementById('dep-terminal');
            if (term) term.innerHTML = _depLastTerminal;
        }

        // Restore search filter
        if (_depSearchQuery) {
            const searchEl = document.getElementById('dep-search');
            if (searchEl) searchEl.value = _depSearchQuery;
        }

        // Background: trigger version intel computation (may take a while)
        // When it completes, the SSE listener will auto-refresh
        api('/dependencies/versions').catch(() => {});

    } catch (e) {
        document.getElementById('dep-tree-panel').innerHTML =
            `<div class="dep-empty"><div class="dep-empty-title" style="color:var(--error)">Failed to load</div><div class="dep-empty-hint">${esc(e.message)}</div></div>`;
    }
}

async function _depBustModal() {
    // Show loading state
    const tree = document.getElementById('dep-tree-panel');
    if (tree) tree.innerHTML = '<div class="dep-loading">◌ Refreshing...</div>';

    _depInstalledLoaded = false;
    _depTargetInstalled = {};

    try {
        // Bust backend caches + re-fetch everything
        const [treeData, installed] = await Promise.all([
            api('/dependencies/tree?bust=1'),
            api('/dependencies/installed?bust=1'),
        ]);

        _depTree = treeData;
        _depCardTree = treeData;
        _depTargetInstalled = installed || {};
        _depInstalledLoaded = Object.keys(_depTargetInstalled).length > 0;

        _depRenderTree(treeData);
        _depLoadTargets();
        _depLoadSnapshots();

        // Restore panels respecting checked state
        _depUpdateOpForSelection();
        if (_depSelectedPkg) {
            _depRenderIntel(_depSelectedPkg);
        } else if (_depSelectedScope) {
            _depRenderEcoOverview(_depSelectedScope);
        }
    } catch (e) {
        if (tree) tree.innerHTML = `<div class="dep-empty"><div class="dep-empty-title" style="color:var(--error)">Refresh failed</div><div class="dep-empty-hint">${esc(e.message)}</div></div>`;
    }

    // Also refresh the dashboard card
    if (typeof cardStore === 'function') cardStore('dep-card-data', null);
    _depLoadCard();
}

function depCloseModal() {
    // Preserve terminal output
    const term = document.getElementById('dep-terminal');
    if (term && term.innerHTML) _depLastTerminal = term.innerHTML;
    _depSaveState();

    if (typeof depAbortOperation === 'function') depAbortOperation();
    const el = document.getElementById('dep-modal');
    if (el) {
        if (el._escHandler) document.removeEventListener('keydown', el._escHandler);
        el.remove();
    }
}

let _depRightPanelBackup = '';  // Backup of right panel HTML before graph view

function _depSwitchTab(tab) {
    _depActiveTab = tab;
    document.getElementById('dep-tab-tree').className = 'dep-tab' + (tab === 'tree' ? ' active' : '');
    document.getElementById('dep-tab-graph').className = 'dep-tab' + (tab === 'graph' ? ' active' : '');

    if (tab === 'graph') {
        // Backup right panel before graph replaces it
        const rp = document.getElementById('dep-right-panel');
        if (rp) _depRightPanelBackup = rp.innerHTML;
        if (typeof _depRenderGraphView === 'function') _depRenderGraphView();
    } else {
        // Restore tree view
        document.getElementById('dep-tree-panel').style.display = '';
        const rp = document.getElementById('dep-right-panel');
        if (rp && _depRightPanelBackup) {
            rp.innerHTML = _depRightPanelBackup;
            _depRightPanelBackup = '';
        }
        _depRenderTree(_depTree);
        if (_depSelectedScope) {
            _depRenderOpPanel(_depSelectedScope);
            _depRenderEcoOverview(_depSelectedScope);
        }
    }
}

// ═══════════════════════════════════════════════════════════════
//  Target selector (venv switching)
// ═══════════════════════════════════════════════════════════════

async function _depLoadTargets() {
    const bar = document.getElementById('dep-target-bar');
    if (!bar) return;

    try {
        const venvInfo = _depVenvInfo || await api('/dependencies/venvs');
        _depVenvInfo = venvInfo;
        const targets = venvInfo.targets || [];
        if (targets.length <= 1) { bar.style.display = 'none'; return; }

        // Set active target — always sync with server's active venv
        if (!_depActiveTarget || _depActiveTarget === 'null') {
            _depActiveTarget = venvInfo.active || 'system';
        }
        // Verify the target still exists in the target list
        if (!targets.find(t => t.path === _depActiveTarget)) {
            _depActiveTarget = venvInfo.active || targets[0]?.path || 'system';
        }

        let h = `<span class="dep-target-bar-label">Target:</span>`;

        for (const t of targets) {
            const isActive = t.path === _depActiveTarget;
            const isSystem = t.is_system;
            const isRisky = t.risky;
            const isPep668 = t.pep668;
            const isFt = t.free_threaded;

            let cls = 'dep-target-btn';
            if (isActive) cls += ' active';
            if (isSystem && isRisky) cls += ' system-locked';

            let dotColor = isActive ? 'var(--success)' : 'var(--text-muted)';
            if (isSystem && isRisky) dotColor = 'var(--warning)';

            let label = t.path;
            let tags = '';
            if (isFt) tags += `<span class="dep-target-tag">free-threaded</span>`;
            if (isSystem && isPep668) tags += `<span class="dep-target-tag" style="color:var(--warning)">PEP 668</span>`;
            else if (isSystem && isRisky) tags += `<span class="dep-target-tag" style="color:var(--warning)">not recommended</span>`;
            else if (isSystem) tags += `<span class="dep-target-tag">system</span>`;

            const titleText = `Python ${t.python}${isPep668 ? ' — EXTERNALLY-MANAGED (PEP 668)' : isRisky ? ' — use a venv instead' : ''}`;

            h += `<button class="${cls}" onclick="_depSwitchTarget('${esc(t.path)}')" title="${esc(titleText)}">`;
            h += `<span class="dep-target-dot" style="background:${dotColor}"></span>`;
            h += `<span>${esc(label)}</span>`;
            h += `<span style="color:var(--text-muted)">${esc(t.python)}</span>`;
            h += tags;
            if (isActive && _depInstalledLoaded) {
                const cnt = Object.keys(_depTargetInstalled).length;
                h += `<span style="font-size:0.56rem;color:var(--text-muted)">${cnt} pkg</span>`;
            }
            h += `</button>`;
        }

        bar.innerHTML = h;
        bar.style.display = '';
    } catch (e) {
        bar.style.display = 'none';
    }
}

async function _depSwitchTarget(targetPath) {
    const venvInfo = _depVenvInfo || {};
    const target = (venvInfo.targets || []).find(t => t.path === targetPath);

    // Risky system target — show confirmation
    if (target && target.is_system && target.risky) {
        const confirmed = await _depConfirmSystemTarget(target);
        if (!confirmed) return;
    }

    _depActiveTarget = targetPath;

    // Reload installed packages for this target
    try {
        const venvParam = targetPath === 'system' ? 'system' : targetPath;
        _depTargetInstalled = await api('/dependencies/installed/' + encodeURIComponent(venvParam));
        _depInstalledLoaded = true;
    } catch (e) {
        _depTargetInstalled = {};
        _depInstalledLoaded = false;
    }

    // Re-render EVERYTHING with new installed data — tree + right panels
    _depLoadTargets();              // Update target bar selection
    _depRenderTree(_depTree);       // Re-render left tree with new health badges
    if (_depSelectedScope) {
        _depRenderOpPanel(_depSelectedScope);
        _depRenderEcoOverview(_depSelectedScope);
    }
    if (_depSelectedPkg) {
        _depRenderIntel(_depSelectedPkg);
    }
}

function _depConfirmSystemTarget(target) {
    return new Promise(resolve => {
        const isPep668 = target && target.pep668;
        const reason = (target && target.risk_detail) || 'Installing into system Python is not recommended.';
        const title = isPep668 ? '⚠ System Python — EXTERNALLY-MANAGED' : '⚠ System Python Target';

        let technicalNote = '';
        if (isPep668) {
            technicalNote = `<div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:var(--space-md);padding:var(--space-sm);background:var(--bg-inset);border-radius:var(--radius-sm);font-family:var(--font-mono)">
                pip install will use --break-system-packages
            </div>`;
        }

        // List available venvs as alternatives
        const venvs = (_depVenvInfo?.venvs || []);
        let altHtml = '';
        if (venvs.length) {
            altHtml = `<div style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:var(--space-md)">
                <div style="font-weight:500;margin-bottom:0.2rem">Available virtual environments:</div>
                ${venvs.map(v => `<div style="padding-left:0.5rem">● <strong>${esc(v.path)}</strong> — Python ${esc(v.python)}${v.free_threaded ? ' (free-threaded)' : ''}</div>`).join('')}
            </div>`;
        }

        const el = document.createElement('div');
        el.className = 'dep-overlay';
        el.style.zIndex = '1001';
        el.innerHTML = `
        <div class="dep-modal" style="max-width:500px;padding:var(--space-xl)">
            <div style="font-size:0.9rem;font-weight:600;margin-bottom:var(--space-sm);color:var(--warning)">${title}</div>
            <div style="font-size:0.78rem;line-height:1.6;color:var(--text-secondary);margin-bottom:var(--space-md)">
                ${esc(reason)}
            </div>
            ${technicalNote}
            ${altHtml}
            <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:var(--space-lg)">
                You will be viewing packages installed in the system Python (${esc(target?.python || '?')}).
                Operations will target the system environment directly.
            </div>
            <div style="display:flex;gap:var(--space-sm);justify-content:flex-end">
                <button class="btn btn-sm btn-ghost" id="dep-sys-cancel">Use a venv instead</button>
                <button class="btn btn-sm" id="dep-sys-proceed" style="background:var(--warning);color:#000;border:none">View System Anyway</button>
            </div>
        </div>`;
        document.body.appendChild(el);
        el.querySelector('#dep-sys-cancel').onclick = () => { el.remove(); resolve(false); };
        el.querySelector('#dep-sys-proceed').onclick = () => { el.remove(); resolve(true); };
        el.onclick = (e) => { if (e.target === el) { el.remove(); resolve(false); } };
    });
}

// ═══════════════════════════════════════════════════════════════
//  Venv setup modal (from notification click)
// ═══════════════════════════════════════════════════════════════

function _depOpenVenvSetupModal(meta, notifId) {
    const variant = meta.variant || 'no_venv';
    const explanation = meta.explanation || '';
    const options = meta.options || [];
    const isPep668 = meta.pep668 || false;
    const severity = meta.severity || 'medium';

    const severityColors = { high: 'var(--error)', medium: 'var(--warning)', low: 'var(--text-muted)' };
    const severityLabels = { high: 'Critical', medium: 'Recommended', low: 'Suggestion' };
    const severityColor = severityColors[severity] || 'var(--warning)';

    const title = variant === 'no_venv'
        ? '📦 Python Virtual Environment Setup'
        : '📦 Activate Virtual Environment';

    let h = '';

    // Severity badge
    h += `<div style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.15rem 0.5rem;border-radius:4px;background:${severityColor}15;color:${severityColor};font-size:0.72rem;font-weight:600;margin-bottom:var(--space-md)">`;
    h += `● ${esc(severityLabels[severity] || 'Info')}`;
    h += `</div>`;

    // Explanation
    h += `<div style="font-size:0.78rem;line-height:1.6;color:var(--text-secondary);margin-bottom:var(--space-lg)">${esc(explanation)}</div>`;

    // PEP 668 technical note
    if (isPep668) {
        h += `<div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:var(--space-lg);padding:var(--space-sm);background:var(--bg-inset);border-radius:var(--radius-sm);border-left:3px solid var(--error)">`;
        h += `<strong>PEP 668:</strong> This system marks Python as EXTERNALLY-MANAGED. `;
        h += `Direct pip install will fail. A virtual environment is required.`;
        h += `</div>`;
    }

    // Options
    if (options.length) {
        h += `<div style="font-size:0.78rem;font-weight:600;color:var(--text-primary);margin-bottom:var(--space-sm)">Setup Options</div>`;
        for (let i = 0; i < options.length; i++) {
            const opt = options[i];
            const recommended = opt.recommended;
            const requires = opt.requires || [];
            const commands = opt.commands || [];

            h += `<div style="border:1px solid ${recommended ? 'var(--accent)' : 'var(--border-subtle)'};border-radius:var(--radius-sm);padding:var(--space-md);margin-bottom:var(--space-sm);${recommended ? 'background:rgba(129,140,248,0.04)' : ''}">`;

            // Option header
            h += `<div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-xs)">`;
            h += `<span style="font-size:0.82rem;font-weight:600;color:var(--text-primary)">${esc(opt.label)}</span>`;
            if (recommended) h += `<span style="font-size:0.58rem;padding:0.1rem 0.3rem;border-radius:3px;background:var(--accent);color:#fff">Recommended</span>`;
            h += `</div>`;

            // Description
            if (opt.description) {
                h += `<div style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:var(--space-sm)">${esc(opt.description)}</div>`;
            }

            // Requirements
            if (requires.length) {
                h += `<div style="font-size:0.66rem;color:var(--text-muted);margin-bottom:var(--space-xs)">Requires: ${requires.map(r => '<code>' + esc(r) + '</code>').join(', ')}</div>`;
            }

            // Commands
            if (commands.length) {
                h += `<div style="font-family:var(--font-mono);font-size:0.7rem;background:#0d0f17;color:#8892a8;padding:var(--space-sm);border-radius:4px;line-height:1.6;margin-bottom:var(--space-sm)">`;
                for (const cmd of commands) {
                    h += `<div>$ ${esc(cmd)}</div>`;
                }
                h += `</div>`;
            }

            // Copy button
            h += `<div style="display:flex;gap:var(--space-xs)">`;
            h += `<button class="btn btn-sm btn-ghost" onclick="navigator.clipboard.writeText('${commands.join(' && ').replace(/'/g, "\\'")}');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy Commands',1500)" style="font-size:0.66rem">Copy Commands</button>`;
            h += `</div>`;

            h += `</div>`;
        }
    }

    // Open modal
    if (typeof modalOpen === 'function') {
        modalOpen({
            title: title,
            body: h,
            size: 'wide',
            footerButtons: [
                { label: 'Dismiss', cls: 'btn-ghost', onclick: notifId ? `_dismissNotif('${notifId}');modalClose()` : 'modalClose()' },
                { label: 'Close', cls: 'btn-secondary', onclick: 'modalClose()' },
            ],
        });
    }
}

// ═══════════════════════════════════════════════════════════════
//  C1: Scope tree
// ═══════════════════════════════════════════════════════════════

function _depRenderTree(tree) {
    const panel = document.getElementById('dep-tree-panel');
    if (!panel || !tree) return;

    const children = tree.children || [];
    if (!children.length) {
        panel.innerHTML = `
            <div class="dep-empty">
                <div class="dep-empty-title">No dependency manifests detected.</div>
                <div class="dep-empty-hint">
                    Supported files:<br>
                    requirements.txt · pyproject.toml<br>
                    package.json · go.mod · Cargo.toml<br>
                    Gemfile · pom.xml · mix.exs · *.csproj
                </div>
            </div>`;
        return;
    }

    const totalPkgs = children.reduce((s, e) => s + (e.children || []).length, 0);
    let h = '';

    // Tree panel header + search
    h += `<div class="dep-tree-header"><span>Scope</span><span style="font-weight:400">${totalPkgs} packages</span></div>`;
    h += `<div style="padding:0 var(--space-xs) var(--space-xs);position:relative">`;
    h += `<input id="dep-search" type="text" placeholder="Filter packages..." value="${esc(_depSearchQuery)}" oninput="_depOnSearch(this.value)" style="width:100%;font-size:0.68rem;padding:0.25rem 1.5rem 0.25rem 0.4rem;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-sans)">`;
    if (_depSearchQuery) h += `<button onclick="_depOnSearch('');document.getElementById('dep-search').value=''" style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.7rem;padding:0">✕</button>`;
    h += `</div>`;

    // Compute global health
    const gStats = _depTreeStats(children);

    // Bulk filter pills (only show if there's something to filter)
    if (gStats.missing || gStats.outdated || gStats.deprecated) {
        h += `<div style="display:flex;gap:0.2rem;padding:0 var(--space-xs) var(--space-xs);flex-wrap:wrap">`;
        if (gStats.missing) h += `<button onclick="_depFilterByStatus('missing')" style="font-size:0.58rem;padding:0.1rem 0.3rem;border:1px solid var(--error);border-radius:3px;background:rgba(239,68,68,0.08);color:var(--error);cursor:pointer">${gStats.missing} ❌ missing</button>`;
        if (gStats.outdated) h += `<button onclick="_depFilterByStatus('outdated')" style="font-size:0.58rem;padding:0.1rem 0.3rem;border:1px solid var(--warning);border-radius:3px;background:rgba(245,158,11,0.08);color:var(--warning);cursor:pointer">${gStats.outdated} ⚠ outdated</button>`;
        if (gStats.deprecated) h += `<button onclick="_depFilterByStatus('deprecated')" style="font-size:0.58rem;padding:0.1rem 0.3rem;border:1px solid var(--error);border-radius:3px;background:rgba(239,68,68,0.08);color:var(--error);cursor:pointer">${gStats.deprecated} ⛔ deprecated</button>`;
        h += `<button onclick="_depFilterByStatus('')" style="font-size:0.58rem;padding:0.1rem 0.3rem;border:1px solid var(--border-subtle);border-radius:3px;background:transparent;color:var(--text-muted);cursor:pointer">all</button>`;
        h += `</div>`;
    }

    // Global root with health
    h += `<div class="dep-node${_depSelectedScope === 'global' ? ' selected' : ''}" onclick="_depSelectScope('global')">`;
    const allPkgIds = [];
    for (const e of children) for (const p of (e.children || [])) allPkgIds.push(p.id);
    const globalAllChecked = allPkgIds.length > 0 && allPkgIds.every(id => _depCheckedPkgs.has(id));
    const globalSomeChecked = !globalAllChecked && allPkgIds.some(id => _depCheckedPkgs.has(id));
    h += `<input type="checkbox" id="dep-chk-global" onclick="_depToggleGlobalCheck(event)" ${globalAllChecked ? 'checked' : ''} ${globalSomeChecked ? 'data-indeterminate="1"' : ''}>`;
    h += `<span class="dep-node-label" style="font-weight:600">Global</span>`;
    h += `<span class="dep-node-badge">${children.length} eco · ${totalPkgs} pkg</span>`;
    h += _depHealthBadges(gStats);
    h += `</div>`;

    // Ecosystems
    for (const eco of children) {
        const id = eco.id;
        const expanded = _depExpanded.has(id);
        const pkgs = eco.children || [];
        const label = eco.label || id;

        // Skip ecosystem entirely if search has no matches
        if (_depSearchQuery && !pkgs.some(_depPkgMatchesSearch)) continue;

        // Per-ecosystem health
        const eStats = _depEcoStats(pkgs);

        h += `<div style="margin-left:0.5rem">`;

        // Ecosystem header with health — data attributes for CSS color coding
        const ecoDataAttrs = eStats.missing ? ' data-has-missing="true"' :
            eStats.deprecated ? ' data-has-deprecated="true"' :
            eStats.outdated ? ' data-has-outdated="true"' :
            (eStats.current === eStats.total && eStats.total > 0) ? ' data-all-current="true"' : '';

        h += `<div class="dep-node${_depSelectedScope === id ? ' selected' : ''}" data-eco="${esc(id)}"${ecoDataAttrs} onclick="_depSelectScope('${esc(id)}')">`;
        h += `<span class="dep-node-chevron" onclick="_depToggleExpand('${esc(id)}',event)">${expanded ? '▼' : '▶'}</span>`;
        const ecoChildIds = pkgs.map(p => p.id);
        const ecoAllChecked = ecoChildIds.length > 0 && ecoChildIds.every(pid => _depCheckedPkgs.has(pid));
        const ecoSomeChecked = !ecoAllChecked && ecoChildIds.some(pid => _depCheckedPkgs.has(pid));
        h += `<input type="checkbox" ${ecoAllChecked ? 'checked' : ''} ${ecoSomeChecked ? 'data-indeterminate="1"' : ''} onclick="_depToggleEcoCheck('${esc(id)}',event)">`;
        h += `<span class="dep-node-label">${esc(label)}</span>`;
        h += `<span class="dep-node-badge">${pkgs.length}</span>`;
        h += _depHealthBadges(eStats);
        h += `</div>`;

        // Packages — filtered by search query
        const filteredPkgs = _depSearchQuery ? pkgs.filter(_depPkgMatchesSearch) : pkgs;
        const showPkgs = expanded || (_depSearchQuery && filteredPkgs.length > 0);

        if (showPkgs && filteredPkgs.length) {
            h += `<div class="dep-pkg-list">`;
            for (const pkg of filteredPkgs) {
                const st = _depPkgState(pkg);
                const sel = _depSelectedPkg && _depSelectedPkg.id === pkg.id;
                const pkgChecked = _depCheckedPkgs.has(pkg.id);
                const pkgExpKey = 'subdep:' + pkg.id;
                const pkgSubExpanded = _depExpanded.has(pkgExpKey);
                h += `<div class="dep-pkg-node${sel ? ' selected' : ''}" data-pkg="${esc(pkg.id)}" data-status="${esc(st.status)}" onclick='_depSelectPackage(${JSON.stringify(pkg).replace(/'/g, "&#39;")})' ondblclick='_depFocusPackage(${JSON.stringify(pkg).replace(/'/g, "&#39;")})' title="${esc(st.detail)}">`;
                if (st.installed) h += `<span onclick="_depTogglePkgSub('${esc(pkgExpKey)}','${esc(st.name)}',event)" style="font-size:0.45rem;min-width:0.6rem;color:var(--text-muted);cursor:pointer;flex-shrink:0">${pkgSubExpanded ? '▼' : '▸'}</span>`;
                h += `<input type="checkbox" ${pkgChecked ? 'checked' : ''} onclick="_depTogglePkg('${esc(pkg.id)}',event)" style="width:11px;height:11px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">`;
                h += `<span class="dep-node-label">${esc(st.name)}${st.declared ? ' <span style="color:var(--text-muted)">' + esc(st.declared) + '</span>' : ''}</span>`;
                h += _depHintHtml(st);
                h += `<span class="dep-node-status">${_depStatusHtml(st)}</span>`;
                if (pkg.group) h += `<span class="dep-node-group" data-group="${esc(pkg.group)}">${esc(pkg.group)}</span>`;
                h += `</div>`;
                // Inline sub-deps (if expanded)
                if (pkgSubExpanded) {
                    h += `<div id="dep-pkg-sub-${esc(pkg.id)}" class="dep-pkg-list" style="margin-left:1rem;border-left:1px solid var(--border-subtle);padding-left:0.3rem"></div>`;
                }
            }
            if (_depSearchQuery && filteredPkgs.length < pkgs.length) {
                h += `<div style="font-size:0.6rem;color:var(--text-muted);padding:0.2rem 0.3rem">${filteredPkgs.length}/${pkgs.length} shown</div>`;
            }
            h += `</div>`;
        }

        h += `</div>`;
    }

    panel.innerHTML = h;

    // Set indeterminate state on checkboxes (can't be done via HTML attribute)
    panel.querySelectorAll('[data-indeterminate="1"]').forEach(el => { el.indeterminate = true; });
}

// ── Centralized package state computation ─────────────────────
// Computes the REAL status from all available data:
// declared (version spec) + installed (from venv) + latest (from registry) + notes

function _depPkgState(pkg) {
    const name = pkg.label ? pkg.label.split(' ')[0] : '';
    const declared = pkg.version || '';
    // When target-specific installed data is loaded, it is the SOURCE OF TRUTH
    // — it overrides the tree's installedVersion (which comes from the server's active venv)
    const installed = _depInstalledLoaded
        ? (_depTargetInstalled[name.toLowerCase()] || '')
        : (pkg.installedVersion || '');
    const latest = pkg.latestVersion || '';
    const regStatus = pkg.status || '';  // From version intel registry
    const note = pkg.note || '';

    // Determine real status
    let status, icon, color, hint, detail;

    if (regStatus === 'deprecated' || regStatus === 'eol' || regStatus === 'yanked') {
        status = regStatus;
        icon = '⛔';
        color = 'var(--error)';
        hint = '→ EOL';
        detail = regStatus === 'yanked' ? 'Yanked from registry' : 'Deprecated / end of life';
    } else if (note) {
        status = 'acknowledged';
        icon = '📝';
        color = '#818cf8';
        hint = '';
        detail = note;
    } else if (!installed && declared && _depInstalledLoaded) {
        // Declared but NOT installed in the active target
        // Only flag as missing AFTER we've actually loaded installed data
        status = 'missing';
        icon = '❌';
        color = 'var(--error)';
        hint = 'not installed';
        detail = 'Declared in manifest but not found in the active environment';
    } else if (installed && latest && installed !== latest) {
        // Installed but not the latest
        status = 'outdated';
        icon = '⚠';
        color = 'var(--warning)';
        hint = `${installed} → ${latest}`;
        detail = `Installed ${installed}, latest ${latest}`;
    } else if (installed && latest && installed === latest) {
        status = 'current';
        icon = '✓';
        color = 'var(--success)';
        hint = installed;
        detail = `Up to date (${installed})`;
    } else if (installed && !latest) {
        // Installed, no registry data — check if installed satisfies declared constraint
        if (declared && _depVersionMismatch(declared, installed)) {
            status = 'mismatch';
            icon = '⚡';
            color = 'var(--warning)';
            hint = `${installed} ≠ ${declared}`;
            detail = `Installed ${installed} does not match declared ${declared}`;
        } else {
            status = 'installed';
            icon = '●';
            color = 'var(--success)';
            hint = installed;
            detail = `Installed ${installed}`;
        }
    } else if (regStatus === 'outdated' && latest) {
        status = 'outdated';
        icon = '⚠';
        color = 'var(--warning)';
        hint = `→ ${latest}`;
        detail = `Latest ${latest} available`;
    } else if (regStatus === 'current') {
        status = 'current';
        icon = '✓';
        color = 'var(--success)';
        hint = installed || '';
        detail = 'Up to date';
    } else {
        // No installed, no latest, no registry — truly unknown
        status = 'unknown';
        icon = '◌';
        color = 'var(--text-muted)';
        hint = '';
        detail = 'No version data available';
    }

    return { name, declared, installed, latest, status, icon, color, hint, detail, note };
}

function _depStatusHtml(state) {
    return `<span style="color:${state.color}">${state.icon}</span>`;
}

function _depRowStyle(st) {
    // Returns inline style for a package row — colored left border + subtle bg
    const borders = {
        missing: 'var(--error)', deprecated: 'var(--error)', eol: 'var(--error)', yanked: 'var(--error)',
        outdated: 'var(--warning)', mismatch: 'var(--warning)', current: 'var(--success)',
        installed: 'var(--success)', acknowledged: '#818cf8',
    };
    const bgs = {
        missing: 'rgba(239,68,68,0.04)', deprecated: 'rgba(239,68,68,0.03)',
        eol: 'rgba(239,68,68,0.03)', outdated: 'rgba(245,158,11,0.03)',
        acknowledged: 'rgba(129,140,248,0.03)',
    };
    const bc = borders[st.status] || 'transparent';
    const bg = bgs[st.status] || '';
    return `border-left:2px solid ${bc};${bg ? 'background:' + bg + ';' : ''}`;
}

function _depHintHtml(state) {
    if (!state.hint) return '';
    // Color the hint based on status
    const hintColor = state.status === 'missing' ? 'var(--error)'
        : state.status === 'outdated' ? 'var(--warning)'
        : state.status === 'deprecated' || state.status === 'eol' ? 'var(--error)'
        : state.status === 'current' ? 'var(--success)'
        : 'var(--text-muted)';
    return `<span class="dep-node-hint" style="color:${hintColor}" title="${esc(state.detail)}">${esc(state.hint)}</span>`;
}

// Legacy wrapper for places that just need the icon
function _depStatusIcon(status) {
    const m = { current:'✓', outdated:'⚠', deprecated:'⛔', eol:'⛔', yanked:'⛔', missing:'❌', installed:'●', mismatch:'⚡', acknowledged:'📝' };
    const c = { current:'var(--success)', outdated:'var(--warning)', deprecated:'var(--error)', eol:'var(--error)', yanked:'var(--error)', missing:'var(--error)', installed:'var(--success)', mismatch:'var(--warning)', acknowledged:'#818cf8' };
    return `<span style="color:${c[status] || 'var(--text-muted)'}">${m[status] || '◌'}</span>`;
}

// ── Search/filter ────────────────────────────────────────────

let _depSearchTimer = null;
function _depOnSearch(query) {
    clearTimeout(_depSearchTimer);
    _depSearchTimer = setTimeout(() => {
        _depSearchQuery = (query || '').toLowerCase().trim();
        _depRenderTree(_depTree);
    }, 150);
}

let _depStatusFilter = '';  // '' = show all, 'missing'/'outdated'/'deprecated' = filter

function _depPkgMatchesSearch(pkg) {
    // Text search
    if (_depSearchQuery) {
        const name = (pkg.label || '').toLowerCase();
        const group = (pkg.group || '').toLowerCase();
        if (!name.includes(_depSearchQuery) && !group.includes(_depSearchQuery)) return false;
    }
    // Status filter
    if (_depStatusFilter) {
        const st = _depPkgState(pkg);
        if (_depStatusFilter === 'deprecated') {
            return st.status === 'deprecated' || st.status === 'eol' || st.status === 'yanked';
        }
        return st.status === _depStatusFilter;
    }
    return true;
}

function _depFilterByStatus(status) {
    _depStatusFilter = status;
    // Also check/uncheck matching packages
    _depCheckedPkgs.clear();
    if (status) {
        for (const eco of (_depTree?.children || [])) {
            for (const pkg of (eco.children || [])) {
                const st = _depPkgState(pkg);
                let matches = false;
                if (status === 'deprecated') {
                    matches = st.status === 'deprecated' || st.status === 'eol' || st.status === 'yanked';
                } else {
                    matches = st.status === status;
                }
                if (matches) _depCheckedPkgs.add(pkg.id);
            }
        }
    }
    _depRenderTree(_depTree);
    // Update op panel to reflect selection
    if (_depCheckedPkgs.size > 0) {
        _depRenderOpPanelForCheckedPkgs();
    }
}

function _depTogglePkgSub(expKey, pkgName, e) {
    e.stopPropagation();
    if (_depExpanded.has(expKey)) {
        _depExpanded.delete(expKey);
    } else {
        _depExpanded.add(expKey);
    }
    _depRenderTree(_depTree);

    // Lazy-load sub-deps into the expanded container
    if (_depExpanded.has(expKey)) {
        const pkgId = expKey.replace('subdep:', '');
        const container = document.getElementById('dep-pkg-sub-' + pkgId);
        if (container && !container.dataset.loaded) {
            container.dataset.loaded = '1';
            container.innerHTML = '<div style="font-size:0.6rem;color:var(--text-muted);padding:0.2rem">◌ Loading...</div>';
            // Find the package data from tree to get ecosystem + path
            let treeEco = '', treePath = '';
            for (const eco of (_depTree?.children || [])) {
                const found = (eco.children || []).find(p => p.id === pkgId);
                if (found) { treeEco = found.ecosystem || ''; treePath = found.path || ''; break; }
            }
            const subParams = new URLSearchParams();
            if (_depActiveTarget) subParams.set('venv', _depActiveTarget);
            if (treeEco) subParams.set('eco', treeEco);
            if (treePath) subParams.set('path', treePath);
            const subQs = subParams.toString() ? '?' + subParams.toString() : '';
            api('/dependencies/subdeps/' + encodeURIComponent(pkgName) + subQs).then(data => {
                let sh = '';
                for (const r of (data.requires_detail || [])) {
                    const ic = r.installed ? '●' : '❌';
                    const clr = r.installed ? 'var(--success)' : 'var(--error)';
                    sh += `<div style="display:flex;align-items:center;gap:0.3rem;font-size:0.64rem;padding:0.1rem 0;color:var(--text-secondary)">`;
                    sh += `<span style="color:${clr};font-size:0.6rem">${ic}</span>`;
                    sh += `<span>${esc(r.name)}</span>`;
                    if (r.installed) sh += `<span style="font-family:var(--font-mono);font-size:0.58rem;color:var(--text-muted)">${esc(r.installed)}</span>`;
                    sh += `</div>`;
                }
                if (!sh) sh = '<div style="font-size:0.6rem;color:var(--text-muted);padding:0.1rem">No sub-dependencies</div>';
                if (data.required_by && data.required_by.length) {
                    sh += `<div style="font-size:0.58rem;color:var(--text-muted);padding:0.2rem 0 0;border-top:1px solid var(--border-subtle);margin-top:0.2rem">Required by: ${data.required_by.map(n => esc(n)).join(', ')}</div>`;
                }
                container.innerHTML = sh;
            }).catch(() => {
                container.innerHTML = '<div style="font-size:0.6rem;color:var(--error)">Failed to load</div>';
            });
        }
    }
}

function _depTogglePkg(pkgId, e) {
    e.stopPropagation();
    if (_depCheckedPkgs.has(pkgId)) _depCheckedPkgs.delete(pkgId);
    else _depCheckedPkgs.add(pkgId);
    _depRenderTree(_depTree);  // Re-render to update parent eco checkbox state
    _depUpdateOpForSelection();
}

function _depRenderOpPanelForCheckedPkgs() {
    const panel = document.getElementById('dep-op-panel');
    if (!panel) return;

    const names = [];
    const statuses = {};
    for (const eco of (_depTree?.children || [])) {
        for (const pkg of (eco.children || [])) {
            if (_depCheckedPkgs.has(pkg.id)) {
                const name = pkg.label ? pkg.label.split(' ')[0] : '';
                if (name) names.push(name);
                const st = _depPkgState(pkg);
                statuses[st.status] = (statuses[st.status] || 0) + 1;
            }
        }
    }

    const target = _depActiveTarget || 'system';

    // Status breakdown of checked packages
    let statusLine = '';
    const statusParts = [];
    if (statuses.missing) statusParts.push(`<span style="color:var(--error)">${statuses.missing} missing</span>`);
    if (statuses.outdated) statusParts.push(`<span style="color:var(--warning)">${statuses.outdated} outdated</span>`);
    if (statuses.deprecated) statusParts.push(`<span style="color:var(--error)">${statuses.deprecated} deprecated</span>`);
    if (statuses.current || statuses.installed) statusParts.push(`<span style="color:var(--success)">${(statuses.current||0) + (statuses.installed||0)} ok</span>`);
    if (statusParts.length) statusLine = ' (' + statusParts.join(' · ') + ')';

    // Show focused package with "Add to selection" if it's not already checked
    let focusHtml = '';
    if (_depSelectedPkg) {
        const focusName = _depSelectedPkg.label ? _depSelectedPkg.label.split(' ')[0] : '';
        const focusSt = _depPkgState(_depSelectedPkg);
        const focusAlreadyChecked = _depCheckedPkgs.has(_depSelectedPkg.id);
        if (focusAlreadyChecked) {
            focusHtml = `<div style="display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-xs) 0;font-size:0.75rem;color:var(--text-muted)">
                <span style="color:${focusSt.color}">${focusSt.icon}</span>
                <span>Viewing: <strong style="color:var(--text-secondary)">${esc(focusName)}</strong> — included in selection</span>
            </div>`;
        } else {
            focusHtml = `<div style="display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) 0;border-top:1px solid var(--border-subtle);margin-top:var(--space-xs);font-size:0.78rem;flex-wrap:wrap">
                <span style="color:${focusSt.color};font-size:0.85rem">${focusSt.icon}</span>
                <span style="color:var(--text-secondary)">Viewing: <strong style="color:var(--text-primary)">${esc(focusName)}</strong></span>
                <button class="btn btn-sm" onclick="_depAddToSelection('${esc(_depSelectedPkg.id)}')" style="background:var(--success);color:#000;border:none">+ Add to selection</button>
                <span style="font-size:0.68rem;color:var(--text-muted)">${esc(focusSt.detail)}</span>
            </div>`;
        }
    }

    panel.innerHTML = `
        <div class="dep-scope-info">
            <div class="dep-scope-title">☑ ${names.length} packages checked${statusLine}</div>
            <div class="dep-scope-meta">
                <span style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.1rem 0.4rem;border-radius:4px;background:rgba(129,140,248,0.1);border:1px solid rgba(129,140,248,0.2);font-size:0.66rem;color:#818cf8;font-weight:500;margin-right:0.4rem">⬤ ${esc(target)}</span>
                ${esc(names.slice(0, 6).join(', '))}${names.length > 6 ? ', +' + (names.length - 6) + ' more' : ''}
            </div>
        </div>
        ${focusHtml}
        <div class="dep-actions" id="dep-action-buttons">
            ${statuses.missing ? `<button class="btn btn-sm" onclick="_depDoActionOnChecked('install')">Install ${statuses.missing} missing</button>` : `<button class="btn btn-sm btn-ghost" disabled style="opacity:0.35;cursor:default" title="None missing">Install</button>`}
            ${statuses.outdated || statuses.deprecated ? `<button class="btn btn-sm" onclick="_depDoActionOnChecked('update')">Update ${(statuses.outdated||0) + (statuses.deprecated||0)} outdated</button>` : `<button class="btn btn-sm btn-ghost" disabled style="opacity:0.35;cursor:default" title="All up to date">Update</button>`}
            <button class="btn btn-sm btn-ghost" onclick="_depDoActionOnChecked('reinstall')">Reinstall ${names.length}</button>
            <button class="btn btn-sm btn-ghost" onclick="_depDoActionOnChecked('clean')" style="color:var(--error)">Uninstall ${names.length}</button>
            <button class="btn btn-sm btn-ghost" onclick="_depCheckedPkgs.clear();_depStatusFilter='';_depRenderTree(_depTree);_depRenderOpPanel(_depSelectedScope)" style="font-size:0.66rem">✕ Clear</button>
            <button class="btn btn-sm" id="dep-cancel-btn" onclick="depAbortOperation()" style="background:var(--error);color:white;border:none;display:none">⛔ Abort</button>
        </div>
        <div class="dep-cmd-preview" id="dep-cmd-preview"><span style="color:var(--text-muted)">Actions will apply to ${names.length} checked packages in ${esc(target)}</span></div>
        <div class="dep-terminal" id="dep-terminal">${_depLastTerminal || ''}</div>
        <div class="dep-progress">
            <span class="dep-progress-left" id="dep-op-progress"></span>
            <span class="dep-progress-right" id="dep-op-status"></span>
        </div>
        <details style="margin-top:var(--space-xs)">
            <summary style="font-size:0.64rem;color:var(--text-muted);cursor:pointer;user-select:none">Recent operations</summary>
            <div id="dep-history" style="max-height:100px;overflow-y:auto;margin-top:var(--space-xs)"></div>
        </details>`;
    _depLoadHistory();
}

function _depDoActionOnChecked(action) {
    const names = [];
    for (const eco of (_depTree?.children || [])) {
        for (const pkg of (eco.children || [])) {
            if (_depCheckedPkgs.has(pkg.id)) {
                const name = pkg.label ? pkg.label.split(' ')[0] : '';
                if (name) names.push(name);
            }
        }
    }
    if (!names.length) return;

    const scope = _depSelectedScope || (_depTree?.children?.[0]?.id) || 'pip:.';
    const target = _depActiveTarget || 'system';
    const targetInfo = (_depVenvInfo?.targets || []).find(t => t.path === target);

    const opts = {
        packages: names,
        target_venv: target,
        break_system: !!(targetInfo && targetInfo.is_system && (targetInfo.pep668 || targetInfo.risky)),
    };

    if (action === 'clean') {
        action = 'clean';
    } else if (action === 'reinstall') {
        opts.force_reinstall = true;
        action = 'update';
    }

    if (typeof depRunOperation === 'function') {
        depRunOperation(scope, action, opts);
    }
}

// ── Health stats helpers for tree panel ───────────────────────

function _depEcoStats(pkgs) {
    const s = { current: 0, outdated: 0, deprecated: 0, missing: 0, installed: 0, unknown: 0 };
    for (const p of pkgs) {
        const st = _depPkgState(p);
        if (st.status === 'current') s.current++;
        else if (st.status === 'outdated') s.outdated++;
        else if (st.status === 'deprecated' || st.status === 'eol' || st.status === 'yanked') s.deprecated++;
        else if (st.status === 'missing') s.missing++;
        else if (st.status === 'installed') s.installed++;
        else s.unknown++;
    }
    s.total = pkgs.length;
    return s;
}

function _depTreeStats(children) {
    const s = { current: 0, outdated: 0, deprecated: 0, missing: 0, installed: 0, unknown: 0, total: 0 };
    for (const eco of children) {
        const es = _depEcoStats(eco.children || []);
        s.current += es.current;
        s.outdated += es.outdated;
        s.deprecated += es.deprecated;
        s.missing += es.missing;
        s.installed += es.installed;
        s.unknown += es.unknown;
        s.total += es.total;
    }
    return s;
}

function _depHealthBadges(s) {
    // Compact health badges for tree nodes
    let h = '';
    if (s.missing) h += `<span style="color:var(--error);font-size:0.58rem;flex-shrink:0" title="${s.missing} missing">${s.missing}❌</span>`;
    if (s.deprecated) h += `<span style="color:var(--error);font-size:0.58rem;flex-shrink:0" title="${s.deprecated} deprecated">${s.deprecated}⛔</span>`;
    if (s.outdated) h += `<span style="color:var(--warning);font-size:0.58rem;flex-shrink:0" title="${s.outdated} outdated">${s.outdated}⚠</span>`;
    if (!h && s.current === s.total && s.total > 0) h = `<span style="color:var(--success);font-size:0.58rem;flex-shrink:0">✓</span>`;
    if (!h && s.installed > 0) h = `<span style="color:var(--success);font-size:0.58rem;flex-shrink:0">${s.installed}●</span>`;
    return h;
}

// ── Tree interactions ────────────────────────────────────────

function _depToggleExpand(id, e) {
    e.stopPropagation();
    if (_depExpanded.has(id)) _depExpanded.delete(id); else _depExpanded.add(id);
    _depRenderTree(_depTree);
}

function _depToggleEcoCheck(ecoId, e) {
    e.stopPropagation();
    // Toggle all child packages of this ecosystem
    const eco = (_depTree?.children || []).find(c => c.id === ecoId);
    if (!eco) return;
    const childIds = (eco.children || []).map(p => p.id);
    const allChecked = childIds.every(id => _depCheckedPkgs.has(id));
    if (allChecked) {
        childIds.forEach(id => _depCheckedPkgs.delete(id));
    } else {
        childIds.forEach(id => _depCheckedPkgs.add(id));
    }
    _depRenderTree(_depTree);
    _depUpdateOpForSelection();
}

function _depToggleGlobalCheck(e) {
    e.stopPropagation();
    // Toggle ALL packages across all ecosystems
    const allIds = [];
    for (const eco of (_depTree?.children || [])) {
        for (const pkg of (eco.children || [])) {
            allIds.push(pkg.id);
        }
    }
    const allChecked = allIds.length > 0 && allIds.every(id => _depCheckedPkgs.has(id));
    if (allChecked) {
        _depCheckedPkgs.clear();
    } else {
        allIds.forEach(id => _depCheckedPkgs.add(id));
    }
    _depRenderTree(_depTree);
    _depUpdateOpForSelection();
}

function _depFocusPackage(pkg) {
    // Double-click: temporarily show single-package op panel
    // even if in batch mode. Does NOT clear checked state.
    _depSelectedPkg = pkg;
    _depSelectedScope = pkg.ecosystem + ':' + (pkg.path || '.');
    _depRenderTree(_depTree);
    _depRenderOpPanel(_depSelectedScope);  // Force single-package view
    _depRenderIntel(pkg);
}

function _depAddToSelection(pkgId) {
    _depCheckedPkgs.add(pkgId);
    _depRenderTree(_depTree);
    _depUpdateOpForSelection();
}

function _depUpdateOpForSelection() {
    // Priority: checked packages > focused scope > empty state
    if (_depCheckedPkgs.size > 0) {
        _depRenderOpPanelForCheckedPkgs();
    } else if (_depSelectedScope) {
        _depRenderOpPanel(_depSelectedScope);
    }
    // Note: _depRenderOpPanel reads _depSelectedPkg internally
    // to show single-package vs ecosystem buttons
}

function _depSelectScope(id) {
    // FOCUS only — does not change checked state
    _depSelectedScope = id;
    _depSelectedPkg = null;
    _depRenderTree(_depTree);
    _depUpdateOpForSelection();  // Op panel: checked > 0 → batch, else focused scope
    _depRenderEcoOverview(id);   // Detail panel: ecosystem overview
}

function _depSelectPackage(pkg) {
    // FOCUS only — does not change checked state
    _depSelectedPkg = pkg;
    _depSelectedScope = pkg.ecosystem + ':' + (pkg.path || '.');
    _depRenderTree(_depTree);
    _depUpdateOpForSelection();  // Op panel: checked > 0 → batch, else focused package
    _depRenderIntel(pkg);        // Detail panel: package version intel
}

// ═══════════════════════════════════════════════════════════════
//  C2: Operation panel
// ═══════════════════════════════════════════════════════════════

function _depRenderOpPanel(scopeId) {
    const panel = document.getElementById('dep-op-panel');
    if (!panel) return;

    if (!scopeId) {
        panel.innerHTML = `<div style="color:var(--text-muted);font-size:0.82rem;line-height:1.8">Select an ecosystem or package in the tree to begin.<br><span style="font-size:0.72rem">Or check ecosystems and use Global scope for batch operations.</span></div>`;
        return;
    }

    const isBatch = scopeId === 'global';
    const eco = (_depTree?.children || []).find(e => e.id === scopeId);
    const label = isBatch
        ? `Global (${(_depTree?.children || []).length} ecosystems)`
        : (eco ? eco.label : scopeId);

    // Count packages by group
    let pkgCount = 0;
    let groups = {};
    const countEcos = isBatch ? (_depTree?.children || []) : (eco ? [eco] : []);
    for (const e of countEcos) {
        for (const p of (e.children || [])) {
            pkgCount++;
            const g = p.group || 'main';
            groups[g] = (groups[g] || 0) + 1;
        }
    }
    const groupStr = Object.entries(groups).map(([g, n]) => `${n} ${g}`).join(' · ');

    // Target info
    const target = _depActiveTarget || 'system';
    const targetInfo = (_depVenvInfo?.targets || []).find(t => t.path === target);
    const targetLabel = targetInfo ? `${target} (Python ${targetInfo.python}${targetInfo.free_threaded ? ' FT' : ''})` : target;

    // Focused package info
    const focusPkg = _depSelectedPkg;
    const focusPkgName = focusPkg ? (focusPkg.label ? focusPkg.label.split(' ')[0] : '') : '';
    const focusSt = focusPkg ? _depPkgState(focusPkg) : null;

    // Scope title — shows what's focused
    let scopeTitle = '';
    let scopeDetail = '';
    if (focusPkg) {
        scopeTitle = `Package: ${focusPkgName}`;
        scopeDetail = focusSt ? `<span style="color:${focusSt.color}">${focusSt.icon} ${focusSt.status.toUpperCase()}</span>` : '';
        if (focusSt?.installed) scopeDetail += ` · installed: ${esc(focusSt.installed)}`;
        if (focusSt?.latest) scopeDetail += ` · latest: ${esc(focusSt.latest)}`;
    } else {
        scopeTitle = label;
        const tc = _depTransitiveCounts();
        const transInfo = tc ? ` · ${tc.installed} total installed (${tc.transitive} transitive)` : '';
        scopeDetail = `${pkgCount} declared${groupStr ? ' (' + groupStr + ')' : ''}${transInfo}`;
    }

    panel.innerHTML = `
        <div class="dep-scope-info">
            <div class="dep-scope-title">${esc(scopeTitle)} ${scopeDetail ? '<span style="font-weight:400;font-size:0.72rem;margin-left:0.5rem">' + scopeDetail + '</span>' : ''}</div>
            <div class="dep-scope-meta">
                <span style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.1rem 0.4rem;border-radius:4px;background:rgba(129,140,248,0.1);border:1px solid rgba(129,140,248,0.2);font-size:0.66rem;color:#818cf8;font-weight:500;margin-right:0.4rem">⬤ ${esc(targetLabel)}</span>
                ${eco ? esc(eco.path || '.') + (eco.path === '.' ? ' (root)' : '') + ' · ' + esc(eco?.ecosystem || '') : ''}
            </div>
        </div>
        <div class="dep-actions" id="dep-action-buttons">
            ${focusPkg ? _depPkgButtons(focusSt, focusPkgName, focusPkg.id) : _depEcoButtons(countEcos)}
            <button class="btn btn-sm" id="dep-cancel-btn" onclick="depAbortOperation()" style="background:var(--error);color:white;border:none;display:none">⛔ Abort</button>
            <div class="dep-actions-right">
                <select class="dep-strategy" id="dep-strategy" title="Update strategy">
                    <option value="compatible">compatible</option>
                    <option value="latest">latest</option>
                    <option value="exact">exact</option>
                </select>
                <label class="dep-dev-check"><input type="checkbox" id="dep-opt-dev"> dev</label>
            </div>
        </div>
        <div class="dep-cmd-preview" id="dep-cmd-preview">${_depCmdPreview(scopeId)}</div>
        <div class="dep-terminal" id="dep-terminal"></div>
        <div class="dep-progress">
            <span class="dep-progress-left" id="dep-op-progress"></span>
            <span class="dep-progress-right" id="dep-op-status"></span>
        </div>
        <details style="margin-top:var(--space-xs)">
            <summary style="font-size:0.64rem;color:var(--text-muted);cursor:pointer;user-select:none">Recent operations</summary>
            <div id="dep-history" style="max-height:100px;overflow-y:auto;margin-top:var(--space-xs)"></div>
        </details>`;

    // Load history
    _depLoadHistory();
}

function _depPkgButtons(st, name, pkgId) {
    if (!st) return '';
    const s = st.status;

    function btn(label, action, isPrimary, isDisabled, tip, extraStyle) {
        if (isDisabled) {
            return `<button class="btn btn-sm btn-ghost" disabled style="opacity:0.35;cursor:default" title="${esc(tip || '')}">${label}</button>`;
        }
        const cls = isPrimary ? 'btn btn-sm' : 'btn btn-sm btn-ghost';
        const style = extraStyle ? ` style="${extraStyle}"` : '';
        return `<button class="${cls}" onclick="_depDoAction('${action}')" title="${esc(tip || '')}"${style}>${label}</button>`;
    }

    const isMissing = s === 'missing';
    const isOutdated = s === 'outdated' || s === 'mismatch' || s === 'deprecated' || s === 'eol';
    const isCurrent = s === 'current' || s === 'installed';
    const hasInstall = !isMissing;  // Already installed

    let h = '';
    h += btn(`Install ${esc(name)}`, 'install', isMissing, hasInstall && isCurrent, hasInstall ? 'Already installed' : '');
    h += btn(`Update${isOutdated && st.latest ? ' → ' + esc(st.latest) : ''}`, 'update', isOutdated, isMissing || isCurrent, isMissing ? 'Not installed' : isCurrent ? (s === 'current' ? 'Already latest' : 'No update available') : '');
    h += btn('Reinstall', 'reinstall', false, isMissing, isMissing ? 'Not installed' : '');
    h += btn('Uninstall', 'clean', false, isMissing, isMissing ? 'Not installed' : '', isMissing ? '' : 'color:var(--error)');
    h += `<button class="btn btn-sm" onclick="_depAddToSelection('${esc(pkgId)}')" style="background:var(--success);color:#000;border:none">+ Add to selection</button>`;
    return h;
}

function _depEcoButtons(ecos) {
    // Compute aggregate health across the ecosystems in scope
    let missing = 0, outdated = 0, deprecated = 0, current = 0, installed = 0, total = 0;
    for (const e of ecos) {
        for (const p of (e.children || [])) {
            total++;
            const st = _depPkgState(p);
            if (st.status === 'missing') missing++;
            else if (st.status === 'outdated' || st.status === 'mismatch') outdated++;
            else if (st.status === 'deprecated' || st.status === 'eol') deprecated++;
            else if (st.status === 'current') current++;
            else if (st.status === 'installed') installed++;
        }
    }

    const allGood = (current + installed) === total && total > 0;
    const needsInstall = missing > 0;
    const needsUpdate = outdated > 0 || deprecated > 0;

    let h = '';
    h += needsInstall
        ? `<button class="btn btn-sm" onclick="_depDoAction('install')">Install (${missing} missing)</button>`
        : `<button class="btn btn-sm btn-ghost" onclick="_depDoAction('install')">Install</button>`;
    h += needsUpdate
        ? `<button class="btn btn-sm" onclick="_depDoAction('update')">Update (${outdated + deprecated} outdated)</button>`
        : allGood
            ? `<button class="btn btn-sm btn-ghost" disabled style="opacity:0.35;cursor:default" title="All packages up to date">Update All</button>`
            : `<button class="btn btn-sm btn-ghost" onclick="_depDoAction('update')">Update All</button>`;
    h += `<button class="btn btn-sm btn-ghost" onclick="_depDoAction('reinstall')">Reinstall</button>`;
    h += `<button class="btn btn-sm btn-ghost" onclick="_depDoAction('clean')" style="color:var(--error)">Clean</button>`;
    h += `<button class="btn btn-sm btn-ghost" onclick="_depDoAction('rollback')">Rollback</button>`;
    return h;
}

function _depCmdPreview(scopeId) {
    const target = _depActiveTarget || 'system';
    const targetInfo = (_depVenvInfo?.targets || []).find(t => t.path === target);
    const pyLabel = targetInfo ? targetInfo.python_bin || target : target;

    if (_depSelectedPkg) {
        const name = _depSelectedPkg.label ? _depSelectedPkg.label.split(' ')[0] : '?';
        return `<span style="color:var(--text-muted)">Target:</span> ${esc(target)} <span style="color:var(--text-muted)">·</span> <span style="color:var(--text-muted)">Package:</span> ${esc(name)}`;
    }
    const eco = (_depTree?.children || []).find(e => e.id === scopeId);
    if (eco) {
        const n = (eco.children || []).length;
        return `<span style="color:var(--text-muted)">Target:</span> ${esc(target)} <span style="color:var(--text-muted)">·</span> <span style="color:var(--text-muted)">Scope:</span> ${n} packages in ${esc(eco.ecosystem || '')}`;
    }
    if (scopeId === 'global') {
        const n = (_depTree?.children || []).length;
        return `<span style="color:var(--text-muted)">Target:</span> ${esc(target)} <span style="color:var(--text-muted)">·</span> <span style="color:var(--text-muted)">Scope:</span> all ${n} ecosystems`;
    }
    return '';
}

async function _depDoAction(action) {
    const scope = _depSelectedScope || 'global';
    const target = _depActiveTarget || 'system';
    const targetInfo = (_depVenvInfo?.targets || []).find(t => t.path === target);

    const opts = {
        dev: document.getElementById('dep-opt-dev')?.checked || false,
        frozen: true,
        target_venv: target,
        break_system: !!(targetInfo && targetInfo.is_system && (targetInfo.pep668 || targetInfo.risky)),
    };

    // If packages are checked, use those. Otherwise if single package selected, use that.
    if (_depCheckedPkgs.size > 0) {
        _depDoActionOnChecked(action);
        return;
    } else if (_depSelectedPkg) {
        const pkgName = _depSelectedPkg.label ? _depSelectedPkg.label.split(' ')[0] : '';
        if (pkgName) {
            opts.packages = [pkgName];
        }
    }

    if (action === 'rollback') {
        _depToggleSnapshots();
        return;
    }

    if (action === 'clean') {
        opts.uninstall = true;
        action = 'clean';
    }

    if (action === 'reinstall') {
        opts.force_reinstall = true;
        action = 'update';
    }

    // Impact check for updates on shared packages (E10)
    if (action === 'update' && _depSelectedPkg && typeof _depShowImpact === 'function') {
        const eco = _depSelectedPkg.ecosystem || '';
        const pkgName = _depSelectedPkg.label ? _depSelectedPkg.label.split(' ')[0] : '';
        const latest = _depSelectedPkg.latestVersion || '';
        if (eco && pkgName) {
            const proceed = await _depShowImpact(eco, pkgName, latest);
            if (!proceed) return;
        }
    }

    // Batch: if Global scope, collect all checked or all ecosystem scopes
    if (scope === 'global') {
        const ecos = _depTree?.children || [];
        const scopes = ecos.map(e => e.id);
        opts.scopes = scopes;
    }

    if (typeof depRunOperation === 'function') {
        depRunOperation(scope, action, opts);
    }
}

// ═══════════════════════════════════════════════════════════════
//  Ecosystem overview (shown in detail panel when eco selected)
// ═══════════════════════════════════════════════════════════════

function _depRenderEcoOverview(scopeId) {
    const panel = document.getElementById('dep-detail-panel');
    if (!panel) return;

    if (scopeId === 'global') {
        // Global overview — show all ecosystems health
        const children = _depTree?.children || [];
        let h = `<div class="dep-intel"><div class="dep-intel-header"><span class="dep-intel-name">Project Dependencies</span></div>`;
        h += `<div class="dep-intel-grid">`;
        h += `<span class="dep-intel-label">Ecosystems:</span><span class="dep-intel-value">${children.length}</span>`;
        const total = children.reduce((s, e) => s + (e.children || []).length, 0);
        h += `<span class="dep-intel-label">Declared:</span><span class="dep-intel-value">${total} packages</span>`;
        const gtc = _depTransitiveCounts();
        if (gtc) {
            h += `<span class="dep-intel-label">Installed:</span><span class="dep-intel-value">${gtc.installed} total (${gtc.transitive} transitive)</span>`;
        }
        const stats = _depCountStatuses(children);
        if (stats.current) h += `<span class="dep-intel-label">Current:</span><span class="dep-intel-value" style="color:var(--success)">${stats.current}</span>`;
        if (stats.outdated) h += `<span class="dep-intel-label">Outdated:</span><span class="dep-intel-value" style="color:var(--warning)">${stats.outdated}</span>`;
        if (stats.deprecated) h += `<span class="dep-intel-label">Deprecated:</span><span class="dep-intel-value" style="color:var(--error)">${stats.deprecated}</span>`;
        if (stats.unknown) h += `<span class="dep-intel-label">Unknown:</span><span class="dep-intel-value">${stats.unknown}</span>`;
        h += `</div></div>`;
        panel.innerHTML = h;
        return;
    }

    const eco = (_depTree?.children || []).find(e => e.id === scopeId);
    if (!eco) { panel.innerHTML = ''; return; }

    const pkgs = eco.children || [];
    const groups = {};
    let current = 0, outdated = 0, deprecated = 0, unknown = 0;
    for (const p of pkgs) {
        const g = p.group || 'main';
        groups[g] = (groups[g] || 0) + 1;
        const s = p.status || 'unknown';
        if (s === 'current') current++;
        else if (s === 'outdated') outdated++;
        else if (s === 'deprecated' || s === 'eol' || s === 'yanked') deprecated++;
        else unknown++;
    }

    let h = `<div class="dep-intel">`;

    // Header + stats
    h += `<div class="dep-intel-header"><span class="dep-intel-name">${esc(eco.label)}</span></div>`;
    h += `<div class="dep-intel-grid" style="margin-bottom:var(--space-sm)">`;
    h += `<span class="dep-intel-label">Path:</span><span class="dep-intel-value">${esc(eco.path || '.')}${eco.path === '.' ? ' (project root)' : ''}</span>`;
    const tc = _depTransitiveCounts();
    h += `<span class="dep-intel-label">Declared:</span><span class="dep-intel-value">${pkgs.length} packages (${Object.entries(groups).map(([g,n]) => n + ' ' + g).join(' · ')})</span>`;
    if (tc) {
        h += `<span class="dep-intel-label">Installed:</span><span class="dep-intel-value">${tc.installed} total (${tc.transitive} transitive sub-dependencies)</span>`;
    }
    // Count using real state
    let missing = 0, installed = 0;
    for (const p of pkgs) {
        const st = _depPkgState(p);
        if (st.status === 'missing') missing++;
        else if (st.status === 'installed') installed++;
    }

    h += `<span class="dep-intel-label">Health:</span><span class="dep-intel-value">`;
    if (missing) h += `<span style="color:var(--error)">${missing} ❌ missing</span> `;
    if (current) h += `<span style="color:var(--success)">${current} ✓</span> `;
    if (installed) h += `<span style="color:var(--text-secondary)">${installed} ●</span> `;
    if (outdated) h += `<span style="color:var(--warning)">${outdated} ⚠</span> `;
    if (deprecated) h += `<span style="color:var(--error)">${deprecated} ⛔</span> `;
    if (unknown) h += `<span style="color:var(--text-muted)">${unknown} ◌</span>`;
    h += `</span>`;
    h += `</div>`;

    // Full package list with real state from all data sources
    if (pkgs.length) {
        h += `<div style="margin-top:var(--space-sm);padding-top:var(--space-sm);border-top:1px solid var(--border-subtle)">`;
        for (const pkg of pkgs) {
            const st = _depPkgState(pkg);
            const group = pkg.group || 'main';

            // Version columns: installed → latest
            let verHtml = '';
            if (st.installed) {
                verHtml += `<span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--text-secondary);min-width:5rem">${esc(st.installed)}</span>`;
                if (st.latest && st.latest !== st.installed) {
                    verHtml += `<span style="font-size:0.56rem;color:var(--text-muted)">→</span>`;
                    verHtml += `<span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--text-muted)">${esc(st.latest)}</span>`;
                }
            } else if (st.status === 'missing') {
                verHtml += `<span style="font-size:0.62rem;color:var(--error)">not installed</span>`;
            } else if (st.latest) {
                verHtml += `<span style="font-size:0.62rem;color:var(--text-muted)">latest: ${esc(st.latest)}</span>`;
            }

            h += `<div style="display:flex;align-items:center;gap:0.4rem;font-size:0.7rem;padding:0.15rem 0.3rem;overflow:hidden;white-space:nowrap;cursor:pointer;border-radius:3px;transition:all 0.1s;${_depRowStyle(st)}" onmouseenter="this.style.opacity='0.85'" onmouseleave="this.style.opacity=''" onclick='_depSelectPackage(${JSON.stringify(pkg).replace(/'/g,"&#39;")})' title="${esc(st.detail)}">`;
            h += `<span style="color:${st.color};min-width:0.9rem;text-align:center;flex-shrink:0">${st.icon}</span>`;
            h += `<span style="color:var(--text-secondary);min-width:10rem;overflow:hidden;text-overflow:ellipsis">${esc(st.name)}</span>`;
            h += `<span style="font-family:var(--font-mono);font-size:0.6rem;color:var(--text-muted);min-width:4.5rem">${esc(st.declared)}</span>`;
            h += verHtml;
            h += `<span class="dep-node-group" data-group="${esc(group)}" style="margin-left:auto">${esc(group)}</span>`;
            h += `</div>`;
        }
        h += `</div>`;
    }

    h += `</div>`;
    panel.innerHTML = h;
}

function _depCountStatuses(ecos) {
    let current = 0, outdated = 0, deprecated = 0, unknown = 0;
    for (const eco of ecos) {
        for (const p of (eco.children || [])) {
            const s = p.status || 'unknown';
            if (s === 'current') current++;
            else if (s === 'outdated') outdated++;
            else if (s === 'deprecated' || s === 'eol' || s === 'yanked') deprecated++;
            else unknown++;
        }
    }
    return { current, outdated, deprecated, unknown };
}

// ═══════════════════════════════════════════════════════════════
//  C3: Version intelligence panel
// ═══════════════════════════════════════════════════════════════

function _depRenderIntel(pkg) {
    const panel = document.getElementById('dep-detail-panel');
    if (!panel || !pkg) return;

    const st = _depPkgState(pkg);
    const targetLabel = _depActiveTarget || 'active';

    let h = `<div class="dep-intel" data-status="${esc(st.status)}">`;

    // ── Header with status ────────────────────────────────
    h += `<div class="dep-intel-header">`;
    h += `<span class="dep-intel-name">${esc(st.name)}</span>`;
    h += `<span style="font-size:0.9rem">${_depStatusHtml(st)}</span>`;
    h += `<span style="font-size:0.72rem;color:${st.color};font-weight:500">${esc(st.status.toUpperCase())}</span>`;
    h += `</div>`;

    // ── 3-column layout: Info | Dependencies | Required by ──
    h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-md);margin-top:var(--space-sm)">`;

    // ── Column 1: Package info ────────────────────────────
    h += `<div>`;
    h += `<div style="font-size:0.66rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--space-xs)">Info</div>`;
    h += `<div class="dep-intel-grid" style="font-size:0.7rem">`;
    h += `<span class="dep-intel-label">Declared:</span><span class="dep-intel-value"><code>${esc(st.declared || '(any)')}</code></span>`;
    if (st.installed) {
        h += `<span class="dep-intel-label">Installed:</span><span class="dep-intel-value"><code>${esc(st.installed)}</code></span>`;
    } else if (st.status === 'missing') {
        h += `<span class="dep-intel-label">Installed:</span><span class="dep-intel-value" style="color:var(--error)">❌ missing</span>`;
    }
    if (st.latest) {
        h += `<span class="dep-intel-label">Latest:</span><span class="dep-intel-value"><code>${esc(st.latest)}</code></span>`;
    }
    h += `<span class="dep-intel-label">Status:</span><span class="dep-intel-value" style="color:${st.color}">${esc(st.detail)}</span>`;
    if (st.status === 'outdated' || st.status === 'deprecated') {
        const breaking = st.latest && st.declared
            ? (_depIsMajorBump(st.declared, st.latest) ? 'Yes (major)' : 'No')
            : (st.latest && st.installed ? (_depIsMajorBump(st.installed, st.latest) ? 'Yes' : 'No') : '?');
        h += `<span class="dep-intel-label">Breaking:</span><span class="dep-intel-value">${esc(breaking)}</span>`;
    }

        if (pkg.ecosystem) params.set('eco', pkg.ecosystem);
        if (pkg.path) params.set('path', pkg.path);

        api('/dependencies/subdeps/' + encodeURIComponent(st.name) + qs).then(data => {

                        rh += `</div>`;
                    }

                    reqEl.innerHTML = '<span style="color:var(--text-muted)">None (leaf package)</span>';

                const reqBy = data.required_by || [];
                if (reqBy.length) {
                    rbEl.innerHTML = reqBy.map(name =>
                        `<div style="padding:0.1rem 0;color:var(--text-secondary)">← ${esc(name)}</div>`

                    rbEl.innerHTML = '<span style="color:var(--text-muted)">None (top-level)</span>';

            const reqEl = document.getElementById('dep-intel-requires');

function _depLoadSubDeps(detailsEl, pkgName) {
    if (!detailsEl.open) return;  // Closing, not opening
    const container = detailsEl.querySelector('.dep-subdeps-content');
    if (!container || container.dataset.loaded) return;
    container.dataset.loaded = '1';
    container.innerHTML = '<span style="font-size:0.66rem;color:var(--text-muted)">◌ Loading...</span>';

    // Build query params including ecosystem and module path
    const params = new URLSearchParams();
    if (_depActiveTarget) params.set('venv', _depActiveTarget);
    if (_depSelectedPkg?.ecosystem) params.set('eco', _depSelectedPkg.ecosystem);
    if (_depSelectedPkg?.path) params.set('path', _depSelectedPkg.path);
    const qs = params.toString() ? '?' + params.toString() : '';

    api('/dependencies/subdeps/' + encodeURIComponent(pkgName) + qs).then(data => {
        let h = '';

        // Requires (children)
        const reqs = data.requires_detail || [];
        if (reqs.length) {
            h += `<div style="font-size:0.68rem;color:var(--text-muted);margin-bottom:0.2rem;font-weight:500">Requires (${reqs.length})</div>`;
            for (const r of reqs) {
                const instColor = r.installed ? 'var(--success)' : 'var(--error)';
                const instIcon = r.installed ? '●' : '❌';
                h += `<div style="display:flex;align-items:center;gap:0.3rem;font-size:0.68rem;padding:0.1rem 0 0.1rem 0.5rem">`;
                h += `<span style="color:${instColor}">${instIcon}</span>`;
                h += `<span style="color:var(--text-secondary)">${esc(r.name)}</span>`;
                if (r.installed) h += `<span style="font-family:var(--font-mono);font-size:0.6rem;color:var(--text-muted)">${esc(r.installed)}</span>`;
                else h += `<span style="font-size:0.6rem;color:var(--error)">not installed</span>`;
                h += `</div>`;
            }
        } else {
            h += `<div style="font-size:0.66rem;color:var(--text-muted)">No sub-dependencies (leaf package)</div>`;
        }

        // Required by (parents)
        const reqBy = data.required_by || [];
        if (reqBy.length) {
            h += `<div style="font-size:0.68rem;color:var(--text-muted);margin-top:var(--space-sm);margin-bottom:0.2rem;font-weight:500">Required by (${reqBy.length})</div>`;
            for (const parent of reqBy) {
                h += `<div style="font-size:0.68rem;padding:0.1rem 0 0.1rem 0.5rem;color:var(--text-secondary)">← ${esc(parent)}</div>`;
            }
        }

        container.innerHTML = h || '<span style="font-size:0.66rem;color:var(--text-muted)">No dependency information available</span>';
    }).catch(e => {
        container.innerHTML = `<span style="font-size:0.66rem;color:var(--error)">Failed: ${esc(e.message)}</span>`;
    });
}
