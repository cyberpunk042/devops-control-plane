<script>
    // ─────────────────────────────────────────────────────────────────
    //  _tab_mesh_panel.html
    //
    //  Floating Tab Mesh management panel.
    //  Toggled by the 📡 Mesh button in the Stage Debugger drawer header.
    //  position:fixed overlay — accessible from anywhere.
    // ─────────────────────────────────────────────────────────────────

    var _meshPanelOpen = false;
    var _meshAutoRefreshInterval = null;
    var _meshWizardActive = false;  // true when setup wizard is showing

    function _toggleMeshPanel() {
        _meshPanelOpen = !_meshPanelOpen;

        // Close the Stage Debugger drawer when opening mesh panel
        if (_meshPanelOpen && _debugDrawerOpen) {
            _toggleDebugDrawer();
        }

        var backdrop = document.getElementById('mesh-panel-backdrop');
        var panel = document.getElementById('mesh-panel');
        if (!panel) {
            _injectMeshPanel();
            backdrop = document.getElementById('mesh-panel-backdrop');
            panel = document.getElementById('mesh-panel');
        }
        if (_meshPanelOpen) {
            backdrop.style.display = 'block';
            panel.style.display = 'flex';
            _renderMeshPanel();
            // Start auto-refresh (pauses when diagnostic has content)
            if (!_meshAutoRefreshInterval) {
                _meshAutoRefreshInterval = setInterval(function() {
                    if (!_meshPanelOpen) {
                        clearInterval(_meshAutoRefreshInterval);
                        _meshAutoRefreshInterval = null;
                        return;
                    }
                    // Don't clobber wizard or inspect dump output
                    if (_meshWizardActive) return;
                    var dumpEl = document.getElementById('mesh-panel-dump');
                    if (dumpEl && dumpEl.style.display !== 'none') {
                        return;
                    }
                    _renderMeshPanel();
                }, 3000);
            }
        } else {
            _closeMeshPanel();
        }
    }

    function _closeMeshPanel() {
        _meshPanelOpen = false;
        var backdrop = document.getElementById('mesh-panel-backdrop');
        var panel = document.getElementById('mesh-panel');
        if (backdrop) backdrop.style.display = 'none';
        if (panel) panel.style.display = 'none';
        if (_meshAutoRefreshInterval) {
            clearInterval(_meshAutoRefreshInterval);
            _meshAutoRefreshInterval = null;
        }
    }

    /**
     * Focus a tab via CDP from the mesh panel.
     * If CDP is not available, shows the setup wizard.
     */
    async function _meshPanelFocus(targetArg, opts) {
        if (!window.TabMesh || !window.TabMesh.cdpAvailable) {
            _meshShowSetup();
            return;
        }
        var result = await window.TabMesh.focusViaCDP(targetArg, opts || {});
        if (result && result.success) {
            console.log('[MeshPanel] Focus succeeded:', result.targetId);
        } else {
            console.log('[MeshPanel] Focus failed:', result);
        }
    }

    /**
     * Show the CDP setup wizard.
     * Fetches diagnostic data and guides the user through setup.
     */
    async function _meshShowSetup() {
        _meshWizardActive = true;
        var body = document.getElementById('mesh-panel-body');
        if (!body) return;

        body.innerHTML =
            '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:0.76rem">' +
                '<div style="font-size:1.5rem;margin-bottom:8px">🔍</div>' +
                'Checking your system…' +
            '</div>';

        try {
            var resp = await fetch('/api/tab-mesh/cdp-diagnose');
            var diag = await resp.json();
            _meshRenderSetupWizard(body, diag);
        } catch (err) {
            body.innerHTML =
                '<div style="text-align:center;padding:2rem;color:var(--danger);font-size:0.76rem">' +
                    '<div style="font-size:1.5rem;margin-bottom:8px">❌</div>' +
                    'Failed to diagnose: ' + err.message +
                '</div>';
        }
    }

    /**
     * Render the CDP setup wizard based on diagnostic data.
     * This is the guided wizard flow with per-location diagnostics.
     */
    function _meshRenderSetupWizard(container, diag) {
        var html = '';

        // Step 1: Detection results
        html += '<div style="font-size:0.78rem;font-weight:700;margin-bottom:10px;color:var(--text-primary)">' +
            '📡 Tab Focus Setup</div>';
        html += '<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:12px">' +
            'Tab focus lets you click a link in one tab and have the other tab jump to the front — no manual switching. ' +
            'It works through Chrome\'s debugging interface, which needs a small one-time setup.</div>';

        // Detection items
        var checks = [
            [diag.wsl, 'WSL interop is working', 'Not running under WSL'],
            [!!diag.windows_user, 'Windows user: ' + (diag.windows_user || '?'), 'Could not detect Windows user'],
            [diag.chrome_exe_found, 'Chrome found', 'Chrome not found at default location'],
            [diag.cdp_active, 'Remote debugging is active!', 'Remote debugging is not active'],
        ];
        for (var i = 0; i < checks.length; i++) {
            var icon = checks[i][0] ? '✅' : '❌';
            var text = checks[i][0] ? checks[i][1] : checks[i][2];
            html += '<div style="font-size:0.68rem;padding:2px 0;color:var(--text-primary)">' +
                icon + ' ' + text + '</div>';
        }

        if (diag.cdp_active) {
            // Already working — but still show shortcut/icon/backup diagnostics
            html += '<div style="margin-top:12px;padding:10px;border-radius:var(--radius-sm);' +
                'background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);' +
                'font-size:0.7rem;color:var(--success)">' +
                '🎉 Tab focus is already working! Checking shortcut configuration below.' +
                '</div>';
        }

        if (!diag.wsl || !diag.windows_user || !diag.chrome_exe_found) {
            // Can't proceed with auto-remediation
            html += '<div style="margin-top:12px;padding:10px;border-radius:var(--radius-sm);' +
                'background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);' +
                'font-size:0.7rem;color:var(--text-muted)">' +
                'Auto-setup requires WSL interop and Chrome. Please check the items above.' +
                '</div>';
            html += '<div style="margin-top:10px;text-align:right">' +
                '<button class="btn btn-sm btn-ghost" onclick="_renderMeshPanel()">← Back</button></div>';
            container.innerHTML = html;
            return;
        }

        // Profile selection (if multiple profiles)
        var profiles = diag.profiles || [];
        if (profiles.length > 1) {
            html += '<div style="font-size:0.74rem;font-weight:600;margin:14px 0 6px;color:var(--text-primary)">' +
                'Which Chrome profile do you use?</div>';
            html += '<div style="font-size:0.66rem;color:var(--text-muted);margin-bottom:8px">' +
                'Chrome stores your bookmarks, extensions, and history in a "profile." ' +
                'Pick the one you use for this admin panel.</div>';
            for (var pi = 0; pi < profiles.length; pi++) {
                var p = profiles[pi];
                var isDefault = p.dir === 'Default';
                html += '<label style="display:flex;align-items:center;gap:6px;padding:4px 8px;' +
                    'border-radius:var(--radius-sm);cursor:pointer;font-size:0.68rem;color:var(--text-primary)">' +
                    '<input type="radio" name="mesh-profile" value="' + esc(p.dir) + '"' +
                    (isDefault ? ' checked' : '') + '>' +
                    '<span><strong>' + esc(p.name) + '</strong>' +
                    (p.email ? ' <span style="color:var(--text-muted)">(' + esc(p.email) + ')</span>' : '') +
                    ' <span style="font-size:0.58rem;color:var(--text-muted)">← ' + esc(p.dir) + '</span></span>' +
                    '</label>';
            }
        }

        // ── Per-location shortcut diagnostics ──
        var shortcuts = diag.shortcuts || {};
        var shortcutLabels = {
            taskbar: '📌 Taskbar pin',
            desktop: '🖥 Desktop shortcut',
            start_menu_global: '📋 Start Menu',
            start_menu_user: '📋 Start Menu (user)',
        };
        var statusLabels = {
            ok: '✅ Fully configured',
            needs_backup: '⚠️ No backup shortcut',
            needs_icon_fix: '⚠️ Icon mismatch',
            needs_setup: '❌ Needs setup',
        };
        var statusColors = {
            ok: 'var(--success)',
            needs_backup: 'var(--warning)',
            needs_icon_fix: 'var(--warning)',
            needs_setup: 'var(--danger)',
        };

        html += '<div style="font-size:0.74rem;font-weight:600;margin:14px 0 6px;color:var(--text-primary)">' +
            'Shortcut diagnostics</div>';
        html += '<div style="font-size:0.66rem;color:var(--text-muted);margin-bottom:8px">' +
            'For each Chrome shortcut, I\'ll create a "Chrome Debug" version with debugging flags and a dev icon, ' +
            'plus keep a clean "Chrome - OLD" backup for normal browsing.</div>';

        var foundKeys = [];
        var actionableKeys = [];

        for (var key in shortcuts) {
            var sc = shortcuts[key];
            if (!sc.found) continue;
            foundKeys.push(key);

            var label = shortcutLabels[key] || key;
            var status = sc.status || 'needs_setup';
            var statusLabel = statusLabels[status] || status;
            var statusColor = statusColors[status] || 'var(--text-muted)';
            var isOk = status === 'ok';
            if (!isOk) actionableKeys.push(key);

            html += '<div style="margin-bottom:8px;padding:8px 10px;border-radius:var(--radius-sm);' +
                'background:var(--bg-secondary);border-left:3px solid ' + statusColor + '">';

            // Header: location + status + checkbox
            html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
            if (!isOk) {
                html += '<input type="checkbox" class="mesh-shortcut-cb" value="' + esc(key) + '" checked>';
            }
            html += '<span style="font-size:0.7rem;font-weight:600;color:var(--text-primary)">' + label + '</span>' +
                '<span style="font-size:0.58rem;padding:1px 6px;border-radius:3px;' +
                'background:rgba(0,0,0,0.15);color:' + statusColor + ';font-weight:600">' +
                statusLabel + '</span>' +
                '</div>';

            // Main shortcut details
            html += '<div style="font-size:0.62rem;color:var(--text-muted);line-height:1.7;padding-left:4px">';
            html += '<strong>Google Chrome.lnk</strong><br>';
            html += '&nbsp;&nbsp;Args: <code style="font-size:0.58rem">' +
                (sc.args ? esc(sc.args) : '<em>none</em>') + '</code><br>';
            html += '&nbsp;&nbsp;Icon: <code style="font-size:0.58rem">' +
                (sc.icon ? esc(sc.icon) : '<em>default</em>') + '</code>';
            if (sc.has_debug_icon) {
                html += ' <span style="color:var(--success)">✅ dev</span>';
            }
            html += '<br>';

            // Backup shortcut details
            var backup = sc.backup || {};
            if (backup.found) {
                html += '<strong>Chrome - OLD.lnk</strong><br>';
                html += '&nbsp;&nbsp;Args: <code style="font-size:0.58rem">' +
                    (backup.args ? esc(backup.args) : '<em>none</em>') + '</code>';
                if (backup.has_debug_args) {
                    html += ' <span style="color:var(--warning)">⚠️ has debug args</span>';
                } else {
                    html += ' <span style="color:var(--success)">✅ clean</span>';
                }
                html += '<br>';
                html += '&nbsp;&nbsp;Icon: <code style="font-size:0.58rem">' +
                    (backup.icon ? esc(backup.icon) : '<em>default</em>') + '</code><br>';
            } else {
                html += '<em style="font-size:0.6rem;color:var(--text-muted)">No backup (Chrome - OLD) found</em><br>';
            }
            html += '</div></div>';
        }

        if (foundKeys.length === 0) {
            html += '<div style="font-size:0.66rem;color:var(--warning);padding:4px 0">' +
                '⚠️ No Chrome shortcuts found. You may need to set up manually.</div>';
        }

        // If all are ok
        if (foundKeys.length > 0 && actionableKeys.length === 0) {
            html += '<div style="margin-top:12px;padding:10px;border-radius:var(--radius-sm);' +
                'background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);' +
                'font-size:0.7rem;color:var(--success)">' +
                '🎉 All shortcuts are fully configured — debug mode is ready with proper icons and backups.' +
                '</div>';
            html += '<div style="margin-top:10px;text-align:right">' +
                '<button class="btn btn-sm btn-primary" onclick="_renderMeshPanel()">Done</button></div>';
            window._meshSetupDiag = diag;
            container.innerHTML = html;
            return;
        }

        // Keep backup toggle
        html += '<label style="display:flex;align-items:center;gap:6px;margin:10px 0;' +
            'font-size:0.68rem;color:var(--text-primary);cursor:pointer">' +
            '<input type="checkbox" id="mesh-keep-backup" checked>' +
            'Keep a clean "Chrome - OLD" backup for normal browsing' +
            '</label>';

        // What we'll set
        html += '<div style="font-size:0.66rem;color:var(--text-muted);margin-top:8px;padding:6px 8px;' +
            'background:var(--bg-secondary);border-radius:var(--radius-sm);font-family:var(--font-mono)">' +
            'What I\'ll do for each selected:<br>' +
            '&nbsp;&nbsp;1. Create "Chrome - OLD.lnk" backup (clean, icon: chrome.exe,4)<br>' +
            '&nbsp;&nbsp;2. Set Google Chrome.lnk args:<br>' +
            '&nbsp;&nbsp;&nbsp;&nbsp;--remote-debugging-port=9222<br>';
        if (diag.requires_user_data_dir) {
            html += '&nbsp;&nbsp;&nbsp;&nbsp;--user-data-dir="' + esc(diag.chrome_data_dir || '') + '"<br>';
        }
        html += '&nbsp;&nbsp;3. Set Google Chrome.lnk icon: chrome.exe,8 (dev)' +
            '<div style="margin-top:4px;font-family:inherit;font-size:0.62rem;color:var(--text-muted)">' +
            'Chrome 136+ requires a <strong>separate</strong> profile directory for remote debugging ' +
            '(pointing to the default User Data path is silently ignored). ' +
            'A lightweight ChromeDebug profile will be created — ' +
            'your real bookmarks and extensions stay untouched.</div></div>';

        // Buttons
        html += '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">' +
            '<button class="btn btn-sm btn-ghost" onclick="_renderMeshPanel()">← Back</button>' +
            '<button class="btn btn-sm btn-primary" id="mesh-apply-btn" onclick="_meshApplyRemediation()">' +
            'Apply Selected →</button></div>';

        // Store diag data for apply
        window._meshSetupDiag = diag;
        container.innerHTML = html;
    }

    /**
     * Apply the shortcut remediation.
     */
    async function _meshApplyRemediation() {
        var body = document.getElementById('mesh-panel-body');
        var btn = document.getElementById('mesh-apply-btn');
        if (btn) { btn.disabled = true; btn.textContent = 'Applying…'; }

        // Collect selected shortcuts
        var checkboxes = document.querySelectorAll('.mesh-shortcut-cb:checked:not(:disabled)');
        var selectedKeys = [];
        for (var i = 0; i < checkboxes.length; i++) {
            selectedKeys.push(checkboxes[i].value);
        }

        // Get selected profile
        var profileRadio = document.querySelector('input[name="mesh-profile"]:checked');
        var profileDir = profileRadio ? profileRadio.value : 'Default';

        // Get backup preference
        var backupCb = document.getElementById('mesh-keep-backup');
        var keepBackup = backupCb ? backupCb.checked : true;

        try {
            var resp = await fetch('/api/tab-mesh/cdp-remediate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    shortcuts: selectedKeys,
                    profile_dir: profileDir,
                    port: 9222,
                    keep_backup: keepBackup,
                }),
            });
            var result = await resp.json();
            result._profileDir = profileDir;  // Pass through for restart
            _meshRenderPostApply(body, result);
        } catch (err) {
            if (body) {
                body.innerHTML =
                    '<div style="padding:1rem;color:var(--danger);font-size:0.74rem">' +
                    '❌ Remediation failed: ' + err.message + '</div>' +
                    '<div style="text-align:right;margin-top:10px">' +
                    '<button class="btn btn-sm btn-ghost" onclick="_meshShowSetup()">← Retry</button></div>';
            }
        }
    }

    /**
     * Render the post-apply step – one-click Chrome restart.
     */
    function _meshRenderPostApply(container, result) {
        var profileDir = result._profileDir || 'Default';

        var html = '<div style="font-size:0.78rem;font-weight:700;margin-bottom:10px;color:var(--text-primary)">' +
            '📡 Shortcuts updated!</div>';

        // Show results for each shortcut
        var results = result.results || {};
        for (var key in results) {
            var r = results[key];
            var shortcutOk = r.shortcut_ok;
            html += '<div style="font-size:0.68rem;padding:2px 0;color:var(--text-primary)">' +
                (shortcutOk ? '✅' : '❌') + ' ' + key + ' shortcut ' +
                (shortcutOk ? 'updated (debug args + dev icon)' : 'failed') + '</div>';
            if (r.backup_ok !== null && r.backup_ok !== undefined) {
                var backupLabel = r.backup_skipped ? 'backup already exists' : 'backup created';
                html += '<div style="font-size:0.62rem;padding:1px 0 1px 18px;color:var(--text-muted)">' +
                    (r.backup_ok ? '✅' : '❌') + ' ' + backupLabel + '</div>';
            }
        }

        // Explanation
        html += '<div style="margin-top:12px;padding:10px;border-radius:var(--radius-sm);' +
            'background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.15);' +
            'font-size:0.7rem;color:var(--text-primary)">' +
            '<div style="font-weight:600;margin-bottom:6px">One more step:</div>' +
            '<div style="font-size:0.66rem;color:var(--text-muted);line-height:1.6">' +
                'Chrome needs a full restart for the debug port to activate. ' +
                'Click below and I\'ll handle everything — kill Chrome, ' +
                'copy your profile (bookmarks, logins, extensions), ' +
                'and relaunch with debugging enabled. You\'ll land right back here.' +
            '</div></div>';

        // Status area (hidden until restart starts)
        html += '<div id="mesh-restart-status" style="display:none;margin-top:10px;' +
            'padding:8px;border-radius:var(--radius-sm);background:var(--bg-secondary);' +
            'font-size:0.66rem;color:var(--text-muted);line-height:1.8"></div>';

        // Buttons
        html += '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">' +
            '<button class="btn btn-sm btn-ghost" onclick="_renderMeshPanel()">← Back</button>' +
            '<button class="btn btn-sm btn-primary" id="mesh-restart-btn" ' +
                'onclick="_meshRestartChrome(\'' + profileDir + '\')">' +
                '🔄 Restart Chrome</button></div>';

        container.innerHTML = html;
    }

    /**
     * Orchestrated Chrome restart: schedule kill + copy profile + relaunch.
     * Backend returns immediately. A background PS1 script will:
     * wait 2s → kill Chrome → copy profile → relaunch with debug flags.
     */
    async function _meshRestartChrome(profileDir) {
        var btn = document.getElementById('mesh-restart-btn');
        var status = document.getElementById('mesh-restart-status');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Scheduling…'; }
        if (status) {
            status.style.display = 'block';
            status.innerHTML = '⏳ Setting up restart…';
        }

        try {
            var resp = await fetch('/api/tab-mesh/restart-chrome', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    profile_dir: profileDir,
                    return_url: window.location.origin,
                }),
            });
            var data = await resp.json();

            if (!data.success) {
                if (status) {
                    status.innerHTML = '❌ ' + (data.error || 'Failed to schedule restart');
                }
                if (btn) {
                    btn.textContent = '↻ Retry';
                    btn.disabled = false;
                }
                return;
            }

            // Success — countdown to Chrome close
            var userEmail = data.email || '';
            if (status) {
                var emailPart = userEmail
                    ? 'Chrome will reopen on the admin panel with debugging enabled. ' +
                      'To restore bookmarks &amp; extensions, sign into Chrome with ' +
                      '<strong>' + userEmail + '</strong> (menu \u2192 Sign in to Chrome).'
                    : 'Chrome will reopen with debugging enabled.';
                status.innerHTML =
                    '\u2705 Restart scheduled!<br>' +
                    '\ud83d\udd04 Chrome will close in <strong id="mesh-countdown">3</strong> seconds\u2026<br>' +
                    '<div style="margin-top:6px;font-size:0.62rem;color:var(--text-muted)">' +
                    emailPart + '</div>';
            }
            if (btn) {
                btn.textContent = '✅ Scheduled';
                btn.style.background = 'var(--success)';
                btn.style.color = 'white';
            }

            // Countdown animation
            var countEl = document.getElementById('mesh-countdown');
            var seconds = 3;
            var countdown = setInterval(function() {
                seconds--;
                if (countEl) countEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdown);
                    if (status) {
                        var signinHtml = '';
                        if (userEmail) {
                            signinHtml =
                                '<div style="margin-top:10px">' +
                                '<button class="btn btn-sm btn-primary" ' +
                                'onclick="_meshTriggerSignin(\'' + userEmail.replace(/'/g, "\\'") + '\')" ' +
                                'id="mesh-signin-btn">' +
                                '🔑 Sign in to Chrome (' + userEmail + ')' +
                                '</button>' +
                                '</div>';
                        }
                        status.innerHTML +=
                            '<br>🚀 <strong>Chrome is restarting now…</strong>' +
                            signinHtml;
                    }
                }
            }, 1000);

        } catch (err) {
            if (status) { status.innerHTML = '❌ Error: ' + err.message; }
            if (btn) {
                btn.textContent = '↻ Retry';
                btn.disabled = false;
            }
        }
    }

    /**
     * Trigger Chrome sign-in and pre-fill email via CDP.
     */
    async function _meshTriggerSignin(email) {
        var btn = document.getElementById('mesh-signin-btn');
        if (btn) {
            btn.disabled = true;
            btn.textContent = '⏳ Opening sign-in…';
        }

        try {
            var resp = await fetch('/api/tab-mesh/trigger-chrome-signin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email }),
            });
            var data = await resp.json();

            if (btn) {
                if (data.success && data.step === 'email_filled') {
                    btn.textContent = '✅ Email filled — enter your password';
                    btn.style.background = 'var(--success)';
                    btn.style.color = 'white';
                } else if (data.step === 'waiting_for_signin_page') {
                    btn.textContent = '🔄 Click "Sign in" in Chrome, then retry';
                    btn.disabled = false;
                } else {
                    btn.textContent = '❌ ' + (data.message || 'Failed');
                    btn.disabled = false;
                }
            }
        } catch (err) {
            if (btn) {
                btn.textContent = '❌ ' + err.message;
                btn.disabled = false;
            }
        }
    }

    /**
     * Verify that CDP is now working after Chrome restart.
     */
    async function _meshVerifyCDP() {
        var body = document.getElementById('mesh-panel-body');
        if (!body) return;

        body.innerHTML =
            '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:0.76rem">' +
                '<div style="font-size:1.5rem;margin-bottom:8px">🔍</div>' +
                'Checking Chrome debugging port…' +
            '</div>';

        try {
            // Re-check CDP and update TabMesh state
            await window.TabMesh.checkCDP();
            var resp = await fetch('/api/tab-mesh/cdp-status');
            var status = await resp.json();

            if (status.available) {
                body.innerHTML =
                    '<div style="padding:1.5rem;text-align:center">' +
                    '<div style="font-size:2rem;margin-bottom:8px">🎉</div>' +
                    '<div style="font-size:0.78rem;font-weight:700;color:var(--success);margin-bottom:8px">' +
                        'Chrome debugging is active!</div>' +
                    '<div style="font-size:0.68rem;color:var(--text-muted);margin-bottom:12px">' +
                        'Tab focus is now working. When you click a cross-tab link, ' +
                        'the target tab will come to the front automatically.</div>' +
                    '<button class="btn btn-sm btn-primary" onclick="_renderMeshPanel()">Done ✓</button>' +
                    '</div>';
            } else {
                body.innerHTML =

    function _renderMeshPanel() {
        _meshWizardActive = false;
        var body = document.getElementById('mesh-panel-body');
        var countEl = document.getElementById('mesh-panel-count');
        if (!body) return;

        if (!window.TabMesh) {
            body.innerHTML =
                '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:0.76rem">' +
                    '📡 Tab Mesh not initialized' +
                '</div>';
            if (countEl) countEl.textContent = '—';
            return;
        }

        var mesh = window.TabMesh;
        var html = '';

        // ── Identity ──
        var uptime = Math.round((Date.now() - mesh.identity.ts) / 1000);
        var uptimeStr = uptime < 60 ? uptime + 's' : Math.floor(uptime / 60) + 'm ' + (uptime % 60) + 's';

        html +=
            '<div style="padding:10px 14px;border-radius:var(--radius-sm);' +
                'background:rgba(99,102,241,0.04);border:1px solid rgba(99,102,241,0.1);margin-bottom:12px">' +
                '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
                    '<span style="font-size:0.78rem;font-weight:700;color:var(--text-primary)">This Tab</span>' +
                    '<span style="font-size:0.58rem;padding:1px 5px;border-radius:3px;' +
                        'background:rgba(52,211,153,0.15);color:#34d399;font-weight:600">' +
                        esc(mesh.identity.tabType.toUpperCase()) + '</span>' +
                    '<span style="font-size:0.58rem;padding:1px 5px;border-radius:3px;' +
                        'background:rgba(99,102,241,0.1);color:var(--accent);font-weight:500">' +
                        'SW: ' + esc(mesh.swState) + '</span>' +
                '</div>' +
                '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:0.68rem;color:var(--text-muted)">' +
                    '<span>🆔 <code style="font-size:0.62rem">' + esc(mesh.id.substring(0, 12)) + '…</code></span>' +
                    '<span>📍 ' + esc(mesh.identity.title) + '</span>' +
                    (mesh.identity.siteName ? '<span>📄 ' + esc(mesh.identity.siteName) + '</span>' : '') +
                    '<span>⏱ ' + uptimeStr + '</span>' +
                '</div>' +
            '</div>';

        // ── Capabilities (compact) ──
        var caps = mesh.capabilities;
        var capItems = [
            ['BC', caps.broadcastChannel],
            ['SW', caps.serviceWorker],
            ['UUID', caps.cryptoUUID],
            ['Vis', caps.visibilityAPI],
            ['CDP', mesh.cdpAvailable],
        ];
        html +=
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:0.64rem;color:var(--text-muted)">';
        for (var ci = 0; ci < capItems.length; ci++) {
            var cap = capItems[ci];
            html += '<span>' + (cap[1] ? '✅' : '❌') + ' ' + cap[0] + '</span>';
        }
        html += '</div>';

        // ── Registry ──
        var regSize = mesh.registry ? mesh.registry.size : 0;
        if (countEl) countEl.textContent = regSize;

        html +=
            '<div style="font-size:0.74rem;font-weight:600;margin-bottom:6px;color:var(--text-primary)">' +
                '🗺 Registry (' + regSize + ')' +
            '</div>';

        if (regSize === 0) {
            html += '<div style="color:var(--text-muted);font-size:0.7rem;padding:6px 0">No tabs discovered yet</div>';
        } else {
            mesh.registry.forEach(function(entry, id) {
                var isSelf = id === mesh.id;
                var age = Math.round((Date.now() - entry.lastSeen) / 1000);
                var ageStr = age < 5 ? 'now' : age + 's ago';
                var ageColor = age < 10 ? 'var(--success)' : age < 30 ? 'var(--warning)' : 'var(--danger)';

                var typeBadge = entry.tabType === 'admin'
                    ? '<span style="font-size:0.54rem;padding:1px 4px;border-radius:3px;background:rgba(99,102,241,0.12);color:var(--accent)">Admin</span>'
                    : '<span style="font-size:0.54rem;padding:1px 4px;border-radius:3px;background:rgba(52,211,153,0.12);color:#34d399">Site</span>';
                var siteBadge = entry.siteName
                    ? ' <span style="font-size:0.54rem;padding:1px 4px;border-radius:3px;background:rgba(245,158,11,0.1);color:#fbbf24">' + esc(entry.siteName) + '</span>'
                    : '';

                var actions;
                if (isSelf) {
                    actions = '<span style="font-size:0.58rem;color:var(--text-muted);font-style:italic">this tab</span>';
                } else {
                    var navTarget = entry.tabType === 'admin' ? 'admin' : 'site:' + (entry.siteName || '');
                    var navHash = entry.hash || '';
                    // Use chromeTargetId for exact focus, fallback to URL pattern
                    var focusArg, focusOpts;
                    if (entry.chromeTargetId) {
                        focusArg = entry.chromeTargetId;
                        focusOpts = '{ directTargetId: true }';
                    } else {
                        focusArg = navTarget === 'admin' ? '/' : '/pages/site/' + (entry.siteName || '');
                        focusOpts = '{}';
                    }
                    actions =
                        '<div style="display:flex;gap:2px;flex-wrap:wrap">' +
                            '<button class="btn btn-sm btn-ghost" style="font-size:0.5rem;padding:1px 4px" ' +
                                'onclick="_meshPanelFocus(\'' + esc(focusArg) + '\', ' + focusOpts + ')" ' +
                                'title="Focus tab (CDP)">' + (mesh.cdpAvailable ? '🎯' : '🔗') + '</button>' +
                            '<button class="btn btn-sm btn-ghost" style="font-size:0.5rem;padding:1px 4px" ' +
                                'onclick="TabMesh.inspect(\'' + esc(id) + '\');_meshShowDump()" ' +
                                'title="Inspect state">🔍</button>' +
                            '<button class="btn btn-sm btn-ghost" style="font-size:0.5rem;padding:1px 4px;color:var(--danger)" ' +
                                'onclick="if(confirm(\'Kill this tab session?\'))TabMesh.kill(\'' + esc(id) + '\');setTimeout(_renderMeshPanel,500)" ' +
                                'title="Kill session">💀</button>' +
                        '</div>';
                }

                html +=
                    '<div style="padding:6px 10px;margin-bottom:3px;border-radius:var(--radius-sm);' +
                        'background:var(--bg-secondary);border-left:3px solid ' + (isSelf ? 'var(--accent)' : ageColor) + ';' +
                        'display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
                        '<div style="flex:1;min-width:160px">' +
                            '<div style="display:flex;align-items:center;gap:4px;margin-bottom:1px">' +
                                typeBadge + siteBadge +
                                ' <span style="font-size:0.68rem;font-weight:600">' + esc(entry.title || '(untitled)') + '</span>' +
                            '</div>' +
                            '<div style="font-size:0.58rem;color:var(--text-muted);font-family:var(--font-mono)">' +
                                esc(id.substring(0, 8)) + '… · ' +
                                '<span style="color:' + ageColor + '">' + ageStr + '</span>' +
                            '</div>' +
                        '</div>' +
                        actions +
                    '</div>';
            });
        }

        // ── Tombstones ──
        var tombstones = mesh.tombstones || [];
        if (tombstones.length > 0) {
            html +=
                '<div style="font-size:0.66rem;font-weight:600;margin:10px 0 4px;color:var(--text-muted)">' +
                    '🪦 Tombstones (' + tombstones.length + ')' +
                '</div>';
            for (var ti = 0; ti < tombstones.length; ti++) {
                var t = tombstones[ti];
                var ago = Math.round((Date.now() - t.diedAt) / 1000);
                html +=
                    '<div style="padding:3px 8px;margin-bottom:2px;border-radius:var(--radius-sm);' +
                        'background:var(--bg-secondary);font-size:0.62rem;color:var(--text-muted);' +
                        'display:flex;gap:6px;align-items:center;opacity:0.7">' +
                        '<span>💀</span>' +
                        '<span>' + esc(t.title || t.id) + '</span>' +
                        '<span style="font-size:0.56rem;padding:1px 3px;border-radius:3px;' +
                            'background:rgba(248,113,113,0.1);color:#f87171">' + esc(t.reason) + '</span>' +
                        '<span style="margin-left:auto">' + ago + 's ago</span>' +
                    '</div>';
            }
        }

        // ── Inspect dump area ──
        html += '<div id="mesh-panel-dump" style="display:none;margin-top:10px;padding:8px 10px;' +
            'border-radius:var(--radius-sm);background:#0d1117;border:1px solid var(--border-subtle);' +
            'font-family:var(--font-mono);font-size:0.62rem;white-space:pre-wrap;max-height:200px;' +
            'overflow-y:auto;color:#c9d1d9"></div>';

        // ── SW Clients cross-reference ──
        html += '<div style="font-size:0.66rem;font-weight:600;margin:12px 0 4px;color:var(--text-muted)">' +
            '⚙️ SW Clients</div>';
        html += '<div id="mesh-panel-sw-clients" style="font-size:0.62rem;color:var(--text-muted)">Loading…</div>';

        // ── SW Controller diagnostic ──
        var ctrlStatus = navigator.serviceWorker && navigator.serviceWorker.controller
            ? '✅ SET (' + navigator.serviceWorker.controller.state + ')'
            : '❌ NULL';
        html += '<div style="font-size:0.6rem;margin:8px 0 2px;color:var(--text-muted)">' +
            '🔧 SW Controller: <strong>' + ctrlStatus + '</strong></div>';

        // ── CDP status ──
        var cdpBadge = mesh.cdpAvailable
            ? '<span style="color:var(--success)">✅ CDP active — tab focus works</span>'
            : '<span style="color:var(--warning)">⚠️ CDP not active — <a href="#" onclick="_meshShowSetup();return false" style="color:var(--accent);text-decoration:underline">Set up tab focus</a></span>';
        html += '<div style="font-size:0.62rem;margin:8px 0 2px;color:var(--text-muted)">' +
            '📡 ' + cdpBadge + '</div>';

        // ── WSL Channel link ──
        html += '<div style="font-size:0.62rem;margin:4px 0 2px;color:var(--text-muted)">' +
            '🔌 <a href="#" onclick="_meshShowWslChannel();return false" ' +
            'style="color:var(--accent);text-decoration:underline">WSL Channel Setup</a>' +
            '</div>';

        body.innerHTML = html;

        // Async: fetch SW client list after render
        _meshFetchSWClients();
    }

    async function _meshFetchSWClients() {
        var container = document.getElementById('mesh-panel-sw-clients');
        if (!container) return;

        if (typeof _meshSWMessage !== 'function' || !window.TabMesh || window.TabMesh.swState !== 'active') {
            container.innerHTML = '<span style="color:var(--text-muted)">SW not active — cannot list clients</span>';
            return;
        }

        try {
            var resp = await _meshSWMessage({ type: 'LIST_TABS' });
            if (!resp || !resp.tabs) {
                container.innerHTML = '<span>No response from SW</span>';
                return;
            }

            if (resp.tabs.length === 0) {
                container.innerHTML = '<span>No SW-controlled clients</span>';
                return;
            }

            var mesh = window.TabMesh;
            var rowsHtml = '';
            for (var i = 0; i < resp.tabs.length; i++) {
                var tab = resp.tabs[i];
                // Cross-reference: check if this SW client has a mesh registry entry
                var inMesh = false;
                if (mesh.registry) {
                    mesh.registry.forEach(function(entry) {
                        if (entry.url && tab.url && entry.url.split('#')[0] === tab.url.split('#')[0]) {
                            inMesh = true;
                        }
                    });
                }
                var meshBadge = inMesh
                    ? '<span style="color:var(--success)">✅ mesh</span>'
                    : '<span style="color:var(--warning)">⚠️ no mesh</span>';
                var focusIcon = tab.focused ? '🟢' : '⚫';
                var visIcon = tab.visibilityState === 'visible' ? '👁' : '🙈';

                // Shorten url for display
                var displayUrl = tab.url;
                try {
                    var urlObj = new URL(tab.url);
                    displayUrl = urlObj.pathname + urlObj.hash;
                } catch(_) {}

                rowsHtml +=
                    '<div style="padding:3px 6px;margin-bottom:2px;border-radius:var(--radius-sm);' +
                        'background:var(--bg-secondary);display:flex;align-items:center;gap:6px">' +
                        '<span>' + focusIcon + '</span>' +
                        '<span>' + visIcon + '</span>' +
                        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' +
                            'font-family:var(--font-mono)" title="' + esc(tab.url) + '">' +
                            esc(displayUrl) + '</span>' +
                        meshBadge +
                    '</div>';
            }
            container.innerHTML = rowsHtml;
        } catch (err) {
        container.innerHTML = '<span style="color:var(--danger)">Error: ' + esc(err.message) + '</span>';
        }
    }

    function _meshShowDump() {
        setTimeout(function() {
            var dumpEl = document.getElementById('mesh-panel-dump');
            if (dumpEl) {
                dumpEl.style.display = '';
                if (!dumpEl.textContent) dumpEl.textContent = 'Waiting for dump response…';
            }
        }, 100);
    }
    // Listen for inspect dump responses
    window.addEventListener('tab-mesh:dump', function(e) {
        var dumpEl = document.getElementById('mesh-panel-dump');
        if (dumpEl) {
            dumpEl.style.display = '';
            dumpEl.textContent = JSON.stringify(e.detail, null, 2);
        }
    });

    // Track which container the WSL channel UI is rendered into
    // (mesh-panel-body vs wsl-channel-modal-body)
    var _wslChannelContainerId = 'mesh-panel-body';

    // ── WSL Channel Setup UI (Phase 4) ──────────────────────────────
    //
    // _meshRenderWslChannel   — render the full WSL channel section
    // _meshShowWslChannel     — standalone entry (fetch + render)
    // _wslStartTunnel         — start a tunnel backend
    // _wslStopTunnel          — stop the active tunnel
    // _wslFixPrereq           — show inline prerequisite fix
    // _wslCreateFirewallRule  — create firewall rule
    // _wslRescan              — re-fetch + re-render
    // ──────────────────────────────────────────────────────────────────

    /**
     * Standalone entry point: fetch wsl-channel-status and render.
     * Called from notification clicks or direct navigation.
     */
    async function _meshShowWslChannel(containerId) {
        _meshWizardActive = true;
        if (containerId) _wslChannelContainerId = containerId;
        var body = document.getElementById(_wslChannelContainerId);
        if (!body) return;

        body.innerHTML =
            '<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:0.76rem">' +
                '<div style="font-size:1.5rem;margin-bottom:8px">🔍</div>' +
                'Scanning WSL channel…' +
            '</div>';

        var inModal = _wslChannelContainerId !== 'mesh-panel-body';
        try {
            var resp = await fetch('/api/tab-mesh/wsl-channel-status');
            var status = await resp.json();
            if (!status.is_wsl) {
                body.innerHTML =
                    '<div style="padding:1rem;color:var(--text-muted);font-size:0.74rem">' +
                    'Not running under WSL — channel setup is not needed.</div>' +
                    (inModal ? '' :
                    '<div style="text-align:right;margin-top:10px">' +
                    '<button class="btn btn-sm btn-ghost" onclick="_renderMeshPanel()">← Back</button></div>');
                return;
            }
            _meshRenderWslChannel(body, status);
        } catch (err) {
            body.innerHTML =
                '<div style="padding:1rem;color:var(--danger);font-size:0.74rem">' +
                '❌ Failed to scan: ' + err.message + '</div>' +
                (inModal ? '' :
                '<div style="text-align:right;margin-top:10px">' +
                '<button class="btn btn-sm btn-ghost" onclick="_renderMeshPanel()">← Back</button></div>');
        }
    }

    /**
     * Render the full WSL Channel setup section.
     * Shows: level banner, detection grid, tunnel choices, actions.
     */
    function _meshRenderWslChannel(container, status) {
        var html = '';

        // ── Header ──
        html += '<div style="font-size:0.78rem;font-weight:700;margin-bottom:10px;color:var(--text-primary)">' +
            '📡 WSL Channel Setup</div>';

        // ── Section 1: Level Banner ──
        var levelColors = {
            0: { bg: 'rgba(248,113,113,0.12)', color: '#f87171', label: 'No CDP' },
            1: { bg: 'rgba(251,191,36,0.12)', color: '#fbbf24', label: 'curl.exe Bridge' },
            2: { bg: 'rgba(52,211,153,0.12)', color: '#34d399', label: 'Direct Channel' },
            3: { bg: 'rgba(96,165,250,0.12)', color: '#60a5fa', label: 'Native localhost' },
        };
        var lvl = levelColors[status.channel_level] || levelColors[0];
        var speedLabel = status.channel_level === 0 ? 'N/A'
            : status.channel_level === 1 ? '~2000ms per CDP call'
            : status.channel_level === 2 ? '~5ms per CDP call'
            : '<1ms per CDP call';

        html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;' +
            'border-radius:var(--radius-sm);background:' + lvl.bg + ';margin-bottom:12px">' +
            '<span style="padding:3px 8px;border-radius:var(--radius-sm);font-size:0.64rem;' +
            'font-weight:700;text-transform:uppercase;background:' + lvl.bg + ';color:' + lvl.color + '">' +
            'Level ' + status.channel_level + '</span>' +
            '<span style="font-size:0.72rem;font-weight:600;color:var(--text-primary)">' +
            (status.channel_level_name || lvl.label) + '</span>' +
            '<span style="font-size:0.62rem;color:var(--text-muted);margin-left:auto">' +
            speedLabel + '</span>' +
            '</div>';

        // ── Section 2: Detection Grid ──
        var detections = [
            [true, '✅ WSL2 ' + (status.networking_mode || 'NAT') + ' mode'],
            [status.hostname_local_resolves,
             status.hostname_local_resolves
                ? '✅ ' + (status.hostname || '?') + '.local → ' + (status.hostname_local_ip || '?')
                : '❌ hostname.local not resolving'],
            [status.firewall_port_reachable || status.firewall_rule_exists,
             status.firewall_port_reachable
                ? '✅ Firewall port reachable'
                : status.firewall_rule_exists
                    ? '⚠️ Firewall rule exists but port unreachable'
                    : '❌ Firewall rule missing'],
            [status.curl_exe_available,
             status.curl_exe_available
                ? '✅ curl.exe available'
                : '⚠️ curl.exe not found — <a href="#" onclick="_wslInstallCurl();return false" ' +
                  'style="color:var(--accent);text-decoration:underline;font-size:0.6rem">[Install]</a>'],
            [status.tunnel_active,
             status.tunnel_active
                ? '✅ Tunnel active (' + (status.tunnel_method || 'unknown') + ')'
                : '❌ No tunnel running'],
        ];

        html += '<div style="margin-bottom:14px">';
        for (var di = 0; di < detections.length; di++) {
            var ok = detections[di][0];
            var text = detections[di][1];
            html += '<div style="font-size:0.66rem;padding:2px 0;color:' +
                (ok ? 'var(--text-primary)' : 'var(--text-muted)') + '">' +
                text + '</div>';
        }
        html += '</div>';

        // ── Section 3: Active Tunnel Controls ──
        if (status.tunnel_active) {
            html += '<div style="padding:10px 12px;border-radius:var(--radius-sm);' +
                'background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.15);margin-bottom:14px">' +
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
                '<span style="font-size:0.72rem;font-weight:600;color:var(--success)">🟢 Tunnel Active</span>' +
                '<button class="btn btn-sm btn-ghost" style="font-size:0.58rem;margin-left:auto;' +
                'color:var(--danger);border-color:var(--danger)" ' +
                'onclick="_wslStopTunnel()">Stop</button></div>';
            if (status.tunnel_stats) {
                var ts = status.tunnel_stats;
                html += '<div style="font-size:0.6rem;color:var(--text-muted);font-family:var(--font-mono)">';
                html += 'Method: ' + (ts.method || '?') + ' · Port: ' + (ts.local_port || '?');
                if (ts.started_at) html += ' · Since: ' + ts.started_at.substring(11, 19);
                html += '</div>';
            }
            html += '</div>';
        }

        // ── Section 4: Tunnel Choices ──
        var choices = status.choices || [];
        if (choices.length > 0) {
            html += '<div style="font-size:0.72rem;font-weight:600;margin-bottom:8px;color:var(--text-primary)">' +
                'Channel Method</div>';
            html += '<div style="font-size:0.62rem;color:var(--text-muted);margin-bottom:10px">' +
                'Choose how WSL communicates with Chrome on Windows. ' +
                'The recommended option works out of the box.</div>';
        }

        for (var ci = 0; ci < choices.length; ci++) {
            var c = choices[ci];
            var cardBorder = c.recommended ? 'rgba(52,211,153,0.4)'
                : c.risky ? 'rgba(251,191,36,0.4)'
                : 'var(--border-subtle)';

            html += '<div id="wsl-choice-' + c.id + '" style="padding:10px 12px;border-radius:var(--radius-sm);' +
                'border:1px solid ' + cardBorder + ';margin-bottom:6px;' +
                'transition:border-color 0.15s;cursor:pointer" ' +
                'onclick="var r=this.querySelector(\'input[type=radio]\');if(r&&!r.disabled){r.checked=true}">';

            // Header row: radio + label + badges
            html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
            html += '<input type="radio" name="wsl-tunnel-method" value="' + c.id + '"' +
                ' id="wsl-radio-' + c.id + '"' +
                (c.recommended ? ' checked' : '') +
                (!c.available && !c.risky ? ' disabled' : '') + '>';
            html += '<span style="font-size:0.7rem;font-weight:600;color:var(--text-primary)">' +
                c.label + '</span>';
            if (c.recommended) {
                html += '<span style="font-size:0.52rem;padding:1px 5px;border-radius:3px;' +
                    'background:rgba(52,211,153,0.15);color:#34d399;font-weight:600">Recommended</span>';
            }
            if (c.risky) {
                html += '<span style="font-size:0.52rem;padding:1px 5px;border-radius:3px;' +
                    'background:rgba(251,191,36,0.15);color:#fbbf24;font-weight:600">⚠️ Risky</span>';
            }
            html += '<span style="font-size:0.58rem;color:var(--text-muted);margin-left:auto">' +
                c.speed + '</span>';
            html += '</div>';

            // Description
            html += '<div style="font-size:0.62rem;color:var(--text-muted);margin-bottom:4px;padding-left:24px">' +
                c.description;
            if (c.risky && c.risk_detail) {
                html += ' <span style="color:var(--warning)">' + c.risk_detail + '</span>';
            }
            html += '</div>';

            // Prerequisites
            var prereqs = c.prerequisites || [];
            if (prereqs.length > 0) {
                // Status line — show ✅/❌ for each prereq with unique IDs
                html += '<div id="wsl-prereqs-' + c.id + '" style="display:flex;gap:8px;flex-wrap:wrap;font-size:0.58rem;padding-left:24px;margin-bottom:2px">';
                for (var pi = 0; pi < prereqs.length; pi++) {
                    var p = prereqs[pi];
                    var prereqId = (p.install_recipe && p.install_recipe.id) || '';
                    html += '<span id="wsl-pq-' + c.id + '-' + pi + '"' +
                        (prereqId ? ' data-recipe="' + prereqId + '"' : '') +
                        ' data-ok="' + (p.ok ? '1' : '0') + '"' +
                        ' style="color:' + (p.ok ? 'var(--success)' : 'var(--danger)') + '">';
                    html += (p.ok ? '✅' : '❌') + ' ' + p.name;
                    if (!p.ok && p.name === 'firewall') {
                        html += ' <a href="#" onclick="_wslFixPrereq(\'firewall\');return false" ' +
                            'style="color:var(--accent);text-decoration:underline;font-size:0.56rem">[Fix]</a>';
                    }
                    html += '</span>';
                }
                html += '</div>';

                // Install buttons for prereqs with recipes
                var missingForRecipe = [];
                for (var mi = 0; mi < prereqs.length; mi++) {
                    var mp = prereqs[mi];
                    if (!mp.ok && mp.install_recipe) {
                        missingForRecipe.push(mp.install_recipe);
                    }
                }
                if (missingForRecipe.length > 0) {
                    html += '<div id="wsl-install-banner-' + c.id + '" style="padding-left:24px;margin-top:4px">';
                    html += '<div class="missing-tools-banner" style="margin:0">';
                    html += '<div class="missing-tools-header">' +
                        '<span style="font-size:0.9rem">⚠️</span>' +
                        '<span style="font-size:0.72rem"><strong>' + missingForRecipe.length + ' tool' +
                        (missingForRecipe.length > 1 ? 's' : '') + ' not installed</strong></span></div>';
                    html += '<div class="missing-tools-list">';
                    for (var ri = 0; ri < missingForRecipe.length; ri++) {
                        var r = missingForRecipe[ri];
                        html += '<div class="missing-tool-item">' +
                            '<span class="missing-tool-label">' + r.label + '</span>' +
                            '<button class="btn btn-sm btn-install-tool"' +
                            ' data-tool-id="' + r.id + '"' +
                            ' data-tool-label="' + r.label + '"' +
                            ' data-method-id="' + c.id + '"' +
                            ' onclick="_wslInstallPrereq(this)">' +
                            '📦 Install</button></div>';
                    }
                    html += '</div></div></div>';
                }
            }

            html += '</div>';
        }

        // ── Section 5: Inline Prerequisite Fix Area ──
        html += '<div id="wsl-prereq-fix-area" style="display:none"></div>';

        // ── Section 6: Actions ──
        var inModal = _wslChannelContainerId !== 'mesh-panel-body';
        html += '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">';
        if (!inModal) html += '<button class="btn btn-sm btn-ghost" onclick="_renderMeshPanel()">← Back</button>';
        html += '<button class="btn btn-sm btn-ghost" onclick="_wslRescan()">🔄 Re-scan</button>';

        if (!status.tunnel_active) {
            html += '<button class="btn btn-sm btn-primary" id="wsl-start-btn" ' +
                'onclick="_wslStartTunnel()">▶ Set Up</button>';
        }
        html += '<button class="btn btn-sm btn-ghost" onclick="_wslValidateChannel()">' +
            '🧪 Validate</button>';
        html += '</div>';

        // ── Validation result area ──
        html += '<div id="wsl-validation-result" style="display:none;margin-top:10px;padding:8px 10px;' +
            'border-radius:var(--radius-sm);background:var(--bg-secondary);font-size:0.66rem;' +
            'color:var(--text-muted)"></div>';

        container.innerHTML = html;
    }

    /**
     * Start a tunnel using the selected method.
     */
    async function _wslStartTunnel() {
        var selected = document.querySelector('input[name="wsl-tunnel-method"]:checked');
        var method = selected ? selected.value : 'python_proxy';
        var btn = document.getElementById('wsl-start-btn');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Starting…'; }

        try {
            var resp = await fetch('/api/tab-mesh/wsl-start-tunnel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ method: method }),
            });
            var data = await resp.json();

            if (data.ok) {
                // Invalidate CDP warm cache so next modal open re-probes
                if (typeof _cdpWarmResult !== 'undefined') { _cdpWarmResult = null; }
                if (btn) {
                    btn.textContent = '✅ Started';
                    btn.style.background = 'var(--success)';
                    btn.style.color = 'white';
                }
                // Re-render after brief pause
                setTimeout(_wslRescan, 500);
            } else {
                if (btn) {
                    btn.textContent = '❌ Failed';
                    btn.disabled = false;
                }
                var resultEl = document.getElementById('wsl-validation-result');
                if (resultEl) {
                    resultEl.style.display = 'block';
                    resultEl.innerHTML = '<span style="color:var(--danger)">❌ ' +
                        (data.error || 'Failed to start tunnel.') + '</span>';
                }
            }
        } catch (err) {
            if (btn) { btn.textContent = '❌ Error'; btn.disabled = false; }
        }
    }

    /**
     * Stop the active tunnel.
     */
    async function _wslStopTunnel() {
        try {
            await fetch('/api/tab-mesh/wsl-stop-tunnel', { method: 'POST' });
            _wslRescan();
        } catch (err) {
            console.error('[WSL Channel] Stop failed:', err);
        }
    }

    /**
     * Install a WSL channel prerequisite via the plan-based flow.
     * After success, surgically updates the DOM — no full rescan.
     *
     * @param {HTMLButtonElement} btn - The install button (has data-tool-id,
     *        data-tool-label, data-method-id attributes)
     */
    function _wslInstallPrereq(btn) {
        var toolId = btn.dataset.toolId;
        var toolLabel = btn.dataset.toolLabel;
        var methodId = btn.dataset.methodId;

        btn.disabled = true;
        btn.textContent = '⏳ Loading…';

        installWithPlan(toolId, toolLabel || toolId, {
            onComplete: function() {
                btn.textContent = '✅ Installed';
                btn.classList.add('btn-success');

                // ── Targeted DOM update ──

                // 1. Flip the prereq status span from ❌ to ✅
                var prereqRow = document.getElementById('wsl-prereqs-' + methodId);
                if (prereqRow) {
                    var spans = prereqRow.querySelectorAll('span[data-recipe="' + toolId + '"]');
                    for (var si = 0; si < spans.length; si++) {
                        var span = spans[si];
                        var name = span.textContent.replace(/^[❌✅]\s*/, '');
                        span.style.color = 'var(--success)';
                        span.textContent = '✅ ' + name;
                        span.dataset.ok = '1';
                    }
                }

                // 2. Remove the install banner if all recipe prereqs are satisfied
                var banner = document.getElementById('wsl-install-banner-' + methodId);
                if (banner) {
                    // Check if any install buttons in this banner are NOT installed
                    var remaining = banner.querySelectorAll('.btn-install-tool:not(.btn-success)');
                    if (remaining.length === 0) {
                        banner.remove();
                    } else {
                        // Update the count text
                        var header = banner.querySelector('.missing-tools-header strong');
                        if (header) {
                            header.textContent = remaining.length + ' tool' +
                                (remaining.length > 1 ? 's' : '') + ' not installed';
                        }
                    }
                }

                // 3. Enable the radio if ALL prereqs in this card are now OK
                if (prereqRow) {
                    var allOk = true;
                    var allSpans = prereqRow.querySelectorAll('span[data-ok]');
                    for (var ai = 0; ai < allSpans.length; ai++) {
                        if (allSpans[ai].dataset.ok !== '1') {
                            allOk = false;
                            break;
                        }
                    }
                    if (allOk) {
                        var radio = document.getElementById('wsl-radio-' + methodId);
                        if (radio) radio.disabled = false;
                    }
                }
            },
        });

        // Re-enable button after timeout (modal takes over)
        setTimeout(function() {
            if (btn.textContent === '⏳ Loading…') {
                btn.disabled = false;
                btn.textContent = '📦 Install';
            }
        }, 3000);
    }

    /**
     * Create the firewall rule via elevated PowerShell.
     */
    async function _wslCreateFirewallRule() {
        var scopeRadio = document.querySelector('input[name="wsl-fw-scope"]:checked');
        var scope = scopeRadio ? scopeRadio.value : 'single';
        var btn = document.getElementById('wsl-fw-btn');
        var statusEl = document.getElementById('wsl-fw-status');
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Waiting for UAC…'; }
        if (statusEl) statusEl.textContent = 'Waiting for admin approval…';

        try {
            var resp = await fetch('/api/tab-mesh/wsl-fix-firewall', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ scope: scope }),
            });
            var data = await resp.json();

            if (data.ok) {
                if (btn) {
                    btn.textContent = '✅ Created';
                    btn.style.background = 'var(--success)';
                    btn.style.color = 'white';
                }
                if (statusEl) {
                    statusEl.innerHTML = '<span style="color:var(--success)">' +
                        data.message + '</span>';
                }
                // Re-scan to update prereq indicators
                setTimeout(_wslRescan, 1000);
            } else {
                if (btn) { btn.textContent = '❌ Failed'; btn.disabled = false; }
                if (statusEl) {
                    statusEl.innerHTML = '<span style="color:var(--danger)">' +
                        (data.message || 'Failed') + '</span>';
                }
            }
        } catch (err) {
            if (btn) { btn.textContent = '❌ Error'; btn.disabled = false; }
            if (statusEl) statusEl.textContent = err.message;
        }
    }

    /**
     * Re-scan WSL channel status and re-render.
     */
    function _wslRescan() {
        _meshShowWslChannel(_wslChannelContainerId);
    }

    // ── Phase 7: End-to-End Validation ────────────────────────────

    /**
     * Run full validation and render results.
     */
    async function _wslValidateChannel() {
        var resultEl = document.getElementById('wsl-validation-result');
        if (!resultEl) return;

        resultEl.style.display = 'block';
        resultEl.innerHTML =
            '<div style="text-align:center;padding:6px;color:var(--text-muted)">' +
            '🧪 Validating all layers…</div>';

        try {
            var resp = await fetch('/api/tab-mesh/wsl-validate', { method: 'POST' });
            var data = await resp.json();
            var html = '';

            // ── Actual Level Badge ──
            var lv = data.actual_level || { level: 0, level_name: 'Unknown' };
            var lvColors = {
                0: { bg: 'rgba(248,113,113,0.12)', color: '#f87171' },
                1: { bg: 'rgba(251,191,36,0.12)', color: '#fbbf24' },
                2: { bg: 'rgba(52,211,153,0.12)', color: '#34d399' },
                3: { bg: 'rgba(96,165,250,0.12)', color: '#60a5fa' },
            };
            var lvC = lvColors[lv.level] || lvColors[0];
            html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">' +
                '<span style="padding:2px 7px;border-radius:var(--radius-sm);font-size:0.62rem;' +
                'font-weight:700;background:' + lvC.bg + ';color:' + lvC.color + '">' +
                'Level ' + lv.level + '</span>' +
                '<span style="font-size:0.7rem;font-weight:600;color:var(--text-primary)">' +
                lv.level_name + '</span></div>';

            // ── Per-Layer Results ──
            var layers = data.layers || {};
            var layerOrder = [
                'layer_0_wsl', 'layer_1_networking', 'layer_2_hostname',
                'layer_3_firewall', 'layer_5_curl_exe', 'tunnel',
            ];
            for (var li = 0; li < layerOrder.length; li++) {
                var key = layerOrder[li];
                var l = layers[key];
                if (!l) continue;
                var icon = l.ok ? '✅' : '❌';
                html += '<div style="font-size:0.64rem;padding:1px 0;color:var(--text-primary)">' +
                    icon + ' ' + l.name + '</div>';
            }

            // ── Latency Comparison ──
            var lat = data.latency || {};
            var hasLatency = (lat.curl_exe_ms != null || lat.tunnel_ms != null || lat.direct_ms != null);
            if (hasLatency) {
                html += '<div style="margin-top:10px;padding:8px 10px;border-radius:var(--radius-sm);' +
                    'background:rgba(99,102,241,0.04);border:1px solid rgba(99,102,241,0.1)">' +
                    '<div style="font-size:0.66rem;font-weight:600;margin-bottom:6px;color:var(--text-primary)">' +
                    '⚡ Latency Comparison</div>';

                var latencies = [];
                if (lat.curl_exe_ms != null) {
                    latencies.push({ label: 'curl.exe bridge', ms: lat.curl_exe_ms, ok: lat.curl_exe_ok });
                }
                if (lat.tunnel_ms != null) {
                    latencies.push({ label: 'Tunnel', ms: lat.tunnel_ms, ok: lat.tunnel_ok });
                }
                if (lat.direct_ms != null) {
                    latencies.push({ label: 'Direct (hostname.local)', ms: lat.direct_ms, ok: lat.direct_ok });
                }

                // Find the slowest for comparison
                var maxMs = 0;
                for (var mi = 0; mi < latencies.length; mi++) {
                    if (latencies[mi].ms > maxMs) maxMs = latencies[mi].ms;
                }

                for (var mi = 0; mi < latencies.length; mi++) {
                    var m = latencies[mi];
                    var msStr = m.ms != null ? m.ms.toFixed(1) + 'ms' : 'N/A';
                    var badge = '';
                    if (m.ms != null && maxMs > 0 && m.ms < maxMs && m.ms > 0) {
                        var factor = Math.round(maxMs / m.ms);
                        if (factor > 1) {
                            badge = ' <span style="font-size:0.52rem;padding:1px 4px;border-radius:3px;' +
                                'background:rgba(52,211,153,0.15);color:#34d399;font-weight:600">' +
                                factor + 'x faster</span>';
                        }
                    }
                    var statusIcon = m.ok ? '✅' : '❌';
                    html += '<div style="font-size:0.62rem;padding:2px 0;color:var(--text-muted);' +
                        'display:flex;align-items:center;gap:6px">' +
                        '<span>' + statusIcon + '</span>' +
                        '<span style="min-width:140px">' + m.label + '</span>' +
                        '<span style="font-family:var(--font-mono);font-weight:600;color:var(--text-primary)">' +
                        msStr + '</span>' + badge + '</div>';
                }
                html += '</div>';
            }

            // ── CDP Status ──
            html += '<div style="margin-top:8px;font-size:0.64rem;color:var(--text-primary)">' +
                (data.cdp_active ? '✅' : '❌') + ' CDP: ' +
                (data.cdp_endpoint ? '<code style="font-size:0.58rem">' + data.cdp_endpoint + '</code>'
                    : '<span style="color:var(--danger)">not reachable</span>') +
                '</div>';

            resultEl.innerHTML = html;
        } catch (err) {
            resultEl.innerHTML = '<span style="color:var(--danger)">❌ Validation failed: ' +
                err.message + '</span>';
        }
    }

    // ── Phase 6: curl.exe Install ─────────────────────────────────

    /**

                '<div style="font-size:0.72rem;font-weight:600;margin-bottom:6px;color:var(--text-primary)">' +

                '<div id="curl-install-status" style="font-size:0.64rem;color:var(--text-muted)">' +

                // Render attempt details

                // Manual install fallback
                html += '<div style="margin-top:10px;padding:8px 10px;border-radius:var(--radius-sm);' +
                    'background:var(--bg-secondary);font-size:0.62rem;color:var(--text-muted)">' +
                    '<div style="font-weight:600;margin-bottom:4px;color:var(--text-primary)">' +
                    '📋 Manual Installation</div>' +
                    '<ol style="margin:0;padding-left:18px;line-height:1.6">' +
                    '<li>Download curl from <a href="https://curl.se/windows/" target="_blank" ' +
                    'style="color:var(--accent)">curl.se/windows/</a></li>' +

        } catch (err) {

            if (statusEl) {
                statusEl.innerHTML = '<span style="color:var(--danger)">❌ Error: ' +
                    err.message + '</span>';
            }
        }
    }

    /**
     * Render install chain attempt details (which methods tried/failed).
     */
    function _renderAttemptDetails(chain) {
        if (!chain || !chain.length) return '';
        var html = '<div style="margin-top:8px;font-size:0.6rem;font-family:var(--font-mono)">';
        for (var i = 0; i < chain.length; i++) {
            var a = chain[i];
            var icon = a.success ? '✅' : a.attempted ? '❌' : '⏭️';
            var label = a.label || a.method || ('Step ' + (i + 1));
            html += '<div style="padding:1px 0;color:var(--text-muted)">' + icon + ' ' + label;
            if (a.error) {
                html += ' — <span style="color:var(--danger)">' + a.error + '</span>';
            }
            if (!a.available) {
                html += ' <span style="color:var(--text-muted)">(not available)</span>';
            }
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

</script>
