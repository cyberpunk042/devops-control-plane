<script>
// ═══════════════════════════════════════════════════════════════════
// ── System Posture — nav badge + detail modal ─────────────────────
// ═══════════════════════════════════════════════════════════════════
//
// Fetches /api/posture/summary once on load, then subscribes
// to SSE cache:done events for live updates via the mediator.
// Clicking the badge opens a modal with full pillar details.

(function() {
    'use strict';

    // ── Constants ──────────────────────────────────────────────
    let _lastPosture = null;

    // ── Rank → CSS class mapping ─────────────────────────────
    const RANK_CSS = {
        current:    'ok',
        aging:      'ok',
        outdated:   'degraded',
        deprecated: 'degraded',
        dangerous:  'failed',
        unknown:    'degraded',
        na:         'ok',
    };

    const RANK_LABEL = {
        current:    'Healthy',
        aging:      'Aging',
        outdated:   'Outdated',
        deprecated: 'Degraded',
        dangerous:  'Critical',
        unknown:    'Unknown',
        na:         'OK',
    };

    const RANK_EMOJI = {
        current:    '🟢',
        aging:      '🔵',
        outdated:   '🟡',
        deprecated: '🟠',
        dangerous:  '🔴',
        unknown:    '⚪',
        na:         '—',
    };

    // ── Badge update ──────────────────────────────────────────
    function updateBadge(summary) {
        const badge = document.getElementById('health-badge');
        if (!badge) return;

        const rank = summary.overall_rank || 'unknown';
        const cssClass = RANK_CSS[rank] || 'degraded';
        const label = RANK_LABEL[rank] || 'Unknown';

        badge.className = 'status-badge ' + cssClass;
        badge.style.cursor = 'pointer';
        badge.innerHTML = `
            <span class="status-dot"></span>
            <span>${label}</span>
        `;
        badge.onclick = openPostureModal;
        badge.title = summary.summary || 'System Posture — click for details';
    }

    // ── Summary fetch (one-time on load) ──────────────────────
    async function fetchSummary() {
        try {
            const resp = await fetch('/api/posture/summary');
            if (!resp.ok) return;
            const data = await resp.json();
            _lastPosture = data;
            updateBadge(data);
        } catch (e) {
            console.debug('[posture] summary fetch failed:', e);
        }
    }

    function initPosture() {
        // One-time fetch for initial badge state
        fetchSummary();

        // Subscribe to SSE for live updates (replaces polling)
        if (typeof storeRegister === 'function') {
            storeRegister('posture:summary', function(data) {
                _lastPosture = data;
                updateBadge(data);
            });
        }
    }

    // ── Modal ─────────────────────────────────────────────────
    async function openPostureModal() {
        if (typeof modalOpen !== 'function') return;

        const loadingBody = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;gap:1rem;">
                <div class="spinner" style="width:36px;height:36px;"></div>
                <p style="color:var(--text-muted);font-size:0.95rem;">Scanning system posture…</p>
            </div>
        `;

        const overlay = modalOpen({
            title: '🛡️ System Posture',
            body: loadingBody,
            size: 'posture',
            footerButtons: [
                { label: '🔄 Rescan', cls: 'btn-primary', onclick: 'postureRescan()', id: 'posture-rescan-btn' },
                { label: 'Close', onclick: 'modalClose()' },
            ],
            footerStatus: 'Loading…',
        });

        try {
            const resp = await fetch('/api/posture');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            const body = overlay.querySelector('.modal-body');
            if (body) body.innerHTML = renderPosture(data);

            const status = overlay.querySelector('.modal-footer-status');
            if (status) status.textContent = data.summary || '';
        } catch (e) {
            const body = overlay.querySelector('.modal-body');
            if (body) {
                body.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;gap:0.75rem;">
                        <span style="font-size:2rem;">⚠️</span>
                        <p style="color:var(--error);font-size:1rem;font-weight:600;">Failed to load posture data</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">${e.message}</p>
                    </div>
                `;
            }
        }
    }

    // ── Render: top-level ─────────────────────────────────────
    function renderPosture(data) {
        const pillars = data.pillars || {};
        const overall = data.overall_rank || 'unknown';
        const emoji = RANK_EMOJI[overall] || '⚪';

        // ── Overview hero ─────────────────────────────────────
        let html = `
            <div class="posture-hero">
                <div class="posture-hero-left">
                    <span class="posture-hero-emoji">${emoji}</span>
                    <div class="posture-hero-info">
                        <span class="posture-hero-label status-badge ${RANK_CSS[overall] || 'degraded'}">${RANK_LABEL[overall] || 'Unknown'}</span>
                        <span class="posture-hero-summary">${data.summary || ''}</span>
                    </div>
                </div>
                <div class="posture-hero-right">
                    <span class="posture-hero-meta">⏱ ${data.scan_duration_ms || 0}ms</span>
                </div>
            </div>
        `;

        // ── Pillar status bar (at-a-glance) ───────────────────
        const pillarOrder = ['platform', 'toolchain', 'project', 'runtime', 'modules'];
        const pillarIcons = { platform: '💻', toolchain: '🔧', project: '📦', runtime: '⚡', modules: '🧩' };
        const pillarLabels = { platform: 'Platform', toolchain: 'Toolchain', project: 'Project', runtime: 'Runtime', modules: 'Modules' };

        html += '<div class="posture-status-bar">';
        for (const key of pillarOrder) {
            const p = pillars[key];
            if (!p) continue;
            const r = p.rank || 'unknown';
            const e = RANK_EMOJI[r] || '⚪';
            const bad = p.warnings?.length || 0;
            html += `
                <div class="posture-status-chip ${RANK_CSS[r] || 'degraded'}" onclick="document.getElementById('posture-pillar-${key}')?.scrollIntoView({behavior:'smooth',block:'nearest'})">
                    <span class="posture-status-chip-icon">${pillarIcons[key]}</span>
                    <span class="posture-status-chip-label">${pillarLabels[key]}</span>
                    <span class="posture-status-chip-rank">${e}</span>
                    ${bad ? `<span class="posture-status-chip-badge">${bad}</span>` : ''}
                </div>
            `;
        }
        html += '</div>';

        // ── Pillar details ────────────────────────────────────
        html += '<div class="posture-pillars">';
        for (const key of pillarOrder) {
            const pillar = pillars[key];
            if (!pillar) continue;
            if (key === 'modules') {
                html += renderModulePillar(pillar);
            } else {
                html += renderPillar(key, pillar, pillarIcons[key], pillarLabels[key]);
            }
        }
        html += '</div>';
        return html;
    }

    // ── Render: single pillar ────────────────────────────────
    function renderPillar(key, pillar, icon, label) {
        const rank = pillar.rank || 'unknown';
        const emoji = RANK_EMOJI[rank] || '⚪';
        const items = pillar.items || [];
        const warnings = pillar.warnings || [];
        const recommendations = pillar.recommendations || [];
        const hasIssues = warnings.length > 0 || ['dangerous', 'deprecated', 'outdated'].includes(rank);

        // Auto-expand pillars that have warnings — collapse healthy ones
        const expanded = hasIssues ? 'expanded' : '';

        // Batch update button for toolchain pillar
        let batchBtn = '';
        if (key === 'toolchain' && pillar.updatable_count > 0) {
            batchBtn = `<button class="posture-btn posture-btn-batch" onclick="event.stopPropagation();postureUpdateAllOutdated()" title="Update all outdated tools">⬆️ Update All (${pillar.updatable_count})</button>`;
        }

        let html = `
            <div class="posture-pillar ${expanded}" data-rank="${rank}" id="posture-pillar-${key}">
                <div class="posture-pillar-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <span class="posture-pillar-icon">${icon}</span>
                    <span class="posture-pillar-label">${label}</span>
                    <span class="posture-pillar-rank">${emoji}</span>
                    <span class="posture-pillar-count">${items.length}</span>
                    ${batchBtn}
                    <span class="posture-pillar-chevron">▸</span>
                </div>
                <div class="posture-pillar-body">
        `;

        // Item table
        if (items.length > 0) {
            html += '<table class="posture-table"><tbody>';
            for (const item of items) {
                const iRank = item.rank || 'unknown';
                const iEmoji = RANK_EMOJI[iRank] || '⚪';
                const iCss = RANK_CSS[iRank] || 'degraded';

                // Clean up names: "project:git" → "Git"
                let displayName = item.name;
                if (displayName.includes(':')) {
                    displayName = displayName.split(':').pop();
                }
                displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);

                // Action column
                const actionHtml = renderItemAction(item);

                html += `
                    <tr class="posture-row ${iCss}">
                        <td class="posture-cell-emoji">${iEmoji}</td>
                        <td class="posture-cell-name">${displayName}</td>
                        <td class="posture-cell-value">${item.value || ''}</td>
                        <td class="posture-cell-detail">${item.detail || ''}</td>
                        <td class="posture-cell-action">${actionHtml}</td>
                    </tr>
                `;
            }
            html += '</tbody></table>';
        }

        // Warnings
        if (warnings.length > 0) {
            html += '<div class="posture-section-warnings">';
            for (const w of warnings) {
                html += `<div class="posture-warn-line">⚠️ ${w}</div>`;
            }
            html += '</div>';
        }

        // Recommendations
        if (recommendations.length > 0) {
            html += '<div class="posture-section-recs">';
            html += '<div class="posture-recs-title">Recommendations</div>';
            for (const r of recommendations) {
                html += `<div class="posture-rec-line">→ ${r}</div>`;
            }
            html += '</div>';
        }

        html += '</div></div>';
        return html;
    }

    // ── Module peek panel system (follows dep-peek pattern) ────
    let _modulePeekItems = [];  // stored for peek content builders

    function _moduleShowPeek(html, x, y) {
        _moduleHidePeek();
        const el = document.createElement('div');
        el.className = 'module-peek';
        el.id = 'module-peek-card';
        el.innerHTML = html;
        document.body.appendChild(el);

        const rect = el.getBoundingClientRect();
        let left = x + 12;
        let top = y - 20;
        if (left + rect.width > window.innerWidth - 16) left = x - rect.width - 12;
        if (top + rect.height > window.innerHeight - 16) top = window.innerHeight - rect.height - 16;
        if (top < 8) top = 8;
        el.style.left = left + 'px';
        el.style.top = top + 'px';

        setTimeout(() => { document.addEventListener('mousedown', _modulePeekOutside); }, 0);
    }

    function _moduleHidePeek() {
        const el = document.getElementById('module-peek-card');
        if (el) el.remove();
        document.removeEventListener('mousedown', _modulePeekOutside);
    }
    window._moduleHidePeek = _moduleHidePeek;

    function _modulePeekOutside(e) {
        const peek = document.getElementById('module-peek-card');
        if (peek && !peek.contains(e.target)) _moduleHidePeek();
    }

    // ── Admonition helper ────────────────────────────────────
    function _adm(type, title, body) {
        const icons = { info:'💡', tip:'🟢', warning:'⚠️', danger:'🔴', note:'📝', success:'✅' };
        return `<div class="adm adm-${type}">
            <div class="adm-icon">${icons[type] || '💡'}</div>
            <div class="adm-content">
                ${title ? `<div class="adm-title">${title}</div>` : ''}
                <div class="adm-body">${body}</div>
            </div>
        </div>`;
    }

    // ── Confirmation modal helper ────────────────────────────
    function _remConfirm(opts) {
        modalOpen({
            title: opts.title,
            replace: false,
            body: opts.body,
            size: 'md',
            footerButtons: [
                { label: 'Cancel', cls: 'btn-ghost', onclick: 'modalClose()' },
                { label: opts.confirmLabel || 'Confirm',
                  cls: opts.confirmCls || 'btn-primary',
                  onclick: opts.onConfirmExpr },
            ],
        });
    }
    window._remConfirm = _remConfirm;

    // Click handler — dispatches to per-column content builder
    window.modulePeek = function(col, idx, evt) {
        const item = _modulePeekItems[idx];
        if (!item) return;
        const builders = {
            module: _peekModule,
            stack: _peekStack,
            declared: _peekDeclared,
            deps: _peekDeps,
            code: _peekCode,
            effective: _peekEffective,
            compat: _peekCompat,
            floor: _peekFloor,
            status: _peekStatus,
        };
        const builder = builders[col];
        if (!builder) return;
        _moduleShowPeek(builder(item), evt.clientX, evt.clientY);
    };

    // ── Per-column content builders (conversational) ───────
    function _peekModule(item) {
        const meta = item.module_meta || {};
        let h = `<div class="mp-title">${esc(item._moduleName)}</div>`;
        if (meta.description) h += `<div class="mp-row">${esc(meta.description)}</div>`;
        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-grid">';
        h += `<span class="mp-grid-label">Path</span><span><code>${esc(meta.path || '')}</code></span>`;
        h += `<span class="mp-grid-label">Domain</span><span>${esc(meta.domain || '')}</span>`;
        h += `<span class="mp-grid-label">Stack</span><span>${esc(item.stack || '')}</span>`;
        h += '</div>';
        const verdict = item.verdict || '';
        if (verdict === 'gap') {
            h += `<div class="mp-muted" style="margin-top:0.5rem">⚠️ This module has a compatibility gap — click the Status column for details and options.</div>`;
        } else if (verdict === 'consistent') {
            h += `<div class="mp-muted" style="margin-top:0.5rem">✅ This module's compatibility layers are aligned.</div>`;
        }
        return h;
    }

    function _peekStack(item) {
        const meta = item.stack_meta || {};
        const stackName = item.stack || '';
        let h = `<div class="mp-title">${esc(stackName)}</div>`;
        if (meta.parent) {
            h += `<div class="mp-row">This is a <strong>${esc(stackName)}</strong> stack, which extends the <code>${esc(meta.parent)}</code> base stack.</div>`;
        } else {
            h += `<div class="mp-row">This is a base <strong>${esc(stackName)}</strong> stack.</div>`;
        }
        if (meta.requires && meta.requires.length) {
            h += '<div class="mp-divider"></div>';
            h += '<div class="mp-section">Runtime requirements</div>';
            for (const r of meta.requires) {
                if (r.min_version) {
                    h += `<div class="mp-row">Needs <strong>${esc(r.adapter)}</strong> version <code>≥${esc(r.min_version)}</code> to run.</div>`;
                } else {
                    h += `<div class="mp-row">Uses <strong>${esc(r.adapter)}</strong> (no specific version required).</div>`;
                }
            }
        }
        if (meta.capabilities && meta.capabilities.length) {
            h += '<div class="mp-section">What this stack can do</div>';
            h += `<div class="mp-row">${meta.capabilities.map(c => '<code>' + esc(c) + '</code>').join(' · ')}</div>`;
        }
        return h;
    }

    function _peekDeclared(item) {
        const tiers = item.floor_tiers || {};
        const t1 = tiers.tier1 || {};
        const t2 = tiers.tier2 || {};
        const t3 = tiers.tier3 || {};
        const used = tiers.used || '';
        const declaredVal = item.value || '—';

        let h = `<div class="mp-title">Declared: ${esc(declaredVal)}</div>`;

        // Explain what "declared" means
        if (used === 'module') {
            h += `<div class="mp-row">This module declares its own Python floor in its config file.</div>`;
        } else if (used === 'stack') {
            h += `<div class="mp-row">This module doesn't have its own config file, so the floor comes from the <strong>${esc(t2.stack_name || '')}</strong> stack definition.</div>`;
        } else if (used === 'project') {
            h += `<div class="mp-row">Neither the module nor its stack declare a floor. This value comes from the project root config.</div>`;
        }

        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-section">How the floor was determined</div>';
        h += `<div class="mp-row ${used === 'module' ? 'active' : (t1.found ? '' : 'dim')}">`;
        h += used === 'module' ? '→ ' : '  ';
        h += `Module config: ${esc(t1.value || '—')}</div>`;

        h += `<div class="mp-row ${used === 'stack' ? 'active' : (t2.found ? '' : 'dim')}">`;
        h += used === 'stack' ? '→ ' : '  ';
        h += `Stack (${esc(t2.stack_name || '')}): ${esc(t2.value || '—')}</div>`;

        h += `<div class="mp-row ${used === 'project' ? 'active' : (t3.found ? '' : 'dim')}">`;
        h += used === 'project' ? '→ ' : '  ';
        h += `Project root: ${esc(t3.value || '—')}</div>`;

        if (used === 'stack' && t3.found) {
            h += `<div class="mp-muted">Note: the project root declares ${esc(t3.value || '')}, which is stricter. But the stack baseline is used because the module has no own config. You can add a <code>requires-python</code> to the module's own <code>pyproject.toml</code> to override this.</div>`;
        }
        return h;
    }

    function _peekDeps(item) {
        const details = item.deps_details || [];
        const depsFloor = item.deps_floor || '—';

        let h = `<div class="mp-title">Dependencies need: ${esc(depsFloor)}</div>`;

        if (!details.length) {
            h += '<div class="mp-row">This module\'s imports don\'t have Python version constraints, or no third-party packages were detected.</div>';
            h += '<div class="mp-muted">The platform scans the module\'s import statements and looks up each package\'s <code>Requires-Python</code> metadata.</div>';
            return h;
        }

        // Sort by floor descending
        const sorted = [...details].sort((a, b) => {
            const av = (a.floor || '').split('.').map(Number);
            const bv = (b.floor || '').split('.').map(Number);
            for (let i = 0; i < Math.max(av.length, bv.length); i++) {
                if ((bv[i] || 0) !== (av[i] || 0)) return (bv[i] || 0) - (av[i] || 0);
            }
            return 0;
        });

        const topPkg = sorted[0];
        h += `<div class="mp-row">The package <strong>${esc(topPkg.package)}</strong> requires Python <code>${esc(topPkg.requires_python)}</code>, which sets the floor for this module.</div>`;

        if (sorted.length > 1) {
            h += '<div class="mp-divider"></div>';
            h += '<div class="mp-section">All dependency constraints</div>';
            for (let i = 0; i < sorted.length; i++) {
                const d = sorted[i];
                const isTop = i === 0;
                h += `<div class="mp-row ${isTop ? 'active' : ''}"><code>${esc(d.package)}</code> needs ${esc(d.requires_python)}${isTop ? ' ← highest' : ''}</div>`;
            }
        }

        h += `<div class="mp-muted">${details.length} package(s) analyzed from this module's imports.</div>`;
        return h;
    }

    function _peekCode(item) {
        const features = item.code_features || [];
        const codeFloor = item.code_floor || '—';

        let h = `<div class="mp-title">Code uses: Python ${esc(codeFloor)}+ features</div>`;

        if (!features.length) {
            h += '<div class="mp-row">No version-specific language features were detected in this module\'s source files.</div>';
            h += '<div class="mp-muted">The platform scans <code>.py</code> files for syntax that requires specific Python versions (match/case, walrus operator, runtime generics, etc.).</div>';
            return h;
        }

        const topFeature = features[0];
        h += `<div class="mp-row">The highest feature found is <strong>${esc(topFeature.feature)}</strong>, which requires Python ${esc(topFeature.version)}+.</div>`;

        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-section">Features found</div>';
        for (const f of features) {
            const shortFile = (f.file || '').split('/').slice(-2).join('/');
            h += `<div class="mp-row"><strong>${esc(f.version)}</strong> — ${esc(f.feature)}</div>`;
            h += `<div class="mp-muted" style="margin-top:0;margin-bottom:0.3rem;padding-left:1rem">found in <code>${esc(shortFile)}:${f.line || '?'}</code></div>`;
        }

        h += `<div class="mp-muted">Files with <code>from __future__ import annotations</code> have their type hints evaluated as strings — they don't raise the floor. Only runtime syntax counts.</div>`;
        return h;
    }

    function _peekEffective(item) {
        const eff = item.effective_floor || '—';
        const effClean = eff.replace('≥', '');
        const declared = (item.value || '').replace('≥', '');
        const deps = (item.deps_floor || '').replace('≥', '');
        const code = item.code_floor || '';

        let h = `<div class="mp-title">Real minimum: Python ${esc(effClean)}+</div>`;
        h += `<div class="mp-row">This is the <strong>highest</strong> of all three layers. It's the actual minimum Python version this module needs to run.</div>`;

        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-section">Layer comparison</div>';

        const layers = [
            { label: 'Declared', value: declared, source: item.floor_source },
            { label: 'Dependencies', value: deps },
            { label: 'Code', value: code },
        ];

        for (const l of layers) {
            const isHighest = l.value === effClean;
            const hasValue = l.value && l.value !== '—' && l.value !== '';
            let line = `<div class="mp-row ${isHighest ? 'active' : (hasValue ? '' : 'dim')}">`;
            line += isHighest ? '→ ' : '  ';
            line += `${l.label}: `;
            if (hasValue) {
                line += `<code>${esc(l.value)}</code>`;
                if (l.source) line += ` <span class="mp-muted" style="display:inline">(from ${esc(l.source)})</span>`;
                if (isHighest) line += ' ← determines the floor';
            } else {
                line += '—';
            }
            line += '</div>';
            h += line;
        }

        if (declared && effClean && declared !== effClean) {
            h += `<div class="mp-muted" style="margin-top:0.5rem">The declared floor (${esc(declared)}) differs from the effective floor (${esc(effClean)}). This means the module claims compatibility with Python ${esc(declared)}+ but actually needs ${esc(effClean)}+.</div>`;
        }
        return h;
    }

    function _peekCompat(item) {
        const count = item.compat_count || 0;
        const range = item.range_display || '';

        let h = `<div class="mp-title">Compatible with ${count} Python version(s)</div>`;

        if (!count) {
            h += '<div class="mp-row">No version range data available.</div>';
            return h;
        }

        h += `<div class="mp-row">This module can run on Python versions <code>${esc(range)}</code>.</div>`;

        const parts = range.split('—').map(s => s.trim());
        if (parts.length === 2) {
            const fromMinor = parseInt(parts[0].split('.')[1] || '0');
            const toMinor = parseInt(parts[1].split('.')[1] || '0');
            const major = parts[0].split('.')[0];
            h += '<div class="mp-divider"></div>';
            for (let m = fromMinor; m <= toMinor; m++) {
                const v = major + '.' + m;
                const isCurrent = m === toMinor;
                h += `<div class="mp-row">${isCurrent ? '🟢' : '✓'} Python ${esc(v)}${isCurrent ? ' (current)' : ''}</div>`;
            }
        }

        h += `<div class="mp-muted" style="margin-top:0.4rem">Wider compatibility means this module can run in more environments. ${count >= 4 ? 'This is a strong compatibility range.' : count <= 2 ? 'Consider whether wider support is needed.' : ''}</div>`;
        return h;
    }

    function _peekFloor(item) {
        const rank = item.rank || 'unknown';
        const emoji = RANK_EMOJI[rank] || '⚪';
        const eol = item.eol_date || '';
        const cves = item.cves || [];
        const effClean = (item.effective_floor || '').replace('≥', '');

        let h = '';

        if (rank === 'current') {
            h += `<div class="mp-title">${emoji} Floor is healthy</div>`;
            h += `<div class="mp-row">Python ${esc(effClean)} is actively maintained and receives security patches. You're in good shape.</div>`;
        } else if (rank === 'outdated') {
            h += `<div class="mp-title">${emoji} Floor approaching end-of-life</div>`;
            h += `<div class="mp-row warn">Python ${esc(effClean)} reaches end-of-life in <strong>${esc(eol)}</strong>. After that date, no more security patches will be released.</div>`;
            h += `<div class="mp-muted">This doesn't mean things break immediately, but any new vulnerabilities discovered after EOL won't be patched.</div>`;
        } else if (rank === 'deprecated') {
            h += `<div class="mp-title">${emoji} Floor is past end-of-life</div>`;
            h += `<div class="mp-row warn">Python ${esc(effClean)} is past its end-of-life date (${esc(eol)}). It no longer receives any updates.</div>`;
            h += `<div class="mp-muted">Deployments on this version are running unpatched software.</div>`;
        } else if (rank === 'dangerous') {
            h += `<div class="mp-title">${emoji} Floor has known vulnerabilities</div>`;
            h += `<div class="mp-row warn">Python ${esc(effClean)} has <strong>${cves.length} known CVE(s)</strong>:</div>`;
            for (const c of cves) {
                h += `<div class="mp-row warn" style="padding-left:0.75rem">• <code>${esc(c)}</code></div>`;
            }
            h += `<div class="mp-muted" style="margin-top:0.4rem">Deployments on this version are exposed to these vulnerabilities. Consider raising the effective floor.</div>`;
        } else {
            h += `<div class="mp-title">${emoji} Floor health unknown</div>`;
            h += `<div class="mp-row">Unable to determine the health status of this floor version.</div>`;
        }

        if (item.version_note) {
            h += '<div class="mp-divider"></div>';
            h += `<div class="mp-row">📝 <em>${esc(item.version_note)}</em></div>`;
        }
        return h;
    }

    function _peekStatus(item) {
        const verdict = item.verdict || '';
        const detail = item.verdict_detail || '';
        const name = item._moduleName || '';
        const effClean = (item.effective_floor || '').replace('≥', '');
        const declared = (item.value || '').replace('≥', '');

        let h = '';
        if (verdict === 'consistent') {
            h += '<div class="mp-title">✅ Everything lines up</div>';
            h += `<div class="mp-row">This module's declared floor matches what its code and dependencies actually need. No action required.</div>`;
            if (item.version_note) {
                h += '<div class="mp-divider"></div>';
                h += `<div class="mp-row">📝 <em>${esc(item.version_note)}</em></div>`;
            }
        } else if (verdict === 'gap') {
            h += '<div class="mp-title">⚠️ Compatibility gap</div>';
            h += `<div class="mp-row warn">This module claims to support Python ${esc(declared)}+, but it actually needs <strong>${esc(effClean)}+</strong> to run.</div>`;

            // Explain what drives the gap
            const deps = item.deps_details || [];
            const features = item.code_features || [];

            if (deps.length) {
                const sorted = [...deps].sort((a,b) => {
                    const av = (a.floor||'').split('.').map(Number);
                    const bv = (b.floor||'').split('.').map(Number);
                    return (bv[1]||0) - (av[1]||0);
                });
                h += `<div class="mp-muted" style="margin-top:0.3rem">• <strong>${esc(sorted[0].package)}</strong> requires Python ≥${esc(sorted[0].floor)}</div>`;
            }
            if (features.length) {
                h += `<div class="mp-muted">• Code uses <strong>${esc(features[0].feature)}</strong> which needs Python ${esc(features[0].version)}+</div>`;
            }

            h += `<div class="mp-row" style="margin-top:0.5rem">If someone tries to run this module on Python ${esc(declared)}, it will fail.</div>`;

            if (item.version_note) {
                h += '<div class="mp-divider"></div>';
                h += `<div class="mp-row">📝 <em>${esc(item.version_note)}</em></div>`;
            }

            h += '<div class="mp-actions">';
            h += `<button class="posture-btn posture-btn-update" onclick="_moduleHidePeek();moduleRemediate('${esc(name)}')">🔧 What can I do?</button>`;
            h += `<button class="posture-btn" onclick="_moduleHidePeek();moduleViewReport('${esc(name)}')">📋 Full report</button>`;
            h += '</div>';
        } else if (verdict === 'could_lower') {
            h += '<div class="mp-title">ℹ️ Floor could be lower</div>';
            h += `<div class="mp-row">The declared floor is ${esc(declared)}, but neither the code nor the dependencies need more than <strong>${esc(effClean)}</strong>.</div>`;
            h += '<div class="mp-muted">This module could support a wider range of Python versions if you lower the declared floor. This is informational — no action is required.</div>';

            h += '<div class="mp-actions">';
            h += `<button class="posture-btn posture-btn-update" onclick="_moduleHidePeek();moduleRemediate('${esc(name)}')">🔧 Options</button>`;
            h += '</div>';
        } else {
            h += '<div class="mp-title">— No analysis available</div>';
            h += '<div class="mp-row">This module doesn\'t have enough data for a compatibility verdict.</div>';
        }
        return h;
    }

    // ── Action handlers ─────────────────────────────────────
    window.moduleAcknowledge = function(moduleName) {
        if (typeof modalOpen !== 'function') return;
        const bodyHtml = typeof modalFormField === 'function'
            ? modalFormField({ name: 'note', label: 'Version Note', type: 'textarea',
                placeholder: 'Explain why this gap is acceptable or what the plan is...',
                hint: 'Saved to project.yml as version_note' })
            : '<textarea id="mf-note" style="width:100%;min-height:80px" placeholder="Note..."></textarea>';

        modalOpen({
            title: '📝 Acknowledge: ' + moduleName,
            replace: false,
            body: bodyHtml,
            size: 'md',
            footerButtons: [
                { label: '💾 Save', cls: 'btn-primary', onclick: "moduleSaveNote('" + moduleName + "')" },
                { label: 'Cancel', onclick: 'modalClose()' },
            ],
        });
    };

    window.moduleSaveNote = async function(moduleName) {
        const note = typeof mfVal === 'function' ? mfVal('note') : (document.getElementById('mf-note') || {}).value || '';
        try {
            const resp = await fetch('/api/posture/module-note', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module: moduleName, version_note: note }),
            });
            if (resp.ok) {
                toast('📝 Note saved for ' + moduleName, 'success');
                modalClose();
                if (typeof postureRescan === 'function') postureRescan();
            } else {
                const data = await resp.json();
                toast('⚠️ ' + (data.error || 'Failed to save'), 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    };

    window.moduleViewReport = function(moduleName) {
        const item = _modulePeekItems.find(i => i._moduleName === moduleName);
        if (!item || typeof modalOpen !== 'function') return;

        let body = '';
        body += '<div style="display:flex;flex-direction:column;gap:1rem">';

        // Declared section
        body += '<div>' + _peekDeclared(item) + '</div>';

        // Deps section
        body += '<div>' + _peekDeps(item) + '</div>';

        // Code section
        body += '<div>' + _peekCode(item) + '</div>';

        // Effective
        body += '<div>' + _peekEffective(item) + '</div>';

        // Floor health
        body += '<div>' + _peekFloor(item) + '</div>';

        body += '</div>';

        modalOpen({
            title: '📋 Full Report: ' + moduleName,
            replace: false,
            body: body,
            size: 'wide',
            footerButtons: [
                { label: 'Close', onclick: 'modalClose()' },
            ],
        });
    };

    // ═══════════════════════════════════════════════════════════
    // ── Remediation Modal System ─────────────────────────────
    // ═══════════════════════════════════════════════════════════

    window.moduleRemediate = function(moduleName) {
        const item = _modulePeekItems.find(i => i._moduleName === moduleName);
        if (!item || typeof modalOpen !== 'function') return;
        _moduleHidePeek();

        const verdict = item.verdict || '';
        const rank = item.rank || '';

        // Determine primary situation
        let situation = 'ok';
        if (verdict === 'gap') situation = 'gap';
        else if (rank === 'dangerous') situation = 'cve';
        else if (rank === 'outdated' || rank === 'deprecated') situation = 'eol';
        else if (verdict === 'could_lower') situation = 'could_lower';

        const titles = {
            gap: '⚠️ ' + moduleName + ' — Compatibility Gap',
            cve: '🔴 ' + moduleName + ' — Vulnerability Exposure',
            eol: '🟡 ' + moduleName + ' — End-of-Life Floor',
            could_lower: 'ℹ️ ' + moduleName + ' — Wider Compatibility Possible',
            ok: '✅ ' + moduleName + ' — All Good',
        };

        modalOpen({
            title: titles[situation] || moduleName,
            replace: false,
            body: _remBuildBody(item, situation),
            size: 'wide',
            footerButtons: [
                { label: 'Close', onclick: 'modalClose()' },
            ],
        });
    };

    function _remBuildBody(item, situation) {
        let html = '';
        html += _remSummary(item, situation);
        html += _remSection('understand', '🔍 Understand — why is this happening?',
            _remUnderstand(item, situation), true);
        html += _remSection('fix', '🔧 Fix — what can I do about it?',
            _remFix(item, situation));
        html += _remSection('decide', '📝 Decide — record a decision',
            _remDecide(item, situation));
        html += _remSection('track', '📋 Track — plan for the future',
            _remTrack(item, situation));
        return html;
    }

    function _remSection(id, title, content, expanded) {
        if (!content) return '';
        return `
            <div class="rem-section ${expanded ? 'expanded' : ''}" id="rem-${id}">
                <div class="rem-section-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <span class="rem-section-chevron">▸</span>
                    <span>${title}</span>
                </div>
                <div class="rem-section-body">${content}</div>
            </div>
        `;
    }

    function _remOption(id, title, content, opts) {
        const badge = opts && opts.badge ? `<span class="rem-option-badge ${opts.badge}">${opts.badgeLabel || opts.badge}</span>` : '';
        return `
            <div class="rem-option ${opts && opts.recommended ? 'recommended' : ''}" id="rem-opt-${id}">
                <div class="rem-option-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <span>${title}</span>
                    ${badge}
                </div>
                <div class="rem-option-body">${content}</div>
            </div>
        `;
    }

    // ═══════════════════════════════════════════════════════════
    // ── Content Functions (with admonitions) ─────────────────
    // ═══════════════════════════════════════════════════════════

    // Helper: sort deps by floor descending
    function _sortDeps(deps) {
        return [...deps].sort((a,b) => {
            const av = (a.floor||'').split('.').map(Number);
            const bv = (b.floor||'').split('.').map(Number);
            for (let i = 0; i < Math.max(av.length, bv.length); i++) {
                if ((bv[i]||0) !== (av[i]||0)) return (bv[i]||0) - (av[i]||0);
            }
            return 0;
        });
    }

    // ── Summary ──────────────────────────────────────────────

    function _remSummary(item, situation) {
        const n = item._moduleName;
        const declared = (item.value || '').replace('≥', '');
        const effClean = (item.effective_floor || '').replace('≥', '');
        const source = item.floor_source || '';
        const eol = item.eol_date || '';
        const cves = item.cves || [];
        const deps = item.deps_details || [];
        const features = item.code_features || [];
        const meta = item.module_meta || {};

        const cls = { gap: '', cve: 'danger', eol: '', could_lower: 'info', ok: 'ok' }[situation] || '';

        let h = `<div class="rem-summary ${cls}">`;

        if (situation === 'gap') {
            h += `<strong>${esc(n)}</strong> declares support for Python ${esc(declared)}+, but actually needs <strong>${esc(effClean)}+</strong> to run.`;
            h += '</div>';
            const sorted = _sortDeps(deps);
            if (sorted.length) {
                h += _adm('warning', 'Deployment risk',
                    `If someone runs this module on Python ${esc(declared)}, it will crash at import time. <code>${esc(sorted[0].package)}</code> requires Python ≥${esc(sorted[0].floor)}.`);
            }
            h += _adm('info', 'Why this happens',
                `The declared floor (<code>${esc(declared)}</code>) comes from the ${source === 'stack' ? '<strong>' + esc(item.stack) + '</strong> stack baseline' : esc(source) + ' config'}. Your module's actual dependencies and code need more than what's declared.`);
        } else if (situation === 'cve') {
            h += `<strong>${esc(n)}</strong>'s effective floor (Python ${esc(effClean)}) has <strong>${cves.length} known vulnerability(ies)</strong>.`;
            h += '</div>';
            h += _adm('danger', 'Security exposure',
                `<code>${cves.map(c => esc(c)).join('</code>, <code>')}</code> affect Python ${esc(effClean)}. Deployments on this version are running unpatched software with known vulnerabilities.`);
            h += _adm('info', 'What this means',
                `The vulnerability exists in the Python interpreter itself. The only fix is ensuring your module runs on a patched version above ${esc(effClean)}.`);
        } else if (situation === 'eol') {
            h += `<strong>${esc(n)}</strong>'s effective floor (Python ${esc(effClean)}) reaches end-of-life in <strong>${esc(eol)}</strong>.`;
            h += '</div>';
            h += _adm('warning', 'Upcoming deadline',
                `Python ${esc(effClean)} stops receiving security patches in <strong>${esc(eol)}</strong>. After that date, new vulnerabilities discovered won't be fixed for this version.`);
            h += _adm('tip', 'Your module will keep working',
                `Nothing breaks at the EOL date. The risk increases gradually as unpatched vulnerabilities accumulate. The ecosystem will naturally move forward — package maintainers will drop support over time.`);
        } else if (situation === 'could_lower') {
            h += `<strong>${esc(n)}</strong> declares Python ${esc(declared)}+, but only needs <strong>${esc(effClean)}+</strong>.`;
            h += '</div>';
            h += _adm('tip', 'Opportunity for wider compatibility',
                meta.domain === 'library'
                    ? `As a <strong>library</strong>, wider compatibility means more users can use your module. You could lower the floor to support more Python versions.`
                    : `As an <strong>application module</strong>, this is informational. You control the deployment environment, so wider compatibility is less critical.`);
        } else {
            h += `<strong>${esc(n)}</strong> is in good shape. All compatibility layers are aligned and the floor is healthy.`;
            h += '</div>';
            h += _adm('success', 'All clear',
                `The declared floor matches what your code and dependencies actually need, and the floor version is still receiving security patches.`);
        }

        return h;
    }

    // ── Understand section ───────────────────────────────────

    function _remUnderstand(item, situation) {
        const n = item._moduleName;
        const declared = (item.value || '').replace('≥', '');
        const effClean = (item.effective_floor || '').replace('≥', '');
        const source = item.floor_source || '';
        const deps = item.deps_details || [];
        const features = item.code_features || [];
        const eol = item.eol_date || '';
        const cves = item.cves || [];
        const meta = item.module_meta || {};
        const tiers = item.floor_tiers || {};

        let h = '';

        if (situation === 'gap') {
            if (source === 'stack') {
                h += `<p style="margin:0 0 0.75rem">The declared floor <code>${esc(declared)}</code> comes from the <strong>${esc(item.stack)}</strong> stack definition — it's the general baseline for this technology. But your specific module needs more because of what it imports and what code patterns it uses.</p>`;
            } else {
                h += `<p style="margin:0 0 0.75rem">Your ${esc(source)} config declares <code>≥${esc(declared)}</code>, but the module's actual dependencies and code require <code>≥${esc(effClean)}</code>.</p>`;
            }

            if (deps.length) {
                const sorted = _sortDeps(deps);
                h += '<div class="rem-preview" style="margin:0.5rem 0">';
                for (const d of sorted) { h += `${esc(d.package)}  requires Python ${esc(d.requires_python)}\n`; }
                h += '</div>';
            }
            if (features.length) {
                h += '<div class="rem-preview" style="margin:0.5rem 0">';
                for (const f of features) {
                    const short = (f.file || '').split('/').slice(-2).join('/');
                    h += `Python ${esc(f.version)}+  ${esc(f.feature)}  in ${esc(short)}:${f.line}\n`;
                }
                h += '</div>';
            }

            h += _adm('tip', 'If you only deploy on Python 3.12+',
                `The gap is cosmetic. Nothing breaks in your actual deployment. You can acknowledge it with a note and move on.`);
            h += _adm('warning', 'If this is a published library',
                `Users on Python ${esc(declared)} will install it and get import errors. The declared floor is misleading and should be fixed.`);

        } else if (situation === 'cve') {
            for (const c of cves) {
                h += _adm('danger', esc(c),
                    `Affects Python ${esc(effClean)} and below. This vulnerability exists in the Python interpreter itself.`);
            }
            if (declared !== effClean) {
                h += _adm('warning', 'Real deployment risk',
                    `Your effective floor IS <code>${esc(effClean)}</code>, which has the vulnerability. If you deploy on this version, you're exposed.`);
            } else {
                h += _adm('danger', 'Direct exposure',
                    `Your effective floor is the vulnerable version. Deployments on Python ${esc(effClean)} are running unpatched software.`);
            }

        } else if (situation === 'eol') {
            h += `<p style="margin:0 0 0.5rem">Python ${esc(effClean)} stops receiving security patches in <strong>${esc(eol)}</strong>. After that date, any new vulnerabilities discovered won't be fixed.</p>`;
            h += _adm('info', 'What usually happens after EOL',
                `Package maintainers start dropping support for EOL versions. Over time, you won't be able to get the latest versions of your dependencies on Python ${esc(effClean)}. The ecosystem moves forward naturally.`);
            h += _adm('tip', 'You may not need to act',
                `As dependencies release new versions requiring newer Python, your effective floor will naturally rise. If you're not deploying on ${esc(effClean)}, the ecosystem handles this for you.`);

        } else if (situation === 'could_lower') {
            h += `<p style="margin:0 0 0.5rem">Your module only uses Python ${esc(effClean)}+ features, but declares ${esc(declared)}+.</p>`;
            h += _adm(meta.domain === 'library' ? 'tip' : 'info',
                meta.domain === 'library' ? 'Library benefit' : 'Informational',
                meta.domain === 'library'
                    ? `As a library, wider compatibility means more potential users. Lowering the floor would allow users on Python ${esc(effClean)} through ${esc(declared)} to use this module.`
                    : `As an application module, wider compatibility is less critical since you control the deployment environment. This is informational — no action is typically needed.`);

        } else {
            h += _adm('success', 'All layers aligned',
                `The declared floor matches what your code and dependencies actually need, and the floor version is still receiving security patches.`);
        }

        // Detection transparency — always show how we analyzed this
        if (situation !== 'ok') {
            h += _adm('info', 'How this was analyzed',
                `<strong>Declared floor:</strong> from ${
                    tiers.used === 'stack' ? esc(item.stack) + ' stack definition'
                    : tiers.used === 'module' ? 'module config'
                    : tiers.used === 'project' ? 'project root config'
                    : 'unknown source'
                }<br>
                <strong>Dependency floor:</strong> scanned imports in <code>${esc(meta.path || '?')}</code> → ${deps.length} package(s) with Python constraints<br>
                <strong>Code floor:</strong> scanned .py files for version-specific syntax → ${features.length} feature(s) detected<br>
                <strong>Effective floor:</strong> highest of all three = <code>${esc(effClean)}</code>`);
        }

        return h;
    }

    // ── Fix section ──────────────────────────────────────────

    function _remFix(item, situation) {
        const n = item._moduleName;
        const declared = (item.value || '').replace('≥', '');
        const effClean = (item.effective_floor || '').replace('≥', '');
        const meta = item.module_meta || {};
        const deps = item.deps_details || [];
        const features = item.code_features || [];

        if (situation === 'ok') return '';

        let h = '';

        // ── Option: Raise the floor (gap, cve, eol) ─────────
        if (situation === 'gap' || situation === 'cve' || situation === 'eol') {
            const targetFloor = effClean || declared;
            let optA = '';
            optA += _adm('tip', 'What this does',
                `Creates a <code>pyproject.toml</code> in <code>${esc(meta.path || n)}/</code> that declares <code>requires-python = ">=${esc(targetFloor)}"</code>. This makes the module honest about what it actually needs.`);
            optA += '<div class="rem-preview">';
            optA += '<span class="context"># ' + esc(meta.path || n) + '/pyproject.toml</span>\n';
            optA += '[project]\nname = "' + esc(n) + '"\n';
            optA += '<span class="added">requires-python = ">=' + esc(targetFloor) + '"</span>\n';
            optA += '</div>';
            optA += _adm('warning', 'Consequence',
                `Anyone trying to install this module on Python below ${esc(targetFloor)} will get an error from pip: <em>"requires Python >=${esc(targetFloor)} but Python ${esc(declared)} is installed."</em> If nobody deploys on ${esc(declared)}, this has no practical impact.`);
            optA += _adm('info', 'What happens after',
                `• Declared floor: <code>${esc(declared)}</code> (${esc(item.floor_source || 'stack')}) → <code>${esc(targetFloor)}</code> (module config)<br>• Status: ⚠️ → ✅ consistent<br>• Floor source: ${esc(item.floor_source || 'stack')} → module config<br>• The posture table updates immediately after applying.`);
            optA += _adm('tip', 'This is reversible',
                `You can delete the created <code>pyproject.toml</code> to revert to the stack baseline. The platform will re-detect on next scan.`);
            optA += `<div style="display:flex;gap:0.5rem;margin-top:0.5rem">`;
            optA += `<button class="btn btn-sm btn-primary" onclick="_remConfirmRaiseFloor('${esc(n)}','${esc(targetFloor)}')">Apply this fix</button>`;
            optA += `<button class="btn btn-sm btn-ghost" onclick="modulePreviewFloorFix('${esc(n)}','${esc(targetFloor)}')">Preview only</button>`;
            optA += `</div>`;
            h += _remOption('raise', '🔧 Raise the declared floor to ≥' + esc(targetFloor), optA,
                { recommended: true, badge: 'recommended', badgeLabel: 'Recommended' });
        }

        // ── Option: Lower the effective (gap only, advanced) ─
        if (situation === 'gap') {
            let optB = '';
            optB += _adm('danger', 'This is complex and risky',
                `Lowering the effective floor means downgrading dependencies or rewriting code. Older package versions may have unpatched security vulnerabilities and missing features. Only do this if you have a strong reason to support Python ${esc(declared)}.`);
            if (deps.length) {
                optB += '<div class="rem-preview" style="margin:0.5rem 0">';
                for (const d of deps) { optB += esc(d.package) + ' — currently needs ≥' + esc(d.floor) + '\n'; }
                optB += '</div>';
                optB += _adm('warning', 'Downgrade risks',
                    `Older versions may have:<br>• Known security vulnerabilities (unpatched CVEs)<br>• Missing features your code depends on<br>• Incompatibilities with other packages in your project`);
                for (const d of deps) {
                    optB += `<button class="btn btn-sm btn-ghost" style="margin:0.2rem" onclick="moduleFindAlternatives('${esc(d.package)}','${esc(declared)}',this)">Find alternatives for ${esc(d.package)}</button>`;
                }
            }
            if (features.length) {
                optB += '<div class="rem-preview" style="margin:0.5rem 0">';
                for (const f of features) {
                    const short = (f.file || '').split('/').slice(-2).join('/');
                    optB += esc(f.feature) + ' → needs rewrite in ' + esc(short) + ':' + f.line + '\n';
                }
                optB += '</div>';
            }
            h += _remOption('lower', '⬇️ Lower the effective floor to ≥' + esc(declared) + ' (advanced)', optB,
                { badge: 'advanced', badgeLabel: 'Advanced' });
        }

        // ── Option: Wait for ecosystem (eol only) ────────────
        if (situation === 'eol') {
            let optW = '';
            optW += _adm('info', 'How this works',
                `Your dependencies will naturally raise their floors as Python ${esc(effClean)} approaches EOL. Package maintainers typically drop support within a few months of the EOL date.`);
            optW += _adm('tip', 'When this is appropriate',
                `If you're not deploying on Python ${esc(effClean)} and have time before ${esc(item.eol_date || 'the EOL date')}, the ecosystem will handle the transition for you. Your effective floor will rise naturally as deps update.`);
            h += _remOption('wait', '⏳ Wait for the ecosystem to move forward', optW);
        }

        if (situation === 'could_lower') {

            optL += _adm('info', 'What this means',

            optL += _adm('warning', 'Consider the tradeoff',

            h += _remOption('lower-declared', '⬇️ Lower floor to ≥' + esc(effClean), optL);

            let optK = '';
            optK += _adm('tip', 'This is fine',

            h += _remOption('accept-current', '✅ Keep the current floor (no action needed)', optK);
        }

        // ── Option: Do nothing (all situations except ok/could_lower) ──
        if (situation === 'gap' || situation === 'cve' || situation === 'eol') {
            let optN = '';
            if (situation === 'gap') {
                optN += _adm('info', 'What happens if you don\'t act',

                optN += _adm('tip', 'When doing nothing is fine',

            } else if (situation === 'eol') {
                optN += _adm('warning', 'What happens if you don\'t act',
                    `After ${esc(item.eol_date || 'EOL')}, Python ${esc(effClean)} stops receiving patches. Your module keeps working, but new vulnerabilities won't be fixed. Package maintainers will eventually drop support.`);
                optN += _adm('tip', 'The ecosystem usually handles this',

            }
            h += _remOption('do-nothing', '🤷 Do nothing — keep current state', optN);
        }

        return h;
    }

    window.moduleOpenPlan = async function(moduleName) {
        const item = _modulePeekItems.find(i => i._moduleName === moduleName);
        if (!item || !item.version_plan || typeof modalOpen !== 'function') {
            // Fallback: try loading directly from API
            return moduleOpenPlanDirect(moduleName);
        }

        const plan = item.version_plan;
        const checklist = plan.checklist || [];
        const target = plan.target || '?';
        const planDate = plan.date || '?';
        const met = plan.met;
        const overdue = plan.overdue;

        // Load fresh plan data from API (checklist has done flags)
        let freshChecklist = checklist;
        try {
            const resp = await fetch('/api/posture/module-plan-detail?module=' + encodeURIComponent(moduleName));
            if (resp.ok) {
                const data = await resp.json();
                if (data.checklist) freshChecklist = data.checklist;
            }
        } catch (e) { /* use enrichment data as fallback */ }

        _renderPlanModal(moduleName, target, planDate, freshChecklist, met, overdue);
    };

    function _renderPlanModal(moduleName, target, planDate, freshChecklist, met, overdue) {
        const doneCount = freshChecklist.filter(s => s.done).length;
        const totalCount = freshChecklist.length || 1;
        const pct = Math.round((doneCount / totalCount) * 100);

        let body = '';
        body += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">`;
        body += `<div><strong>Target:</strong> ≥${esc(target)}</div>`;
        body += `<div><strong>Deadline:</strong> ${esc(planDate)}</div>`;
        body += `</div>`;

        // Progress bar
        body += `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem">`;
        body += `<div class="plan-progress-bar" style="flex:1"><div class="plan-progress-fill" style="width:${pct}%"></div></div>`;
        body += `<span style="font-size:0.82rem;color:var(--text-muted)">${doneCount}/${totalCount} (${pct}%)</span>`;
        body += `</div>`;

        if (met) {
            body += _adm('success', 'Plan complete!', 'The effective floor meets or exceeds the target. This plan has been achieved.');
        } else if (overdue) {
            body += _adm('warning', 'Plan overdue', `The target date (${esc(planDate)}) has passed but the floor hasn't reached ≥${esc(target)} yet.`);
        }

        // Batch button container — dynamically updated by _refreshPlanState()
        body += `<div id="plan-batch-container" data-module="${esc(moduleName)}"></div>`;

        // Checklist
        body += '<div id="plan-checklist">';
        for (let i = 0; i < freshChecklist.length; i++) {
            const step = freshChecklist[i];
            const done = step.done || false;
            const canAutomate = step.automatable && step.automation_id && !done;
            const stepId = step.id || '';
            const cat = step.category || '';
            const catBadge = cat ? `<span class="plan-step-cat">${esc(cat)}</span>` : '';

            const desc = step.description || '';
            body += `<div class="plan-step ${done ? 'done' : ''}" data-step-id="${esc(stepId)}">
                <input type="checkbox" class="plan-step-check" ${done ? 'checked' : ''}
                    onchange="modulePlanToggleStep('${esc(moduleName)}',${i},this.checked)">
                <div class="plan-step-content">
                    <div class="plan-step-label">${catBadge}${esc(step.label)}</div>
                    ${desc ? '<div class="plan-step-desc">' + esc(desc) + '</div>' : ''}
                </div>`;
            if (canAutomate) {
                body += `<button class="plan-step-auto" onclick="modulePlanAutomate('${esc(moduleName)}','${esc(stepId)}',${i})" title="Run automation">🔧 Automate</button>`;
            }
            body += `<div class="plan-step-remove" onclick="modulePlanRemoveStep('${esc(moduleName)}',${i})" title="Remove step">✕</div>
            </div>`;
            // Preview area (hidden until automation is clicked)
            body += `<div class="plan-step-preview" id="plan-preview-${i}" style="display:none"></div>`;
        }
        body += '</div>';

        // Add step
        body += `<div style="margin-top:0.75rem;display:flex;gap:0.5rem">
            <div style="flex:1;display:flex;flex-direction:column;gap:0.3rem">
                <input id="plan-new-step" type="text" placeholder="Step label..." style="padding:0.4rem 0.6rem;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.82rem">
                <input id="plan-new-step-desc" type="text" placeholder="Description (optional)" style="padding:0.3rem 0.6rem;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:0.78rem">
            </div>
            <button class="btn btn-sm btn-ghost" onclick="modulePlanAddStep('${esc(moduleName)}')" style="align-self:flex-start;margin-top:0.15rem">➕ Add</button>
        </div>`;

        body += _adm('info', 'How this works',
            'Check off items as you complete them. The checklist structure is shared with your team via <code>project.yml</code>.');

        modalOpen({
            title: '📋 Version Plan: ' + moduleName,
            replace: false,
            body: body,
            size: 'md',
            footerButtons: [
                { label: '❌ Clear plan', cls: 'btn-danger', onclick: "_remConfirmClearPlan('" + esc(moduleName) + "')" },
                { label: 'Close', onclick: 'modalClose()' },
            ],
        });

        // Initial state evaluation (batch buttons, automate colors)
        setTimeout(_refreshPlanState, 0);
    }

    // ── Plan automation: preview + execute ──────────────────────

    window.modulePlanAutomate = async function(moduleName, stepId, stepIndex) {
        const aid = stepId.split(':')[0] || '';

        // Route wizard-eligible steps to the wizard modal
        if (aid.startsWith('run_')) {
            return modulePlanWizard(moduleName, stepId, stepIndex, 'subprocess');
        }
        if (aid.startsWith('check_dep_compat_') || aid.startsWith('update_deps_')) {
            return modulePlanWizard(moduleName, stepId, stepIndex, 'dep_scan');
        }

        // Everything else: inline preview
        const previewEl = document.getElementById('plan-preview-' + stepIndex);
        if (!previewEl) return;

        // Toggle: if already showing, hide
        if (previewEl.style.display !== 'none') {
            previewEl.style.display = 'none';
            previewEl.innerHTML = '';
            return;
        }

        previewEl.style.display = 'block';
        previewEl.innerHTML = '<span class="spinner" style="margin:0.5rem"></span> Running preview...';

        try {
            const resp = await fetch('/api/posture/module-step-execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module: moduleName, step_id: stepId, mode: 'preview' }),
            });
            const data = await resp.json();

            if (!data.ok) {
                previewEl.innerHTML = _adm('warning', 'Preview failed', esc(data.error || 'Unknown error'));
                return;
            }

            let html = '';
            const ptype = data.preview_type || 'info';

            // Summary
            if (data.summary) {
                html += `<div class="plan-preview-summary">${esc(data.summary)}</div>`;
            }

            // Detail text
            if (data.detail) {
                html += `<div class="plan-preview-detail">${esc(data.detail)}</div>`;
            }

            // Diff preview (config edits)
            if (ptype === 'diff') {
                html += '<div class="plan-preview-diff">';
                if (data.file) html += `<div class="plan-preview-file">📄 ${esc(data.file)}</div>`;
                if (data.old_value) html += `<div class="plan-preview-old">− ${esc(data.old_value)}</div>`;
                if (data.new_value) html += `<div class="plan-preview-new">+ ${esc(data.new_value)}</div>`;
                html += '</div>';
            }

            // Findings list (code scan, dep check)
            if (ptype === 'findings' && data.findings && data.findings.length) {
                html += '<div class="plan-preview-findings">';
                for (const f of data.findings.slice(0, 20)) {
                    if (f.feature) {
                        // Code scan finding
                        html += `<div class="plan-preview-finding">`;
                        html += `<code>${esc(f.file || '')}${f.line ? ':' + f.line : ''}</code> `;
                        html += `<span>${esc(f.feature)}</span> `;
                        if (f.version) html += `<span class="plan-preview-tag">${esc(f.version)}+</span>`;
                        html += '</div>';
                    } else if (f.package) {
                        // Dep check finding
                        const icon = f.compatible ? '✅' : (f.unknown ? '❓' : '❌');
                        html += `<div class="plan-preview-finding">`;
                        html += `${icon} <strong>${esc(f.package)}</strong>`;
                        if (f.version) html += ` ${esc(f.version)}`;
                        html += ` <span class="plan-preview-tag">${esc(f.requires_python || '')}</span>`;
                        if (f.note) html += ` <em>${esc(f.note)}</em>`;
                        html += '</div>';
                    } else if (f.file) {
                        // File list (__future__ etc.)
                        html += `<div class="plan-preview-finding"><code>${esc(f.file)}</code></div>`;
                    }
                }
                if (data.findings.length > 20) {
                    html += `<div class="plan-preview-detail">...and ${data.findings.length - 20} more</div>`;
                }
                html += '</div>';
            }

            // Apply button (only for steps that can be applied)
            if (data.can_apply) {
                html += `<div class="plan-preview-actions">
                    <button class="posture-btn posture-btn-update" onclick="modulePlanApplyStep('${esc(moduleName)}','${esc(stepId)}',${stepIndex})">✅ Apply</button>
                </div>`;
            }

            previewEl.innerHTML = html;

        } catch (e) {
            previewEl.innerHTML = _adm('danger', 'Error', esc(e.message));
        }
    };

    window.modulePlanRunBatch = async function(moduleName, fromIdx, toIdx) {
        // Collect step IDs and labels for the batch
        const planSteps = document.querySelectorAll('#plan-checklist .plan-step');
        const stepIds = [];
        const stepLabels = [];
        const stepIndices = [];

        for (let i = fromIdx; i <= toIdx; i++) {
            const stepEl = planSteps[i];
            if (!stepEl || stepEl.classList.contains('done')) continue;
            const autoBtn = stepEl.querySelector('.plan-step-auto');
            if (!autoBtn || autoBtn.style.display === 'none') continue;
            stepIds.push(stepEl.getAttribute('data-step-id') || '');
            stepLabels.push(stepEl.querySelector('.plan-step-label')?.textContent?.trim() || 'Step ' + (i+1));
            stepIndices.push(i);
        }

        if (!stepIds.length) return;

        // Open wizard modal for the batch
        let body = '';
        body += '<div id="wizard-steps"></div>';
        body += '<div id="wizard-log" class="wizard-log"></div>';
        body += '<div id="wizard-result"></div>';

        modalOpen({
            title: '▶ Running ' + stepIds.length + ' automation steps',
            replace: false,
            body: body,
            size: 'lg',
            footerButtons: [
                { label: 'Close', onclick: 'modalClose()' },
            ],
        });

        const stepsEl = document.getElementById('wizard-steps');
        const logEl = document.getElementById('wizard-log');
        const resultEl = document.getElementById('wizard-result');

        await streamSSE('/api/posture/module-wizard', {
            module: moduleName,
            wizard_type: 'batch',
            step_ids: stepIds,
            step_labels: stepLabels,
        }, {
            onLog: function(line) {
                const el = document.createElement('div');
                el.className = 'wizard-log-line';
                el.textContent = line;
                logEl.appendChild(el);
                logEl.scrollTop = logEl.scrollHeight;
            },
            onStepStart: function(event) {
                const el = document.createElement('div');
                el.className = 'wizard-step running';
                el.id = 'wizard-step-' + event.step;
                el.innerHTML = `<span class="wizard-step-icon">⏳</span> <span class="wizard-step-label">${esc(event.label)}</span>`;
                stepsEl.appendChild(el);
            },
            onStepDone: function(event) {
                const el = document.getElementById('wizard-step-' + event.step);
                if (el) {
                    el.className = 'wizard-step done';
                    const elapsed = event.elapsed_ms ? ` (${(event.elapsed_ms / 1000).toFixed(1)}s)` : '';
                    el.querySelector('.wizard-step-icon').textContent = '✅';
                    el.querySelector('.wizard-step-label').textContent += elapsed;
                }
                // Mark step done in plan modal
                const planIdx = stepIndices[event.step];
                if (planIdx !== undefined && planSteps[planIdx]) {
                    planSteps[planIdx].classList.add('done');
                    const cb = planSteps[planIdx].querySelector('.plan-step-check');
                    if (cb) cb.checked = true;
                    const btn = planSteps[planIdx].querySelector('.plan-step-auto');
                    if (btn) btn.style.display = 'none';
                }
            },
            onStepFailed: function(event) {
                const el = document.getElementById('wizard-step-' + event.step);
                if (el) {
                    el.className = 'wizard-step failed';
                    el.querySelector('.wizard-step-icon').textContent = '❌';
                }
                const errEl = document.createElement('div');
                errEl.className = 'wizard-log-line wizard-log-error';
                errEl.textContent = '❌ ' + (event.error || 'Failed');
                logEl.appendChild(errEl);
            },
            onDone: function(event) {
                if (!resultEl) return;
                if (event.ok) {
                    resultEl.innerHTML = _adm('success', 'Batch complete', esc(event.summary || 'All steps done'));
                } else if (event.remediation) {
                    // Dep check failure with remediation options
                    resultEl.innerHTML = _renderRemediation(event.remediation, moduleName);
                } else {
                    resultEl.innerHTML = _adm('danger', 'Batch stopped', esc(event.summary || event.error || 'Failed'));
                }
                _refreshPlanState();
            },
            onError: function(msg) {
                if (resultEl) resultEl.innerHTML = _adm('danger', 'Error', esc(msg));
            },
        });
    };

    // Central state refresh — called on EVERY state change (checkbox, apply, batch)
    function _refreshPlanState() {
        const steps = document.querySelectorAll('#plan-checklist .plan-step');
        const total = steps.length || 1;
        let doneCount = 0;
        let hasUndonePredecessor = false;

        // ── Pass 1: update progress + automate button colors ────
        for (let i = 0; i < steps.length; i++) {
            const stepEl = steps[i];
            const isDone = stepEl.classList.contains('done');
            if (isDone) { doneCount++; }

            const autoBtn = stepEl.querySelector('.plan-step-auto');
            if (autoBtn) {
                if (isDone) {
                    autoBtn.style.display = 'none';
                } else {
                    // Undone: show button (handles rewind case)
                    autoBtn.style.display = '';
                    if (hasUndonePredecessor) {
                        autoBtn.classList.add('plan-step-auto-warn');
                        autoBtn.classList.remove('plan-step-auto-ready');
                    } else {
                        autoBtn.classList.remove('plan-step-auto-warn');
                        autoBtn.classList.add('plan-step-auto-ready');
                    }
                }
            }

            if (!isDone) { hasUndonePredecessor = true; }
        }

        // ── Progress bar ────────────────────────────────────────
        const pct = Math.round((doneCount / total) * 100);
        const fill = document.querySelector('.plan-progress-fill');
        if (fill) fill.style.width = pct + '%';
        const bar = document.querySelector('.plan-progress-bar');
        if (bar && bar.nextElementSibling) {
            bar.nextElementSibling.textContent = `${doneCount}/${total} (${pct}%)`;
        }

        // ── Batch button: find next automatable chunk ───────────
        const batchContainer = document.getElementById('plan-batch-container');
        if (!batchContainer) return;

        // Find the next batch of automatable undone steps.
        // ALL automatable steps count (inline + wizard).
        // Manual steps (no automate button) are blockers.
        // Done steps are transparent (skipped).
        // We find the first contiguous group of automatable undone steps.
        const moduleName = batchContainer.dataset.module;
        let batchIndices = [];

        for (let i = 0; i < steps.length; i++) {
            const stepEl = steps[i];
            if (stepEl.classList.contains('done')) continue;

            const autoBtn = stepEl.querySelector('.plan-step-auto');
            const hasBtn = autoBtn && autoBtn.style.display !== 'none';

            if (hasBtn) {
                batchIndices.push(i);
            } else {
                // Manual undone step — this is a blocker
                if (batchIndices.length > 0) break; // found batch, stop
                // else keep scanning past this blocker
            }
        }

        if (batchIndices.length > 0) {
            const first = batchIndices[0];
            const last = batchIndices[batchIndices.length - 1];
            const count = batchIndices.length;

            // Check if all steps before the batch are done
            const allPredsDone = !Array.from(steps).slice(0, first).some(
                s => !s.classList.contains('done')
            );
            const label = `▶ Run ${count} automatable step${count > 1 ? 's' : ''}`;

            if (allPredsDone) {
                batchContainer.innerHTML = `<button class="plan-run-all" onclick="modulePlanRunBatch('${esc(moduleName)}',${first},${last})">${label}</button>`;
            } else {
                batchContainer.innerHTML = `<button class="plan-run-all plan-run-all-disabled" disabled title="Complete earlier steps first">${label}</button>`;
            }
        } else {
            batchContainer.innerHTML = '';
        }
    }

    // Backward compat alias
