<script>
// ═══════════════════════════════════════════════════════════════════
// ── System Posture — nav badge + detail modal ─────────────────────
// ═══════════════════════════════════════════════════════════════════
//
// Fetches /api/posture/summary once on load, then subscribes
// to SSE cache:done events for live updates via the mediator.
// Clicking the badge opens a modal with full pillar details.

(function() {
    'use strict';

    // ── Constants ──────────────────────────────────────────────
    let _lastPosture = null;

    // ── Rank → CSS class mapping ─────────────────────────────
    const RANK_CSS = {
        current:    'ok',
        aging:      'ok',
        outdated:   'degraded',
        deprecated: 'degraded',
        dangerous:  'failed',
        unknown:    'degraded',
        na:         'ok',
    };

    const RANK_LABEL = {
        current:    'Healthy',
        aging:      'Aging',
        outdated:   'Outdated',
        deprecated: 'Degraded',
        dangerous:  'Critical',
        unknown:    'Unknown',
        na:         'OK',
    };

    const RANK_EMOJI = {
        current:    '🟢',
        aging:      '🔵',
        outdated:   '🟡',
        deprecated: '🟠',
        dangerous:  '🔴',
        unknown:    '⚪',
        na:         '—',
    };

    // ── Badge update ──────────────────────────────────────────
    function updateBadge(summary) {
        const badge = document.getElementById('health-badge');
        if (!badge) return;

        const rank = summary.overall_rank || 'unknown';
        const cssClass = RANK_CSS[rank] || 'degraded';
        const label = RANK_LABEL[rank] || 'Unknown';

        badge.className = 'status-badge ' + cssClass;
        badge.style.cursor = 'pointer';
        badge.innerHTML = `
            <span class="status-dot"></span>
            <span>${label}</span>
        `;
        badge.onclick = openPostureModal;
        badge.title = summary.summary || 'System Posture — click for details';
    }

    // ── Summary fetch (one-time on load) ──────────────────────
    async function fetchSummary() {
        try {
            const resp = await fetch('/api/posture/summary');
            if (!resp.ok) return;
            const data = await resp.json();
            _lastPosture = data;
            updateBadge(data);
        } catch (e) {
            console.debug('[posture] summary fetch failed:', e);
        }
    }

    function initPosture() {
        // One-time fetch for initial badge state
        fetchSummary();

        // Subscribe to SSE for live updates (replaces polling)
        if (typeof storeRegister === 'function') {
            storeRegister('posture:summary', function(data) {
                _lastPosture = data;
                updateBadge(data);
            });
        }
    }

    // ── Modal ─────────────────────────────────────────────────
    async function openPostureModal() {
        if (typeof modalOpen !== 'function') return;

        const loadingBody = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;gap:1rem;">
                <div class="spinner" style="width:36px;height:36px;"></div>
                <p style="color:var(--text-muted);font-size:0.95rem;">Scanning system posture…</p>
            </div>
        `;

        const overlay = modalOpen({
            title: '🛡️ System Posture',
            body: loadingBody,
            size: 'posture',
            footerButtons: [
                { label: '🔄 Rescan', cls: 'btn-primary', onclick: 'postureRescan()', id: 'posture-rescan-btn' },
                { label: 'Close', onclick: 'modalClose()' },
            ],
            footerStatus: 'Loading…',
        });

        try {
            const resp = await fetch('/api/posture');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            const body = overlay.querySelector('.modal-body');
            if (body) body.innerHTML = renderPosture(data);

            const status = overlay.querySelector('.modal-footer-status');
            if (status) status.textContent = data.summary || '';
        } catch (e) {
            const body = overlay.querySelector('.modal-body');
            if (body) {
                body.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;gap:0.75rem;">
                        <span style="font-size:2rem;">⚠️</span>
                        <p style="color:var(--error);font-size:1rem;font-weight:600;">Failed to load posture data</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">${e.message}</p>
                    </div>
                `;
            }
        }
    }

    // ── Render: top-level ─────────────────────────────────────
    function renderPosture(data) {
        const pillars = data.pillars || {};
        const overall = data.overall_rank || 'unknown';
        const emoji = RANK_EMOJI[overall] || '⚪';

        // ── Overview hero ─────────────────────────────────────
        let html = `
            <div class="posture-hero">
                <div class="posture-hero-left">
                    <span class="posture-hero-emoji">${emoji}</span>
                    <div class="posture-hero-info">
                        <span class="posture-hero-label status-badge ${RANK_CSS[overall] || 'degraded'}">${RANK_LABEL[overall] || 'Unknown'}</span>
                        <span class="posture-hero-summary">${data.summary || ''}</span>
                    </div>
                </div>
                <div class="posture-hero-right">
                    <span class="posture-hero-meta">⏱ ${data.scan_duration_ms || 0}ms</span>
                </div>
            </div>
        `;

        // ── Pillar status bar (at-a-glance) ───────────────────
        const pillarOrder = ['platform', 'toolchain', 'project', 'runtime', 'modules'];
        const pillarIcons = { platform: '💻', toolchain: '🔧', project: '📦', runtime: '⚡', modules: '🧩' };
        const pillarLabels = { platform: 'Platform', toolchain: 'Toolchain', project: 'Project', runtime: 'Runtime', modules: 'Modules' };

        html += '<div class="posture-status-bar">';
        for (const key of pillarOrder) {
            const p = pillars[key];
            if (!p) continue;
            const r = p.rank || 'unknown';
            const e = RANK_EMOJI[r] || '⚪';
            const bad = p.warnings?.length || 0;
            html += `
                <div class="posture-status-chip ${RANK_CSS[r] || 'degraded'}" onclick="document.getElementById('posture-pillar-${key}')?.scrollIntoView({behavior:'smooth',block:'nearest'})">
                    <span class="posture-status-chip-icon">${pillarIcons[key]}</span>
                    <span class="posture-status-chip-label">${pillarLabels[key]}</span>
                    <span class="posture-status-chip-rank">${e}</span>
                    ${bad ? `<span class="posture-status-chip-badge">${bad}</span>` : ''}
                </div>
            `;
        }
        html += '</div>';

        // ── Pillar details ────────────────────────────────────
        html += '<div class="posture-pillars">';
        for (const key of pillarOrder) {
            const pillar = pillars[key];
            if (!pillar) continue;
            if (key === 'modules') {
                html += renderModulePillar(pillar);
            } else {
                html += renderPillar(key, pillar, pillarIcons[key], pillarLabels[key]);
            }
        }
        html += '</div>';
        return html;
    }

    // ── Render: single pillar ────────────────────────────────
    function renderPillar(key, pillar, icon, label) {
        const rank = pillar.rank || 'unknown';
        const emoji = RANK_EMOJI[rank] || '⚪';
        const items = pillar.items || [];
        const warnings = pillar.warnings || [];
        const recommendations = pillar.recommendations || [];
        const hasIssues = warnings.length > 0 || ['dangerous', 'deprecated', 'outdated'].includes(rank);

        // Auto-expand pillars that have warnings — collapse healthy ones
        const expanded = hasIssues ? 'expanded' : '';

        // Batch update button for toolchain pillar
        let batchBtn = '';
        if (key === 'toolchain' && pillar.updatable_count > 0) {
            batchBtn = `<button class="posture-btn posture-btn-batch" onclick="event.stopPropagation();postureUpdateAllOutdated()" title="Update all outdated tools">⬆️ Update All (${pillar.updatable_count})</button>`;
        }

        let html = `
            <div class="posture-pillar ${expanded}" data-rank="${rank}" id="posture-pillar-${key}">
                <div class="posture-pillar-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <span class="posture-pillar-icon">${icon}</span>
                    <span class="posture-pillar-label">${label}</span>
                    <span class="posture-pillar-rank">${emoji}</span>
                    <span class="posture-pillar-count">${items.length}</span>
                    ${batchBtn}
                    <span class="posture-pillar-chevron">▸</span>
                </div>
                <div class="posture-pillar-body">
        `;

        // Item table
        if (items.length > 0) {
            html += '<table class="posture-table"><tbody>';
            for (const item of items) {
                const iRank = item.rank || 'unknown';
                const iEmoji = RANK_EMOJI[iRank] || '⚪';
                const iCss = RANK_CSS[iRank] || 'degraded';

                // Clean up names: "project:git" → "Git"
                let displayName = item.name;
                if (displayName.includes(':')) {
                    displayName = displayName.split(':').pop();
                }
                displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);

                // Action column
                const actionHtml = renderItemAction(item);

                html += `
                    <tr class="posture-row ${iCss}">
                        <td class="posture-cell-emoji">${iEmoji}</td>
                        <td class="posture-cell-name">${displayName}</td>
                        <td class="posture-cell-value">${item.value || ''}</td>
                        <td class="posture-cell-detail">${item.detail || ''}</td>
                        <td class="posture-cell-action">${actionHtml}</td>
                    </tr>
                `;
            }
            html += '</tbody></table>';
        }

        // Warnings
        if (warnings.length > 0) {
            html += '<div class="posture-section-warnings">';
            for (const w of warnings) {
                html += `<div class="posture-warn-line">⚠️ ${w}</div>`;
            }
            html += '</div>';
        }

        // Recommendations
        if (recommendations.length > 0) {
            html += '<div class="posture-section-recs">';
            html += '<div class="posture-recs-title">Recommendations</div>';
            for (const r of recommendations) {
                html += `<div class="posture-rec-line">→ ${r}</div>`;
            }
            html += '</div>';
        }

        html += '</div></div>';
        return html;
    }

    // ── Module peek panel system (follows dep-peek pattern) ────
    let _modulePeekItems = [];  // stored for peek content builders

    function _moduleShowPeek(html, x, y) {
        _moduleHidePeek();
        const el = document.createElement('div');
        el.className = 'module-peek';
        el.id = 'module-peek-card';
        el.innerHTML = html;
        document.body.appendChild(el);

        const rect = el.getBoundingClientRect();
        let left = x + 12;
        let top = y - 20;
        if (left + rect.width > window.innerWidth - 16) left = x - rect.width - 12;
        if (top + rect.height > window.innerHeight - 16) top = window.innerHeight - rect.height - 16;
        if (top < 8) top = 8;
        el.style.left = left + 'px';
        el.style.top = top + 'px';

        setTimeout(() => { document.addEventListener('mousedown', _modulePeekOutside); }, 0);
    }

    function _moduleHidePeek() {
        const el = document.getElementById('module-peek-card');
        if (el) el.remove();
        document.removeEventListener('mousedown', _modulePeekOutside);
    }
    window._moduleHidePeek = _moduleHidePeek;

    function _modulePeekOutside(e) {
        const peek = document.getElementById('module-peek-card');
        if (peek && !peek.contains(e.target)) _moduleHidePeek();
    }

    // Click handler — dispatches to per-column content builder
    window.modulePeek = function(col, idx, evt) {
        const item = _modulePeekItems[idx];
        if (!item) return;
        const builders = {
            module: _peekModule,
            stack: _peekStack,
            declared: _peekDeclared,
            deps: _peekDeps,
            code: _peekCode,
            effective: _peekEffective,
            compat: _peekCompat,
            floor: _peekFloor,
            status: _peekStatus,
        };
        const builder = builders[col];
        if (!builder) return;
        _moduleShowPeek(builder(item), evt.clientX, evt.clientY);
    };

    // ── Per-column content builders (conversational) ───────
    function _peekModule(item) {
        const meta = item.module_meta || {};
        let h = `<div class="mp-title">${esc(item._moduleName)}</div>`;
        if (meta.description) h += `<div class="mp-row">${esc(meta.description)}</div>`;
        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-grid">';
        h += `<span class="mp-grid-label">Path</span><span><code>${esc(meta.path || '')}</code></span>`;
        h += `<span class="mp-grid-label">Domain</span><span>${esc(meta.domain || '')}</span>`;
        h += `<span class="mp-grid-label">Stack</span><span>${esc(item.stack || '')}</span>`;
        h += '</div>';
        const verdict = item.verdict || '';
        if (verdict === 'gap') {
            h += `<div class="mp-muted" style="margin-top:0.5rem">⚠️ This module has a compatibility gap — click the Status column for details and options.</div>`;
        } else if (verdict === 'consistent') {
            h += `<div class="mp-muted" style="margin-top:0.5rem">✅ This module's compatibility layers are aligned.</div>`;
        }
        return h;
    }

    function _peekStack(item) {
        const meta = item.stack_meta || {};
        const stackName = item.stack || '';
        let h = `<div class="mp-title">${esc(stackName)}</div>`;
        if (meta.parent) {
            h += `<div class="mp-row">This is a <strong>${esc(stackName)}</strong> stack, which extends the <code>${esc(meta.parent)}</code> base stack.</div>`;
        } else {
            h += `<div class="mp-row">This is a base <strong>${esc(stackName)}</strong> stack.</div>`;
        }
        if (meta.requires && meta.requires.length) {
            h += '<div class="mp-divider"></div>';
            h += '<div class="mp-section">Runtime requirements</div>';
            for (const r of meta.requires) {
                if (r.min_version) {
                    h += `<div class="mp-row">Needs <strong>${esc(r.adapter)}</strong> version <code>≥${esc(r.min_version)}</code> to run.</div>`;
                } else {
                    h += `<div class="mp-row">Uses <strong>${esc(r.adapter)}</strong> (no specific version required).</div>`;
                }
            }
        }
        if (meta.capabilities && meta.capabilities.length) {
            h += '<div class="mp-section">What this stack can do</div>';
            h += `<div class="mp-row">${meta.capabilities.map(c => '<code>' + esc(c) + '</code>').join(' · ')}</div>`;
        }
        return h;
    }

    function _peekDeclared(item) {
        const tiers = item.floor_tiers || {};
        const t1 = tiers.tier1 || {};
        const t2 = tiers.tier2 || {};
        const t3 = tiers.tier3 || {};
        const used = tiers.used || '';
        const declaredVal = item.value || '—';

        let h = `<div class="mp-title">Declared: ${esc(declaredVal)}</div>`;

        // Explain what "declared" means
        if (used === 'module') {
            h += `<div class="mp-row">This module declares its own Python floor in its config file.</div>`;
        } else if (used === 'stack') {
            h += `<div class="mp-row">This module doesn't have its own config file, so the floor comes from the <strong>${esc(t2.stack_name || '')}</strong> stack definition.</div>`;
        } else if (used === 'project') {
            h += `<div class="mp-row">Neither the module nor its stack declare a floor. This value comes from the project root config.</div>`;
        }

        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-section">How the floor was determined</div>';
        h += `<div class="mp-row ${used === 'module' ? 'active' : (t1.found ? '' : 'dim')}">`;
        h += used === 'module' ? '→ ' : '  ';
        h += `Module config: ${esc(t1.value || '—')}</div>`;

        h += `<div class="mp-row ${used === 'stack' ? 'active' : (t2.found ? '' : 'dim')}">`;
        h += used === 'stack' ? '→ ' : '  ';
        h += `Stack (${esc(t2.stack_name || '')}): ${esc(t2.value || '—')}</div>`;

        h += `<div class="mp-row ${used === 'project' ? 'active' : (t3.found ? '' : 'dim')}">`;
        h += used === 'project' ? '→ ' : '  ';
        h += `Project root: ${esc(t3.value || '—')}</div>`;

        if (used === 'stack' && t3.found) {
            h += `<div class="mp-muted">Note: the project root declares ${esc(t3.value || '')}, which is stricter. But the stack baseline is used because the module has no own config. You can add a <code>requires-python</code> to the module's own <code>pyproject.toml</code> to override this.</div>`;
        }
        return h;
    }

    function _peekDeps(item) {
        const details = item.deps_details || [];
        const depsFloor = item.deps_floor || '—';

        let h = `<div class="mp-title">Dependencies need: ${esc(depsFloor)}</div>`;

        if (!details.length) {
            h += '<div class="mp-row">This module\'s imports don\'t have Python version constraints, or no third-party packages were detected.</div>';
            h += '<div class="mp-muted">The platform scans the module\'s import statements and looks up each package\'s <code>Requires-Python</code> metadata.</div>';
            return h;
        }

        // Sort by floor descending
        const sorted = [...details].sort((a, b) => {
            const av = (a.floor || '').split('.').map(Number);
            const bv = (b.floor || '').split('.').map(Number);
            for (let i = 0; i < Math.max(av.length, bv.length); i++) {
                if ((bv[i] || 0) !== (av[i] || 0)) return (bv[i] || 0) - (av[i] || 0);
            }
            return 0;
        });

        const topPkg = sorted[0];
        h += `<div class="mp-row">The package <strong>${esc(topPkg.package)}</strong> requires Python <code>${esc(topPkg.requires_python)}</code>, which sets the floor for this module.</div>`;

        if (sorted.length > 1) {
            h += '<div class="mp-divider"></div>';
            h += '<div class="mp-section">All dependency constraints</div>';
            for (let i = 0; i < sorted.length; i++) {
                const d = sorted[i];
                const isTop = i === 0;
                h += `<div class="mp-row ${isTop ? 'active' : ''}"><code>${esc(d.package)}</code> needs ${esc(d.requires_python)}${isTop ? ' ← highest' : ''}</div>`;
            }
        }

        h += `<div class="mp-muted">${details.length} package(s) analyzed from this module's imports.</div>`;
        return h;
    }

    function _peekCode(item) {
        const features = item.code_features || [];
        const codeFloor = item.code_floor || '—';

        let h = `<div class="mp-title">Code uses: Python ${esc(codeFloor)}+ features</div>`;

        if (!features.length) {
            h += '<div class="mp-row">No version-specific language features were detected in this module\'s source files.</div>';
            h += '<div class="mp-muted">The platform scans <code>.py</code> files for syntax that requires specific Python versions (match/case, walrus operator, runtime generics, etc.).</div>';
            return h;
        }

        const topFeature = features[0];
        h += `<div class="mp-row">The highest feature found is <strong>${esc(topFeature.feature)}</strong>, which requires Python ${esc(topFeature.version)}+.</div>`;

        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-section">Features found</div>';
        for (const f of features) {
            const shortFile = (f.file || '').split('/').slice(-2).join('/');
            h += `<div class="mp-row"><strong>${esc(f.version)}</strong> — ${esc(f.feature)}</div>`;
            h += `<div class="mp-muted" style="margin-top:0;margin-bottom:0.3rem;padding-left:1rem">found in <code>${esc(shortFile)}:${f.line || '?'}</code></div>`;
        }

        h += `<div class="mp-muted">Files with <code>from __future__ import annotations</code> have their type hints evaluated as strings — they don't raise the floor. Only runtime syntax counts.</div>`;
        return h;
    }

    function _peekEffective(item) {
        const eff = item.effective_floor || '—';
        const effClean = eff.replace('≥', '');
        const declared = (item.value || '').replace('≥', '');
        const deps = (item.deps_floor || '').replace('≥', '');
        const code = item.code_floor || '';

        let h = `<div class="mp-title">Real minimum: Python ${esc(effClean)}+</div>`;
        h += `<div class="mp-row">This is the <strong>highest</strong> of all three layers. It's the actual minimum Python version this module needs to run.</div>`;

        h += '<div class="mp-divider"></div>';
        h += '<div class="mp-section">Layer comparison</div>';

        const layers = [
            { label: 'Declared', value: declared, source: item.floor_source },
            { label: 'Dependencies', value: deps },
            { label: 'Code', value: code },
        ];

        for (const l of layers) {
            const isHighest = l.value === effClean;
            const hasValue = l.value && l.value !== '—' && l.value !== '';
            let line = `<div class="mp-row ${isHighest ? 'active' : (hasValue ? '' : 'dim')}">`;
            line += isHighest ? '→ ' : '  ';
            line += `${l.label}: `;
            if (hasValue) {
                line += `<code>${esc(l.value)}</code>`;
                if (l.source) line += ` <span class="mp-muted" style="display:inline">(from ${esc(l.source)})</span>`;
                if (isHighest) line += ' ← determines the floor';
            } else {
                line += '—';
            }
            line += '</div>';
            h += line;
        }

        if (declared && effClean && declared !== effClean) {
            h += `<div class="mp-muted" style="margin-top:0.5rem">The declared floor (${esc(declared)}) differs from the effective floor (${esc(effClean)}). This means the module claims compatibility with Python ${esc(declared)}+ but actually needs ${esc(effClean)}+.</div>`;
        }
        return h;
    }

    function _peekCompat(item) {
        const count = item.compat_count || 0;
        const range = item.range_display || '';

        let h = `<div class="mp-title">Compatible with ${count} Python version(s)</div>`;

        if (!count) {
            h += '<div class="mp-row">No version range data available.</div>';
            return h;
        }

        h += `<div class="mp-row">This module can run on Python versions <code>${esc(range)}</code>.</div>`;

        const parts = range.split('—').map(s => s.trim());
        if (parts.length === 2) {
            const fromMinor = parseInt(parts[0].split('.')[1] || '0');
            const toMinor = parseInt(parts[1].split('.')[1] || '0');
            const major = parts[0].split('.')[0];
            h += '<div class="mp-divider"></div>';
            for (let m = fromMinor; m <= toMinor; m++) {
                const v = major + '.' + m;
                const isCurrent = m === toMinor;
                h += `<div class="mp-row">${isCurrent ? '🟢' : '✓'} Python ${esc(v)}${isCurrent ? ' (current)' : ''}</div>`;
            }
        }

        h += `<div class="mp-muted" style="margin-top:0.4rem">Wider compatibility means this module can run in more environments. ${count >= 4 ? 'This is a strong compatibility range.' : count <= 2 ? 'Consider whether wider support is needed.' : ''}</div>`;
        return h;
    }

    function _peekFloor(item) {
        const rank = item.rank || 'unknown';
        const emoji = RANK_EMOJI[rank] || '⚪';
        const eol = item.eol_date || '';
        const cves = item.cves || [];
        const effClean = (item.effective_floor || '').replace('≥', '');

        let h = '';

        if (rank === 'current') {
            h += `<div class="mp-title">${emoji} Floor is healthy</div>`;
            h += `<div class="mp-row">Python ${esc(effClean)} is actively maintained and receives security patches. You're in good shape.</div>`;
        } else if (rank === 'outdated') {
            h += `<div class="mp-title">${emoji} Floor approaching end-of-life</div>`;
            h += `<div class="mp-row warn">Python ${esc(effClean)} reaches end-of-life in <strong>${esc(eol)}</strong>. After that date, no more security patches will be released.</div>`;
            h += `<div class="mp-muted">This doesn't mean things break immediately, but any new vulnerabilities discovered after EOL won't be patched.</div>`;
        } else if (rank === 'deprecated') {
            h += `<div class="mp-title">${emoji} Floor is past end-of-life</div>`;
            h += `<div class="mp-row warn">Python ${esc(effClean)} is past its end-of-life date (${esc(eol)}). It no longer receives any updates.</div>`;
            h += `<div class="mp-muted">Deployments on this version are running unpatched software.</div>`;
        } else if (rank === 'dangerous') {
            h += `<div class="mp-title">${emoji} Floor has known vulnerabilities</div>`;
            h += `<div class="mp-row warn">Python ${esc(effClean)} has <strong>${cves.length} known CVE(s)</strong>:</div>`;
            for (const c of cves) {
                h += `<div class="mp-row warn" style="padding-left:0.75rem">• <code>${esc(c)}</code></div>`;
            }
            h += `<div class="mp-muted" style="margin-top:0.4rem">Deployments on this version are exposed to these vulnerabilities. Consider raising the effective floor.</div>`;
        } else {
            h += `<div class="mp-title">${emoji} Floor health unknown</div>`;
            h += `<div class="mp-row">Unable to determine the health status of this floor version.</div>`;
        }

        if (item.version_note) {
            h += '<div class="mp-divider"></div>';
            h += `<div class="mp-row">📝 <em>${esc(item.version_note)}</em></div>`;
        }
        return h;
    }

    function _peekStatus(item) {
        const verdict = item.verdict || '';
        const detail = item.verdict_detail || '';
        const name = item._moduleName || '';
        const effClean = (item.effective_floor || '').replace('≥', '');
        const declared = (item.value || '').replace('≥', '');

        let h = '';
        if (verdict === 'consistent') {
            h += '<div class="mp-title">✅ Everything lines up</div>';
            h += `<div class="mp-row">This module's declared floor matches what its code and dependencies actually need. No action required.</div>`;
            if (item.version_note) {
                h += '<div class="mp-divider"></div>';
                h += `<div class="mp-row">📝 <em>${esc(item.version_note)}</em></div>`;
            }
        } else if (verdict === 'gap') {
            h += '<div class="mp-title">⚠️ Compatibility gap</div>';
            h += `<div class="mp-row warn">This module claims to support Python ${esc(declared)}+, but it actually needs <strong>${esc(effClean)}+</strong> to run.</div>`;

            // Explain what drives the gap
            const deps = item.deps_details || [];
            const features = item.code_features || [];

            if (deps.length) {
                const sorted = [...deps].sort((a,b) => {
                    const av = (a.floor||'').split('.').map(Number);
                    const bv = (b.floor||'').split('.').map(Number);
                    return (bv[1]||0) - (av[1]||0);
                });
                h += `<div class="mp-muted" style="margin-top:0.3rem">• <strong>${esc(sorted[0].package)}</strong> requires Python ≥${esc(sorted[0].floor)}</div>`;
            }
            if (features.length) {
                h += `<div class="mp-muted">• Code uses <strong>${esc(features[0].feature)}</strong> which needs Python ${esc(features[0].version)}+</div>`;
            }

            h += `<div class="mp-row" style="margin-top:0.5rem">If someone tries to run this module on Python ${esc(declared)}, it will fail.</div>`;

            if (item.version_note) {
                h += '<div class="mp-divider"></div>';
                h += `<div class="mp-row">📝 <em>${esc(item.version_note)}</em></div>`;
            }

            h += '<div class="mp-actions">';
            h += `<button class="posture-btn" onclick="_moduleHidePeek();moduleAcknowledge('${esc(name)}')">📝 Add note</button>`;
            h += `<button class="posture-btn" onclick="_moduleHidePeek();moduleViewReport('${esc(name)}')">📋 Full report</button>`;
            h += '</div>';
        } else if (verdict === 'could_lower') {
            h += '<div class="mp-title">ℹ️ Floor could be lower</div>';
            h += `<div class="mp-row">The declared floor is ${esc(declared)}, but neither the code nor the dependencies need more than <strong>${esc(effClean)}</strong>.</div>`;
            h += '<div class="mp-muted">This module could support a wider range of Python versions if you lower the declared floor. This is informational — no action is required.</div>';

            h += '<div class="mp-actions">';
            h += `<button class="posture-btn" onclick="_moduleHidePeek();moduleAcknowledge('${esc(name)}')">📝 Add note</button>`;
            h += '</div>';
        } else {
            h += '<div class="mp-title">— No analysis available</div>';
            h += '<div class="mp-row">This module doesn\'t have enough data for a compatibility verdict.</div>';
        }
        return h;
    }

    // ── Action handlers ─────────────────────────────────────
    window.moduleAcknowledge = function(moduleName) {
        if (typeof modalOpen !== 'function') return;
        const bodyHtml = typeof modalFormField === 'function'
            ? modalFormField({ name: 'note', label: 'Version Note', type: 'textarea',
                placeholder: 'Explain why this gap is acceptable or what the plan is...',
                hint: 'Saved to project.yml as version_note' })
            : '<textarea id="mf-note" style="width:100%;min-height:80px" placeholder="Note..."></textarea>';

        modalOpen({
            title: '📝 Acknowledge: ' + moduleName,
            replace: false,
            body: bodyHtml,
            size: 'md',
            footerButtons: [
                { label: '💾 Save', cls: 'btn-primary', onclick: "moduleSaveNote('" + moduleName + "')" },
                { label: 'Cancel', onclick: 'modalClose()' },
            ],
        });
    };

    window.moduleSaveNote = async function(moduleName) {
        const note = typeof mfVal === 'function' ? mfVal('note') : (document.getElementById('mf-note') || {}).value || '';
        try {
            const resp = await fetch('/api/posture/module-note', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module: moduleName, version_note: note }),
            });
            if (resp.ok) {
                toast('📝 Note saved for ' + moduleName, 'success');
                modalClose();
            } else {
                const data = await resp.json();
                toast('⚠️ ' + (data.error || 'Failed to save'), 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    };

    window.moduleViewReport = function(moduleName) {
        const item = _modulePeekItems.find(i => i._moduleName === moduleName);
        if (!item || typeof modalOpen !== 'function') return;

        let body = '';
        body += '<div style="display:flex;flex-direction:column;gap:1rem">';

        // Declared section
        body += '<div>' + _peekDeclared(item) + '</div>';

        // Deps section
        body += '<div>' + _peekDeps(item) + '</div>';

        // Code section
        body += '<div>' + _peekCode(item) + '</div>';

        // Effective
        body += '<div>' + _peekEffective(item) + '</div>';

        // Floor health
        body += '<div>' + _peekFloor(item) + '</div>';

        body += '</div>';

        modalOpen({
            title: '📋 Full Report: ' + moduleName,

            body: body,
            size: 'wide',
            footerButtons: [
                { label: 'Close', onclick: 'modalClose()' },
            ],
        });
    };

    // ── Render: module pillar (matrix table — 9 columns) ───────
    function renderModulePillar(pillar) {
        const rank = pillar.rank || 'unknown';
        const emoji = RANK_EMOJI[rank] || '⚪';
        const items = pillar.items || [];
        const warnings = pillar.warnings || [];

        let html = `
            <div class="posture-pillar expanded" data-rank="${rank}" id="posture-pillar-modules">
                <div class="posture-pillar-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <span class="posture-pillar-icon">🧩</span>
                    <span class="posture-pillar-label">Module Stack Health</span>
                    <span class="posture-pillar-rank">${emoji}</span>
                    <span class="posture-pillar-count">${items.length}</span>
                    <span class="posture-pillar-chevron">▸</span>
                </div>
                <div class="posture-pillar-body">
        `;

        // Store items for peek panel content builders
        _modulePeekItems = items.map(item => {
            let moduleName = item.name || '';
            const nameMatch = moduleName.match(/^(.+?)\s*\((.+)\)$/);
            if (nameMatch) moduleName = nameMatch[1];
            return { ...item, _moduleName: moduleName };
        });

        if (items.length > 0) {
            html += `
                <table class="posture-table posture-module-table">
                    <thead>
                        <tr class="posture-module-header-row">
                            <th>Module</th>
                            <th>Stack</th>
                            <th>Declared</th>
                            <th>Deps</th>
                            <th>Code</th>
                            <th>Effective</th>
                            <th>Compat.</th>
                            <th>Floor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (let idx = 0; idx < items.length; idx++) {
                const item = items[idx];
                const iRank = item.rank || 'unknown';
                const iEmoji = RANK_EMOJI[iRank] || '⚪';
                const iCss = RANK_CSS[iRank] || '';
                const isNA = iRank === 'na';

                let moduleName = item.name || '';
                let lang = '';
                const nameMatch = moduleName.match(/^(.+?)\s*\((.+)\)$/);
                if (nameMatch) { moduleName = nameMatch[1]; lang = nameMatch[2]; }

                const stack = item.stack || lang || '—';
                const declared = item.value || '—';
                const depsFloor = item.deps_floor || '—';
                const codeFloor = item.code_floor || '—';
                const effective = item.effective_floor || '—';
                const note = item.version_note || '';
                const verdict = item.verdict || '';

                // Compat bar
                let compatDisplay = '—';
                const compatCount = item.compat_count || 0;
                if (compatCount > 0) {
                    const maxBars = 8;
                    const filled = Math.min(compatCount, maxBars);
                    const empty = maxBars - filled;
                    compatDisplay = '<span class="posture-compat-bar">' +
                        '█'.repeat(filled) + '░'.repeat(empty) +
                        '</span> ' + compatCount + 'v';
                }

                // Floor health — just the emoji
                let floorDisplay = iEmoji;
                if (note) floorDisplay += ' 📝';

                // Verdict icon
                let verdictDisplay = '—';
                if (verdict === 'consistent') verdictDisplay = '✅';
                else if (verdict === 'gap') verdictDisplay = '⚠️';
                else if (verdict === 'could_lower') verdictDisplay = 'ℹ️';

                // Floor source tag
                const floorSource = item.floor_source || '';
                let sourceTag = '';
                if (floorSource === 'stack') sourceTag = ' <span class="posture-floor-source">stack</span>';
                else if (floorSource === 'project') sourceTag = ' <span class="posture-floor-source">project</span>';

                // Click handler shorthand
                const pk = (col) => `data-peek onclick="modulePeek('${col}',${idx},event)"`;

                if (isNA) {
                    html += `
                        <tr class="posture-row posture-module-row posture-module-na">
                            <td ${pk('module')}>${esc(moduleName)}</td>
                            <td ${pk('stack')}>${esc(stack)}</td>
                            <td colspan="5" class="posture-module-cell-na">—</td>
                            <td>⚪</td>
                            <td>—</td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr class="posture-row posture-module-row ${iCss}">
                            <td class="posture-module-cell-name" ${pk('module')}>${esc(moduleName)}</td>
                            <td class="posture-module-cell-stack" ${pk('stack')}>${esc(stack)}</td>
                            <td class="posture-module-cell-declared" ${pk('declared')}><code>${esc(declared)}</code>${sourceTag}</td>
                            <td class="posture-module-cell-deps" ${pk('deps')}>${esc(depsFloor)}</td>
                            <td class="posture-module-cell-code" ${pk('code')}>${esc(codeFloor)}</td>
                            <td class="posture-module-cell-effective" ${pk('effective')}><code>${esc(effective)}</code></td>
                            <td class="posture-module-cell-compat" ${pk('compat')}>${compatDisplay}</td>
                            <td class="posture-module-cell-health" ${pk('floor')}>${floorDisplay}</td>
                            <td class="posture-module-cell-verdict" ${pk('status')}>${verdictDisplay}</td>
                        </tr>
                    `;

                    if (note) {
                        html += `<tr class="posture-module-note-row"><td colspan="9" class="posture-module-note-cell">📝 ${esc(note)}</td></tr>`;
                    }
                }
            }
            html += '</tbody></table>';
        }

        // ── Below-table sections (conversational) ─────────────

        const stratItems = items.filter(i => i.rank !== 'na');
        const gapItems = stratItems.filter(i => i.verdict === 'gap');
        const okItems = stratItems.filter(i => i.verdict === 'consistent');
        const lowerItems = stratItems.filter(i => i.verdict === 'could_lower');

        // ── Findings — what needs attention ──────────────────
        if (gapItems.length > 0) {
            html += '<div class="posture-section-warnings">';
            html += '<div class="posture-recs-title">Needs attention</div>';
            for (const item of gapItems) {
                const n = (item.name || '').split(' (')[0];
                const effClean = (item.effective_floor || '').replace('≥', '');
                const declared = (item.value || '').replace('≥', '');
                const deps = item.deps_details || [];
                const features = item.code_features || [];

                let explanation = `<strong>${esc(n)}</strong> declares support for Python ${esc(declared)}+, but actually needs <strong>${esc(effClean)}+</strong>.`;

                // What drives the gap
                if (deps.length) {
                    const sorted = [...deps].sort((a,b) => {
                        const av = (a.floor||'').split('.').map(Number);
                        const bv = (b.floor||'').split('.').map(Number);
                        return (bv[1]||0) - (av[1]||0);
                    });
                    explanation += ` The package <code>${esc(sorted[0].package)}</code> requires ≥${esc(sorted[0].floor)}.`;
                }
                if (features.length && features[0].version > (deps.length ? deps[0].floor : '')) {
                    explanation += ` The code uses <code>${esc(features[0].feature)}</code> (${esc(features[0].version)}+).`;
                }

                html += `<div class="posture-warn-line" style="line-height:1.6">⚠️ ${explanation}</div>`;
            }
            html += '</div>';
        }

        // ── Status summary ───────────────────────────────────
        if (okItems.length > 0 || lowerItems.length > 0) {
            html += '<div class="posture-module-status-section">';
            for (const item of okItems) {
                const n = (item.name || '').split(' (')[0];
                html += `<div class="posture-module-status-line ok">✅ <strong>${esc(n)}</strong> — all layers aligned, no issues.</div>`;
            }
            for (const item of lowerItems) {
                const n = (item.name || '').split(' (')[0];
                const effClean = (item.effective_floor || '').replace('≥', '');
                const declared = (item.value || '').replace('≥', '');
                html += `<div class="posture-module-status-line info">ℹ️ <strong>${esc(n)}</strong> — floor is ${esc(declared)} but only needs ${esc(effClean)}. Could support a wider range.</div>`;
            }
            html += '</div>';
        }

        // ── Strategy ─────────────────────────────────────────
        if (stratItems.length > 0) {
            const allDeduced = stratItems.every(i => i.strategy_deduced);
            html += '<div class="posture-module-strategy-row">';

            const parts = [];
            for (const item of stratItems) {
                const n = (item.name || '').split(' (')[0];
                const s = item.version_strategy || '';
                const d = item.strategy_deduced;
                const note = item.version_note || '';
                let label = s === 'compatibility' ? (d ? 'compat.✱' : 'compat.') :
                            s === 'latest' ? (d ? 'latest✱' : 'latest') : '—';
                if (note) label += ' 📝';
                parts.push(`${esc(n)}: <span class="posture-strategy-badge ${s}${d ? ' deduced' : ''}">${label}</span>`);
            }

            html += '<span class="posture-module-strategy-title">Strategy:</span> ' + parts.join(' · ');

            if (allDeduced) {
                html += '<div class="mp-muted" style="margin-top:0.4rem">All strategies are deduced from the constraint gap. You can set them explicitly in <code>project.yml</code> by adding <code>version_strategy: latest</code> or <code>version_strategy: compatibility</code> to each module.</div>';
            }
            html += '</div>';
        }

        // ── Notes ────────────────────────────────────────────
        const noted = items.filter(i => i.version_note);
        if (noted.length > 0) {
            html += '<div class="posture-module-notes-section">';
            for (const item of noted) {
                const n = (item.name || '').split(' (')[0];
                html += `<div class="posture-module-note-line">📝 <strong>${esc(n)}</strong>: <em>"${esc(item.version_note)}"</em></div>`;
            }
            html += '</div>';
        }

        // ── Floor advisories ─────────────────────────────────
        const floorWarnings = warnings.filter(w => !w.includes('⚠️'));
        if (floorWarnings.length > 0) {
            html += '<div class="posture-section-warnings">';
            html += '<div class="posture-recs-title">Floor health</div>';
            for (const w of floorWarnings) {
                html += `<div class="posture-warn-line">⚠️ ${w}</div>`;
            }
            html += '</div>';
        }

        html += '</div></div>';
        return html;
    }

    // ── Render: item action button ────────────────────────────
    function renderItemAction(item) {
        const actions = item.actions;
        if (!actions || !actions.length) return '';

        const action = actions[0];
        switch (action.type) {
            case 'update':
                return `<button class="posture-btn posture-btn-update" onclick="postureUpdateTool('${action.tool_id}', '${(action.label || '').replace(/'/g, "\\'")}')">⬆️ Update</button>`;
            case 'manual':
                return `<button class="posture-btn posture-btn-manual" onclick="postureShowManual('${(action.hint || '').replace(/'/g, "\\'")}')">📋 Manual</button>`;
            case 'link':
                return `<button class="posture-btn posture-btn-link" onclick="postureViewAudit('${action.card_id}')">🔍 Audit →</button>`;
            case 'guide':
                return `<button class="posture-btn posture-btn-guide" onclick="postureShowGuide(this)">📖 Guide</button>`;
            case 'reset':
                return `<button class="posture-btn posture-btn-reset" onclick="postureResetBreaker('${action.breaker_id}')">🔄 Reset</button>`;
            case 'clear':
                return `<button class="posture-btn posture-btn-reset" onclick="postureClearRetryQueue()">🗑️ Clear</button>`;
            default:
                return '';
        }
    }

    // ── Action handlers ───────────────────────────────────────

    // Update a single tool's posture row in-place after an update.
    // Uses the done event data (new_version, old_version) to avoid a full rescan.
    function _postureUpdateToolRow(toolId, doneEvent) {
        var rows = document.querySelectorAll('.posture-row');
        for (var r of rows) {
            var nameCell = r.querySelector('.posture-cell-name');
            if (!nameCell || nameCell.textContent.trim().toLowerCase() !== toolId.toLowerCase()) continue;

            var newVer = (doneEvent && doneEvent.new_version) || '';
            var oldVer = (doneEvent && doneEvent.old_version) || '';
            var unchanged = doneEvent && doneEvent.version_unchanged;

            var emojiCell = r.querySelector('.posture-cell-emoji');
            var valueCell = r.querySelector('.posture-cell-value');
            var detailCell = r.querySelector('.posture-cell-detail');
            var actionCell = r.querySelector('.posture-cell-action');

            if (unchanged) {
                // Version didn't change — show warning state
                r.style.opacity = '1';
                r.className = r.className.replace(/posture-rank-\w+/g, '') + ' posture-rank-outdated';
                if (emojiCell) emojiCell.textContent = '🟡';
                if (valueCell) valueCell.textContent = newVer || oldVer;
                if (detailCell) detailCell.textContent = 'Version unchanged — package manager has no newer version';
                if (actionCell) actionCell.innerHTML =
                    '<span style="font-size:0.72rem;color:hsl(40,80%,65%)">⚠️ Unchanged</span>';
            } else if (newVer && newVer !== oldVer) {
                // Successfully updated — show success state
                r.style.opacity = '1';
                r.className = r.className.replace(/posture-rank-\w+/g, '') + ' posture-rank-current';
                if (emojiCell) emojiCell.textContent = '🟢';
                if (valueCell) valueCell.innerHTML =
                    '<span style="color:var(--success)">' + esc(newVer) + '</span>';
                if (detailCell) detailCell.textContent = 'Updated from ' + oldVer;
                if (actionCell) actionCell.innerHTML =
                    '<span style="font-size:0.72rem;color:var(--success)">✅ Updated</span>';
            } else {
                // Fallback — just mark as verifying until next poll
                r.style.opacity = '0.6';
                if (emojiCell) emojiCell.textContent = '⏳';
                if (valueCell) valueCell.innerHTML =
                    '<span style="color:var(--text-muted);font-style:italic">verifying…</span>';
                if (detailCell) detailCell.textContent = 'Awaiting next posture poll…';
                if (actionCell) actionCell.innerHTML =
                    '<span style="font-size:0.75rem;color:var(--text-muted)">⏳</span>';
            }
            break;
        }

        // Invalidate server-side toolchain cache so next badge poll is fresh
        fetch('/api/posture/rescan-tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tool: toolId }),
        }).then(function(resp) {
            if (resp.ok) return resp.json();
        }).then(function(data) {
            if (data && data.overall_rank) {
                updateBadge(data);
            }
        }).catch(function() {});
    }

    // Individual tool update — plan-based
    window.postureUpdateTool = async function(toolId, toolLabel) {
        try {
            const resp = await fetch('/api/audit/update-plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tool: toolId }),
            });
            const plan = await resp.json();

            if (plan.error) {
                toast('⚠️ ' + plan.error, 'error');
                return;
            }

            // showStepModal is defined in _ops_modal.html — handles
            // the full step-by-step execution window with SSE
            if (typeof showStepModal === 'function') {
                // Override: the step modal posts to execute with mode=update
                plan._mode = 'update';
                showStepModal(plan, {
                    onComplete: function(doneEvent) {
                        _postureUpdateToolRow(toolId, doneEvent);
                    },
                });
            } else {
                toast('⚠️ Step modal not available', 'error');
            }
        } catch (e) {
            toast('❌ Failed to fetch update plan: ' + e.message, 'error');
        }
    };

    // Retry update with a specific method (remediation from version-unchanged)
    window.postureRetryUpdate = async function(toolId, method) {
        // Close the current step modal
        var stepModal = document.getElementById('step-modal');
        if (stepModal) stepModal.remove();

        try {
            const resp = await fetch('/api/audit/update-plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tool: toolId, prefer_method: method }),
            });
            const plan = await resp.json();

            if (plan.error) {
                toast('⚠️ ' + plan.error, 'error');
                return;
            }

            if (typeof showStepModal === 'function') {
                plan._mode = 'update';
                showStepModal(plan, {
                    onComplete: function(doneEvent) {
                        _postureUpdateToolRow(toolId, doneEvent);
                    },
                });
            }
        } catch (e) {
            toast('❌ Failed to retry update: ' + e.message, 'error');
        }
    };

    // Batch update — all outdated tools
    window.postureUpdateAllOutdated = async function() {
        // Collect all updatable tool IDs from the posture data
        try {
            const resp = await fetch('/api/posture');
            if (!resp.ok) throw new Error('Failed to fetch posture');
            const data = await resp.json();

            const tcItems = (data.pillars?.toolchain?.items || []);
            const updatableTools = [];
            for (const item of tcItems) {
                const actions = item.actions || [];
                if (actions.length && actions[0].type === 'update') {
                    updatableTools.push(actions[0].tool_id);
                }
            }

            if (!updatableTools.length) {
                toast('✅ All tools are up to date!', 'success');
                return;
            }

            // Fetch batch plan
            const planResp = await fetch('/api/audit/update-plan/batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tools: updatableTools }),
            });
            const plan = await planResp.json();

            if (plan.error) {
                toast('⚠️ ' + plan.error, 'error');
                return;
            }

            if (typeof showStepModal === 'function') {
                plan._mode = 'update';
                // For batch, use the first tool as the identifier
                plan.tool = updatableTools[0];
                showStepModal(plan, {
                    onComplete: function() {
                        postureRescan();
                    },
                });
            }
        } catch (e) {
            toast('❌ Batch update failed: ' + e.message, 'error');
        }
    };

    // Navigate to audit tab
    window.postureViewAudit = function(cardId) {
        // Close posture modal
        if (typeof modalClose === 'function') modalClose();

        // Use the app's tab navigation system
        if (typeof switchTab === 'function') {
            switchTab('audit');
        }
    };

    // Show manual update hint
    window.postureShowManual = function(hint) {
        toast('📋 ' + hint, 'info', 8000);
    };

    // Show platform upgrade guide modal
    window.postureShowGuide = function(btn) {
        // Read the platform item data from the posture response
        // We stored it in the row's parent context
        const row = btn.closest('.posture-row');
        let itemName = '';
        let itemValue = '';
        let itemDetail = '';
        if (row) {
            itemName = row.querySelector('.posture-cell-name')?.textContent || '';
            itemValue = row.querySelector('.posture-cell-value')?.textContent || '';
            itemDetail = row.querySelector('.posture-cell-detail')?.textContent || '';
        }

        const guideBody = `
            <div style="padding:0.5rem 0">
                <div style="display:flex;align-items:center;gap:0.75rem;padding:1rem;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:1.25rem">
                    <span style="font-size:2rem">🟠</span>
                    <div>
                        <div style="font-weight:700;font-size:1rem;color:var(--text)">${esc(itemName)} ${esc(itemValue)}</div>
                        <div style="font-size:0.82rem;color:var(--text-muted)">${esc(itemDetail)}</div>
                    </div>
                </div>

                <div style="font-size:0.88rem;color:var(--text);line-height:1.65;margin-bottom:1.25rem">
                    <p style="margin:0 0 0.75rem">Your operating system has reached <strong>end-of-life</strong> and no longer receives security updates.
                    This affects all tools installed through the system package manager — their versions are frozen at what this OS series provides.</p>
                    <p style="margin:0">Upgrading resolves both the platform security posture and enables newer tool versions through <code>apt</code>.</p>
                </div>

                <div style="font-size:0.78rem;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.75rem">Upgrade Options</div>

                <div style="display:flex;flex-direction:column;gap:0.75rem">
                    <!-- Option 1: In-place upgrade -->
                    <div style="padding:0.85rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
                            <div>
                                <span style="font-weight:700;font-size:0.88rem">⬆️ In-Place Upgrade</span>
                                <span style="font-size:0.68rem;padding:2px 6px;background:hsl(30,60%,20%);color:hsl(30,80%,70%);border-radius:4px;margin-left:0.5rem">Disruptive</span>
                            </div>
                            <button class="posture-btn posture-btn-update" onclick="postureStartOsUpgrade()" style="font-size:0.78rem;padding:0.35rem 0.85rem">
                                Start Upgrade →
                            </button>
                        </div>
                        <div style="font-size:0.78rem;color:var(--text-muted);line-height:1.5">
                            Runs <code>do-release-upgrade</code> to upgrade to the next LTS release.
                            This is a <strong>multi-step, disruptive</strong> operation that modifies system packages.
                            Your WSL instance will need to be restarted afterward.
                        </div>
                    </div>

                    <!-- Option 2: Fresh WSL distro -->
                    <div style="padding:0.85rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
                            <div>
                                <span style="font-weight:700;font-size:0.88rem">🆕 Install Fresh WSL Distro</span>
                                <span style="font-size:0.68rem;padding:2px 6px;background:hsl(210,50%,20%);color:hsl(210,70%,70%);border-radius:4px;margin-left:0.5rem">Safe</span>
                            </div>
                        </div>
                        <div style="font-size:0.78rem;color:var(--text-muted);line-height:1.5">
                            Install Ubuntu 24.04 as a new WSL distribution alongside this one. You can migrate your projects at your own pace.
                            <div style="margin-top:0.5rem">
                                <code style="font-size:0.72rem;padding:4px 8px;background:var(--bg-primary);border-radius:4px;display:inline-block">
                                    wsl --install Ubuntu-24.04
                                </code>
                                <button class="posture-btn posture-btn-manual" onclick="navigator.clipboard.writeText('wsl --install Ubuntu-24.04');toast('📋 Copied to clipboard','success')" style="margin-left:0.5rem;font-size:0.7rem">
                                    📋 Copy
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Option 3: Manual -->
                    <div style="padding:0.85rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)">
                        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
                            <span style="font-weight:700;font-size:0.88rem">📖 Manual Reference</span>
                        </div>
                        <div style="font-size:0.78rem;color:var(--text-muted);line-height:1.5">
                            <div style="margin-bottom:0.4rem">• <a href="https://ubuntu.com/server/docs/how-to-upgrade-your-release" target="_blank" rel="noopener" style="color:var(--accent)">Ubuntu Server Upgrade Guide</a></div>
                            <div style="margin-bottom:0.4rem">• <a href="https://learn.microsoft.com/en-us/windows/wsl/install" target="_blank" rel="noopener" style="color:var(--accent)">Microsoft WSL Documentation</a></div>
                            <div>• <a href="https://wiki.ubuntu.com/Releases" target="_blank" rel="noopener" style="color:var(--accent)">Ubuntu Release Schedule</a></div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        modalOpen({
            title: '📖 Platform Upgrade Guide',
            body: guideBody,
            size: 'md',
            replace: false,  // Stack on top of posture modal
            footerButtons: [
                { label: 'Close', onclick: 'modalClose()' },
            ],
        });
    };

    // Start do-release-upgrade via plan execution
    window.postureStartOsUpgrade = async function() {
        // Confirm first — this is disruptive
        if (!confirm(
            'This will run do-release-upgrade which modifies system packages.\\n\\n' +
            'Your WSL instance will need to be restarted afterward.\\n\\n' +
            'Are you sure you want to proceed?'
        )) return;

        // Close the guide modal
        if (typeof modalClose === 'function') modalClose();

        // Show as a toast for now — the actual upgrade needs a terminal
        toast('🚀 Starting do-release-upgrade — check your terminal...', 'info', 10000);

        try {
            // The OS upgrade is too disruptive for the step modal.
            // It requires interactive terminal access. Open a toast with guidance.
            toast(
                '⚠️ OS upgrades require an interactive terminal.\\n' +
                'Run: sudo do-release-upgrade\\n' +
                'Then restart WSL: wsl --shutdown',
                'warning', 15000
            );
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    };

    // Reset a circuit breaker
    window.postureResetBreaker = async function(breakerId) {
        try {
            const resp = await fetch('/api/health/circuit-breaker/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ breaker: breakerId }),
            });
            if (resp.ok) {
                toast('✅ Circuit breaker reset: ' + breakerId, 'success');
                postureRescan();
            } else {
                toast('⚠️ Failed to reset breaker', 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    };

    // Clear exhausted retry queue items
    window.postureClearRetryQueue = async function() {
        try {
            const resp = await fetch('/api/health/retry-queue/clear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
            });
            if (resp.ok) {
                toast('✅ Retry queue cleared', 'success');
                postureRescan();
            } else {
                toast('⚠️ Failed to clear retry queue', 'error');
            }
        } catch (e) {
            toast('❌ ' + e.message, 'error');
        }
    };

    // ── Rescan ────────────────────────────────────────────────
    window.postureRescan = async function() {
        const btn = document.getElementById('posture-rescan-btn');
        if (btn) {
            btn.disabled = true;
            btn.textContent = '⏳ Scanning…';
        }

        try {
            // Bust client-side caches so rescan picks up new versions
            try { sessionStorage.removeItem('l0_detection'); } catch (_) {}
            try { sessionStorage.removeItem('system_deps_cache'); } catch (_) {}
            if (typeof cardInvalidate === 'function') cardInvalidate('tools-status');

            const resp = await fetch('/api/posture/rescan', { method: 'POST' });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            // Re-enrich happens server-side via the rescan endpoint
            const body = document.querySelector('.modal-body');
            if (body) body.innerHTML = renderPosture(data);

            const status = document.querySelector('.modal-footer-status');
            if (status) status.textContent = data.summary || 'Rescanned';

            if (data.overall_rank) {
                updateBadge({
                    overall_rank: data.overall_rank,
                    summary: data.summary,
                });
            }
        } catch (e) {
            console.error('[posture] rescan failed:', e);
        } finally {
            if (btn) {
                btn.disabled = false;
                btn.textContent = '🔄 Rescan';
            }
        }
    };

    window.openPostureModal = openPostureModal;

    // ── Start on page load ────────────────────────────────────
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPosture);
    } else {
        initPosture();
    }
})();
</script>
