- id: csharp.9.module_initializers
  language: csharp
  feature_name: module initializers
  introduced: '9'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - module
  - initializer
  - startup
  detection:
    primary:
      ast_type: attribute
      match:
        name: ModuleInitializer
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: attribute
        name: ModuleInitializer
      replace:
        note: module initializers — csharp 9+
  verification:
    re_detect: true
  test:
    before: '[ModuleInitializer] static void Init() {}

      '
    after: 'static void Init() {} // Call from Main

      '
