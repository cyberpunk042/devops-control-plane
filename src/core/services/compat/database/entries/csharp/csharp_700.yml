- id: csharp.9.nint_nuint
  language: csharp
  feature_name: nint/nuint native integers
  introduced: '9'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - nint
  - native
  - integer
  detection:
    primary:
      ast_type: predefined_type
      match:
        keyword_in: &id001
        - nint
        - nuint
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: predefined_type
        keyword_in: *id001
      replace:
        note: nint/nuint native integers — csharp 9+
  verification:
    re_detect: true
  test:
    before: 'nint size = 42;

      '
    after: 'IntPtr size = (IntPtr)42;

      '
- id: csharp.10.extended_property_patterns
  language: csharp
  feature_name: extended property patterns
  introduced: '10'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - pattern
  - property
  - extended
  detection:
    primary:
      ast_type: subpattern
      match:
        has_dot_path: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: subpattern
        has_dot_path: true
      replace:
        note: extended property patterns — csharp 10+
  verification:
    re_detect: true
  test:
    before: 'if (obj is { Address.City: "NYC" })

      '
    after: 'if (obj is { Address: { City: "NYC" } })

      '
- id: csharp.12.alias_any_type
  language: csharp
  feature_name: alias any type with using
  introduced: '12'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - using
  - alias
  - any_type
  detection:
    primary:
      ast_type: using_directive
      match:
        has_type_alias: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: using_directive
        has_type_alias: true
      replace:
        note: alias any type with using — csharp 12+
  verification:
    re_detect: true
  test:
    before: 'using Point = (int X, int Y);

      '
    after: '// Use explicit tuple type

      '
