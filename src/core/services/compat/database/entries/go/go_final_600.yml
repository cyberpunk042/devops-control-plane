- id: php.8_3.random_getbytes
  language: php
  feature_name: "Random\\Randomizer::getBytes()"
  introduced: "8.2"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [random, bytes, security]
  detection:
    primary:
      ast_type: method_call_expression
      match: { method: getBytes }
  fix:
    strategy: manual
    manual_instructions: "Use random_bytes() function."
  verification: { re_detect: true }
  test:
    before: |
      $bytes = (new Random\Randomizer())->getBytes(16);
    after: |
      $bytes = random_bytes(16);

- id: csharp.11.generic_math
  language: csharp
  feature_name: "generic math interfaces"
  introduced: "11"
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [generic, math, interfaces]
  detection:
    primary:
      ast_type: type_constraint
      match: { name_in: [INumber, IAdditionOperators, IMultiplyOperators] }
  fix:
    strategy: manual
    manual_instructions: "Remove generic math constraints. Use concrete types."
  verification: { re_detect: true }
  test:
    before: |
      T Add<T>(T a, T b) where T : INumber<T> => a + b;
    after: |
      int Add(int a, int b) => a + b;

