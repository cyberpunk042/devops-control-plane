- id: go.1_21.slices_max
  language: go
  feature_name: slices.Max()/Min()
  introduced: '1.21'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - slices
  - max
  - min
  detection:
    primary:
      ast_type: call_expression
      match:
        package: slices
        function_in: &id001
        - Max
        - Min
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        package: slices
        function_in: *id001
      replace:
        note: slices.Max()/Min() — go 1.21+
  verification:
    re_detect: true
  test:
    before: 'm := slices.Max(s)

      '
    after: '// Manual loop

      '
