# Go misc features across versions

- id: go.1_19.atomic_pointer
  language: go
  feature_name: "atomic.Pointer[T]"
  introduced: "1.19"
  category: stdlib
  description: "Type-safe atomic pointer"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [atomic, pointer, generics]
  detection:
    primary:
      ast_type: qualified_type
      match:
        package: atomic
        type: Pointer
  fix:
    strategy: manual
    manual_instructions: "Use unsafe.Pointer with atomic.LoadPointer/StorePointer."
  verification:
    re_detect: true
  test:
    before: |
      var ptr atomic.Pointer[Config]
    after: |
      var ptr unsafe.Pointer

- id: go.1_21.slog_handler
  language: go
  feature_name: "slog.Handler interface"
  introduced: "1.21"
  category: stdlib
  description: "Custom slog handler implementation"
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [slog, handler, logging]
  detection:
    primary:
      ast_type: import_spec
      match:
        path: '"log/slog"'
  fix:
    strategy: manual
    manual_instructions: "Replace with golang.org/x/exp/slog backport."
    backport:
      package: "golang.org/x/exp/slog"
  verification:
    re_detect: false
  test:
    before: |
      import "log/slog"
    after: |
      import "golang.org/x/exp/slog"

- id: go.1_22.http_servemux_wildcard
  language: go
  feature_name: "ServeMux wildcard patterns ({id})"
  introduced: "1.22"
  category: stdlib
  description: "Path parameters in ServeMux: /users/{id}"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [http, routing, wildcard]
  detection:
    primary:
      ast_type: call_expression
      match:
        method: HandleFunc
  fix:
    strategy: manual
    manual_instructions: "Use chi or gorilla/mux for path parameters."
  verification:
    re_detect: false
  test:
    before: |
      mux.HandleFunc("/users/{id}", getUser)
    after: |
      // Use chi: r.Get("/users/{id}", getUser)

- id: go.1_23.unique_handle
  language: go
  feature_name: "unique.Handle[T]"
  introduced: "1.23"
  category: stdlib
  description: "Canonical handle for interned values"
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [unique, handle, interning]
  detection:
    primary:
      ast_type: import_spec
      match:
        path: '"unique"'
  fix:
    strategy: manual
    manual_instructions: "Use sync.Map for manual interning."
  verification:
    re_detect: false
  test:
    before: |
      import "unique"
    after: |
      import "sync"
