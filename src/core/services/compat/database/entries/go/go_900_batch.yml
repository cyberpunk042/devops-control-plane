- id: go.1_21.maps_clone
  language: go
  feature_name: maps.Clone()
  introduced: '1.21'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - maps
  - clone
  - copy
  detection:
    primary:
      ast_type: call_expression
      match:
        package: maps
        function: Clone
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        package: maps
        function: Clone
      replace:
        note: maps.Clone() — go 1.21+
  verification:
    re_detect: true
  test:
    before: 'copy := maps.Clone(m)

      '
    after: 'copy := make(map[K]V); for k,v := range m { copy[k]=v }

      '
