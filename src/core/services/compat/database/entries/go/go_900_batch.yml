  introduced: "1.21"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [slices, sort, func]
  detection: { primary: { ast_type: call_expression, match: { package: slices, function: SortFunc } } }
  fix: { strategy: manual, manual_instructions: "Use sort.Slice()." }
