# Go batch — 900

- id: go.1_21.maps_clone
  language: go
  feature_name: "maps.Clone()"
  introduced: "1.21"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [maps, clone, copy]
  detection: { primary: { ast_type: call_expression, match: { package: maps, function: Clone } } }
  fix: { strategy: manual, manual_instructions: "Manual copy with for range." }
  verification: { re_detect: true }
  test: { before: "copy := maps.Clone(m)\n", after: "copy := make(map[K]V); for k,v := range m { copy[k]=v }\n" }

- id: go.1_21.slices_sort_func
