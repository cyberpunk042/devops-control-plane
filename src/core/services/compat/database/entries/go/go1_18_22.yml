# Go 1.18-1.22 features

# ── Go 1.18 ──────────────────────────────────────────────────────

- id: go.1_18.generics
  language: go
  feature_name: "generics (type parameters)"
  introduced: "1.18"
  category: syntax
  description: "Generic functions and types with type parameters"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [generics, type_parameters]
  detection:
    primary:
      ast_type: type_parameter_list
      match: {}
  fix:
    strategy: manual
    manual_instructions: |
      Generics require Go 1.18+. Options:
        1. Use interface{} or any (1.18+) with type assertions
        2. Use code generation (go generate) for type-safe alternatives
        3. Write type-specific implementations
  verification:
    re_detect: true
  test:
    before: |
      func Map[T any, U any](s []T, f func(T) U) []U {
          r := make([]U, len(s))
          for i, v := range s { r[i] = f(v) }
          return r
      }
    after: |
      func MapStrings(s []string, f func(string) string) []string {
          r := make([]string, len(s))
          for i, v := range s { r[i] = f(v) }
          return r
      }

- id: go.1_18.any_type
  language: go
  feature_name: "any (alias for interface{})"
  introduced: "1.18"
  category: syntax
  description: "any is a predeclared identifier aliasing interface{}"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [any, interface, type]
  detection:
    primary:
      ast_type: type_identifier
      match:
        name: any
  fix:
    strategy: rewrite_expression
    transforms:
      - type: replace_identifier
        find:
          name: any
        replace:
          expression: "interface{}"
  verification:
    re_detect: true
  test:
    before: |
      func process(data any) any { return data }
    after: |
      func process(data interface{}) interface{} { return data }

- id: go.1_18.fuzzing
  language: go
  feature_name: "fuzz testing"
  introduced: "1.18"
  category: stdlib
  description: "Built-in fuzz testing support in testing package"
  direction: downgrade
  severity: warning
  error_type: syntax_error
  tags: [testing, fuzz]
  detection:
    primary:
      ast_type: function_declaration
      match:
        name_prefix: Fuzz
        param_type: "*testing.F"
  fix:
    strategy: manual
    manual_instructions: |
      Fuzz tests require Go 1.18+. Options:
        1. Remove fuzz tests (they're optional)
        2. Gate with build tags: //go:build go1.18
        3. Convert to regular tests with hardcoded inputs
  verification:
    re_detect: true
  test:
    before: |
      func FuzzReverse(f *testing.F) {
          f.Fuzz(func(t *testing.T, s string) {
              if Reverse(Reverse(s)) != s { t.Fail() }
          })
      }
    after: |
      func TestReverse(t *testing.T) {
          cases := []string{"hello", "世界", "!@#$"}
          for _, s := range cases {
              if Reverse(Reverse(s)) != s { t.Fail() }
          }
      }

# ── Go 1.20 ──────────────────────────────────────────────────────

- id: go.1_20.errors_join
  language: go
  feature_name: "errors.Join()"
  introduced: "1.20"
  category: stdlib
  description: "Join multiple errors into one"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [errors, join]
  detection:
    primary:
      ast_type: call_expression
      match:
        package: errors
        function: Join
  fix:
    strategy: manual
    manual_instructions: |
      Replace with a custom implementation:
        func joinErrors(errs ...error) error {
            var msgs []string
            for _, e := range errs {
                if e != nil { msgs = append(msgs, e.Error()) }
            }
            if len(msgs) == 0 { return nil }
            return fmt.Errorf(strings.Join(msgs, "; "))
        }
      Or use hashicorp/go-multierror package.
    backport:
      package: "github.com/hashicorp/go-multierror"
  verification:
    re_detect: true
  test:
    before: |
      err := errors.Join(err1, err2, err3)
    after: |
      err := multierror.Append(err1, err2, err3)

# ── Go 1.22 ──────────────────────────────────────────────────────

- id: go.1_22.range_int
  language: go
  feature_name: "for range over integer"
  introduced: "1.22"
  category: syntax
  description: "for i := range N iterates from 0 to N-1"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [range, loop, syntax]
  detection:
    primary:
      ast_type: for_statement
      match:
        range_over_int: true
  fix:
    strategy: rewrite_expression
    transforms:
      - type: rewrite_range_int
        find:
          ast_type: for_statement
        replace:
          template: "for {var} := 0; {var} < {n}; {var}++"
  verification:
    re_detect: true
  test:
    before: |
      for i := range 10 {
          fmt.Println(i)
      }
    after: |
      for i := 0; i < 10; i++ {
          fmt.Println(i)
      }

- id: go.1_22.range_func
  language: go
  feature_name: "range over function"
  introduced: "1.22"
  category: syntax
  description: "for x := range f iterates using a function iterator"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [range, iterator, syntax]
  detection:
    primary:
      ast_type: for_statement
      match:
        range_over_func: true
  fix:
    strategy: manual
    manual_instructions: |
      Range over functions requires Go 1.22+.
      Replace with explicit function calls or callback patterns:
        for k, v := range seq.All(m) { ... }
        →
        seq.All(m)(func(k K, v V) bool { ...; return true })
  verification:
    re_detect: true
  test:
    before: |
      for k, v := range maps.All(m) {
          process(k, v)
      }
    after: |
      maps.All(m)(func(k string, v int) bool {
          process(k, v)
          return true
      })
