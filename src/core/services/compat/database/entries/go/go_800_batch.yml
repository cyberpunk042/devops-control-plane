- id: go.1_23.range_closure
  language: go
  feature_name: range over closure
  introduced: '1.23'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - range
  - closure
  - iterator
  detection:
    primary:
      ast_type: for_statement
      match:
        range_over_func: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: for_statement
        range_over_func: true
      replace:
        note: range over closure — go 1.23+
  verification:
    re_detect: true
  test:
    before: 'for v := range genFunc {}

      '
    after: 'genFunc(func(v int) bool { return true })

      '
