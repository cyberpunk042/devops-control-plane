- id: go.1_18.any_comparable
  language: go
  feature_name: any and comparable predeclared
  introduced: '1.18'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - any
  - comparable
  - predeclared
  detection:
    primary:
      ast_type: type_identifier
      match:
        name_in: &id001
        - any
        - comparable
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: type_identifier
        name_in: *id001
      replace:
        note: any and comparable predeclared — go 1.18+
  verification:
    re_detect: true
  test:
    before: 'func f(x any) {}

      '
    after: 'func f(x interface{}) {}

      '
