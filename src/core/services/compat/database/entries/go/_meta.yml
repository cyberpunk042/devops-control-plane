language: go
display_name: Go
file_extensions: [".go"]
parser: tree-sitter-go

versions:
  - version: "1.18"
    status: eol
  - version: "1.19"
    status: eol
  - version: "1.20"
    status: eol
  - version: "1.21"
    status: active
  - version: "1.22"
    status: active
  - version: "1.23"
    status: active

version_format: "major.minor"

default_exclusions:
  - "vendor"
  - "testdata"

import_styles:
  - 'import "{module}"'
  - 'import . "{module}"'

package_registry:
  name: "Go Module Proxy"
  api: "https://proxy.golang.org/{module}/@latest"
  version_field: "go"
