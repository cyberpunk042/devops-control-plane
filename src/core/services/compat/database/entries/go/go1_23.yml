# Go 1.23 features

- id: go.1_23.unique_package
  language: go
  feature_name: "unique package"
  introduced: "1.23"
  category: stdlib
  description: "Canonicalize values for efficient comparison (interning)"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags: [unique, interning, stdlib]
  detection:
    primary:
      ast_type: import_spec
      match:
        path: '"unique"'
  fix:
    strategy: manual
    manual_instructions: "Implement manual interning with sync.Map or use a third-party interning library."
  verification:
    re_detect: true
  test:
    before: |
      import "unique"
      h := unique.Make("hello")
    after: |
      // Manual interning implementation needed

- id: go.1_23.iter_package
  language: go
  feature_name: "iter package (iterators)"
  introduced: "1.23"
  category: stdlib
  description: "Standard iterator types and combinators"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags: [iter, iterator, stdlib]
  detection:
    primary:
      ast_type: import_spec
      match:
        path: '"iter"'
  fix:
    strategy: manual
    manual_instructions: "Use explicit loops or channel-based iteration patterns."
  verification:
    re_detect: true
  test:
    before: |
      import "iter"
      for v := range iter.Seq[int](gen) { process(v) }
    after: |
      for _, v := range gen() { process(v) }

