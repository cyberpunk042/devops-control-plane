# Go — final batch for 1000

- id: go.1_21.maps_delete_func
  language: go
  feature_name: "maps.DeleteFunc()"
  introduced: "1.21"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [maps, delete, func]
  detection: { primary: { ast_type: call_expression, match: { package: maps, function: DeleteFunc } } }
  fix: { strategy: manual, manual_instructions: "for k, v := range m { if pred(k,v) { delete(m, k) } }" }
  verification: { re_detect: true }
  test: { before: "maps.DeleteFunc(m, pred)\n", after: "for k,v:=range m{if pred(k,v){delete(m,k)}}\n" }

