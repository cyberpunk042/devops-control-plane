- id: go.1_21.maps_delete_func
  language: go
  feature_name: maps.DeleteFunc()
  introduced: '1.21'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - maps
  - delete
  - func
  detection:
    primary:
      ast_type: call_expression
      match:
        package: maps
        function: DeleteFunc
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        package: maps
        function: DeleteFunc
      replace:
        note: maps.DeleteFunc() — go 1.21+
  verification:
    re_detect: true
  test:
    before: 'maps.DeleteFunc(m, pred)

      '
    after: 'for k,v:=range m{if pred(k,v){delete(m,k)}}

      '
