# Go 1.21 features

- id: go.1_21.slices_package
  language: go
  feature_name: "slices package"
  introduced: "1.21"
  category: stdlib
  description: "Generic slice manipulation functions in stdlib"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags: [slices, generics, stdlib]
  detection:
    primary:
      ast_type: import_spec
      match:
        path: '"slices"'
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_statement
        find:
          import_pattern: '"slices"'
        replace:
          import_statement: '"golang.org/x/exp/slices"'
    backport:
      package: "golang.org/x/exp/slices"
      install_command: "go get golang.org/x/exp/slices"
      supports_versions: ">=1.18"
      maintained: true
      notes: "Experimental precursor — API mostly compatible"
  verification:
    re_detect: true
  test:
    before: |
      import "slices"
      func main() { slices.Sort(data) }
    after: |
      import "golang.org/x/exp/slices"
      func main() { slices.Sort(data) }


