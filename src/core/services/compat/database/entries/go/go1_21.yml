- id: go.1_21.min_max_builtins
  language: go
  feature_name: "min/max builtin functions"
  introduced: "1.21"
  category: syntax
  description: "Built-in min() and max() functions for ordered types"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_builtin
  tags: [builtin, math]
  detection:
    primary:
      ast_type: call_expression
      match:
        function_in: [min, max]
        is_builtin: true
  fix:
    strategy: manual
    manual_instructions: |
      min/max builtins require Go 1.21+. Options:
        1. Define helper functions:
           func min(a, b int) int { if a < b { return a }; return b }
           func max(a, b int) int { if a > b { return a }; return b }
        2. Use math.Min/math.Max for float64
        3. Note: generic min/max requires type-specific implementations without generics
  verification:
    re_detect: true
  test:
    before: |
      func smallest(a, b int) int { return min(a, b) }
    after: |
      func min(a, b int) int { if a < b { return a }; return b }
      func smallest(a, b int) int { return min(a, b) }


- id: go.1_21.clear_builtin
  language: go
  feature_name: "clear() builtin"
  introduced: "1.21"
  category: syntax
  description: "Built-in clear() for maps and slices"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_builtin
  tags: [builtin, clear]
  detection:
    primary:
      ast_type: call_expression
      match:
        function: clear
        is_builtin: true
  fix:
    strategy: manual
    manual_instructions: |
      clear() builtin requires Go 1.21+. Replacements:
        For maps: for k := range m { delete(m, k) }
        For slices: s = s[:0]
  verification:
    re_detect: true
  test:
    before: |
      func reset(m map[string]int) { clear(m) }
    after: |
      func reset(m map[string]int) { for k := range m { delete(m, k) } }
