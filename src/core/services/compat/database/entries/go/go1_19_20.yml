- id: go.1_19.atomic_types
  language: go
  feature_name: sync/atomic type wrappers
  introduced: '1.19'
  category: stdlib
  description: 'Type-safe atomic wrappers: atomic.Int64, atomic.Bool, etc.'
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - atomic
  - sync
  - concurrency
  detection:
    primary:
      ast_type: qualified_type
      match:
        package: atomic
        type_in: &id001
        - Int32
        - Int64
        - Uint32
        - Uint64
        - Bool
        - Pointer
        - Value
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: qualified_type
        package: atomic
        type_in: *id001
      replace:
        note: sync/atomic type wrappers — go 1.19+
  verification:
    re_detect: true
  test:
    before: 'var count atomic.Int64

      count.Add(1)

      '
    after: 'var count int64

      atomic.AddInt64(&count, 1)

      '
- id: go.1_19.sort_find
  language: go
  feature_name: sort.Find()
  introduced: '1.19'
  category: stdlib
  description: Binary search returning the index and found status
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - sort
  - search
  - binary
  detection:
    primary:
      ast_type: call_expression
      match:
        package: sort
        function: Find
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        package: sort
        function: Find
      replace:
        note: sort.Find() — go 1.19+
  verification:
    re_detect: true
  test:
    before: "i, found := sort.Find(len(data), func(i int) int {\n    return strings.Compare(target,\
      \ data[i])\n})\n"
    after: "i := sort.Search(len(data), func(i int) bool {\n    return strings.Compare(target,\
      \ data[i]) >= 0\n})\nfound := i < len(data) && data[i] == target\n"
- id: go.1_20.errors_unwrap_multiple
  language: go
  feature_name: errors.Join / multi-error wrapping
  introduced: '1.20'
  category: stdlib
  description: Wrapping multiple errors with %w in fmt.Errorf, errors.Join
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - errors
  - wrapping
  - multiple
  detection:
    primary:
      ast_type: call_expression
      match:
        package: errors
        function: Join
  fix:
    strategy: rewrite_expression
    backport:
      package: github.com/hashicorp/go-multierror
      install_command: go get github.com/hashicorp/go-multierror
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        package: errors
        function: Join
      replace:
        note: errors.Join / multi-error wrapping — go 1.20+
  verification:
    re_detect: true
  test:
    before: 'err := errors.Join(validateErr, saveErr)

      '
    after: 'err := multierror.Append(validateErr, saveErr)

      '
- id: go.1_20.context_with_cause
  language: go
  feature_name: context.WithCancelCause
  introduced: '1.20'
  category: stdlib
  description: Cancel context with a specific cause error
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - context
  - cancel
  - cause
  detection:
    primary:
      ast_type: call_expression
      match:
        package: context
        function_in: &id002
        - WithCancelCause
        - WithDeadlineCause
        - WithTimeoutCause
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        package: context
        function_in: *id002
      replace:
        note: context.WithCancelCause — go 1.20+
  verification:
    re_detect: true
  test:
    before: 'ctx, cancel := context.WithCancelCause(parentCtx)

      defer cancel(nil)

      '
    after: 'ctx, cancel := context.WithCancel(parentCtx)

      defer cancel()

      '
- id: go.1_20.slice_to_array
  language: go
  feature_name: slice to array conversion
  introduced: '1.20'
  category: syntax
  description: 'Direct conversion from slice to array: [4]byte(slice)'
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - slice
  - array
  - conversion
  detection:
    primary:
      ast_type: type_conversion_expression
      match:
        target_type: array
        source_type: slice
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: type_conversion_expression
        target_type: array
        source_type: slice
      replace:
        note: slice to array conversion — go 1.20+
  verification:
    re_detect: true
  test:
    before: 'arr := [4]byte(data[:4])

      '
    after: 'var arr [4]byte

      copy(arr[:], data[:4])

      '
