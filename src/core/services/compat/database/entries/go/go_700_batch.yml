- id: go.1_23.os_copyfs
  language: go
  feature_name: "os.CopyFS()"
  introduced: "1.23"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [os, copyfs, filesystem]
  detection:
    primary: { ast_type: call_expression, match: { package: os, function: CopyFS } }
  fix: { strategy: manual, manual_instructions: "Use filepath.WalkDir with manual copy." }
  verification: { re_detect: true }
  test: { before: "os.CopyFS(dst, srcFS)\n", after: "// Manual walk + copy\n" }
