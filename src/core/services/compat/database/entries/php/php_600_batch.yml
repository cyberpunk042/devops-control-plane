- id: php.8_0.throw_expression
  language: php
  feature_name: throw as expression
  introduced: '8.0'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - throw
  - expression
  - syntax
  detection:
    primary:
      ast_type: throw_expression
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: throw_expression
      replace:
        note: throw as expression — php 8.0+
  verification:
    re_detect: true
  test:
    before: '$value = $input ?? throw new InvalidArgumentException();

      '
    after: 'if ($input === null) throw new InvalidArgumentException();

      $value = $input;

      '
- id: php.8_1.never_return_type
  language: php
  feature_name: never return type
  introduced: '8.1'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - never
  - return
  - type
  detection:
    primary:
      ast_type: named_type
      match:
        name: never
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: named_type
        name: never
      replace:
        note: never return type — php 8.1+
  verification:
    re_detect: true
  test:
    before: 'function abort(): never { exit(1); }

      '
    after: 'function abort(): void { exit(1); }

      '
- id: php.8_2.constants_in_traits
  language: php
  feature_name: constants in traits
  introduced: '8.2'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - trait
  - constants
  - syntax
  detection:
    primary:
      ast_type: const_declaration
      context: trait_body
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: const_declaration
      replace:
        note: constants in traits — php 8.2+
  verification:
    re_detect: true
  test:
    before: 'trait HasVersion { const VERSION = ''1.0''; }

      '
    after: 'interface HasVersion { const VERSION = ''1.0''; }

      '
