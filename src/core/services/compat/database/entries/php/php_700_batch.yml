- id: php.8_0.mixed_type
  language: php
  feature_name: mixed type
  introduced: '8.0'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - types
  - mixed
  detection:
    primary:
      ast_type: named_type
      match:
        name: mixed
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: named_type
        name: mixed
      replace:
        note: mixed type — php 8.0+
  verification:
    re_detect: true
  test:
    before: 'function process(mixed $input): mixed {}

      '
    after: 'function process($input) {}

      '
- id: php.8_1.readonly_promotion
  language: php
  feature_name: readonly constructor promotion
  introduced: '8.1'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - readonly
  - promotion
  - constructor
  detection:
    primary:
      ast_type: property_promotion_parameter
      match:
        modifiers_contains: readonly
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: property_promotion_parameter
        modifiers_contains: readonly
      replace:
        note: readonly constructor promotion — php 8.1+
  verification:
    re_detect: true
  test:
    before: 'public function __construct(public readonly string $name) {}

      '
    after: 'private string $name;

      public function __construct(string $name) { $this->name = $name; }

      '
- id: php.8_2.disjunctive_normal_form
  language: php
  feature_name: DNF types
  introduced: '8.2'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - types
  - dnf
  - compound
  detection:
    primary:
      ast_type: disjunctive_normal_form_type
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: disjunctive_normal_form_type
      replace:
        note: DNF types — php 8.2+
  verification:
    re_detect: true
  test:
    before: 'function f((A&B)|C $x) {}

      '
    after: '/** @param A&B|C $x */

      function f($x) {}

      '
- id: php.8_3.fetch_class_constants
  language: php
  feature_name: class constant dynamic fetch
  introduced: '8.3'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - constant
  - dynamic
  detection:
    primary:
      ast_type: dynamic_class_const_access
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: dynamic_class_const_access
      replace:
        note: class constant dynamic fetch — php 8.3+
  verification:
    re_detect: true
  test:
    before: '$val = Enum::{$name};

      '
    after: '$val = constant(Enum::class . ''::'' . $name);

      '
- id: php.7_4.unpack_in_const
  language: php
  feature_name: unpacking inside const arrays
  introduced: '8.1'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - unpack
  - const
  - array
  detection:
    primary:
      ast_type: spread_element
      context: const_declaration
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: spread_element
      replace:
        note: unpacking inside const arrays — php 8.1+
  verification:
    re_detect: true
  test:
    before: 'const ALL = [...DEFAULTS, ...EXTRA];

      '
    after: 'const ALL = [''a'', ''b'', ''c'', ''d''];

      '
