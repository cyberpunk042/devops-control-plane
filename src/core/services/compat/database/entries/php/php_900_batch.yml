- id: php.8_0.mixed_return_type
  language: php
  feature_name: mixed return type
  introduced: '8.0'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - mixed
  - return
  - type
  detection:
    primary:
      ast_type: named_type
      match:
        name: mixed
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: named_type
        name: mixed
      replace:
        note: mixed return type — php 8.0+
  verification:
    re_detect: true
  test:
    before: 'function f(): mixed {}

      '
    after: 'function f() {}

      '
- id: php.8_1.fiber_suspend
  language: php
  feature_name: Fiber::suspend()
  introduced: '8.1'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - fiber
  - suspend
  - async
  detection:
    primary:
      ast_type: scoped_call_expression
      match:
        method: suspend
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: scoped_call_expression
        method: suspend
      replace:
        note: Fiber::suspend() — php 8.1+
  verification:
    re_detect: true
  test:
    before: 'Fiber::suspend($value);

      '
    after: 'yield $value;

      '
- id: php.8_2.sensitive_parameter
  language: php
  feature_name: '#[SensitiveParameter]'
  introduced: '8.2'
  category: syntax
  direction: downgrade
  severity: warning
  error_type: syntax_error
  tags:
  - sensitive
  - parameter
  - security
  detection:
    primary:
      ast_type: attribute
      match:
        name: SensitiveParameter
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: attribute
        name: SensitiveParameter
      replace:
        note: '#[SensitiveParameter] — php 8.2+'
  verification:
    re_detect: true
  test:
    before: 'function login(#[SensitiveParameter] string $password) {}

      '
    after: 'function login(string $password) {}

      '
