- id: php.8_0.nullsafe_operator
  language: php
  feature_name: null-safe operator (?->)
  introduced: '8.0'
  category: syntax
  description: Short-circuit null check on method chains
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - nullsafe
  - operator
  - chain
  detection:
    primary:
      ast_type: nullsafe_member_access_expression
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: nullsafe_member_access_expression
      replace:
        note: null-safe operator (?->) — php 8.0+
  verification:
    re_detect: true
  test:
    before: '$country = $user?->address?->country;

      '
    after: '$country = ($user !== null && $user->address !== null) ? $user->address->country
      : null;

      '
- id: php.8_0.constructor_promotion
  language: php
  feature_name: constructor promotion
  introduced: '8.0'
  category: syntax
  description: Declare and assign properties in constructor parameters
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - constructor
  - promotion
  - class
  detection:
    primary:
      ast_type: property_promotion_parameter
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: property_promotion_parameter
      replace:
        note: constructor promotion — php 8.0+
  verification:
    re_detect: true
  test:
    before: "class User {\n    public function __construct(\n        private string\
      \ $name,\n        public int $age,\n    ) {}\n}\n"
    after: "class User {\n    private string $name;\n    public int $age;\n    public\
      \ function __construct(string $name, int $age) {\n        $this->name = $name;\n\
      \        $this->age = $age;\n    }\n}\n"
- id: php.8_0.str_functions
  language: php
  feature_name: str_contains/str_starts_with/str_ends_with
  introduced: '8.0'
  category: stdlib
  description: New string functions for common operations
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - string
  - functions
  detection:
    primary:
      ast_type: function_call_expression
      match:
        function_in: &id001
        - str_contains
        - str_starts_with
        - str_ends_with
  fix:
    strategy: rewrite_expression
    backport:
      package: symfony/polyfill-php80
      install_command: composer require symfony/polyfill-php80
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: function_call_expression
        function_in: *id001
      replace:
        note: str_contains/str_starts_with/str_ends_with — php 8.0+
  verification:
    re_detect: true
  test:
    before: 'if (str_contains($haystack, $needle)) { found(); }

      '
    after: 'if (strpos($haystack, $needle) !== false) { found(); }

      '
- id: php.8_1.intersection_types
  language: php
  feature_name: intersection types (A&B)
