  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - types
  - intersection
  - syntax
  detection:
    primary:
      ast_type: intersection_type
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: intersection_type
      replace:
        note: intersection types (A&B) — php 8.1+
  verification:
    re_detect: true
  test:
    before: 'function process(Iterator&Countable $items): void { }

      '
    after: '/** @param Iterator&Countable $items */

      function process($items): void { }

      '
- id: php.8_1.fibers
  language: php
  feature_name: Fiber class
  introduced: '8.1'
  category: stdlib
  description: Lightweight cooperative concurrency
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - fiber
  - async
  - concurrency
  detection:
    primary:
      ast_type: object_creation_expression
      match:
        class: Fiber
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: object_creation_expression
        class: Fiber
      replace:
        note: Fiber class — php 8.1+
  verification:
    re_detect: true
  test:
    before: '$fiber = new Fiber(function(): void { Fiber::suspend(''hello''); });

      '
    after: '// Use generators or ReactPHP for async patterns

      '
- id: php.8_2.readonly_classes
  language: php
  feature_name: readonly class
  introduced: '8.2'
  category: syntax
  description: All properties in a readonly class are implicitly readonly
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - readonly
  - class
  - syntax
  detection:
    primary:
      ast_type: class_declaration
      match:
        modifiers_contains: readonly
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: class_declaration
        modifiers_contains: readonly
      replace:
        note: readonly class — php 8.2+
  verification:
    re_detect: true
  test:
    before: "readonly class Config {\n    public function __construct(public string\
      \ $name, public int $port) {}\n}\n"
    after: "class Config {\n    public function __construct(\n        public readonly\
      \ string $name,\n        public readonly int $port,\n    ) {}\n}\n"
- id: php.8_2.true_false_null_types
  language: php
  feature_name: true/false/null standalone types
  introduced: '8.2'
  category: syntax
  description: Use true, false, null as standalone type declarations
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - types
  - standalone
  - syntax
  detection:
    primary:
      ast_type: named_type
      match:
        name_in: &id002
        - true
        - false
        - 'null'
        context: type_declaration
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: named_type
        name_in: *id002
        context: type_declaration
      replace:
        note: true/false/null standalone types — php 8.2+
  verification:
    re_detect: true
  test:
    before: 'function alwaysTrue(): true { return true; }

      '
    after: 'function alwaysTrue(): bool { return true; }

      '
- id: php.8_3.typed_constants
  language: php
  feature_name: typed class constants
  introduced: '8.3'
  category: syntax
  description: Type declarations on class constants
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - constants
  - types
  - class
  detection:
    primary:
      ast_type: const_declaration
      match:
        has_type: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: const_declaration
        has_type: true
      replace:
        note: typed class constants — php 8.3+
  verification:
    re_detect: true
  test:
    before: "class Config {\n    const string VERSION = '1.0.0';\n}\n"
    after: "class Config {\n    const VERSION = '1.0.0';\n}\n"
- id: php.8_3.override_attribute
  language: php
  feature_name: '#[Override] attribute'
  introduced: '8.3'
  category: syntax
  description: Explicitly declare a method overrides a parent method
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - override
  - attribute
  - method
  detection:
    primary:
      ast_type: attribute
      match:
        name: Override
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: attribute
        name: Override
      replace:
        note: '#[Override] attribute — php 8.3+'
  verification:
    re_detect: true
  test:
    before: "class Child extends Parent {\n    #[Override]\n    public function method():\
      \ void {}\n}\n"
    after: "class Child extends Parent {\n    /** @override */\n    public function\
      \ method(): void {}\n}\n"
