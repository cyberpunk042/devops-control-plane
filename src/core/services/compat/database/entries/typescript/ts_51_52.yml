- id: ts.5_1.return_undefined
  language: typescript
  feature_name: undefined-returning functions
  introduced: '5.1'
  category: ts5
  description: Functions with no return can be typed as returning undefined
  direction: downgrade
  severity: info
  error_type: type_error
  tags:
  - undefined
  - return
  - function
  detection:
    primary:
      ast_type: function_declaration
      match:
        return_type: undefined
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: function_declaration
        return_type: undefined
      replace:
        note: undefined-returning functions — typescript 5.1+
  verification:
    re_detect: true
  test:
    before: 'function log(msg: string): undefined { console.log(msg); }

      '
    after: 'function log(msg: string): void { console.log(msg); }

      '
- id: ts.5_1.getter_setter_unrelated
  language: typescript
  feature_name: unrelated getter/setter types
  introduced: '5.1'
  category: ts5
  description: Getter and setter can have unrelated types
  direction: downgrade
  severity: warning
  error_type: type_error
  tags:
  - getter
  - setter
  - types
  detection:
    primary:
      ast_type: accessor_declaration
      match:
        mismatched_types: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: accessor_declaration
        mismatched_types: true
      replace:
        note: unrelated getter/setter types — typescript 5.1+
  verification:
    re_detect: true
  test:
    before: "class Box {\n  #value: number = 0;\n  get value(): number { return this.#value;\
      \ }\n  set value(val: string | number) { this.#value = Number(val); }\n}\n"
    after: "class Box {\n  #value: number = 0;\n  get value(): number { return this.#value;\
      \ }\n  set value(val: number) { this.#value = val; }\n}\n"
- id: ts.5_2.decorator_metadata
  language: typescript
  feature_name: decorator metadata
  introduced: '5.2'
  category: ts5
  description: Symbol.metadata for decorator context
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - decorator
  - metadata
  - symbol
  detection:
    primary:
      ast_type: member_expression
      match:
        object: Symbol
        property: metadata
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: member_expression
        object: Symbol
        property: metadata
      replace:
        note: decorator metadata — typescript 5.2+
  verification:
    re_detect: true
  test:
    before: "function track(target: any, context: ClassMethodDecoratorContext) {\n\
      \  context.metadata[context.name] = true;\n}\n"
    after: "const metadata = new WeakMap();\nfunction track(target: any) {\n  metadata.set(target,\
      \ true);\n}\n"
