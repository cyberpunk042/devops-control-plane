- id: ts.5_5.isolated_declarations
  language: typescript
  feature_name: isolated declarations
  introduced: '5.5'
  category: ts5
  direction: downgrade
  severity: info
  error_type: type_error
  tags:
  - isolated
  - declarations
  - dts
  detection:
    primary:
      ast_type: tsconfig_json
      match:
        isolatedDeclarations: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: tsconfig_json
        isolatedDeclarations: true
      replace:
        note: isolated declarations — typescript 5.5+
  verification:
    re_detect: true
  test:
    before: '{ "isolatedDeclarations": true }

      '
    after: '{}

      '
- id: ts.5_2.using_declarations_ts
  language: typescript
  feature_name: using/await using
  introduced: '5.2'
  category: ts5
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - using
  - disposable
  - resource
  detection:
    primary:
      ast_type: using_declaration
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: using_declaration
      replace:
        note: using/await using — typescript 5.2+
  verification:
    re_detect: true
  test:
    before: 'using db = getConnection();

      '
    after: 'const db = getConnection();

      try { } finally { db.close(); }

      '
