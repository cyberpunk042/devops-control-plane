- id: ruby.3_2.io_buffer
  language: ruby
  feature_name: IO::Buffer
  introduced: '3.2'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - io
  - buffer
  - memory
  detection:
    primary:
      ast_type: call
      match:
        receiver: IO
        method: Buffer
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        receiver: IO
        method: Buffer
      replace:
        note: IO::Buffer — ruby 3.2+
  verification:
    re_detect: true
  test:
    before: 'buf = IO::Buffer.new(1024)

      '
    after: 'buf = "\0" * 1024

      '
