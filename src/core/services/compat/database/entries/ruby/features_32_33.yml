# Ruby 3.2-3.3 extras

- id: ruby.3_2.struct_keyword_init_default
  language: ruby
  feature_name: "Struct keyword_init default"
  introduced: "3.2"
  category: stdlib
  description: "Struct auto-detects keyword_init vs positional"
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [struct, keyword_init]
  detection:
    primary:
      ast_type: call
      match:
        receiver: Struct
        method: new
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      Point = Struct.new(:x, :y)
    after: |
      Point = Struct.new(:x, :y)

- id: ruby.3_3.range_overlap
  language: ruby
  feature_name: "Range#overlap?"
  introduced: "3.3"
  category: stdlib
  description: "Check if two ranges overlap"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [range, overlap, method]
  detection:
    primary:
      ast_type: call
      match:
        method: overlap?
  fix:
    strategy: manual
    manual_instructions: |
      Implement manually:
        (1..5).overlap?(3..8)
        → !(a.max < b.min || b.max < a.min)
  verification:
    re_detect: true
  test:
    before: |
      if (1..5).overlap?(3..8)
        puts "overlaps"
      end
    after: |
      a = (1..5); b = (3..8)
      if !(a.max < b.min || b.max < a.min)
        puts "overlaps"
      end

- id: ruby.3_3.prism_parser
  language: ruby
  feature_name: "Prism parser (default)"
  introduced: "3.3"
  category: stdlib
  description: "Prism becomes the default Ruby parser"
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [parser, prism]
  detection:
    primary:
      ast_type: call
      match:
        module: Prism
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      Prism.parse("1 + 2")
    after: |
      # Use Ripper or Parser gem on older Ruby
