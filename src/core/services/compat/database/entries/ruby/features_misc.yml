      match:
        function: binding
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: 'binding.irb

      '
    after: 'binding.irb

      '
- id: ruby.3_2.immutable_strings
  language: ruby
  feature_name: frozen string literal improvements
  introduced: '3.2'
  category: stdlib
  description: Improved frozen string literal performance
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - frozen
  - string
  - performance
  detection:
    primary:
      ast_type: comment
      match:
        content: 'frozen_string_literal: true'
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: '# frozen_string_literal: true

      '
    after: '# frozen_string_literal: true

      '
