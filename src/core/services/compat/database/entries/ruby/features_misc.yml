- id: ruby.2_7.pattern_matching_experimental
  language: ruby
  feature_name: pattern matching (experimental)
  introduced: '2.7'
  category: syntax
  description: Experimental case/in (finalized in 3.0)
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - pattern
  - experimental
  detection:
    primary:
      ast_type: case_match
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: case_match
      replace:
        note: pattern matching (experimental) — ruby 2.7+
  verification:
    re_detect: true
  test:
    before: 'case obj in [Integer => x] then x end

      '
    after: 'x = obj.is_a?(Integer) ? obj : nil

      '
- id: ruby.3_0.ractor_move
  language: ruby
  feature_name: Ractor.new with move
  introduced: '3.0'
  category: stdlib
  description: Move objects between Ractors
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - ractor
  - move
  - concurrency
  detection:
    primary:
      ast_type: call
      match:
        receiver: Ractor
        method: new
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        receiver: Ractor
        method: new
      replace:
        note: Ractor.new with move — ruby 3.0+
  verification:
    re_detect: true
  test:
    before: 'Ractor.new(data, move: true) { |d| process(d) }

      '
    after: 'Thread.new { process(Marshal.load(Marshal.dump(data))) }

      '
