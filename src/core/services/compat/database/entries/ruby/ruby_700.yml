- id: ruby.3_2.set_intersect_operator
  language: ruby
  feature_name: "Set#intersect?/disjoint?"
  introduced: "3.2"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [set, intersect, disjoint]
  detection:
    primary: { ast_type: call, match: { method_in: ["intersect?", "disjoint?"] } }
  fix: { strategy: manual, manual_instructions: "Use (a & b).empty? for disjoint, !(a & b).empty? for intersect." }
  verification: { re_detect: true }
  test: { before: "set1.intersect?(set2)\n", after: "!(set1 & set2).empty?\n" }
