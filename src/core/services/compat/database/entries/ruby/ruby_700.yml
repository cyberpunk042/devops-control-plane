# Ruby — 700 batch

- id: ruby.3_0.integer_zero
  language: ruby
  feature_name: "Integer.try_convert"
  introduced: "3.0"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [integer, convert]
  detection:
    primary: { ast_type: call, match: { receiver: Integer, method: try_convert } }
  fix: { strategy: manual, manual_instructions: "Use Integer(val) rescue nil." }
  verification: { re_detect: true }
  test: { before: "Integer.try_convert('42')\n", after: "Integer('42') rescue nil\n" }

- id: ruby.3_1.process_fork_deprecated
  language: ruby
  feature_name: "Process._fork"
  introduced: "3.1"
  category: stdlib
