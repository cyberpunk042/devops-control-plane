- id: ruby.3_2.set_intersect_operator
  language: ruby
  feature_name: Set#intersect?/disjoint?
  introduced: '3.2'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - set
  - intersect
  - disjoint
  detection:
    primary:
      ast_type: call
      match:
        method_in: &id001
        - intersect?
        - disjoint?
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        method_in: *id001
      replace:
        note: Set#intersect?/disjoint? — ruby 3.2+
  verification:
    re_detect: true
  test:
    before: 'set1.intersect?(set2)

      '
    after: '!(set1 & set2).empty?

      '
