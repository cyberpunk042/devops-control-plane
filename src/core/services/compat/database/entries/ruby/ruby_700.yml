- id: ruby.3_0.integer_zero
  language: ruby
  feature_name: Integer.try_convert
  introduced: '3.0'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - integer
  - convert
  detection:
    primary:
      ast_type: call
      match:
        receiver: Integer
        method: try_convert
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        receiver: Integer
        method: try_convert
      replace:
        note: Integer.try_convert — ruby 3.0+
  verification:
    re_detect: true
  test:
    before: 'Integer.try_convert(''42'')

      '
    after: 'Integer(''42'') rescue nil

      '
