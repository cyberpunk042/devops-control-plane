- id: ruby.3_0.hash_except
  language: ruby
  feature_name: Hash#except
  introduced: '3.0'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - hash
  - except
  - filter
  detection:
    primary:
      ast_type: call
      match:
        method: except
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        method: except
      replace:
        note: Hash#except — ruby 3.0+
  verification:
    re_detect: true
  test:
    before: 'clean = params.except(:password, :token)

      '
    after: 'clean = params.reject { |k, _| [:password, :token].include?(k) }

      '
