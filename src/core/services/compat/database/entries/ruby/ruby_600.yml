# Ruby — push to 600

- id: ruby.3_0.hash_except
  language: ruby
  feature_name: "Hash#except"
  introduced: "3.0"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [hash, except, filter]
  detection:
    primary:
      ast_type: call
      match: { method: except }
  fix:
    strategy: manual
    manual_instructions: "hash.except(:a, :b) → hash.reject { |k, _| [:a, :b].include?(k) }"
  verification: { re_detect: true }
  test:
    before: |
      clean = params.except(:password, :token)
    after: |
      clean = params.reject { |k, _| [:password, :token].include?(k) }

