- id: rust.1_58.format_captured_idents
  language: rust
  feature_name: captured identifiers in format strings
  introduced: '1.58'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - format
  - captured
  - identifiers
  detection:
    primary:
      ast_type: macro_invocation
      match:
        macro_name_in: &id001
        - println
        - format
        - write
        - eprintln
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: macro_invocation
        macro_name_in: *id001
      replace:
        note: captured identifiers in format strings — rust 1.58+
  verification:
    re_detect: false
  test:
    before: 'println!("{name} is {age}");

      '
    after: 'println!("{} is {}", name, age);

      '
- id: rust.1_61.const_fn_trait_bounds
  language: rust
  feature_name: const fn with trait bounds
  introduced: '1.61'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - const
  - fn
  - trait_bounds
  detection:
    primary:
      ast_type: function_item
      match:
        is_const: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: function_item
        is_const: true
      replace:
        note: const fn with trait bounds — rust 1.61+
  verification:
    re_detect: false
  test:
    before: 'const fn max<T: Ord>(a: T, b: T) -> T { if a > b { a } else { b } }

      '
    after: 'fn max<T: Ord>(a: T, b: T) -> T { if a > b { a } else { b } }

      '
- id: rust.1_79.associated_type_bounds
  language: rust
  feature_name: associated type bounds in trait
  introduced: '1.79'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - associated
  - type
  - bounds
  detection:
    primary:
      ast_type: type_bound_list
      match:
        has_associated_type_bound: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: type_bound_list
        has_associated_type_bound: true
      replace:
        note: associated type bounds in trait — rust 1.79+
  verification:
    re_detect: true
  test:
    before: 'fn f(x: impl Iterator<Item: Display>) {}

      '
    after: 'fn f<T: Iterator>(x: T) where T::Item: Display {}

      '
