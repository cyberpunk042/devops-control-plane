# Rust — final for 1000

- id: rust.1_65.generic_associated_types_stable
  language: rust
  feature_name: "GATs (stable)"
  introduced: "1.65"
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [gats, generics, associated]
  detection: { primary: { ast_type: associated_type, match: { has_type_params: true } } }
  fix: { strategy: manual, manual_instructions: "Use concrete types or Box<dyn>." }
  verification: { re_detect: true }
  test: { before: "type Item<'a>;\n", after: "type Item;\n" }

- id: rust.1_75.async_trait_stable
  language: rust
  feature_name: "async fn in traits"
  introduced: "1.75"
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [async, trait, stable]
  detection: { primary: { ast_type: function_item, match: { is_async: true, context: trait_impl } } }
  fix: { strategy: manual, manual_instructions: "Use async-trait crate." }
  verification: { re_detect: true }
  test: { before: "async fn handle(&self) {}\n", after: "#[async_trait] async fn handle(&self) {}\n" }

- id: rust.1_80.lazy_type_aliases
  language: rust
