- id: java.21.record_patterns_switch
  language: java
  feature_name: record patterns in switch
  introduced: '21'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - record
  - pattern
  - switch
  detection:
    primary:
      ast_type: switch_expression
      match:
        has_record_pattern: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: switch_expression
        has_record_pattern: true
      replace:
        note: record patterns in switch — java 21+
  verification:
    re_detect: true
  test:
    before: 'case Point(var x, var y) -> x + y;

      '
    after: 'if (obj instanceof Point p) return p.x() + p.y();

      '
- id: java.11.optional_isempty
  language: java
  feature_name: Optional.isEmpty()
  introduced: '11'
  category: api
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - optional
  - isEmpty
  detection:
    primary:
      ast_type: method_invocation
      match:
        method: isEmpty
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_invocation
        method: isEmpty
      replace:
        note: Optional.isEmpty() — java 11+
  verification:
    re_detect: false
  test:
    before: 'if (opt.isEmpty()) {}

      '
    after: 'if (!opt.isPresent()) {}

      '
