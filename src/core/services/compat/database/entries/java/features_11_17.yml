- id: java.14.helpful_nullpointer
  language: java
  feature_name: helpful NullPointerException messages
  introduced: '14'
  category: jvm
  description: JVM shows which expression was null in NPE
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - npe
  - debugging
  - jvm
  detection:
    primary:
      ast_type: jvm_flag
      match:
        flag: -XX:+ShowCodeDetailsInExceptionMessages
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: '// JVM flag: -XX:+ShowCodeDetailsInExceptionMessages

      '
    after: '// Remove flag for older JVMs

      '
- id: java.16.record_components
  language: java
  feature_name: record with custom methods
  introduced: '16'
  category: syntax
  description: Records with custom constructors, methods, and static members
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - record
  - custom
  - methods
  detection:
    primary:
      ast_type: record_declaration
      match:
        has_body: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: record_declaration
        has_body: true
      replace:
        note: record with custom methods — java 16+
  verification:
    re_detect: true
  test:
    before: "public record Range(int start, int end) {\n    public Range {\n     \
      \   if (start > end) throw new IllegalArgumentException();\n    }\n    public\
      \ int length() { return end - start; }\n}\n"
    after: "public final class Range {\n    private final int start, end;\n    public\
      \ Range(int start, int end) {\n        if (start > end) throw new IllegalArgumentException();\n\
      \        this.start = start; this.end = end;\n    }\n    public int length()\
      \ { return end - start; }\n}\n"
- id: java.17.sealed_interfaces
  language: java
  feature_name: sealed interfaces
  introduced: '17'
  category: syntax
  description: Restrict which classes can implement an interface
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - sealed
  - interface
  - hierarchy
  detection:
    primary:
      ast_type: interface_declaration
      match:
        modifiers_contains: sealed
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: interface_declaration
        modifiers_contains: sealed
      replace:
        note: sealed interfaces — java 17+
  verification:
    re_detect: true
  test:
    before: 'public sealed interface Shape permits Circle, Rectangle {}

      '
    after: 'public interface Shape {}

      '
