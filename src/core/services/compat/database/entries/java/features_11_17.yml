# Java 11-17 features — filling gaps

- id: java.14.helpful_nullpointer
  language: java
  feature_name: "helpful NullPointerException messages"
  introduced: "14"
  category: jvm
  description: "JVM shows which expression was null in NPE"
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [npe, debugging, jvm]
  detection:
    primary:
      ast_type: jvm_flag
      match:
        flag: "-XX:+ShowCodeDetailsInExceptionMessages"
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      // JVM flag: -XX:+ShowCodeDetailsInExceptionMessages
    after: |
      // Remove flag for older JVMs

- id: java.16.record_components
  language: java
  feature_name: "record with custom methods"
  introduced: "16"
  category: syntax
  description: "Records with custom constructors, methods, and static members"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [record, custom, methods]
  detection:
    primary:
      ast_type: record_declaration
      match:
        has_body: true
  fix:
    strategy: manual
    manual_instructions: "Convert record body to equivalent class methods."
  verification:
    re_detect: true
  test:
    before: |
      public record Range(int start, int end) {
          public Range {
              if (start > end) throw new IllegalArgumentException();
          }
          public int length() { return end - start; }
      }
    after: |
      public final class Range {
          private final int start, end;
          public Range(int start, int end) {
              if (start > end) throw new IllegalArgumentException();
              this.start = start; this.end = end;
          }
          public int length() { return end - start; }
      }

- id: java.17.sealed_interfaces
  language: java
  feature_name: "sealed interfaces"
  introduced: "17"
  category: syntax
  description: "Restrict which classes can implement an interface"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [sealed, interface, hierarchy]
  detection:
    primary:
      ast_type: interface_declaration
      match:
        modifiers_contains: sealed
  fix:
    strategy: manual
    manual_instructions: "Remove 'sealed' and 'permits' keywords. Document constraints in Javadoc."
  verification:
    re_detect: true
  test:
    before: |
      public sealed interface Shape permits Circle, Rectangle {}
    after: |
      public interface Shape {}
