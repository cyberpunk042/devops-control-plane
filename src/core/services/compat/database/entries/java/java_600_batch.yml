  error_type: runtime_error
  tags:
  - serialization
  - filter
  - security
  detection:
    primary:
      ast_type: method_invocation
      match:
        method: setObjectInputFilter
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_invocation
        method: setObjectInputFilter
      replace:
        note: context-specific deserialization filters — java 17+
  verification:
    re_detect: true
  test:
    before: 'ois.setObjectInputFilter(filter);

      '
    after: 'ObjectInputFilter.Config.setSerialFilter(filter);

      '
- id: java.11.files_readstring
  language: java
  feature_name: Files.readString/writeString
  introduced: '11'
  category: api
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - files
  - string
  - io
  detection:
    primary:
      ast_type: method_invocation
      match:
        method_in: &id001
        - readString
        - writeString
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_invocation
        method_in: *id001
      replace:
        note: Files.readString/writeString — java 11+
  verification:
    re_detect: true
  test:
    before: 'String content = Files.readString(path);

      '
    after: 'String content = new String(Files.readAllBytes(path), StandardCharsets.UTF_8);

      '
- id: java.11.collection_tounmodifiable
  language: java
  feature_name: Collectors.toUnmodifiable*()
  introduced: '10'
  category: api
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - collectors
  - unmodifiable
  - collection
  detection:
    primary:
      ast_type: method_invocation
      match:
        method_in: &id002
        - toUnmodifiableList
        - toUnmodifiableSet
        - toUnmodifiableMap
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_invocation
        method_in: *id002
      replace:
        note: Collectors.toUnmodifiable*() — java 10+
  verification:
    re_detect: true
  test:
    before: 'List<String> names = stream.collect(Collectors.toUnmodifiableList());

      '
    after: 'List<String> names = Collections.unmodifiableList(stream.collect(Collectors.toList()));

      '
