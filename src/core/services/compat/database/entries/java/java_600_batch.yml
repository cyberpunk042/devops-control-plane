- id: java.14.npe_helpful_messages
  language: java
  feature_name: helpful NullPointerExceptions
  introduced: '14'
  category: jvm
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - npe
  - debug
  - messages
  detection:
    primary:
      ast_type: jvm_flag
      match:
        flag: ShowCodeDetailsInExceptionMessages
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: '// -XX:+ShowCodeDetailsInExceptionMessages

      '
    after: '// Not available

      '
- id: java.16.stream_tolist
  language: java
  feature_name: Stream.toList()
  introduced: '16'
  category: api
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - stream
  - toList
  - collection
  detection:
    primary:
      ast_type: method_invocation
      match:
        method: toList
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_invocation
        method: toList
      replace:
        note: Stream.toList() — java 16+
  verification:
    re_detect: true
  test:
    before: 'List<String> names = users.stream().map(User::name).toList();

      '
    after: 'List<String> names = users.stream().map(User::name).collect(Collectors.toList());

      '
- id: java.17.context_specific_deserialization
  language: java
  feature_name: context-specific deserialization filters
  introduced: '17'
  category: api
  direction: downgrade
