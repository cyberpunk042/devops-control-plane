- id: python.typing.deprecated
  language: python
  feature_name: warnings.deprecated
  introduced: '3.13'
  category: typing
  description: '@deprecated decorator for marking deprecated functions/classes'
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - warnings
  - deprecated
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: warnings
        names_contains: deprecated
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: warnings
        import_name: deprecated
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import deprecated
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.5.0
  verification:
    re_detect: true
  test:
    before: 'from warnings import deprecated

      @deprecated("Use new_func instead")

      def old_func(): pass

      '
    after: 'from typing_extensions import deprecated

      @deprecated("Use new_func instead")

      def old_func(): pass

      '
- id: python.syntax.type_defaults
  language: python
  feature_name: type parameter defaults
  introduced: '3.13'
  category: syntax
  description: Default values for type parameters (PEP 696)
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - typing
  - generics
  - defaults
  detection:
    primary:
      ast_type: Call
      match:
        func_id: TypeVar
  fix:
    strategy: rewrite_expression
    backport:
      package: typing-extensions
      min_version: 4.12.0
    transforms:
    - type: rewrite_method_call
      find:
        function: TypeVar
      replace:
        note: type parameter defaults — requires Python 3.13+
  verification:
    re_detect: true
  test:
    before: 'from typing import TypeVar

      T = TypeVar(''T'', default=int)

      '
    after: 'from typing import TypeVar

      T = TypeVar(''T'')

      '
