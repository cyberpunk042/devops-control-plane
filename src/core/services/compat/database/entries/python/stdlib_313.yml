- id: python.typing.typeis
  language: python
  feature_name: typing.TypeIs
  introduced: '3.13'
  category: typing
  description: TypeIs for precise type narrowing (PEP 742)
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - narrowing
  - typeis
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: TypeIs
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: TypeIs
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import TypeIs
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.10.0
  verification:
    re_detect: true
  test:
    before: "from typing import TypeIs\ndef is_str(val: object) -> TypeIs[str]:\n\
      \    return isinstance(val, str)\n"
    after: "from typing_extensions import TypeIs\ndef is_str(val: object) -> TypeIs[str]:\n\
      \    return isinstance(val, str)\n"
