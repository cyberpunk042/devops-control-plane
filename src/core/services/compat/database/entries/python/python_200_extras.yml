# Python extras to hit 500 total

- id: python.stdlib.typing_generic_alias
  language: python
  feature_name: "types.GenericAlias"
  introduced: "3.9"
  category: typing
  description: "Runtime generic alias for builtin types"
  direction: downgrade
  severity: info
  error_type: runtime_error
  tags: [types, generic, alias]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: types
        names_contains: GenericAlias
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      from types import GenericAlias
    after: |
      from types import GenericAlias

