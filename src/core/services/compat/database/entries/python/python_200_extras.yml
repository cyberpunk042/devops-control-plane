- id: python.stdlib.sysconfig_names
  language: python
  feature_name: "sysconfig.get_default_scheme()"
  introduced: "3.10"
  category: stdlib
  description: "Get default installation scheme name"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [sysconfig, scheme, install]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: sysconfig
        attr: get_default_scheme
  fix:
    strategy: manual
    manual_instructions: "Use sysconfig.get_scheme_names() and pick the first."
  verification:
    re_detect: true
  test:
    before: |
      import sysconfig
      scheme = sysconfig.get_default_scheme()
    after: |
      import sysconfig
      scheme = sysconfig.get_scheme_names()[0]

- id: python.stdlib.typing_type_form
  language: python
  feature_name: "typing.TypeForm"
  introduced: "3.13"
  category: typing
  description: "Type representing any type form"
  direction: downgrade
  severity: warning
  error_type: import_error
  tags: [typing, typeform]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: TypeForm
    exclude:
      - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find:
          import_module: typing
          import_name: TypeForm
        replace:
          import_name: ""
      - type: add_import
        import_statement: "from typing_extensions import TypeForm"
        condition: not_already_present
    backport:
      package: typing-extensions
  verification:
    re_detect: true
  test:
    before: |
      from typing import TypeForm
    after: |
      from typing_extensions import TypeForm

