- id: python.stdlib.zip_strict
  language: python
  feature_name: zip(strict=True)
  introduced: '3.10'
  category: stdlib
  description: zip with length check — raises ValueError if lengths differ
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - zip
  - strict
  - builtin
  detection:
    primary:
      ast_type: Call
      match:
        func_id: zip
        has_keyword: strict
    exclude:
    - reason: zip() without strict=True is fine — only strict param is 3.10+
  fix:
    strategy: rewrite_expression
    transforms:
    - type: remove_keyword_arg
      find:
        keyword: strict
      replace: {}
  verification:
    re_detect: true
  test:
    before: "for a, b in zip(keys, values, strict=True):\n    mapping[a] = b\n"
    after: "if len(keys) != len(values):\n    raise ValueError(\"zip strict: lengths\
      \ differ\")\nfor a, b in zip(keys, values):\n    mapping[a] = b\n"
- id: python.stdlib.anext_builtin
  language: python
  feature_name: anext() builtin
  introduced: '3.10'
  category: stdlib
  description: Async version of next() builtin
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - async
  - builtin
  - iterator
  detection:
    primary:
      ast_type: Call
      match:
        func_id: anext
    exclude: []
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        function: anext
      replace:
        note: anext() builtin — requires Python 3.10+
  verification:
    re_detect: true
  test:
    before: 'item = await anext(async_iterator)

      '
    after: 'item = await async_iterator.__anext__()

      '
