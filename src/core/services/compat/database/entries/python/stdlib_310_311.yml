- id: python.stdlib.taskgroup
  language: python
  feature_name: asyncio.TaskGroup
  introduced: '3.11'
  category: stdlib
  description: Structured concurrency with TaskGroup context manager
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - asyncio
  - taskgroup
  - concurrency
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: TaskGroup
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: conditional_import
    backport:
      package: anyio
      install_command: pip install anyio
    transforms:
    - type: conditional_import
      find:
        import_name: TaskGroup
      replace:
        try_import: from asyncio import TaskGroup
        except_import: 'from exceptiongroup import BaseExceptionGroup  # pip install
          exceptiongroup'
  verification:
    re_detect: true
  test:
    before: "from asyncio import TaskGroup\nasync with TaskGroup() as tg:\n    tg.create_task(fetch_data())\n"
    after: 'import asyncio

      await asyncio.gather(fetch_data())

      '
- id: python.stdlib.bisect_key
  language: python
  feature_name: bisect key parameter
  introduced: '3.10'
  category: stdlib
  description: key parameter added to bisect functions
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - bisect
  - key
  - sorting
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: bisect_left
        has_keyword: key
    alternatives:
    - ast_type: Call
      match:
        func_attr: bisect_right
    - ast_type: Call
      match:
        func_attr: insort_left
    - ast_type: Call
      match:
        func_attr: insort_right
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: bisect_left
      replace:
        note: bisect key parameter — requires Python 3.10+
  verification:
    re_detect: true
  test:
    before: 'import bisect

      idx = bisect.bisect_left(data, target, key=lambda x: x.value)

      '
    after: 'import bisect

      values = [x.value for x in data]

      idx = bisect.bisect_left(values, target)

      '
- id: python.stdlib.dataclass_slots
  language: python
  feature_name: dataclass slots=True
  introduced: '3.10'
  category: stdlib
  description: __slots__ support for dataclasses
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - dataclass
  - slots
  - memory
  detection:
    primary:
      ast_type: Call
      match:
        func_id: dataclass
        has_keyword: slots
  fix:
    strategy: rewrite_expression
    transforms:
    - type: remove_keyword_arg
      find:
        keyword: slots
      replace: {}
  verification:
    re_detect: true
  test:
    before: "@dataclass(slots=True)\nclass Point:\n    x: float\n    y: float\n"
    after: "@dataclass\nclass Point:\n    __slots__ = ('x', 'y')\n    x: float\n \
      \   y: float\n"
