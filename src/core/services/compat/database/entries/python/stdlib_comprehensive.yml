# ── Python 3.10 ──────────────────────────────────────────────────

- id: python.stdlib.typing_concatenate
  language: python
  feature_name: "typing.Concatenate"
  introduced: "3.10"
  category: stdlib
  description: "Concatenate type for ParamSpec manipulation"
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags: [typing, concatenate]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Concatenate
    exclude:
      - context: type_checking_block
        reason: "Not executed at runtime"
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find:
          import_module: typing
          import_name: Concatenate
        replace:
          import_name: ""
      - type: add_import
        import_statement: "from typing_extensions import Concatenate"
        condition: not_already_present
    backport:
      package: typing-extensions
      min_version: "3.10.0"
  verification:
    re_detect: true
  test:
    before: |
      from typing import Concatenate
    after: |
      from typing_extensions import Concatenate

- id: python.stdlib.contextlib_aclosing
  language: python
  feature_name: "contextlib.aclosing"
  introduced: "3.10"
  category: stdlib
  description: "Async version of contextlib.closing"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [contextlib, async, closing]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: contextlib
        names_contains: aclosing
  fix:
    strategy: manual
    manual_instructions: |
      Implement manually:
        @asynccontextmanager
        async def aclosing(thing):
            try:
                yield thing
            finally:
                await thing.aclose()
  verification:
    re_detect: true
  test:
    before: |
      from contextlib import aclosing
      async with aclosing(stream) as s:
          async for item in s: process(item)
    after: |
      # Manual aclosing implementation needed

# ── Python 3.9 ──────────────────────────────────────────────────

- id: python.stdlib.functools_cache
  language: python
  feature_name: "functools.cache"
  introduced: "3.9"
  category: stdlib
  description: "Unbounded cache decorator (simpler than lru_cache)"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [functools, cache, decorator]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: functools
        names_contains: cache
  fix:
    strategy: manual
    manual_instructions: |
      Replace with lru_cache(maxsize=None):
        from functools import cache → from functools import lru_cache
        @cache → @lru_cache(maxsize=None)
  verification:
    re_detect: true
  test:
    before: |
      from functools import cache
      @cache
      def fib(n): return n if n < 2 else fib(n-1) + fib(n-2)
    after: |
      from functools import lru_cache
      @lru_cache(maxsize=None)
      def fib(n): return n if n < 2 else fib(n-1) + fib(n-2)

