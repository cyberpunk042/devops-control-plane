- id: python.stdlib.calendar_month_enum
  language: python
  feature_name: calendar.Month/Day enums
  introduced: '3.12'
  category: stdlib
  description: Month and Day enums in calendar module
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - calendar
  - enum
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: calendar
        names_contains: Month
    alternatives:
    - ast_type: ImportFrom
      match:
        module: calendar
        names_contains: Day
  fix:
    strategy: manual
    manual_instructions: Use integer constants instead (calendar.JANUARY = 1, etc.)
  verification:
    re_detect: true
  test:
    before: 'from calendar import Month

      jan = Month.JANUARY

      '
    after: 'import calendar

      jan = calendar.JANUARY

      '
