- id: python.stdlib.ast_unparse
  language: python
  feature_name: "ast.unparse()"
  introduced: "3.9"
  category: stdlib
  description: "Convert AST back to source code"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [ast, unparse, codegen]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: ast
        attr: unparse
    alternatives:
      - ast_type: ImportFrom
        match:
          module: ast
          names_contains: unparse
  fix:
    strategy: manual
    manual_instructions: |
      Use the astunparse backport:
        pip install astunparse
        import astunparse
        code = astunparse.unparse(tree)
    backport:
      package: astunparse
      install_command: "pip install astunparse"
  verification:
    re_detect: true
  test:
    before: |
      import ast
      code = ast.unparse(tree)
    after: |
      import astunparse
      code = astunparse.unparse(tree)
