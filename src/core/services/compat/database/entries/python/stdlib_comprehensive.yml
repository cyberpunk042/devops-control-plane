- id: python.stdlib.ast_unparse
  language: python
  feature_name: ast.unparse()
  introduced: '3.9'
  category: stdlib
  description: Convert AST back to source code
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - ast
  - unparse
  - codegen
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: ast
        attr: unparse
    alternatives:
    - ast_type: ImportFrom
      match:
        module: ast
        names_contains: unparse
  fix:
    strategy: conditional_import
    backport:
      package: astunparse
      min_version: 1.6.0
      import_name: astunparse
    transforms:
    - type: conditional_import
      find:
        import_module: ast
        import_name: unparse
      replace:
        try_import: from ast import unparse
        except_import: from astunparse import unparse
  verification:
    re_detect: true
  test:
    before: 'import ast

      code = ast.unparse(tree)

      '
    after: 'import astunparse

      code = astunparse.unparse(tree)

      '
