      '
- id: python.stdlib.asyncio_runner
  language: python
  feature_name: asyncio.Runner
  introduced: '3.11'
  category: stdlib
  description: Runner context manager for running async code
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - asyncio
  - runner
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: Runner
  fix:
    strategy: manual
    manual_instructions: "Replace with asyncio.run() or manual event loop:\n  with\
      \ asyncio.Runner() as runner:\n      runner.run(main())\n  → asyncio.run(main())\n"
  verification:
    re_detect: true
  test:
    before: "from asyncio import Runner\nwith Runner() as runner:\n    runner.run(main())\n"
    after: 'import asyncio

      asyncio.run(main())

      '
- id: python.stdlib.contextlib_chdir
  language: python
  feature_name: contextlib.chdir
  introduced: '3.11'
  category: stdlib
  description: Context manager for changing directory
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - contextlib
  - chdir
  - directory
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: contextlib
        names_contains: chdir
  fix:
    strategy: manual
    manual_instructions: "Replace with manual chdir:\n  import os\n  from contextlib\
      \ import contextmanager\n  @contextmanager\n  def chdir(path):\n      old =\
      \ os.getcwd()\n      try:\n          os.chdir(path)\n          yield\n     \
      \ finally:\n          os.chdir(old)\n"
  verification:
    re_detect: true
  test:
    before: "from contextlib import chdir\nwith chdir(\"/tmp\"):\n    work()\n"
    after: "import os\nold = os.getcwd()\ntry:\n    os.chdir(\"/tmp\")\n    work()\n\
      finally:\n    os.chdir(old)\n"
