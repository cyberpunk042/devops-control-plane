        module: typing
        names_contains: get_origin
    alternatives:
      - ast_type: ImportFrom
        match:
          module: typing
          names_contains: get_args
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find:
          import_module: typing
          import_name: get_origin
        replace:
          import_name: ""
      - type: add_import
