- id: python.stdlib.calendar_month_enum
  language: python
  feature_name: calendar.Month/Day enums
  introduced: '3.12'
  category: stdlib
  description: Month and Day enums in calendar module
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - calendar
  - enum
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: calendar
        names_contains: Month
    alternatives:
    - ast_type: ImportFrom
      match:
        module: calendar
        names_contains: Day
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: Month
      replace:
        try_import: '# calendar.Month/Day enums — requires Python 3.12+'
        except_import: 'pass  # calendar.Month/Day enums not available'
  verification:
    re_detect: true
  test:
    before: 'from calendar import Month

      jan = Month.JANUARY

      '
    after: 'import calendar

      jan = calendar.JANUARY

      '
- id: python.stdlib.csv_reader_strict
  language: python
  feature_name: csv strict mode
  introduced: '3.12'
  category: stdlib
  description: strict parameter in csv.reader/writer
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - csv
  - strict
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: reader
        has_keyword: strict
        func_value_id: csv
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: reader
      replace:
        note: csv strict mode — requires Python 3.12+
  verification:
    re_detect: false
  test:
    before: 'import csv

      reader = csv.reader(f, strict=True)

      '
    after: 'import csv

      reader = csv.reader(f)

      '
