- id: python.stdlib.os_pidfd_open
  language: python
  feature_name: "os.pidfd_open()"
  introduced: "3.9"
  category: stdlib
  description: "Open a file descriptor for a process (Linux only)"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [os, pidfd, linux, process]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: os
        attr: pidfd_open
  fix:
    strategy: manual
    manual_instructions: "Use os.waitpid() or subprocess module instead."
  verification:
    re_detect: true
  test:
    before: |
      import os
      fd = os.pidfd_open(pid)
    after: |
      import os
      os.waitpid(pid, 0)

