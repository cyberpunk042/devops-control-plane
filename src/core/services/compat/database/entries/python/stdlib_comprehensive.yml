- id: python.stdlib.typing_concatenate
  language: python
  feature_name: typing.Concatenate
  introduced: '3.10'
  category: stdlib
  description: Concatenate type for ParamSpec manipulation
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - concatenate
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Concatenate
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: Concatenate
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import Concatenate
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 3.10.0
  verification:
    re_detect: true
  test:
    before: 'from typing import Concatenate

      '
    after: 'from typing_extensions import Concatenate

      '
