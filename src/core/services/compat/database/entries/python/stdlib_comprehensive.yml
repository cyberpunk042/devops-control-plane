- id: python.stdlib.functools_cache
  language: python
  feature_name: functools.cache
  introduced: '3.9'
  category: stdlib
  description: Unbounded cache decorator (simpler than lru_cache)
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - functools
  - cache
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: functools
        names_contains: cache
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: cache
      replace:
        try_import: from functools import cache
        except_import: from functools import lru_cache; cache = lru_cache(maxsize=None)
  verification:
    re_detect: true
  test:
    before: 'from functools import cache

      @cache

      def fib(n): return n if n < 2 else fib(n-1) + fib(n-2)

      '
    after: 'from functools import lru_cache

      @lru_cache(maxsize=None)

      def fib(n): return n if n < 2 else fib(n-1) + fib(n-2)

      '
