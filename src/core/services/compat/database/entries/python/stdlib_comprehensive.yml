# Python stdlib — comprehensive additions across all versions

# ── Python 3.12 ──────────────────────────────────────────────────

- id: python.stdlib.calendar_month_enum
  language: python
  feature_name: "calendar.Month/Day enums"
  introduced: "3.12"
  category: stdlib
  description: "Month and Day enums in calendar module"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [calendar, enum]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: calendar
        names_contains: Month
    alternatives:
      - ast_type: ImportFrom
        match:
          module: calendar
          names_contains: Day
  fix:
    strategy: manual
    manual_instructions: "Use integer constants instead (calendar.JANUARY = 1, etc.)"
  verification:
    re_detect: true
  test:
    before: |
      from calendar import Month
      jan = Month.JANUARY
    after: |
      import calendar
      jan = calendar.JANUARY

- id: python.stdlib.csv_reader_strict
  language: python
  feature_name: "csv strict mode"
  introduced: "3.12"
  category: stdlib
  description: "strict parameter in csv.reader/writer"
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags: [csv, strict]
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: reader
  fix:
    strategy: manual
    manual_instructions: "Remove strict=True parameter from csv.reader()"
  verification:
    re_detect: false
  test:
    before: |
      import csv
      reader = csv.reader(f, strict=True)
    after: |
      import csv
      reader = csv.reader(f)

# ── Python 3.11 ──────────────────────────────────────────────────

- id: python.stdlib.asyncio_runner
  language: python
  feature_name: "asyncio.Runner"
  introduced: "3.11"
  category: stdlib
  description: "Runner context manager for running async code"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [asyncio, runner]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: Runner
  fix:
    strategy: manual
    manual_instructions: |
      Replace with asyncio.run() or manual event loop:
        with asyncio.Runner() as runner:
            runner.run(main())
        → asyncio.run(main())
  verification:
    re_detect: true
  test:
    before: |
      from asyncio import Runner
      with Runner() as runner:
          runner.run(main())
    after: |
      import asyncio
      asyncio.run(main())

- id: python.stdlib.contextlib_chdir
  language: python
  feature_name: "contextlib.chdir"
  introduced: "3.11"
  category: stdlib
  description: "Context manager for changing directory"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [contextlib, chdir, directory]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: contextlib
        names_contains: chdir
  fix:
    strategy: manual
    manual_instructions: |
      Replace with manual chdir:
        import os
        from contextlib import contextmanager
        @contextmanager
        def chdir(path):
            old = os.getcwd()
            try:
                os.chdir(path)
                yield
            finally:
                os.chdir(old)
  verification:
    re_detect: true
  test:
    before: |
      from contextlib import chdir
      with chdir("/tmp"):
          work()
    after: |
      import os
      old = os.getcwd()
      try:
          os.chdir("/tmp")
          work()
      finally:
          os.chdir(old)

