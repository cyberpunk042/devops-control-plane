- id: python.stdlib.pathlib_relative_to_walk
  language: python
  feature_name: Path.relative_to(walk_up=True)
  introduced: '3.12'
  category: stdlib
  description: walk_up parameter for relative_to method
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - pathlib
  - relative
  - walk_up
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: relative_to
        has_keyword: walk_up
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: relative_to
      replace:
        note: Path.relative_to(walk_up=True) — requires Python 3.12+
  verification:
    re_detect: false
  test:
    before: 'rel = path.relative_to(base, walk_up=True)

      '
    after: 'import os

      rel = Path(os.path.relpath(str(path), str(base)))

      '
- id: python.stdlib.tempfile_delete_param
  language: python
  feature_name: NamedTemporaryFile(delete_on_close=False)
  introduced: '3.12'
  category: stdlib
  description: delete_on_close parameter for NamedTemporaryFile
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - tempfile
  - delete
  - parameter
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: NamedTemporaryFile
        has_keyword: delete_on_close
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: NamedTemporaryFile
      replace:
        note: NamedTemporaryFile(delete_on_close=False) — requires Python 3.12+
  verification:
    re_detect: false
  test:
    before: 'import tempfile

      f = tempfile.NamedTemporaryFile(delete_on_close=False)

      '
