      f = tempfile.NamedTemporaryFile(delete=False)

      '
- id: python.stdlib.sqlite3_autocommit
  language: python
  feature_name: sqlite3 autocommit mode
  introduced: '3.12'
  category: stdlib
  description: PEP 249 compliant autocommit mode for sqlite3
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - sqlite3
  - autocommit
  - database
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: connect
        has_keyword: autocommit
        func_value_id: sqlite3
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: connect
      replace:
        note: sqlite3 autocommit mode — requires Python 3.12+
  verification:
    re_detect: false
  test:
    before: 'import sqlite3

      conn = sqlite3.connect("app.db", autocommit=True)

      '
    after: 'import sqlite3

      conn = sqlite3.connect("app.db")

      '
