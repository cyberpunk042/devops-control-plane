# Python batch — pushing to 600 total

- id: python.stdlib.typing_override_check
  language: python
  feature_name: "typing.override runtime"
  introduced: "3.12"
  category: typing
  direction: downgrade
  severity: warning
  error_type: import_error
  tags: [typing, override]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: override
    exclude:
      - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find: { import_module: typing, import_name: override }
        replace: { import_name: "" }
      - type: add_import
        import_statement: "from typing_extensions import override"
        condition: not_already_present
    backport: { package: typing-extensions }
  verification: { re_detect: true }
  test:
    before: |
      from typing import override
    after: |
      from typing_extensions import override

