- id: python.stdlib.decimal_localcontext
  language: python
  feature_name: "decimal.localcontext kwargs"
  introduced: "3.11"
  category: stdlib
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags: [decimal, context, kwargs]
  detection:
    primary:
      ast_type: Call
      match: { func_attr: localcontext }
  fix:
    strategy: manual
    manual_instructions: "Set context attributes after creation instead of kwargs."
  verification: { re_detect: false }
  test:
    before: |
      with decimal.localcontext(prec=10):
          pass
    after: |
      ctx = decimal.getcontext().copy()
      ctx.prec = 10
      with decimal.localcontext(ctx):
          pass

