- id: python.stdlib.override_decorator
  language: python
  feature_name: typing.override
  introduced: '3.12'
  category: stdlib
  description: '@override decorator for explicit method overriding'
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - override
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: override
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: override
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import override
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.4.0
      install_command: pip install typing-extensions>=4.4.0
      maintained: true
  verification:
    re_detect: true
  test:
    before: "from typing import override\nclass Child(Parent):\n    @override\n  \
      \  def method(self): pass\n"
    after: "from typing_extensions import override\nclass Child(Parent):\n    @override\n\
      \    def method(self): pass\n"
- id: python.stdlib.pathlib_walk
  language: python
  feature_name: Path.walk()
  introduced: '3.12'
  category: stdlib
  description: Path.walk() method for directory traversal
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - pathlib
  - filesystem
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: walk
        func_value_id: Path
  fix:
    strategy: manual
    manual_instructions: "Replace Path.walk() with os.walk():\n  for root, dirs, files\
      \ in path.walk():\n  →\n  import os\n  for root, dirs, files in os.walk(str(path)):\n\
      \      root = Path(root)\n"
  verification:
    re_detect: true
  test:
    before: "for root, dirs, files in project_dir.walk():\n    process(root, files)\n"
    after: "import os\nfor root, dirs, files in os.walk(str(project_dir)):\n    root\
      \ = Path(root)\n    process(root, files)\n"
- id: python.stdlib.itertools_batched
  language: python
  feature_name: itertools.batched()
  introduced: '3.12'
  category: stdlib
  description: Batch iterable into fixed-size chunks
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - itertools
  - batch
  - chunking
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: itertools
        names_contains: batched
  fix:
    strategy: manual
    manual_instructions: "Replace with a generator function:\n  def batched(iterable,\
      \ n):\n      from itertools import islice\n      it = iter(iterable)\n     \
      \ while batch := tuple(islice(it, n)):\n          yield batch\nOr use more-itertools:\
      \ pip install more-itertools\n  from more_itertools import batched\n"
    backport:
      package: more-itertools
      install_command: pip install more-itertools
  verification:
    re_detect: true
  test:
    before: "from itertools import batched\nfor batch in batched(range(10), 3):\n\
      \    process(batch)\n"
    after: "from more_itertools import batched\nfor batch in batched(range(10), 3):\n\
      \    process(batch)\n"
