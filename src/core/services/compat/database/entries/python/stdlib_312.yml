- id: python.stdlib.pathlib_walk
  language: python
  feature_name: Path.walk()
  introduced: '3.12'
  category: stdlib
  description: Path.walk() method for directory traversal
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - pathlib
  - filesystem
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: walk
        func_value_id: Path
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: walk
      replace:
        note: Path.walk() — requires Python 3.12+
  verification:
    re_detect: true
  test:
    before: "for root, dirs, files in project_dir.walk():\n    process(root, files)\n"
    after: "import os\nfor root, dirs, files in os.walk(str(project_dir)):\n    root\
      \ = Path(root)\n    process(root, files)\n"
- id: python.stdlib.itertools_batched
  language: python
  feature_name: itertools.batched()
  introduced: '3.12'
  category: stdlib
  description: Batch iterable into fixed-size chunks
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - itertools
  - batch
  - chunking
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: itertools
        names_contains: batched
  fix:
    strategy: conditional_import
    backport:
      package: more-itertools
      install_command: pip install more-itertools
    transforms:
    - type: conditional_import
      find:
        import_name: batched
      replace:
        try_import: from itertools import batched
        except_import: 'from more_itertools import batched  # pip install more-itertools'
  verification:
    re_detect: true
  test:
    before: "from itertools import batched\nfor batch in batched(range(10), 3):\n\
      \    process(batch)\n"
    after: "from more_itertools import batched\nfor batch in batched(range(10), 3):\n\
      \    process(batch)\n"
