- id: python.syntax.fstring_nested
  language: python
  feature_name: nested f-string expressions
  introduced: '3.12'
  category: syntax
  description: F-strings can contain other f-strings as expressions
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - fstring
  - string
  - syntax
  detection:
    primary:
      ast_type: JoinedStr
      match:
        has_nested_fstring: true
  fix:
    strategy: manual
    manual_instructions: "Extract inner f-strings to variables:\n  f\"{'yes' if f'{x}'\
      \ == 'hello' else 'no'}\"\n  →\n  inner = f'{x}'\n  f\"{'yes' if inner == 'hello'\
      \ else 'no'}\"\n"
  verification:
    re_detect: true
    syntax_check: true
  test:
    before: 'msg = f"result: {f''{value:.2f}''}"

      '
    after: '_inner = f''{value:.2f}''

      msg = f"result: {_inner}"

      '
- id: python.syntax.match_case
  language: python
  feature_name: match/case statement
  introduced: '3.10'
  category: syntax
  description: PEP 634 — structural pattern matching
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - match
  - case
  - pattern
  - syntax
  detection:
    primary:
      ast_type: Match
      match: {}
  fix:
    strategy: manual
    manual_instructions: "match/case must be rewritten as if/elif/else chains.\n\n\
      Simple value matching:\n  match command:\n      case \"quit\": quit()\n    \
      \  case \"hello\": greet()\n      case _: unknown()\n  →\n  if command == \"\
      quit\": quit()\n  elif command == \"hello\": greet()\n  else: unknown()\n\n\
      Structural pattern matching (destructuring, guards, OR patterns)\nrequires more\
      \ complex rewriting. Review each case carefully.\n"
  verification:
    re_detect: true
    syntax_check: true
  test:
    before: "match command:\n    case \"quit\":\n        return 0\n    case \"help\"\
      :\n        show_help()\n        return 0\n    case _:\n        return 1\n"
    after: "if command == \"quit\":\n    return 0\nelif command == \"help\":\n   \
      \ show_help()\n    return 0\nelse:\n    return 1\n"
- id: python.syntax.parenthesized_context_managers
  language: python
  feature_name: parenthesized context managers
  introduced: '3.10'
  category: syntax
  description: Multiple context managers in parenthesized with statement
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - with
  - context_manager
  - syntax
  detection:
    primary:
      ast_type: With
      match:
        has_parenthesized_items: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: split_with_statement
      find:
        ast_type: With
      replace:
        style: nested_with
  verification:
    re_detect: true
    syntax_check: true
  test:
    before: "with (\n    open(\"a.txt\") as f1,\n    open(\"b.txt\") as f2,\n):\n\
      \    data = f1.read() + f2.read()\n"
    after: "with open(\"a.txt\") as f1:\n    with open(\"b.txt\") as f2:\n       \
      \ data = f1.read() + f2.read()\n"
- id: python.syntax.walrus_operator
  language: python
  feature_name: walrus operator (:=)
  introduced: '3.8'
  category: syntax
  description: PEP 572 — assignment expressions
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - walrus
  - assignment
  - expression
  - syntax
  detection:
    primary:
      ast_type: NamedExpr
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_walrus
      find:
        ast_type: NamedExpr
      replace:
        style: split
  verification:
    re_detect: true
    syntax_check: true
  edge_cases:
  - id: python.walrus.in_while
    category: transform_edge_case
    description: Walrus in while condition
    handling: special_transform
    test:
      before: "while chunk := f.read(8192):\n    process(chunk)\n"
      after: "chunk = f.read(8192)\nwhile chunk:\n    process(chunk)\n    chunk =\
        \ f.read(8192)\n"
      notes: While loop needs the assignment before AND at end of loop body
  - id: python.walrus.in_comprehension
    category: transform_edge_case
    description: Walrus in list comprehension
    handling: special_transform
    test:
      before: 'results = [y for x in data if (y := f(x)) is not None]

        '
      after: "results = []\nfor x in data:\n    y = f(x)\n    if y is not None:\n\
        \        results.append(y)\n"
      notes: Comprehension with walrus must be expanded to a loop
  test:
    before: "if (n := len(data)) > 10:\n    print(f\"Too long: {n}\")\n"
    after: "n = len(data)\nif n > 10:\n    print(f\"Too long: {n}\")\n"
- id: python.syntax.positional_only_params
  language: python
  feature_name: positional-only parameters (/)
  introduced: '3.8'
  category: syntax
  description: PEP 570 — function parameters before / are positional-only
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - function
  - parameters
  - syntax
  detection:
    primary:
      ast_type: FunctionDef
      match:
        has_posonlyargs: true
    alternatives:
    - ast_type: AsyncFunctionDef
      match:
        has_posonlyargs: true
  fix:
    strategy: manual
    manual_instructions: "Remove the / separator from the parameter list.\nCallers\
      \ that currently use positional-only arguments\nmay start using keyword arguments\
      \ — review call sites.\n  def greet(name, /, greeting=\"Hello\"):\n  →\n  def\
      \ greet(name, greeting=\"Hello\"):\n"
  verification:
    re_detect: true
    syntax_check: true
  test:
    before: "def greet(name, /, greeting=\"Hello\"):\n    return f\"{greeting}, {name}\"\
      \n"
    after: "def greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}\"\
      \n"
