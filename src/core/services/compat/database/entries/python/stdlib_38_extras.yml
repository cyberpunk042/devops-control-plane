- id: python.stdlib.typing_final_class
  language: python
  feature_name: typing.final (decorator)
  introduced: '3.8'
  category: typing
  description: '@final decorator to prevent subclassing/overriding'
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - final
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: final
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: final
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import final
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 3.8.0
  verification:
    re_detect: true
  test:
    before: "from typing import final\n@final\nclass Immutable:\n    pass\n"
    after: "from typing_extensions import final\n@final\nclass Immutable:\n    pass\n"
- id: python.stdlib.dataclasses_field_kw
  language: python
  feature_name: dataclasses.KW_ONLY
  introduced: '3.10'
  category: stdlib
  description: KW_ONLY sentinel for keyword-only dataclass fields
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - dataclasses
  - keyword_only
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: dataclasses
        names_contains: KW_ONLY
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: KW_ONLY
      replace:
        try_import: '# dataclasses.KW_ONLY — requires Python 3.10+'
        except_import: 'pass  # dataclasses.KW_ONLY not available'
  verification:
    re_detect: true
  test:
    before: 'from dataclasses import dataclass, field, KW_ONLY

      '
    after: 'from dataclasses import dataclass, field

      '
