- id: python.stdlib.inspect_getmembers_static
  language: python
  feature_name: inspect.getmembers_static()
  introduced: '3.11'
  category: stdlib
  description: Get members without triggering descriptors
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - inspect
  - getmembers
  - static
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: inspect
        attr: getmembers_static
    alternatives:
    - ast_type: ImportFrom
      match:
        module: inspect
        names_contains: getmembers_static
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: getmembers_static
      replace:
        try_import: '# inspect.getmembers_static() — Python 3.11+'
        except_import: 'pass  # getmembers_static not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import inspect

      members = inspect.getmembers_static(obj)

      '
    after: 'import inspect

      members = inspect.getmembers(obj)

      '
- id: python.stdlib.hashlib_file_digest
  language: python
  feature_name: hashlib.file_digest()
  introduced: '3.11'
  category: stdlib
  description: Efficiently hash a file object
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - hashlib
  - file
  - digest
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: hashlib
        attr: file_digest
    alternatives:
    - ast_type: ImportFrom
      match:
        module: hashlib
        names_contains: file_digest
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: file_digest
      replace:
        try_import: '# hashlib.file_digest() — Python 3.11+'
        except_import: 'pass  # file_digest not available in older Python'
  verification:
    re_detect: true
  test:
    before: "import hashlib\nwith open(\"file.bin\", \"rb\") as f:\n    digest = hashlib.file_digest(f,\
      \ \"sha256\")\n"
    after: "import hashlib\nwith open(\"file.bin\", \"rb\") as f:\n    h = hashlib.sha256()\n\
      \    for chunk in iter(lambda: f.read(8192), b\"\"):\n        h.update(chunk)\n\
      \    digest = h\n"
- id: python.stdlib.re_possessive
  language: python
  feature_name: re possessive quantifiers
  introduced: '3.11'
  category: stdlib
  description: 'Possessive quantifiers in regex: *+, ++, ?+'
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - regex
  - possessive
  - quantifier
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: compile
        func_value_id: re
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: compile
      replace:
        note: re possessive quantifiers — requires Python 3.11+
  verification:
    re_detect: false
  test:
    before: 'import re

      pattern = re.compile(r"a*+b")

      '
    after: 'import re

      pattern = re.compile(r"a*b")

      '
