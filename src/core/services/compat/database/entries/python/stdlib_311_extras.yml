# Python 3.11 stdlib extras

- id: python.stdlib.inspect_getmembers_static
  language: python
  feature_name: "inspect.getmembers_static()"
  introduced: "3.11"
  category: stdlib
  description: "Get members without triggering descriptors"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [inspect, getmembers, static]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: inspect
        attr: getmembers_static
    alternatives:
      - ast_type: ImportFrom
        match:
          module: inspect
          names_contains: getmembers_static
  fix:
    strategy: manual
    manual_instructions: "Use inspect.getmembers() or vars() as alternatives."
  verification:
    re_detect: true
  test:
    before: |
      import inspect
      members = inspect.getmembers_static(obj)
    after: |
      import inspect
      members = inspect.getmembers(obj)

- id: python.stdlib.hashlib_file_digest
  language: python
  feature_name: "hashlib.file_digest()"
  introduced: "3.11"
  category: stdlib
  description: "Efficiently hash a file object"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [hashlib, file, digest]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: hashlib
        attr: file_digest
    alternatives:
      - ast_type: ImportFrom
        match:
          module: hashlib
          names_contains: file_digest
  fix:
    strategy: manual
    manual_instructions: |
      Read and hash manually:
        hashlib.file_digest(f, "sha256")
        →
        h = hashlib.sha256()
        while chunk := f.read(8192):
            h.update(chunk)
        digest = h
  verification:
    re_detect: true
  test:
    before: |
      import hashlib
      with open("file.bin", "rb") as f:
          digest = hashlib.file_digest(f, "sha256")
    after: |
      import hashlib
      with open("file.bin", "rb") as f:
          h = hashlib.sha256()
          for chunk in iter(lambda: f.read(8192), b""):
              h.update(chunk)
          digest = h

- id: python.stdlib.re_possessive
  language: python
  feature_name: "re possessive quantifiers"
  introduced: "3.11"
  category: stdlib
  description: "Possessive quantifiers in regex: *+, ++, ?+"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [regex, possessive, quantifier]
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: compile
  fix:
    strategy: manual
    manual_instructions: |
      Remove possessive quantifiers — they prevent backtracking:
        r"a*+b" → r"a*b"
      May change matching behavior for some patterns.
  verification:
    re_detect: false
  test:
    before: |
      import re
      pattern = re.compile(r"a*+b")
    after: |
      import re
      pattern = re.compile(r"a*b")

- id: python.stdlib.re_atomic_groups
  language: python
  feature_name: "re atomic groups"
  introduced: "3.11"
  category: stdlib
  description: "Atomic groups in regex: (?>...)"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [regex, atomic, group]
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: compile
  fix:
    strategy: manual
    manual_instructions: |
      Remove atomic groups — rewrite the pattern:
        r"(?>a+)" → r"a+"
      May need to restructure the regex.
  verification:
    re_detect: false
  test:
    before: |
      import re
      pattern = re.compile(r"(?>abc)+")
    after: |
      import re
      pattern = re.compile(r"(?:abc)+")

