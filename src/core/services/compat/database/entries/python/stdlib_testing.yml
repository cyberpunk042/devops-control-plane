- id: python.stdlib.sys_exception
  language: python
  feature_name: sys.exception()
  introduced: '3.11'
  category: stdlib
  description: Get the current exception being handled
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - sys
  - exception
  - handling
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: sys
        attr: exception
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: exception
      replace:
        try_import: '# sys.exception() — Python 3.11+'
        except_import: 'pass  # exception not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import sys

      exc = sys.exception()

      '
    after: 'import sys

      exc = sys.exc_info()[1]

      '
