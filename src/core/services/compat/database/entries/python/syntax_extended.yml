- id: python.syntax.fstring_equals
  language: python
  feature_name: f-string = debugging
  introduced: '3.8'
  category: syntax
  description: 'f-string with = for debugging: f''{expr=}'' prints ''expr=value'''
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - fstring
  - debug
  - syntax
  detection:
    primary:
      ast_type: FormattedValue
      match:
        conversion_eq: true
  fix:
    strategy: manual
    manual_instructions: "Replace f'{x=}' with explicit label:\n  f'{x=}' → f'x={x}'\n\
      \  f'{len(data)=}' → f'len(data)={len(data)}'\n"
  verification:
    re_detect: true
  test:
    before: 'print(f''{name=}, {age=}'')

      '
    after: 'print(f''name={name}, age={age}'')

      '
- id: python.syntax.structural_pattern_guard
  language: python
  feature_name: match/case with guards
  introduced: '3.10'
  category: syntax
  description: 'case pattern if guard: — conditional pattern matching'
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - match
  - case
  - guard
  - syntax
  detection:
    primary:
      ast_type: match_case
      match:
        has_guard: true
  fix:
    strategy: manual
    manual_instructions: "Rewrite as if/elif with manual checks:\n  match point:\n\
      \      case Point(x, y) if x > 0:\n          handle_positive(x, y)\n  →\n  if\
      \ isinstance(point, Point) and point.x > 0:\n      handle_positive(point.x,\
      \ point.y)\n"
  verification:
    re_detect: true
  test:
    before: "match point:\n    case Point(x, y) if x > 0:\n        handle(x, y)\n"
    after: "if isinstance(point, Point) and point.x > 0:\n    handle(point.x, point.y)\n"
- id: python.syntax.decorator_expression
  language: python
  feature_name: relaxed decorator syntax
  introduced: '3.9'
  category: syntax
  description: Any valid expression allowed as decorator (not just dotted name)
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - decorator
  - expression
  - syntax
  detection:
    primary:
      ast_type: FunctionDef
      match:
        has_complex_decorator: true
  fix:
    strategy: manual
    manual_instructions: "Assign the complex expression to a variable first:\n  @buttons[0].clicked.connect\n\
      \  →\n  _deco = buttons[0].clicked.connect\n  @_deco\n"
  verification:
    re_detect: true
  test:
    before: "@buttons[0].clicked.connect\ndef on_click():\n    pass\n"
    after: "_deco = buttons[0].clicked.connect\n@_deco\ndef on_click():\n    pass\n"
- id: python.syntax.continue_in_finally
  language: python
  feature_name: continue in finally
  introduced: '3.8'
  category: syntax
  description: continue statement allowed in finally blocks
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - finally
  - continue
  - syntax
  detection:
    primary:
      ast_type: Continue
      context: finally_block
  fix:
    strategy: manual
    manual_instructions: "Move the continue logic out of the finally block:\n  try:\
      \ ...\n  finally:\n      if condition:\n          continue\n  →\n  try: ...\n\
      \  finally:\n      should_continue = condition\n  if should_continue:\n    \
      \  continue\n"
  verification:
    re_detect: true
  test:
    before: "for item in items:\n    try:\n        process(item)\n    finally:\n \
      \       if should_skip:\n            continue\n"
    after: "for item in items:\n    try:\n        process(item)\n    finally:\n  \
      \      _continue = should_skip\n    if _continue:\n        continue\n"
