      '
- id: python.stdlib.typing_assert_never
  language: python
  feature_name: typing.assert_never()
  introduced: '3.11'
  category: typing
  description: Assert that code is unreachable (for exhaustiveness checking)
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - assert
  - unreachable
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: assert_never
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: assert_never
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import assert_never
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.1.0
  verification:
    re_detect: true
  test:
    before: 'from typing import assert_never

      '
    after: 'from typing_extensions import assert_never

      '
- id: python.stdlib.enum_verify
  language: python
  feature_name: enum.verify()
  introduced: '3.11'
  category: stdlib
  description: Verify enum classes meet certain criteria
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - enum
  - verify
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: enum
        names_contains: verify
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: verify
      replace:
        try_import: '# enum.verify() — requires Python 3.11+'
        except_import: 'pass  # enum.verify() not available'
  verification:
    re_detect: true
  test:
    before: "from enum import Enum, verify, UNIQUE\n@verify(UNIQUE)\nclass Color(Enum):\n\
      \    RED = 1\n"
    after: "from enum import Enum\nclass Color(Enum):\n    RED = 1\n"
