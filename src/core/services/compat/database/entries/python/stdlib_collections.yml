- id: python.stdlib.collections_chainmap_or
  language: python
  feature_name: ChainMap | operator
  introduced: '3.9'
  category: stdlib
  description: ChainMap supports | and |= operators
  direction: downgrade
  severity: info
  error_type: runtime_error
  tags:
  - collections
  - chainmap
  - merge
  detection:
    primary:
      ast_type: BinOp
      match:
        op_type: BitOr
      context: runtime
  fix:
    strategy: manual
    manual_instructions: 'Use ChainMap constructor: ChainMap(map1, map2) instead of
      map1 | map2'
  verification:
    re_detect: false
  test:
    before: 'merged = chain1 | chain2

      '
    after: 'from collections import ChainMap

      merged = ChainMap(chain1, chain2)

      '
- id: python.stdlib.itertools_pairwise
  language: python
  feature_name: itertools.pairwise()
  introduced: '3.10'
  category: stdlib
  description: Return successive overlapping pairs
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - itertools
  - pairwise
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: itertools
        names_contains: pairwise
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: pairwise
      replace:
        try_import: from itertools import pairwise
        except_import: 'from more_itertools import pairwise  # pip install more-itertools'
  verification:
    re_detect: true
  test:
    before: 'from itertools import pairwise

      '
    after: "import itertools\ndef pairwise(it):\n    a, b = itertools.tee(it)\n  \
      \  next(b, None)\n    return zip(a, b)\n"
