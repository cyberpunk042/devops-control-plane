- id: python.stdlib.typing_typevartuple_312
  language: python
  feature_name: TypeVarTuple unpack syntax
  introduced: '3.11'
  category: typing
  direction: downgrade
  severity: warning
  error_type: import_error
  tags:
  - typing
  - typevartuple
  - unpack
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: TypeVarTuple
    exclude:
    - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: TypeVarTuple
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import TypeVarTuple
      condition: not_already_present
    backport:
      package: typing-extensions
  verification:
    re_detect: true
  test:
    before: 'from typing import TypeVarTuple

      '
    after: 'from typing_extensions import TypeVarTuple

      '
