- id: python.stdlib.re_noflag
  language: python
  feature_name: re.NOFLAG
  introduced: '3.11'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - re
  - noflag
  - constant
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: re
        attr: NOFLAG
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: NOFLAG
      replace:
        try_import: '# re.NOFLAG — Python 3.11+'
        except_import: 'pass  # NOFLAG not available in older Python'
  verification:
    re_detect: true
  test:
    before: 're.compile(pattern, re.NOFLAG)

      '
    after: 're.compile(pattern, 0)

      '
