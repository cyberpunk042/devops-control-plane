- id: python.stdlib.inspect_get_annotations
  language: python
  feature_name: inspect.get_annotations()
  introduced: '3.10'
  category: stdlib
  description: Proper annotation resolution
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - inspect
  - annotations
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: inspect
        attr: get_annotations
    alternatives:
    - ast_type: ImportFrom
      match:
        module: inspect
        names_contains: get_annotations
  fix:
    strategy: manual
    manual_instructions: Use typing.get_type_hints() or obj.__annotations__.
  verification:
    re_detect: true
  test:
    before: 'import inspect

      ann = inspect.get_annotations(MyClass)

      '
    after: 'from typing import get_type_hints

      ann = get_type_hints(MyClass)

      '
