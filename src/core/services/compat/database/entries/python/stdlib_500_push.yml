    before: 'from typing import TypedDict

      '
    after: 'from typing import TypedDict

      '
- id: python.stdlib.typing_type_alias_310
  language: python
  feature_name: TypeAlias (3.10)
  introduced: '3.10'
  category: typing
  description: Explicit type alias annotation
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - alias
  - annotation
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: TypeAlias
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: TypeAlias
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import TypeAlias
      condition: not_already_present
    backport:
      package: typing-extensions
  verification:
    re_detect: true
  test:
    before: 'from typing import TypeAlias

      Vector: TypeAlias = list[float]

      '
    after: 'from typing_extensions import TypeAlias

      Vector: TypeAlias = list[float]

      '
- id: python.stdlib.asyncio_to_thread
  language: python
  feature_name: asyncio.to_thread()
  introduced: '3.9'
  category: stdlib
  description: Run blocking function in a separate thread
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - asyncio
  - thread
  - blocking
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: asyncio
        attr: to_thread
    alternatives:
    - ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: to_thread
  fix:
    strategy: manual
    manual_instructions: "Use loop.run_in_executor():\n  await asyncio.to_thread(blocking_func,\
      \ arg)\n  → loop = asyncio.get_event_loop()\n    await loop.run_in_executor(None,\
      \ blocking_func, arg)\n"
  verification:
    re_detect: true
  test:
    before: 'result = await asyncio.to_thread(blocking_io)

      '
    after: 'loop = asyncio.get_event_loop()

      result = await loop.run_in_executor(None, blocking_io)

      '
- id: python.stdlib.typing_never_311
  language: python
  feature_name: typing.Never (3.11)
  introduced: '3.11'
  category: typing
  description: Bottom type — function that never returns
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - never
  - bottom
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Never
    exclude:
    - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: Never
      replace:
        import_name: NoReturn
  verification:
    re_detect: true
  test:
    before: 'from typing import Never

      def fail() -> Never: raise RuntimeError

      '
    after: 'from typing import NoReturn

      def fail() -> NoReturn: raise RuntimeError

      '
