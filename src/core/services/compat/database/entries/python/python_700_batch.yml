    before: 'import configparser

      '
    after: 'import configparser

      '
- id: python.stdlib.pkgutil_resolve
  language: python
  feature_name: pkgutil.resolve_name()
  introduced: '3.9'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - pkgutil
  - resolve
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: pkgutil
        attr: resolve_name
  fix:
    strategy: manual
    manual_instructions: Use importlib.import_module + getattr.
  verification:
    re_detect: true
  test:
    before: 'pkgutil.resolve_name(''os.path'')

      '
    after: 'importlib.import_module(''os.path'')

      '
