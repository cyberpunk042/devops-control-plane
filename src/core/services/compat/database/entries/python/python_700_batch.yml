# Python batch — 700

- id: python.stdlib.configparser_converters
  language: python
  feature_name: "configparser converters"
  introduced: "3.8"
  category: stdlib
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [configparser]
  detection:
    primary: { ast_type: Import, match: { names_contains: configparser } }
  fix: { strategy: no_fix_needed }
  verification: { re_detect: false }
  test: { before: "import configparser\n", after: "import configparser\n" }

- id: python.stdlib.pkgutil_resolve
  language: python
  feature_name: "pkgutil.resolve_name()"
  introduced: "3.9"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [pkgutil, resolve]
  detection:
    primary: { ast_type: Attribute, match: { value_id: pkgutil, attr: resolve_name } }
  fix: { strategy: manual, manual_instructions: "Use importlib.import_module + getattr." }
  verification: { re_detect: true }
  test: { before: "pkgutil.resolve_name('os.path')\n", after: "importlib.import_module('os.path')\n" }

