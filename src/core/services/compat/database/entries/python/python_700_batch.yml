- id: python.stdlib.glob_root_dir
  language: python
  feature_name: glob.glob root_dir parameter
  introduced: '3.10'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - glob
  - root_dir
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: glob
        has_keyword: root_dir
        func_value_id:
        - glob
        - Path
  fix:
    strategy: manual
    manual_instructions: Use os.chdir or manual path joining.
  verification:
    re_detect: false
  test:
    before: 'glob.glob(''*.py'', root_dir=''/src'')

      '
    after: 'glob.glob(''/src/*.py'')

      '
- id: python.stdlib.locale_delocalize
  language: python
  feature_name: locale.delocalize()
  introduced: '3.10'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - locale
  - delocalize
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: locale
        attr: delocalize
  fix:
    strategy: manual
    manual_instructions: Parse manually with locale.atof.
  verification:
    re_detect: true
  test:
    before: 'locale.delocalize(''1,234.56'')

      '
    after: 'locale.atof(''1,234.56'')

      '
