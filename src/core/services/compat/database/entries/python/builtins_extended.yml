# Python builtins — extended set

# ── Python 3.12 ──────────────────────────────────────────────────

- id: python.builtins.type_alias_type
  language: python
  feature_name: "type (builtin keyword)"
  introduced: "3.12"
  category: builtins
  description: "type keyword for creating TypeAlias"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [type, alias, keyword]
  detection:
    primary:
      ast_type: TypeAlias
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
      - type: rewrite_type_alias
        find:
          ast_type: TypeAlias
        replace:
          template: "{name}: TypeAlias = {value}"
  verification:
    re_detect: true
  test:
    before: |
      type UserId = int
    after: |
      from typing import TypeAlias
      UserId: TypeAlias = int

# ── Python 3.10 ──────────────────────────────────────────────────

- id: python.builtins.isinstance_union
  language: python
  feature_name: "isinstance with union type"
  introduced: "3.10"
  category: builtins
  description: "isinstance(x, int | str) using | syntax"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [isinstance, union, runtime]
  detection:
    primary:
      ast_type: BinOp
      match:
        op_type: BitOr
      context: runtime
  fix:
    strategy: rewrite_expression
    transforms:
      - type: rewrite_isinstance_union
        find:
          context: isinstance_arg
        replace:
          template: "({types_as_tuple})"
  verification:
    re_detect: true
  test:
    before: |
      if isinstance(x, int | str):
          pass
    after: |
      if isinstance(x, (int, str)):
          pass

- id: python.builtins.aiter_builtin
  language: python
  feature_name: "aiter() builtin"
  introduced: "3.10"
  category: builtins
  description: "Async version of iter() builtin"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [async, builtin, iterator]
  detection:
    primary:
      ast_type: Call
      match:
        func_id: aiter
  fix:
    strategy: manual
    manual_instructions: |
      Replace with explicit __aiter__ call:
        async_it = aiter(async_iterable)
        → async_it = async_iterable.__aiter__()
  verification:
    re_detect: true
  test:
    before: |
      async_it = aiter(stream)
    after: |
      async_it = stream.__aiter__()

# ── Python 3.9 ──────────────────────────────────────────────────

- id: python.builtins.dict_union_or
  language: python
  feature_name: "dict | dict merge"
  introduced: "3.9"
  category: builtins
  description: "Merge two dicts with | operator — runtime usage"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: unsupported_operator
  tags: [dict, merge, runtime]
  detection:
    primary:
      ast_type: BinOp
      match:
        op_type: BitOr
      context: runtime
    exclude:
      - context: annotation
        reason: "X | Y in annotations is union type, not dict merge"
  fix:
    strategy: rewrite_expression
    transforms:
      - type: rewrite_binary_op
        find:
          operator: "|"
        replace:
          template: "{**{left}, **{right}}"
  verification:
    re_detect: true
  test:
    before: |
      merged = defaults | overrides
    after: |
      merged = {**defaults, **overrides}

- id: python.builtins.str_isascii
  language: python
  feature_name: "str.isascii()"
  introduced: "3.7"
  category: builtins
  description: "Check if all characters in string are ASCII"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [string, ascii, method]
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: isascii
  fix:
    strategy: rewrite_expression
    transforms:
      - type: rewrite_method_call
        find:
          method: isascii
        replace:
          template: "all(ord(c) < 128 for c in {receiver})"
  verification:
    re_detect: true
  test:
    before: |
      if text.isascii():
          process(text)
    after: |
      if all(ord(c) < 128 for c in text):
          process(text)

# ── Python 3.8 ──────────────────────────────────────────────────

- id: python.builtins.math_isqrt
  language: python
  feature_name: "math.isqrt()"
  introduced: "3.8"
  category: builtins
  description: "Integer square root"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [math, isqrt, integer]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: math
        names_contains: isqrt
    alternatives:
      - ast_type: Attribute
        match:
          value_id: math
          attr: isqrt
  fix:
    strategy: manual
    manual_instructions: |
      Replace with int(math.sqrt(n)):
        math.isqrt(n)  → int(math.sqrt(n))
      Note: int(sqrt) may have floating-point precision issues for very large numbers.
  verification:
    re_detect: true
  test:
    before: |
      from math import isqrt
      result = isqrt(144)
    after: |
      import math
      result = int(math.sqrt(144))

- id: python.builtins.statistics_fmean
  language: python
  feature_name: "statistics.fmean()"
  introduced: "3.8"
  category: builtins
  description: "Fast floating-point arithmetic mean"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [statistics, mean, math]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: statistics
        names_contains: fmean
  fix:
    strategy: manual
    manual_instructions: |
      Replace with sum/len:
        statistics.fmean(data)  → sum(data) / len(data)
  verification:
    re_detect: true
  test:
    before: |
      from statistics import fmean
      avg = fmean([1.0, 2.0, 3.0])
    after: |
      data = [1.0, 2.0, 3.0]
      avg = sum(data) / len(data)
