- id: python.stdlib.breakpoint_builtin
  language: python
  feature_name: breakpoint() builtin
  introduced: '3.7'
  category: builtins
  description: Built-in breakpoint function for debugging
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - breakpoint
  - debug
  - builtin
  detection:
    primary:
      ast_type: Call
      match:
        func_id: breakpoint
  fix:
    strategy: rewrite_expression
    transforms:
    - type: replace_function_call
      find:
        function: breakpoint
      replace:
        template: import pdb; pdb.set_trace()
  verification:
    re_detect: true
  test:
    before: 'breakpoint()

      '
    after: 'import pdb; pdb.set_trace()

      '
- id: python.stdlib.subprocess_capture
  language: python
  feature_name: subprocess.run capture_output
  introduced: '3.7'
  category: stdlib
  description: capture_output parameter in subprocess.run()
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - subprocess
  - capture
  - output
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: run
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: run
      replace:
        note: subprocess.run capture_output — requires Python 3.7+
  verification:
    re_detect: false
  test:
    before: 'result = subprocess.run(cmd, capture_output=True)

      '
    after: 'import subprocess

      result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)

      '
- id: python.stdlib.datetime_fromisoformat
  language: python
  feature_name: datetime.fromisoformat() improvements
  introduced: '3.11'
  category: stdlib
  description: fromisoformat accepts more formats in 3.11+
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - datetime
  - fromisoformat
  - parsing
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: fromisoformat
        func_value_id: datetime
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: fromisoformat
      replace:
        note: datetime.fromisoformat() improvements — requires Python 3.11+
  verification:
    re_detect: false
  test:
    before: 'dt = datetime.fromisoformat("2024-01-01T12:00:00Z")

      '
    after: 'from dateutil.parser import isoparse

      dt = isoparse("2024-01-01T12:00:00Z")

      '
