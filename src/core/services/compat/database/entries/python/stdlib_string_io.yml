- id: python.stdlib.os_fspath
  language: python
  feature_name: os.fspath()
  introduced: '3.6'
  category: stdlib
  description: Get filesystem path from path-like object
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - os
  - path
  - fspath
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: os
        attr: fspath
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: fspath
      replace:
        try_import: '# os.fspath() — Python 3.6+'
        except_import: 'pass  # fspath not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import os

      s = os.fspath(path)

      '
    after: 's = str(path)

      '
