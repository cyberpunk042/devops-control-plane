- id: python.stdlib.str_isascii_37
  language: python
  feature_name: str.isascii()
  introduced: '3.7'
  category: builtins
  description: Check if all characters are ASCII
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - string
  - ascii
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: isascii
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: isascii
      replace:
        template: all(ord(c) < 128 for c in {receiver})
  verification:
    re_detect: true
  test:
    before: "if text.isascii():\n    pass\n"
    after: "if all(ord(c) < 128 for c in text):\n    pass\n"
- id: python.stdlib.os_fspath
  language: python
  feature_name: os.fspath()
  introduced: '3.6'
  category: stdlib
  description: Get filesystem path from path-like object
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - os
  - path
  - fspath
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: os
        attr: fspath
  fix:
    strategy: manual
    manual_instructions: Use str(path) instead of os.fspath(path).
  verification:
    re_detect: true
  test:
    before: 'import os

      s = os.fspath(path)

      '
    after: 's = str(path)

      '
