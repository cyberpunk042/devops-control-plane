- id: python.stdlib.zipfile_path
  language: python
  feature_name: zipfile.Path
  introduced: '3.8'
  category: stdlib
  description: Path-like access to zip file contents
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - zipfile
  - path
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: zipfile
        names_contains: Path
    alternatives:
    - ast_type: Attribute
      match:
        value_id: zipfile
        attr: Path
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: Path
      replace:
        try_import: '# zipfile.Path — requires Python 3.8+'
        except_import: 'pass  # zipfile.Path not available'
  verification:
    re_detect: true
  test:
    before: 'from zipfile import Path as ZipPath

      p = ZipPath(archive, "data/config.json")

      '
    after: "import zipfile\nwith zipfile.ZipFile(archive) as zf:\n    data = zf.read(\"\
      data/config.json\")\n"
