- id: python.stdlib.subprocess_capture
  language: python
  feature_name: subprocess.run capture_output
  introduced: '3.7'
  category: stdlib
  description: capture_output parameter in subprocess.run()
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - subprocess
  - capture
  - output
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: run
  fix:
    strategy: manual
    manual_instructions: "Replace capture_output=True with explicit PIPE:\n  subprocess.run(cmd,\
      \ capture_output=True)\n  → subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n"
  verification:
    re_detect: false
  test:
    before: 'result = subprocess.run(cmd, capture_output=True)

      '
    after: 'import subprocess

      result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)

      '
- id: python.stdlib.datetime_fromisoformat
  language: python
  feature_name: datetime.fromisoformat() improvements
  introduced: '3.11'
  category: stdlib
  description: fromisoformat accepts more formats in 3.11+
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - datetime
  - fromisoformat
  - parsing
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: fromisoformat
        func_value_id: datetime
  fix:
    strategy: manual
    manual_instructions: '3.7-3.10: fromisoformat only accepts YYYY-MM-DDTHH:MM:SS

      3.11+: also accepts Z suffix, +00:00, etc.

      For broader parsing: use dateutil.parser.isoparse()

      '
  verification:
    re_detect: false
  test:
    before: 'dt = datetime.fromisoformat("2024-01-01T12:00:00Z")

      '
    after: 'from dateutil.parser import isoparse

      dt = isoparse("2024-01-01T12:00:00Z")

      '
