- id: python.stdlib.pathlib_match_pattern
  language: python
  feature_name: Path.match() case sensitivity
  introduced: '3.12'
  category: stdlib
  description: case_sensitive parameter for Path.match()
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - pathlib
  - match
  - case
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: match
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: match
      replace:
        note: Path.match() case sensitivity — requires Python 3.12+
  verification:
    re_detect: false
  test:
    before: 'path.match("*.py", case_sensitive=False)

      '
    after: 'path.match("*.py")

      '
- id: python.stdlib.enum_global_enum
  language: python
  feature_name: enum.global_enum()
  introduced: '3.11'
  category: stdlib
  description: Make enum members available at module level
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - enum
  - global
  - module
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: enum
        names_contains: global_enum
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: global_enum
      replace:
        try_import: '# enum.global_enum() — requires Python 3.11+'
        except_import: 'pass  # enum.global_enum() not available'
  verification:
    re_detect: true
  test:
    before: 'from enum import global_enum

      '
    after: '# Manually export members

      '
- id: python.stdlib.asyncio_eager_task
  language: python
  feature_name: asyncio.eager_task_factory
  introduced: '3.12'
  category: stdlib
  description: Eagerly start coroutine execution
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - asyncio
  - eager
  - task
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: asyncio
        attr: eager_task_factory
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: eager_task_factory
      replace:
        try_import: '# asyncio.eager_task_factory — Python 3.12+'
        except_import: 'pass  # eager_task_factory not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'asyncio.get_event_loop().set_task_factory(asyncio.eager_task_factory)

      '
    after: '# Use asyncio.create_task() — no eager mode

      '
