- id: python.stdlib.copy_replace
  language: python
  feature_name: copy.replace()
  introduced: '3.13'
  category: stdlib
  description: Create modified copy of an object
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - copy
  - replace
  - immutable
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: copy
        attr: replace
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: replace
      replace:
        try_import: '# copy.replace() — Python 3.13+'
        except_import: 'pass  # replace not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import copy

      new_obj = copy.replace(obj, x=10)

      '
    after: 'from dataclasses import replace

      new_obj = replace(obj, x=10)

      '
