- id: python.stdlib.typing_no_return
  language: python
  feature_name: typing.NoReturn
  introduced: '3.5'
  category: typing
  description: Type for functions that never return
  direction: downgrade
  severity: info
  error_type: import_error
  tags:
  - typing
  - noreturn
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: NoReturn
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: 'from typing import NoReturn

      '
    after: 'from typing import NoReturn

      '
