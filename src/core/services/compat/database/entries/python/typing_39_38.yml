    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: Unpack
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import Unpack
