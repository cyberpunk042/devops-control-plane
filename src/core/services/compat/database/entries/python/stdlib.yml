- id: python.stdlib.datetime_utc
  language: python
  feature_name: datetime.UTC
  introduced: '3.11'
  category: stdlib
  description: datetime.UTC shorthand for datetime.timezone.utc, added in 3.11
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - datetime
  - timezone
  - import
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: datetime
        names_contains: UTC
    alternatives:
    - ast_type: Attribute
      match:
        value_type: Name
        value_id: datetime
        attr: UTC
    exclude:
    - context: type_checking_block
      reason: TYPE_CHECKING imports are not executed at runtime
    - context: try_except_import
      reason: Already handled by try/except fallback
    - context: version_gate
      reason: Already gated by sys.version_info check
  fix:
    strategy: replace_import_and_usages
    transforms:
    - type: replace_import_name
      find:
        import_module: datetime
        import_name: UTC
      replace:
        import_name: timezone
    - type: replace_usage
      find:
        name: UTC
        origin: import
      replace:
        expression: timezone.utc
  verification:
    re_detect: true
    import_check: true
    syntax_check: true
  edge_cases:
  - id: python.datetime_utc.sole_import
    category: transform_edge_case
    description: UTC is the only name imported from datetime
    handling: special_transform
    test:
      before: 'from datetime import UTC

        now = datetime.now(UTC)

        '
      after: 'from datetime import timezone

        now = datetime.now(timezone.utc)

        '
  - id: python.datetime_utc.mixed_import
    category: transform_edge_case
    description: UTC imported alongside other names
    handling: special_transform
    test:
      before: 'from datetime import datetime, UTC, timezone

        now = datetime.now(UTC)

        '
      after: 'from datetime import datetime, timezone

        now = datetime.now(timezone.utc)

        '
      notes: Only remove UTC from names list, keep datetime and timezone
  - id: python.datetime_utc.aliased
    category: transform_edge_case
    description: UTC imported with alias
    handling: special_transform
    test:
      before: 'from datetime import UTC as utc_tz

        now = datetime.now(utc_tz)

        '
      after: 'from datetime import timezone

        now = datetime.now(timezone.utc)

        '
      notes: Must track alias and replace all usages of the alias
  - id: python.datetime_utc.attribute_access
    category: transform_edge_case
    description: datetime.UTC attribute form instead of import
    handling: special_transform
    test:
      before: 'import datetime

        now = datetime.datetime.now(datetime.UTC)

        '
      after: 'import datetime

        now = datetime.datetime.now(datetime.timezone.utc)

        '
  - id: python.datetime_utc.type_checking
    category: context_dependent
    description: UTC inside TYPE_CHECKING block
    handling: exclude
    test:
      input: "from typing import TYPE_CHECKING\nif TYPE_CHECKING:\n    from datetime\
        \ import UTC\n"
      expected_findings: 0
  - id: python.datetime_utc.try_except
    category: context_dependent
    description: UTC with try/except fallback already in place
    handling: downgrade_severity
    severity_override: info
    test:
      input: "try:\n    from datetime import UTC\nexcept ImportError:\n    from datetime\
        \ import timezone\n    UTC = timezone.utc\n"
      expected_findings: 1
      expected_severity: info
  - id: python.datetime_utc.version_gate
    category: context_dependent
    description: UTC inside sys.version_info check
    handling: exclude
    test:
      input: "import sys\nif sys.version_info >= (3, 11):\n    from datetime import\
        \ UTC\nelse:\n    from datetime import timezone\n    UTC = timezone.utc\n"
      expected_findings: 0
  - id: python.datetime_utc.getattr_safe
    category: false_positive
    description: Safe attribute access via getattr with default
    handling: exclude
    test:
      input: 'import datetime

        utc = getattr(datetime, "UTC", datetime.timezone.utc)

        '
      expected_findings: 0
  test:
    before: 'from datetime import UTC, datetime

      now = datetime.now(UTC)

      ts = datetime(2024, 1, 1, tzinfo=UTC)

      '
    after: 'from datetime import timezone, datetime

      now = datetime.now(timezone.utc)

      ts = datetime(2024, 1, 1, tzinfo=timezone.utc)

      '
    additional:
    - name: sole import
      before: 'from datetime import UTC

        '
      after: 'from datetime import timezone

        '
    - name: attribute access
      before: 'import datetime

        now = datetime.datetime.now(datetime.UTC)

        '
      after: 'import datetime

        now = datetime.datetime.now(datetime.timezone.utc)

        '
    - name: multiple usages
      before: 'from datetime import UTC, datetime

        a = datetime.now(UTC)

        b = datetime(2024, 1, 1, tzinfo=UTC)

        c = datetime.now(tz=UTC)

        '
      after: 'from datetime import timezone, datetime

        a = datetime.now(timezone.utc)

        b = datetime(2024, 1, 1, tzinfo=timezone.utc)

        c = datetime.now(tz=timezone.utc)

        '
- id: python.stdlib.tomllib
  language: python
  feature_name: tomllib
  introduced: '3.11'
  category: stdlib
  description: TOML parser added to stdlib in 3.11 — backport available as tomli
  direction: both
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags:
  - toml
  - config
  - import
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: tomllib
    alternatives:
    - ast_type: ImportFrom
      match:
        module: tomllib
    exclude:
    - context: try_except_import
      reason: Already handled by try/except backport pattern
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: add_backport_import
    transforms:
    - type: replace_import_statement
      find:
        import_pattern: import tomllib
      replace:
        import_statement: import tomli as tomllib
    - type: replace_import_statement
      find:
        import_pattern: from tomllib import
      replace:
        import_prefix: from tomli import
    backport:
      package: tomli
      min_version: 1.0.0
      import_name: tomli
      import_as: tomllib
      install_command: pip install tomli>=1.0.0
      supports_versions: '>=3.7'
      maintained: true
      notes: Official backport by the stdlib author
    alternative:
      strategy: wrap_in_try_except
      transforms:
      - type: conditional_import
        find:
          import_module: tomllib
        replace:
          try_import: import tomllib
          except_import: import tomli as tomllib
          except_type: ModuleNotFoundError
  fix_upgrade:
    strategy: replace_import
    transforms:
    - type: replace_import_statement
      find:
        import_pattern: import tomli as tomllib
      replace:
        import_statement: import tomllib
    - type: unwrap_try_except_import
      find:
        try_import: import tomllib
        except_import: import tomli as tomllib
      replace:
        keep: try
  verification:
    re_detect: true
    import_check: true
  edge_cases:
  - id: python.tomllib.try_except_pattern
    category: context_dependent
    description: tomllib imported with try/except fallback
    handling: exclude
    test:
      input: "try:\n    import tomllib\nexcept ModuleNotFoundError:\n    import tomli\
        \ as tomllib\n"
      expected_findings: 0
      notes: Already has fallback — no action needed
  - id: python.tomllib.tomli_alias
    category: false_positive
    description: import tomli as tomllib is the FIX, not the problem
    handling: exclude
    test:
      input: 'import tomli as tomllib

        '
      expected_findings: 0
      notes: This IS the backport pattern — don't flag it
  - id: python.tomllib.from_import
    category: transform_edge_case
    description: from tomllib import load, loads
    handling: special_transform
    test:
      before: 'from tomllib import load, loads

        '
      after: 'from tomli import load, loads

        '
      notes: Replace module in from-import
  test:
    before: "import tomllib\nwith open(\"config.toml\", \"rb\") as f:\n    data =\
      \ tomllib.load(f)\n"
    after: "import tomli as tomllib\nwith open(\"config.toml\", \"rb\") as f:\n  \
      \  data = tomllib.load(f)\n"
    additional:
    - name: from import form
      before: 'from tomllib import load

        data = load(open("config.toml", "rb"))

        '
      after: 'from tomli import load

        data = load(open("config.toml", "rb"))

        '
- id: python.stdlib.strenum
  language: python
  feature_name: enum.StrEnum
  introduced: '3.11'
  category: stdlib
  description: StrEnum class added to enum module in 3.11
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - enum
  - string
  - import
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: enum
        names_contains: StrEnum
    alternatives:
    - ast_type: Attribute
      match:
        value_id: enum
        attr: StrEnum
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: add_backport_import
    transforms:
    - type: replace_import_name
      find:
        import_module: enum
        import_name: StrEnum
      replace:
        import_name: ''
    - type: add_import
      import_statement: from backports.strenum import StrEnum
      position: after_imports
      condition: not_already_present
    backport:
      package: backports.strenum
      min_version: 1.0.0
      import_name: backports.strenum
      install_command: pip install backports.strenum
      supports_versions: '>=3.8'
      maintained: true
    alternative:
      strategy: manual
      manual_instructions: "Define a simple StrEnum base class:\n  class StrEnum(str,\
        \ Enum):\n      pass\nOr use the backport: pip install backports.strenum\n"
  verification:
    re_detect: true
    import_check: true
  edge_cases:
  - id: python.strenum.mixed_enum_import
    category: transform_edge_case
    description: StrEnum imported alongside other enum members
    handling: special_transform
    test:
      before: "from enum import Enum, StrEnum, auto\nclass Color(StrEnum):\n    RED\
        \ = \"red\"\n"
      after: "from enum import Enum, auto\nfrom backports.strenum import StrEnum\n\
        class Color(StrEnum):\n    RED = \"red\"\n"
      notes: Remove StrEnum from enum import, add separate backport import
  test:
    before: "from enum import StrEnum\nclass Color(StrEnum):\n    RED = \"red\"\n\
      \    GREEN = \"green\"\n"
    after: "from backports.strenum import StrEnum\nclass Color(StrEnum):\n    RED\
      \ = \"red\"\n    GREEN = \"green\"\n"
- id: python.stdlib.exceptiongroup
  language: python
  feature_name: ExceptionGroup
  introduced: '3.11'
  category: stdlib
  description: ExceptionGroup and BaseExceptionGroup classes for exception groups
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - exceptions
  - error_handling
  - import
  detection:
    primary:
      ast_type: Name
      match:
        id: ExceptionGroup
    alternatives:
    - ast_type: Name
      match:
        id: BaseExceptionGroup
    - ast_type: ImportFrom
      match:
        module: builtins
        names_contains: ExceptionGroup
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: add_backport_import
    transforms:
    - type: add_import
      import_statement: from exceptiongroup import ExceptionGroup, BaseExceptionGroup
      position: after_imports
    backport:
      package: exceptiongroup
      min_version: 1.0.0
      install_command: pip install exceptiongroup>=1.0.0
      supports_versions: '>=3.7'
      maintained: true
      notes: Provides ExceptionGroup class but NOT except* syntax
  verification:
    re_detect: false
    import_check: true
  test:
    before: "try:\n    raise ExceptionGroup(\"errors\", [ValueError(\"a\"), TypeError(\"\
      b\")])\nexcept Exception as e:\n    print(e)\n"
    after: "from exceptiongroup import ExceptionGroup, BaseExceptionGroup\ntry:\n\
      \    raise ExceptionGroup(\"errors\", [ValueError(\"a\"), TypeError(\"b\")])\n\
      except Exception as e:\n    print(e)\n"
- id: python.stdlib.zoneinfo
  language: python
  feature_name: zoneinfo
  introduced: '3.9'
  category: stdlib
  description: IANA time zone database access via zoneinfo module
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags:
  - timezone
  - zoneinfo
  - import
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: zoneinfo
    alternatives:
    - ast_type: ImportFrom
      match:
        module: zoneinfo
  fix:
    strategy: add_backport_import
    transforms:
    - type: replace_import_statement
      find:
        import_pattern: from zoneinfo import
      replace:
        import_prefix: from backports.zoneinfo import
    - type: replace_import_statement
      find:
        import_pattern: import zoneinfo
      replace:
        import_statement: from backports import zoneinfo
    backport:
      package: backports.zoneinfo
      min_version: 0.2.1
      install_command: pip install backports.zoneinfo
      supports_versions: '>=3.6'
      maintained: true
  verification:
    re_detect: true
    import_check: true
  test:
    before: 'from zoneinfo import ZoneInfo

      tz = ZoneInfo("America/New_York")

      '
    after: 'from backports.zoneinfo import ZoneInfo

      tz = ZoneInfo("America/New_York")

      '
- id: python.stdlib.graphlib
  language: python
  feature_name: graphlib
  introduced: '3.9'
  category: stdlib
  description: graphlib module with TopologicalSorter
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags:
  - graph
  - topological
  - sort
  - import
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: graphlib
    alternatives:
    - ast_type: ImportFrom
      match:
        module: graphlib
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: graphlib
      replace:
        try_import: from graphlib import TopologicalSorter
        except_import: 'from graphlib_backport import TopologicalSorter  # pip install
          graphlib-backport'
  verification:
    re_detect: true
  test:
    before: 'from graphlib import TopologicalSorter

      ts = TopologicalSorter({"a": {"b", "c"}, "b": {"c"}})

      '
    after: 'from graphlib import TopologicalSorter

      ts = TopologicalSorter({"a": {"b", "c"}, "b": {"c"}})

      '
