- id: python.stdlib.annotated
  language: python
  feature_name: typing.Annotated
  introduced: '3.9'
  category: stdlib
  description: typing.Annotated for adding metadata to type hints
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - annotated
  - import
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Annotated
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: Annotated
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import Annotated
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 3.11.0
      install_command: pip install typing-extensions
      maintained: true
  verification:
    re_detect: true
  test:
    before: 'from typing import Annotated

      Name = Annotated[str, "max_length=50"]

      '
    after: 'from typing_extensions import Annotated

      Name = Annotated[str, "max_length=50"]

      '
- id: python.stdlib.removesuffix_bytes
  language: python
  feature_name: bytes.removeprefix/removesuffix
  introduced: '3.9'
  category: stdlib
  description: removeprefix and removesuffix methods on bytes/bytearray
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - bytes
  - method
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: removeprefix
    alternatives:
    - ast_type: Call
      match:
        func_attr: removesuffix
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: removeprefix
      replace:
        extract:
          arg: call_args_0
          receiver: call_receiver
        template: '{receiver}[len({arg}):]  if {receiver}.startswith({arg}) else {receiver}'
  verification:
    re_detect: true
  test:
    before: 'data = raw.removeprefix(b"header:")

      '
    after: 'data = raw[len(b"header:"):] if raw.startswith(b"header:") else raw

      '
- id: python.stdlib.math_lcm
  language: python
  feature_name: math.lcm()
  introduced: '3.9'
  category: stdlib
  description: Least common multiple function in math module
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - math
  - lcm
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: math
        names_contains: lcm
    alternatives:
    - ast_type: Attribute
      match:
        value_id: math
        attr: lcm
  fix:
    strategy: manual
    manual_instructions: "Implement lcm using gcd:\n  from math import gcd\n  def\
      \ lcm(a, b):\n      return abs(a * b) // gcd(a, b)\n"
  verification:
    re_detect: true
  test:
    before: 'from math import lcm

      result = lcm(12, 8)

      '
    after: "from math import gcd\ndef lcm(a, b):\n    return abs(a * b) // gcd(a,\
      \ b)\nresult = lcm(12, 8)\n"
- id: python.stdlib.random_randbytes
  language: python
  feature_name: random.randbytes()
  introduced: '3.9'
  category: stdlib
  description: Generate random bytes
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - random
  - bytes
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: randbytes
        func_value_id: random
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: randbytes
      replace:
        template: os.urandom({arg})
  verification:
    re_detect: true
  test:
    before: 'import random

      data = random.randbytes(16)

      '
    after: 'import os

      data = os.urandom(16)

      '
