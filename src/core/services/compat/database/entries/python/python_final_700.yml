- id: python.stdlib.asyncio_cancel_msg
  language: python
  feature_name: Task.cancel(msg=)
  introduced: '3.9'
  category: stdlib
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - asyncio
  - cancel
  - message
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: cancel
        has_keyword: msg
  fix:
    strategy: manual
    manual_instructions: Remove msg parameter from cancel().
  verification:
    re_detect: false
  test:
    before: 'task.cancel(msg=''timeout'')

      '
    after: 'task.cancel()

      '
