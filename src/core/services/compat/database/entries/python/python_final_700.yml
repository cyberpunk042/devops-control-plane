- id: python.stdlib.typing_type_param_syntax
  language: python
  feature_name: type parameter syntax [T]
  introduced: '3.12'
  category: syntax
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - typing
  - type_param
  - syntax
  detection:
    primary:
      ast_type: FunctionDef
      match:
        has_type_params: true
  fix:
    strategy: manual
    manual_instructions: Use TypeVar explicitly.
  verification:
    re_detect: false
  test:
    before: 'def first[T](items: list[T]) -> T: return items[0]

      '
    after: 'T = TypeVar(''T'')

      def first(items: list) -> Any: return items[0]

      '
