- id: python.stdlib.typing_clear_overloads
  language: python
  feature_name: typing.clear_overloads()
  introduced: '3.11'
  category: typing
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - typing
  - overloads
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: clear_overloads
  fix:
    strategy: manual
    manual_instructions: Not available on older Python.
  verification:
    re_detect: true
  test:
    before: 'from typing import clear_overloads

      '
    after: '# Not available

      '
