- id: python.stdlib.typing_namedtuple_defaults
  language: python
  feature_name: "NamedTuple with defaults"
  introduced: "3.6"
  category: typing
  description: "NamedTuple class syntax with default values"
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [typing, namedtuple, defaults]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: NamedTuple
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      from typing import NamedTuple
      class Point(NamedTuple):
          x: int
          y: int = 0
    after: |
      from typing import NamedTuple
      class Point(NamedTuple):
          x: int
          y: int = 0

