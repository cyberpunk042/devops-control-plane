- id: python.stdlib.secrets_module
  language: python
  feature_name: secrets module
  introduced: '3.6'
  category: stdlib
  description: Cryptographically strong random numbers
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags:
  - secrets
  - random
  - security
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: secrets
    alternatives:
    - ast_type: ImportFrom
      match:
        module: secrets
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: secrets
      replace:
        try_import: '# secrets module — requires Python 3.6+'
        except_import: 'pass  # secrets module not available'
  verification:
    re_detect: true
  test:
    before: 'import secrets

      token = secrets.token_hex(16)

      '
    after: 'import os, binascii

      token = binascii.hexlify(os.urandom(16)).decode()

      '
- id: python.stdlib.dataclasses_module
  language: python
  feature_name: dataclasses module
  introduced: '3.7'
  category: stdlib
  description: Decorator for auto-generating __init__, __repr__, etc.
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags:
  - dataclasses
  - class
  - decorator
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: dataclasses
    alternatives:
    - ast_type: ImportFrom
      match:
        module: dataclasses
  fix:
    strategy: conditional_import
    backport:
      package: dataclasses
      install_command: pip install dataclasses
      notes: Official backport for Python 3.6
    transforms:
    - type: conditional_import
      find:
        import_name: dataclasses
      replace:
        try_import: '# dataclasses module — requires Python 3.7+'
        except_import: 'pass  # dataclasses module not available'
  verification:
    re_detect: true
  test:
    before: 'from dataclasses import dataclass

      '
    after: '# pip install dataclasses (for 3.6)

      from dataclasses import dataclass

      '
