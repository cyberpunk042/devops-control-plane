- id: python.stdlib.secrets_module
  language: python
  feature_name: "secrets module"
  introduced: "3.6"
  category: stdlib
  description: "Cryptographically strong random numbers"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags: [secrets, random, security]
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: secrets
    alternatives:
      - ast_type: ImportFrom
        match:
          module: secrets
  fix:
    strategy: manual
    manual_instructions: "Use os.urandom() or random.SystemRandom()."
  verification:
    re_detect: true
  test:
    before: |
      import secrets
      token = secrets.token_hex(16)
    after: |
      import os, binascii
      token = binascii.hexlify(os.urandom(16)).decode()

