- id: python.stdlib.graphlib_toposort
  language: python
  feature_name: "graphlib.TopologicalSorter"
  introduced: "3.9"
  category: stdlib
  description: "Topological sort implementation"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [graphlib, topological, sort, graph]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: graphlib
        names_contains: TopologicalSorter
  fix:
    strategy: manual
    manual_instructions: |
      Implement with DFS:
        def topo_sort(graph):
            visited, order = set(), []
            def dfs(node):
                if node in visited: return
                visited.add(node)
                for dep in graph.get(node, []):
                    dfs(dep)
                order.append(node)
            for node in graph:
                dfs(node)
            return order
  verification:
    re_detect: true
  test:
    before: |
      from graphlib import TopologicalSorter
      ts = TopologicalSorter(graph)
      order = list(ts.static_order())
    after: |
      # Manual topological sort

- id: python.stdlib.math_comb_perm
  language: python
  feature_name: "math.comb() and math.perm()"
  introduced: "3.8"
  category: stdlib
  description: "Combinations and permutations"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [math, combinatorics]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: math
        names_contains: comb
    alternatives:
      - ast_type: ImportFrom
        match:
          module: math
          names_contains: perm
  fix:
    strategy: manual
    manual_instructions: |
      Implement using factorial:
        math.comb(n, k) → math.factorial(n) // (math.factorial(k) * math.factorial(n - k))
        math.perm(n, k) → math.factorial(n) // math.factorial(n - k)
  verification:
    re_detect: true
  test:
    before: |
      from math import comb
      result = comb(10, 3)
    after: |
      from math import factorial
      result = factorial(10) // (factorial(3) * factorial(7))

