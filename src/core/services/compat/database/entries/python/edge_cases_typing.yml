    - id: python.edge.typing_ext.deprecated
      category: false_positive
      description: "deprecated from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import deprecated
        expected_findings: 0

    - id: python.edge.typing_ext.typevar_tuple
      category: false_positive
      description: "TypeVarTuple from typing_extensions"
      handling: exclude
