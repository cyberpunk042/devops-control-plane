      from typing_extensions import Self

- id: python.edge.mixed_typing_imports
  language: python
  feature_name: "mixed typing and typing_extensions imports"
  introduced: "3.8"
  category: typing
  description: "Some names from typing, others from typing_extensions"
  direction: downgrade
  severity: info
  error_type: import_error
  tags: [edge_case, typing, mixed_imports]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  edge_cases:
    - id: python.edge.mixed.common_pattern
      category: transform_edge_case
      description: "Common pattern: old names from typing, new from typing_extensions"
      handling: special_transform
      test:
        input: |
          from typing import Dict, List, Optional
          from typing_extensions import Self, ParamSpec
        expected_findings: 0
        notes: "This is the CORRECT pattern — don't flag"

    - id: python.edge.mixed.type_checking_guard
      category: context_dependent
      description: "Mixed imports inside TYPE_CHECKING"
      handling: exclude
      test:
        input: |
          from typing import TYPE_CHECKING
          if TYPE_CHECKING:
              from typing import Self, ParamSpec
        expected_findings: 0
        notes: "TYPE_CHECKING guard makes all imports safe"

  test:
    before: |
      from typing import Dict, Optional
    after: |
      from typing import Dict, Optional
