# Typing edge cases — common patterns that need careful handling

- id: python.edge.typing_extensions_universal
  language: python
  feature_name: "typing_extensions as universal backport"
  introduced: "3.8"
  category: typing
  description: "typing_extensions provides backports for ALL typing features"
  direction: downgrade
  severity: info
  error_type: import_error
  tags: [edge_case, typing_extensions, backport]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing_extensions
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  edge_cases:
    - id: python.edge.typing_ext.self
      category: false_positive
      description: "Self from typing_extensions — NOT from typing"
      handling: exclude
      test:
        input: |
          from typing_extensions import Self
        expected_findings: 0

    - id: python.edge.typing_ext.paramspec
      category: false_positive
      description: "ParamSpec from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import ParamSpec
        expected_findings: 0

    - id: python.edge.typing_ext.typeguard
      category: false_positive
      description: "TypeGuard from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import TypeGuard
        expected_findings: 0

    - id: python.edge.typing_ext.never
      category: false_positive
      description: "Never from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import Never
        expected_findings: 0

    - id: python.edge.typing_ext.protocol
      category: false_positive
      description: "Protocol from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import Protocol
        expected_findings: 0

    - id: python.edge.typing_ext.literal
      category: false_positive
      description: "Literal from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import Literal
        expected_findings: 0

    - id: python.edge.typing_ext.annotated
      category: false_positive
      description: "Annotated from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import Annotated
        expected_findings: 0

    - id: python.edge.typing_ext.override
      category: false_positive
      description: "override from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import override
        expected_findings: 0

    - id: python.edge.typing_ext.typeis
      category: false_positive
      description: "TypeIs from typing_extensions"
      handling: exclude
      test:
        input: |
          from typing_extensions import TypeIs
        expected_findings: 0

    - id: python.edge.typing_ext.readonly
      category: false_positive
      description: "ReadOnly from typing_extensions"
      handling: exclude
