- id: python.stdlib.json_default_improved
  language: python
  feature_name: json.dumps improvements
  introduced: '3.10'
  category: stdlib
  description: Improved error messages in json.dumps
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - json
  - serialization
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: dumps
        func_value_id: json
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: 'import json

      data = json.dumps(obj)

      '
    after: 'import json

      data = json.dumps(obj)

      '
- id: python.stdlib.http_status_names
  language: python
  feature_name: http.HTTPStatus additions
  introduced: '3.9'
  category: stdlib
  description: New HTTP status codes in http module
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - http
  - status
  - codes
  detection:
    primary:
      ast_type: Attribute
      match:
        attr: EARLY_HINTS
    alternatives:
    - ast_type: Attribute
      match:
        attr: IM_A_TEAPOT
    - ast_type: Attribute
      match:
        attr: TOO_EARLY
  fix:
    strategy: manual
    manual_instructions: 'Use integer status codes directly: 103, 418, 425'
  verification:
    re_detect: true
  test:
    before: "from http import HTTPStatus\nif resp.status == HTTPStatus.EARLY_HINTS:\n\
      \    pass\n"
    after: "if resp.status == 103:\n    pass\n"
