- id: python.stdlib.importlib_resources_files
  language: python
  feature_name: importlib.resources.files()
  introduced: '3.9'
  category: stdlib
  description: Modern resource access API
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - importlib
  - resources
  - files
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: importlib.resources
        names_contains: files
    alternatives:
    - ast_type: Attribute
      match:
        attr: files
  fix:
    strategy: manual
    manual_instructions: "Use the backport:\n  pip install importlib-resources\n \
      \ from importlib_resources import files\nOr use pkg_resources:\n  import pkg_resources\n\
      \  data = pkg_resources.resource_string(package, name)\n"
    backport:
      package: importlib-resources
      install_command: pip install importlib-resources
  verification:
    re_detect: true
  test:
    before: 'from importlib.resources import files

      data = files("my_package").joinpath("data.json").read_text()

      '
    after: 'from importlib_resources import files

      data = files("my_package").joinpath("data.json").read_text()

      '
- id: python.stdlib.socket_create_server
  language: python
  feature_name: socket.create_server()
  introduced: '3.8'
  category: stdlib
  description: Convenience function for creating TCP server sockets
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - socket
  - server
  - tcp
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: socket
        attr: create_server
  fix:
    strategy: manual
    manual_instructions: "Use manual socket setup:\n  sock = socket.create_server((\"\
      \", 8080))\n  →\n  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
      \  sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n  sock.bind((\"\
      \", 8080))\n  sock.listen()\n"
  verification:
    re_detect: true
  test:
    before: 'import socket

      srv = socket.create_server(("", 8080))

      '
    after: 'import socket

      srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)

      srv.bind(("", 8080))

      srv.listen()

      '
