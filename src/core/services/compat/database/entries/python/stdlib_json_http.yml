- id: python.stdlib.importlib_resources_files
  language: python
  feature_name: importlib.resources.files()
  introduced: '3.9'
  category: stdlib
  description: Modern resource access API
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - importlib
  - resources
  - files
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: importlib.resources
        names_contains: files
    alternatives:
    - ast_type: Attribute
      match:
        func_value_attr: resources
        attr: files
  fix:
    strategy: conditional_import
    backport:
      package: importlib-resources
      min_version: '5.0'
      import_name: importlib_resources
    transforms:
    - type: conditional_import
      find:
        import_module: importlib.resources
        import_name: files
      replace:
        try_import: from importlib.resources import files
        except_import: from importlib_resources import files
  verification:
    re_detect: true
  test:
    before: 'from importlib.resources import files

      data = files("my_package").joinpath("data.json").read_text()

      '
    after: 'from importlib_resources import files

      data = files("my_package").joinpath("data.json").read_text()

      '
- id: python.stdlib.socket_create_server
  language: python
  feature_name: socket.create_server()
  introduced: '3.8'
  category: stdlib
  description: Convenience function for creating TCP server sockets
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - socket
  - server
  - tcp
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: socket
        attr: create_server
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: create_server
      replace:
        try_import: '# socket.create_server() — Python 3.8+'
        except_import: 'pass  # create_server not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import socket

      srv = socket.create_server(("", 8080))

      '
    after: 'import socket

      srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)

      srv.bind(("", 8080))

      srv.listen()

      '
