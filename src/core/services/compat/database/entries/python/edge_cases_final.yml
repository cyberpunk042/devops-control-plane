# Final edge cases to hit 100+

- id: python.edge.file_level_patterns
  language: python
  feature_name: "file-level detection edge cases"
  introduced: "3.8"
  category: syntax
  description: "Edge cases at the file/module level"
  direction: downgrade
  severity: info
  error_type: syntax_error
  tags: [edge_case, file, module]
  detection:
    primary:
      ast_type: NamedExpr
      match: {}
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  edge_cases:
    - id: python.edge.file.encoding_declaration
      category: false_positive
      description: "File with encoding declaration"
      handling: exclude
      test:
        input: |
          # -*- coding: utf-8 -*-
          x = 1
        expected_findings: 0

    - id: python.edge.file.shebang
      category: false_positive
      description: "File with shebang line"
      handling: exclude
      test:
        input: |
          #!/usr/bin/env python3
          x = 1
        expected_findings: 0

    - id: python.edge.file.init_py
      category: context_dependent
      description: "__init__.py with re-exports"
      handling: special_transform
      test:
        input: |
          from .module import SomeClass
        expected_findings: 0

    - id: python.edge.file.conftest
      category: context_dependent
      description: "conftest.py with fixtures"
      handling: special_transform
      test:
        input: |
          import pytest
          @pytest.fixture
          def sample():
              return 42
        expected_findings: 0

    - id: python.edge.file.generated
      category: false_positive
      description: "Generated code markers"
      handling: exclude
      test:
        input: |
          # This file is automatically generated. Do not edit.
          from datetime import UTC
        expected_findings: 1
        notes: "Generated files still contain real code — flag them (user can exclude via config)"

    - id: python.edge.file.pyi_stub
      category: false_positive
      description: ".pyi type stub files"
      handling: exclude
      test:
        input: |
          from datetime import UTC
          def get_time() -> UTC: ...
        expected_findings: 1
        notes: ".pyi files: syntax features are real (file won't parse), but runtime features are annotation-only"

  test:
    before: |
      if (n := len(data)) > 0:
          pass
    after: |
      n = len(data)
      if n > 0:
          pass

- id: python.edge.cross_feature_interactions
  language: python
  feature_name: "cross-feature interaction edge cases"
  introduced: "3.10"
  category: typing
  description: "Features that interact with each other"
  direction: downgrade
  severity: info
  error_type: type_error
  tags: [edge_case, interaction, cross_feature]
  detection:
    primary:
      ast_type: BinOp
      match:
        op_type: BitOr
      context: annotation
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  edge_cases:
    - id: python.edge.cross.future_plus_union
      category: context_dependent
      description: "__future__ + union type = safe for annotations"
      handling: exclude
      test:
        input: |
          from __future__ import annotations
          x: int | str = 1
        expected_findings: 0

    - id: python.edge.cross.future_plus_generics
      category: context_dependent
      description: "__future__ + builtin generics = safe for annotations"
      handling: exclude
      test:
        input: |
          from __future__ import annotations
          x: list[int] = []
          y: dict[str, list[int]] = {}
        expected_findings: 0

    - id: python.edge.cross.union_in_default_value
      category: context_dependent
      description: "Union type in default parameter value (runtime!)"
      handling: special_transform
      test:
        before: |
          from __future__ import annotations
          def foo(types = int | str):
              return isinstance(x, types)
        after: |
          from __future__ import annotations
          def foo(types = (int, str)):
              return isinstance(x, types)
        notes: "Default values are evaluated at function definition time — runtime even with __future__"

    - id: python.edge.cross.generic_in_isinstance
      category: context_dependent
      description: "Builtin generic in isinstance (runtime!)"
      handling: special_transform
      test:
        before: |
          from __future__ import annotations
          if isinstance(x, list[int]):
              pass
        after: |
          from __future__ import annotations
          if isinstance(x, list):
              pass
        notes: "isinstance(x, list[int]) is RUNTIME — crashes even with __future__"

  test:
    before: |
      x: int | str = 1
    after: |
      x: int | str = 1
