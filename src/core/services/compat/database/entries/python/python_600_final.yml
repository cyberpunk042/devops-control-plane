- id: python.stdlib.logging_gethandlerbyname
  language: python
  feature_name: logging.getHandlerByName()
  introduced: '3.12'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - logging
  - handler
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: logging
        attr: getHandlerByName
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: getHandlerByName
      replace:
        try_import: '# logging.getHandlerByName() — Python 3.12+'
        except_import: 'pass  # getHandlerByName not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'h = logging.getHandlerByName("console")

      '
    after: "h = None\nfor handler in logging.root.handlers:\n    if handler.name ==\
      \ \"console\": h = handler; break\n"
- id: python.stdlib.pathlib_full_match
  language: python
  feature_name: Path.full_match()
  introduced: '3.13'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - pathlib
  - match
  - full
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: full_match
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: full_match
      replace:
        note: Path.full_match() — requires Python 3.13+
  verification:
    re_detect: true
  test:
    before: "if path.full_match(\"**/*.py\"):\n    pass\n"
    after: "import fnmatch\nif fnmatch.fnmatch(str(path), \"**/*.py\"):\n    pass\n"
