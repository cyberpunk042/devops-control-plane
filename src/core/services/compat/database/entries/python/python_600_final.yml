# Python — final push to 600

- id: python.stdlib.typing_self_312
  language: python
  feature_name: "typing.Self (3.11+)"
  introduced: "3.11"
  category: typing
  direction: downgrade
  severity: warning
  error_type: import_error
  tags: [typing, self, return]
  detection:
    primary:
      ast_type: ImportFrom
      match: { module: typing, names_contains: Self }
    exclude:
      - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find: { import_module: typing, import_name: Self }
        replace: { import_name: "" }
      - type: add_import
        import_statement: "from typing_extensions import Self"
        condition: not_already_present
    backport: { package: typing-extensions }
  verification: { re_detect: true }
  test:
    before: |
      from typing import Self
    after: |
      from typing_extensions import Self

