- id: python.stdlib.logging_gethandlerbyname
  language: python
  feature_name: "logging.getHandlerByName()"
  introduced: "3.12"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [logging, handler]
  detection:
    primary:
      ast_type: Attribute
      match: { value_id: logging, attr: getHandlerByName }
  fix:
    strategy: manual
    manual_instructions: "Iterate handlers manually."
  verification: { re_detect: true }
  test:
    before: |
      h = logging.getHandlerByName("console")
    after: |
      h = None
      for handler in logging.root.handlers:
          if handler.name == "console": h = handler; break

- id: python.stdlib.pathlib_full_match
  language: python
  feature_name: "Path.full_match()"
  introduced: "3.13"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [pathlib, match, full]
  detection:
    primary:
      ast_type: Call
      match: { func_attr: full_match }
  fix:
    strategy: manual
    manual_instructions: "Use fnmatch.fnmatch() on the full path string."
  verification: { re_detect: true }
  test:
    before: |
      if path.full_match("**/*.py"):
          pass
    after: |
      import fnmatch
      if fnmatch.fnmatch(str(path), "**/*.py"):
          pass

