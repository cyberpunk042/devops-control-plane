- id: python.typing.dataclass_transform
  language: python
  feature_name: typing.dataclass_transform()
  introduced: '3.11'
  category: typing
  description: Decorator for custom dataclass-like decorators
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - dataclass
  - transform
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: dataclass_transform
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: dataclass_transform
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import dataclass_transform
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.1.0
  verification:
    re_detect: true
  test:
    before: 'from typing import dataclass_transform

      @dataclass_transform()

      def my_dataclass(cls): return cls

      '
    after: 'from typing_extensions import dataclass_transform

      @dataclass_transform()

      def my_dataclass(cls): return cls

      '
- id: python.typing.type_var_defaults_312
  language: python
  feature_name: TypeVar with default (PEP 696)
  introduced: '3.13'
  category: typing
  description: Default values for TypeVar, ParamSpec, TypeVarTuple
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - typing
  - typevar
  - default
  detection:
    primary:
      ast_type: Call
      match:
        func_id: TypeVar
        has_keyword: default
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: rewrite_expression
    backport:
      package: typing-extensions
      min_version: 4.12.0
    transforms:
    - type: rewrite_method_call
      find:
        function: TypeVar
      replace:
        note: TypeVar with default (PEP 696) — requires Python 3.13+
  verification:
    re_detect: false
  test:
    before: 'from typing import TypeVar

      T = TypeVar(''T'', default=int)

      '
    after: 'from typing import TypeVar

      T = TypeVar(''T'')

      '
