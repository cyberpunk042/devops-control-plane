- id: python.typing.assert_type
  language: python
  feature_name: typing.assert_type()
  introduced: '3.11'
  category: typing
  description: Assert that a value has a specific type (for type checkers)
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - assert
  - type_checker
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: assert_type
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: assert_type
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import assert_type
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.2.0
  verification:
    re_detect: true
  test:
    before: 'from typing import assert_type

      assert_type(value, int)

      '
    after: 'from typing_extensions import assert_type

      assert_type(value, int)

      '
- id: python.typing.reveal_type_builtin
  language: python
  feature_name: reveal_type() builtin
  introduced: '3.11'
  category: typing
  description: Built-in reveal_type function (previously only in type checkers)
  direction: downgrade
  severity: warning
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - typing
  - reveal
  - debug
  detection:
    primary:
      ast_type: Call
      match:
        func_id: reveal_type
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        function: reveal_type
      replace:
        note: reveal_type() builtin — requires Python 3.11+
  verification:
    re_detect: true
  test:
    before: 'x = reveal_type(compute())

      '
    after: 'x = compute()  # type was revealed during development

      '
- id: python.typing.dataclass_transform
  language: python
  feature_name: typing.dataclass_transform()
  introduced: '3.11'
  category: typing
  description: Decorator for custom dataclass-like decorators
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - dataclass
  - transform
  - decorator
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: dataclass_transform
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: dataclass_transform
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import dataclass_transform
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.1.0
  verification:
    re_detect: true
  test:
