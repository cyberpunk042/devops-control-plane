- id: python.async.task_groups_strict
  language: python
  feature_name: asyncio.TaskGroup strict exception handling
  introduced: '3.12'
  category: stdlib
  description: Improved TaskGroup exception handling in 3.12
  direction: downgrade
  severity: warning
  error_type: behavioral_change
  tags:
  - asyncio
  - taskgroup
  - exceptions
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: TaskGroup
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: TaskGroup
      replace:
        try_import: from asyncio import TaskGroup
        except_import: 'from exceptiongroup import BaseExceptionGroup  # pip install
          exceptiongroup'
  verification:
    re_detect: false
  test:
    before: 'from asyncio import TaskGroup

      '
    after: 'from asyncio import TaskGroup

      '
- id: python.async.timeout
  language: python
  feature_name: asyncio.timeout()
  introduced: '3.11'
  category: stdlib
  description: Async timeout context manager
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - asyncio
  - timeout
  - context_manager
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: timeout
    alternatives:
    - ast_type: Attribute
      match:
        value_id: asyncio
        attr: timeout
  fix:
    strategy: conditional_import
    backport:
      package: async-timeout
      install_command: pip install async-timeout
    transforms:
    - type: conditional_import
      find:
        import_name: timeout
      replace:
        try_import: from asyncio import timeout
        except_import: 'from async_timeout import timeout  # pip install async-timeout'
  verification:
    re_detect: true
  test:
    before: "import asyncio\nasync with asyncio.timeout(5.0):\n    await fetch_data()\n"
    after: 'import asyncio

      await asyncio.wait_for(fetch_data(), timeout=5.0)

      '
