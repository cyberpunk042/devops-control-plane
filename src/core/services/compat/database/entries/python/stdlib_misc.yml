- id: python.stdlib.sys_monitoring
  language: python
  feature_name: sys.monitoring
  introduced: '3.12'
  category: stdlib
  description: Low-impact monitoring API for profilers and debuggers (PEP 669)
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - sys
  - monitoring
  - profiling
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: sys
        attr: monitoring
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: monitoring
      replace:
        try_import: '# sys.monitoring — Python 3.12+'
        except_import: 'pass  # monitoring not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import sys

      sys.monitoring.use_tool_id(1, "profiler")

      '
    after: 'import sys

      sys.settrace(trace_func)

      '
- id: python.stdlib.cbor2_tomllib
  language: python
  feature_name: tomllib (stdlib TOML parser)
  introduced: '3.11'
  category: stdlib
  description: Read-only TOML parser in standard library
  direction: upgrade
  severity: info
  error_type: deprecation_warning
  tags:
  - toml
  - stdlib
  - backport
  - upgrade
  detection:
    primary:
      ast_type: Import
      match:
        names_contains: tomli
    alternatives:
    - ast_type: ImportFrom
      match:
        module: tomli
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_statement
      find:
        import_pattern: import tomli as tomllib
      replace:
        import_statement: import tomllib
    - type: replace_import_statement
      find:
        import_pattern: import tomli
      replace:
        import_statement: import tomllib
  verification:
    re_detect: true
  test:
    before: 'import tomli as tomllib

      '
    after: 'import tomllib

      '
- id: python.stdlib.datetime_utc_upgrade
  language: python
  feature_name: 'datetime.UTC (upgrade: use new shorthand)'
  introduced: '3.11'
  category: stdlib
  description: Replace verbose datetime.timezone.utc with the UTC shorthand
  direction: upgrade
  severity: info
  error_type: deprecation_warning
  tags:
  - datetime
  - timezone
  - upgrade
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: timezone
        attr: utc
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import_and_usages
    transforms:
    - type: replace_import_name
      find:
        import_module: datetime
        import_name: timezone
      replace:
        import_name: UTC
    - type: replace_usage
      find:
        name: timezone.utc
        origin: import
      replace:
        expression: UTC
  verification:
    re_detect: true
  test:
    before: 'from datetime import timezone, datetime

      now = datetime.now(timezone.utc)

      '
    after: 'from datetime import UTC, datetime

      now = datetime.now(UTC)

      '
- id: python.stdlib.strict_zip
  language: python
  feature_name: itertools.pairwise()
  introduced: '3.10'
  category: stdlib
  description: Return successive overlapping pairs from an iterable
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - itertools
  - pairwise
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: itertools
        names_contains: pairwise
  fix:
    strategy: conditional_import
    backport:
      package: more-itertools
      install_command: pip install more-itertools
    transforms:
    - type: conditional_import
      find:
        import_name: pairwise
      replace:
        try_import: from itertools import pairwise
        except_import: 'from more_itertools import pairwise  # pip install more-itertools'
  verification:
    re_detect: true
  test:
    before: "from itertools import pairwise\nfor a, b in pairwise([1, 2, 3]):\n  \
      \  print(a, b)\n"
    after: "import itertools\ndef pairwise(it):\n    a, b = itertools.tee(it)\n  \
      \  next(b, None)\n    return zip(a, b)\nfor a, b in pairwise([1, 2, 3]):\n \
      \   print(a, b)\n"
- id: python.stdlib.int_bit_count
  language: python
  feature_name: int.bit_count()
  introduced: '3.10'
  category: stdlib
  description: Count the number of 1-bits (popcount) in an integer
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - int
  - bits
  - method
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: bit_count
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: bit_count
      replace:
        template: bin({receiver}).count('1')
  verification:
    re_detect: true
  test:
    before: 'count = n.bit_count()

      '
    after: 'count = bin(n).count(''1'')

      '
- id: python.stdlib.dict_union_update
  language: python
  feature_name: dict |= operator
  introduced: '3.9'
  category: stdlib
  description: In-place dictionary merge with |= operator
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: unsupported_operator
  tags:
  - dict
  - merge
  - operator
  - update
  detection:
    primary:
      ast_type: AugAssign
      match:
        op_type: BitOr
      context: runtime
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_augmented_assign
      find:
        operator: '|='
      replace:
        template: '{target}.update({value})'
  verification:
    re_detect: true
  test:
    before: 'config |= extra_settings

      '
    after: 'config.update(extra_settings)

      '
- id: python.stdlib.string_removeprefix_bytes
  language: python
  feature_name: bytes.removeprefix()
  introduced: '3.9'
  category: stdlib
  description: removeprefix method on bytes objects
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - bytes
  - removeprefix
  - method
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: removeprefix
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: removeprefix
      replace:
        template: '{receiver}[len({arg}):]  if {receiver}.startswith({arg}) else {receiver}'
  verification:
    re_detect: true
  test:
    before: 'data = raw.removeprefix(b"header:")

      '
    after: 'data = raw[len(b"header:"):]  if raw.startswith(b"header:") else raw

      '
- id: python.stdlib.importlib_metadata
  language: python
  feature_name: importlib.metadata
  introduced: '3.8'
  category: stdlib
  description: Package metadata access from stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_module
  tags:
  - importlib
  - metadata
  - package
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: importlib.metadata
    alternatives:
    - ast_type: Import
      match:
        names_contains: importlib.metadata
  fix:
    strategy: add_backport_import
    transforms:
    - type: replace_import_statement
      find:
        import_pattern: from importlib.metadata import
      replace:
        import_prefix: from importlib_metadata import
    backport:
      package: importlib-metadata
      min_version: 1.0.0
      install_command: pip install importlib-metadata
      maintains: true
  verification:
    re_detect: true
  test:
    before: 'from importlib.metadata import version

      v = version("my-package")

      '
    after: 'from importlib_metadata import version

      v = version("my-package")

      '
