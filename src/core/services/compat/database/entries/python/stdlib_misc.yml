- id: python.stdlib.functools_cached_property
  language: python
  feature_name: functools.cached_property
  introduced: '3.8'
  category: stdlib
  description: Decorator that converts a method into a cached property
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - functools
  - cached
  - property
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: functools
        names_contains: cached_property
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: cached_property
      replace:
        try_import: from functools import cache
        except_import: from functools import lru_cache; cache = lru_cache(maxsize=None)
  verification:
    re_detect: true
  test:
    before: "from functools import cached_property\nclass Config:\n    @cached_property\n\
      \    def data(self): return load_data()\n"
    after: "class cached_property:\n    def __init__(self, func): self.func = func;\
      \ self.attrname = None\n    def __set_name__(self, owner, name): self.attrname\
      \ = name\n    def __get__(self, instance, owner=None):\n        if instance\
      \ is None: return self\n        val = self.func(instance); setattr(instance,\
      \ self.attrname, val); return val\nclass Config:\n    @cached_property\n   \
      \ def data(self): return load_data()\n"
- id: python.stdlib.shlex_join
  language: python
  feature_name: shlex.join()
  introduced: '3.8'
  category: stdlib
  description: Join a list of tokens into a shell-safe string
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - shlex
  - shell
  - join
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: shlex
        attr: join
    alternatives:
    - ast_type: ImportFrom
      match:
        module: shlex
        names_contains: join
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: join
      replace:
        template: ''' ''.join(shlex.quote(t) for t in {arg})'
  verification:
    re_detect: true
  test:
    before: 'import shlex

      cmd = shlex.join(["echo", "hello world"])

      '
    after: 'import shlex

      cmd = '' ''.join(shlex.quote(t) for t in ["echo", "hello world"])

      '
