- id: python.stdlib.typing_doc
  language: python
  feature_name: typing.Doc
  introduced: '3.13'
  category: typing
  direction: downgrade
  severity: warning
  error_type: import_error
  tags:
  - typing
  - doc
  - annotation
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Doc
    exclude:
    - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: Doc
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import Doc
      condition: not_already_present
    backport:
      package: typing-extensions
  verification:
    re_detect: true
  test:
    before: 'from typing import Doc

      '
    after: 'from typing_extensions import Doc

      '
