- id: python.stdlib.math_sumprod
  language: python
  feature_name: math.sumprod()
  introduced: '3.12'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - math
  - sumprod
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: math
        attr: sumprod
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: sumprod
      replace:
        try_import: '# math.sumprod() — Python 3.12+'
        except_import: 'pass  # sumprod not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'result = math.sumprod(prices, quantities)

      '
    after: 'result = sum(a*b for a,b in zip(prices, quantities))

      '
