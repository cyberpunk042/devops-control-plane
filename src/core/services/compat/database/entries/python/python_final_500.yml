- id: python.stdlib.contextlib_nullcontext
  language: python
  feature_name: "contextlib.nullcontext"
  introduced: "3.7"
  category: stdlib
  description: "No-op context manager"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [contextlib, null, noop]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: contextlib
        names_contains: nullcontext
  fix:
    strategy: manual
    manual_instructions: |
      Implement:
        from contextlib import contextmanager
        @contextmanager
        def nullcontext(enter_result=None):
            yield enter_result
  verification:
    re_detect: true
  test:
    before: |
      from contextlib import nullcontext
    after: |
      from contextlib import contextmanager
      @contextmanager
      def nullcontext(enter_result=None):
          yield enter_result

