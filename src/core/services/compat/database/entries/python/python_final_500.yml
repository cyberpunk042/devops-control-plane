- id: python.stdlib.os_waitstatus_to_exitcode
  language: python
  feature_name: "os.waitstatus_to_exitcode()"
  introduced: "3.9"
  category: stdlib
  description: "Convert wait status to exit code"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [os, process, exitcode]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: os
        attr: waitstatus_to_exitcode
  fix:
    strategy: manual
    manual_instructions: "Use os.WEXITSTATUS(status) if os.WIFEXITED(status) else -os.WTERMSIG(status)"
  verification:
    re_detect: true
  test:
    before: |
      code = os.waitstatus_to_exitcode(status)
    after: |
      code = os.WEXITSTATUS(status) if os.WIFEXITED(status) else -os.WTERMSIG(status)

- id: python.stdlib.itertools_accumulate_init
  language: python
  feature_name: "itertools.accumulate initial parameter"
  introduced: "3.8"
  category: stdlib
  description: "Initial value for accumulate"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [itertools, accumulate, initial]
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: accumulate
  fix:
    strategy: manual
    manual_instructions: "Use itertools.chain([initial], accumulate(...))."
  verification:
    re_detect: false
  test:
    before: |
      sums = list(itertools.accumulate(data, initial=0))
    after: |
      sums = list(itertools.chain([0], itertools.accumulate(data)))

- id: python.stdlib.math_dist
  language: python
  feature_name: "math.dist()"
  introduced: "3.8"
  category: stdlib
  description: "Euclidean distance between two points"
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags: [math, distance, geometry]
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: math
        attr: dist
    alternatives:
      - ast_type: ImportFrom
        match:
          module: math
          names_contains: dist
  fix:
    strategy: manual
    manual_instructions: "math.dist(p, q) → math.sqrt(sum((a-b)**2 for a,b in zip(p,q)))"
  verification:
    re_detect: true
  test:
    before: |
      import math
      d = math.dist([0,0], [3,4])
    after: |
      import math
      d = math.sqrt(sum((a-b)**2 for a,b in zip([0,0], [3,4])))

