  error_type: runtime_error
  tags:
  - itertools
  - accumulate
  - initial
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: accumulate
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: accumulate
      replace:
        note: itertools.accumulate initial parameter — requires Python 3.8+
  verification:
    re_detect: false
  test:
    before: 'sums = list(itertools.accumulate(data, initial=0))

      '
    after: 'sums = list(itertools.chain([0], itertools.accumulate(data)))

      '
- id: python.stdlib.math_dist
  language: python
  feature_name: math.dist()
  introduced: '3.8'
  category: stdlib
  description: Euclidean distance between two points
  direction: downgrade
  severity: error
  error_type: import_error
  error_subtype: missing_name
  tags:
  - math
  - distance
  - geometry
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: math
        attr: dist
    alternatives:
    - ast_type: ImportFrom
      match:
        module: math
        names_contains: dist
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: dist
      replace:
        try_import: '# math.dist() — Python 3.8+'
        except_import: 'pass  # dist not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'import math

      d = math.dist([0,0], [3,4])

      '
    after: 'import math

      d = math.sqrt(sum((a-b)**2 for a,b in zip([0,0], [3,4])))

      '
