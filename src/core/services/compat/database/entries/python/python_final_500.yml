- id: python.stdlib.sqlite3_serialize
  language: python
  feature_name: sqlite3.Connection.serialize/deserialize
  introduced: '3.11'
  category: stdlib
  description: Serialize/deserialize SQLite databases in memory
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - sqlite3
  - serialize
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: serialize
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: serialize
      replace:
        note: sqlite3.Connection.serialize/deserialize — requires Python 3.11+
  verification:
    re_detect: false
  test:
    before: 'data = conn.serialize()

      '
    after: '# Use conn.iterdump()

      '
