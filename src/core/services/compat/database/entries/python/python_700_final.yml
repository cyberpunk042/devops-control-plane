- id: python.stdlib.asyncio_cancelling
  language: python
  feature_name: Task.cancelling()/uncancel()
  introduced: '3.11'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - asyncio
  - cancel
  - task
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: cancelling
    alternatives:
    - ast_type: Call
      match:
        func_attr: uncancel
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: cancelling
      replace:
        note: Task.cancelling()/uncancel() — requires Python 3.11+
  verification:
    re_detect: true
  test:
    before: 'task.cancelling()

      '
    after: '# Use try/except

      '
- id: python.stdlib.asyncio_runner_311
  language: python
  feature_name: asyncio.Runner
  introduced: '3.11'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - asyncio
  - runner
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: asyncio
        names_contains: Runner
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        import_name: Runner
      replace:
        try_import: from asyncio import Runner
        except_import: 'pass  # No backport for Runner'
  verification:
    re_detect: true
  test:
    before: 'from asyncio import Runner

      '
    after: 'import asyncio

      '
- id: python.stdlib.typing_assert_type_312
  language: python
  feature_name: typing.assert_type (3.11)
  introduced: '3.11'
  category: typing
  direction: downgrade
  severity: warning
  error_type: import_error
  tags:
  - typing
  - assert_type
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: assert_type
    exclude:
    - context: type_checking_block
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: assert_type
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import assert_type
      condition: not_already_present
    backport:
      package: typing-extensions
  verification:
    re_detect: true
  test:
    before: 'from typing import assert_type

      '
    after: 'from typing_extensions import assert_type

      '
