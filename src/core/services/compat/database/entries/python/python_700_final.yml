# Python — push to 700

- id: python.stdlib.asyncio_cancelling
  language: python
  feature_name: "Task.cancelling()/uncancel()"
  introduced: "3.11"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [asyncio, cancel, task]
  detection:
    primary: { ast_type: Call, match: { func_attr: cancelling } }
    alternatives:
      - { ast_type: Call, match: { func_attr: uncancel } }
  fix: { strategy: manual, manual_instructions: "Use try/except CancelledError." }
  verification: { re_detect: true }
  test: { before: "task.cancelling()\n", after: "# Use try/except\n" }

