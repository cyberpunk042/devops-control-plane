- id: python.stdlib.typing_assert_type_312
  language: python
  feature_name: "typing.assert_type (3.11)"
  introduced: "3.11"
  category: typing
  direction: downgrade
  severity: warning
  error_type: import_error
  tags: [typing, assert_type]
  detection:
    primary: { ast_type: ImportFrom, match: { module: typing, names_contains: assert_type } }
    exclude: [{ context: type_checking_block }]
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find: { import_module: typing, import_name: assert_type }
        replace: { import_name: "" }
      - type: add_import
        import_statement: "from typing_extensions import assert_type"
        condition: not_already_present
    backport: { package: typing-extensions }
  verification: { re_detect: true }
  test: { before: "from typing import assert_type\n", after: "from typing_extensions import assert_type\n" }

