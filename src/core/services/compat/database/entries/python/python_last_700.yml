- id: python.stdlib.signal_strsignal
  language: python
  feature_name: signal.strsignal()
  introduced: '3.8'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - signal
  - strsignal
  detection:
    primary:
      ast_type: Attribute
      match:
        value_id: signal
        attr: strsignal
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        attribute: strsignal
      replace:
        try_import: '# signal.strsignal() — Python 3.8+'
        except_import: 'pass  # strsignal not available in older Python'
  verification:
    re_detect: true
  test:
    before: 'name = signal.strsignal(sig)

      '
    after: 'name = str(sig)

      '
