- id: python.stdlib.pathlib_with_stem
  language: python
  feature_name: Path.with_stem()
  introduced: '3.9'
  category: stdlib
  description: Return path with a different stem (filename without suffix)
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - pathlib
  - stem
  - rename
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: with_stem
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: with_stem
      replace:
        note: Path.with_stem() — requires Python 3.9+
  verification:
    re_detect: true
  test:
    before: 'new_path = path.with_stem("output")

      '
    after: 'new_path = path.with_name("output" + path.suffix)

      '
