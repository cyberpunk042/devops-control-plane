- id: python.stdlib.pathlib_is_relative_to
  language: python
  feature_name: Path.is_relative_to()
  introduced: '3.9'
  category: stdlib
  description: Check if path is relative to another
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - pathlib
  - relative
  - method
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: is_relative_to
  fix:
    strategy: conditional_import
    transforms:
    - type: rewrite_method_call
      find:
        method: is_relative_to
      replace:
        extract:
          arg: call_args_0
          receiver: call_receiver
        template: '(lambda p, b: p.parts[:len(b.parts)] == b.parts)(Path({receiver}),
          Path({arg}))'
  verification:
    re_detect: true
  test:
    before: "if path.is_relative_to(\"/home\"):\n    process(path)\n"
    after: "try:\n    path.relative_to(\"/home\")\n    is_rel = True\nexcept ValueError:\n\
      \    is_rel = False\nif is_rel:\n    process(path)\n"
- id: python.stdlib.pathlib_readlink
  language: python
  feature_name: Path.readlink()
  introduced: '3.9'
  category: stdlib
  description: Read the target of a symbolic link
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - pathlib
  - symlink
  - readlink
  detection:
    primary:
      ast_type: Call
      match:
        func_attr: readlink
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: readlink
      replace:
        note: Path.readlink() — requires Python 3.9+
  verification:
    re_detect: true
  test:
    before: 'target = link.readlink()

      '
    after: 'import os

      target = Path(os.readlink(str(link)))

      '
