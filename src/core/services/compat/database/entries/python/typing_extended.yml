# Python typing features — extended set (ParamSpec, TypeGuard, Self, Never, etc.)

# ── Python 3.12 ──────────────────────────────────────────────────

- id: python.typing.type_alias_statement
  language: python
  feature_name: "type alias (PEP 695)"
  introduced: "3.12"
  category: typing
  description: "type X = ... syntax for type aliases"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [typing, alias, syntax]
  detection:
    primary:
      ast_type: TypeAlias
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
      - type: rewrite_type_alias
        find:
          ast_type: TypeAlias
        replace:
          template: "{name}: TypeAlias = {value}"
          add_import: "from typing import TypeAlias"
  verification:
    re_detect: true
    syntax_check: true
  test:
    before: |
      type Vector = list[float]
    after: |
      from typing import TypeAlias
      Vector: TypeAlias = list[float]

# ── Python 3.11 ──────────────────────────────────────────────────

- id: python.typing.self_type
  language: python
  feature_name: "typing.Self"
  introduced: "3.11"
  category: typing
  description: "Self type for methods returning the same class"
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags: [typing, self]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Self
    exclude:
      - context: type_checking_block
        reason: "Not executed at runtime"
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find:
          import_module: typing
          import_name: Self
        replace:
          import_name: ""
      - type: add_import
        import_statement: "from typing_extensions import Self"
        condition: not_already_present
    backport:
      package: typing-extensions
      min_version: "4.0.0"
  verification:
    re_detect: true
  test:
    before: |
      from typing import Self
      class Builder:
          def set_name(self, name: str) -> Self: ...
    after: |
      from typing_extensions import Self
      class Builder:
          def set_name(self, name: str) -> Self: ...

- id: python.typing.never_type
  language: python
  feature_name: "typing.Never"
  introduced: "3.11"
  category: typing
  description: "Never type (bottom type) — function never returns"
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags: [typing, never, noreturn]
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: Never
    exclude:
      - context: type_checking_block
        reason: "Not executed at runtime"
  fix:
    strategy: replace_import
    transforms:
      - type: replace_import_name
        find:
          import_module: typing
          import_name: Never
        replace:
          import_name: NoReturn
    backport: null
  verification:
    re_detect: true
  test:
    before: |
      from typing import Never
      def fail() -> Never:
          raise RuntimeError
    after: |
      from typing import NoReturn
      def fail() -> NoReturn:
          raise RuntimeError

