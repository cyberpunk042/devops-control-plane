- id: python.typing.literal_string
  language: python
  feature_name: typing.LiteralString
  introduced: '3.11'
  category: typing
  description: LiteralString type for SQL injection prevention
  direction: downgrade
  severity: warning
  error_type: import_error
  error_subtype: missing_name
  tags:
  - typing
  - literal
  - security
  detection:
    primary:
      ast_type: ImportFrom
      match:
        module: typing
        names_contains: LiteralString
    exclude:
    - context: type_checking_block
      reason: Not executed at runtime
  fix:
    strategy: replace_import
    transforms:
    - type: replace_import_name
      find:
        import_module: typing
        import_name: LiteralString
      replace:
        import_name: ''
    - type: add_import
      import_statement: from typing_extensions import LiteralString
      condition: not_already_present
    backport:
      package: typing-extensions
      min_version: 4.0.0
  verification:
    re_detect: true
  test:
    before: 'from typing import LiteralString

      def query(sql: LiteralString) -> None: ...

      '
    after: 'from typing_extensions import LiteralString

      def query(sql: LiteralString) -> None: ...

      '
