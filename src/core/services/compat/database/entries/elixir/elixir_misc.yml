# Elixir misc features

- id: elixir.1_12.tap
  language: elixir
  feature_name: "Kernel.tap/2"
  introduced: "1.12"
  category: stdlib
  description: "Tap into a pipeline for side effects"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [kernel, tap, pipeline]
  detection:
    primary:
      ast_type: call
      match:
        function: tap
  fix:
    strategy: manual
    manual_instructions: |
      Implement inline:
        value |> tap(&IO.inspect/1)
        → (fn v -> IO.inspect(v); v end).(value)
  verification:
    re_detect: true
  test:
    before: |
      result |> tap(&IO.inspect/1)
    after: |
      result |> (fn v -> IO.inspect(v); v end).()

- id: elixir.1_13.compilation_tracers
  language: elixir
  feature_name: "compilation tracers"
  introduced: "1.13"
  category: stdlib
  description: "Trace compilation events"
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [compilation, tracer]
  detection:
    primary:
      ast_type: call
      match:
        module: Code
        function: put_compiler_option
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      Code.put_compiler_option(:tracers, [MyTracer])
    after: |
      # Not available in older Elixir

- id: elixir.1_17.duration_from_iso
  language: elixir
  feature_name: "Duration.from_iso8601/1"
  introduced: "1.17"
  category: stdlib
  description: "Parse ISO 8601 duration strings"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [duration, iso8601, parse]
  detection:
    primary:
      ast_type: call
      match:
        module: Duration
        function: from_iso8601
  fix:
    strategy: manual
    manual_instructions: "Use Timex.Duration.parse or manual parsing."
  verification:
    re_detect: true
  test:
    before: |
      {:ok, dur} = Duration.from_iso8601("PT1H30M")
    after: |
      # Use Timex: {:ok, dur} = Timex.Duration.parse("PT1H30M")
