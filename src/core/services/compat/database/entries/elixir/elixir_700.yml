- id: elixir.1_13.then_pipe
  language: elixir
  feature_name: then/1 pipe operator
  introduced: '1.12'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - then
  - pipe
  - kernel
  detection:
    primary:
      ast_type: call
      match:
        function: then
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        function: then
      replace:
        note: then/1 pipe operator — elixir 1.12+
  verification:
    re_detect: true
  test:
    before: 'value |> then(&process/1)

      '
    after: 'process(value)

      '
