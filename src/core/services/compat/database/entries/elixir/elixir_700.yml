# Elixir — 700 batch

- id: elixir.1_13.then_pipe
  language: elixir
  feature_name: "then/1 pipe operator"
  introduced: "1.12"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [then, pipe, kernel]
  detection:
    primary: { ast_type: call, match: { function: then } }
  fix: { strategy: manual, manual_instructions: "Use case or anonymous function." }
  verification: { re_detect: true }
  test: { before: "value |> then(&process/1)\n", after: "process(value)\n" }

- id: elixir.1_14.dbg_pipe
  language: elixir
  feature_name: "dbg in pipe"
  introduced: "1.14"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [dbg, pipe, debug]
  detection:
    primary: { ast_type: call, match: { function: dbg } }
  fix: { strategy: manual, manual_instructions: "Replace with IO.inspect." }
  verification: { re_detect: true }
  test: { before: "data |> transform() |> dbg()\n", after: "data |> transform() |> IO.inspect()\n" }

- id: elixir.1_15.utc_datetime_new
  language: elixir
  feature_name: "DateTime.utc_now improvements"
  introduced: "1.15"
  category: stdlib
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [datetime, utc]
  detection:
    primary: { ast_type: call, match: { module: DateTime } }
  fix: { strategy: no_fix_needed }
  verification: { re_detect: false }
  test: { before: "DateTime.utc_now(:second)\n", after: "DateTime.utc_now()\n" }

- id: elixir.1_17.kernel_to_timeout
  language: elixir
  feature_name: "Kernel.to_timeout/1"
  introduced: "1.17"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [kernel, timeout, duration]
  detection:
    primary: { ast_type: call, match: { function: to_timeout } }
  fix: { strategy: manual, manual_instructions: "Convert duration to milliseconds manually." }
  verification: { re_detect: true }
  test: { before: "to_timeout(Duration.new!(second: 30))\n", after: "30_000\n" }
