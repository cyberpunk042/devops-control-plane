# Elixir batch — 800

- id: elixir.1_12.enum_zip_with
  language: elixir
  feature_name: "Enum.zip_with/2"
  introduced: "1.12"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [enum, zip, transform]
  detection: { primary: { ast_type: call, match: { module: Enum, function: zip_with } } }
  fix: { strategy: manual, manual_instructions: "Use Enum.zip then Enum.map." }
  verification: { re_detect: true }
  test: { before: "Enum.zip_with([a, b], fn x, y -> x + y end)\n", after: "Enum.zip(a, b) |> Enum.map(fn {x, y} -> x + y end)\n" }

