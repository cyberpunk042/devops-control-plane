- id: elixir.1_17.calendar_operations
  language: elixir
  feature_name: Calendar operations
  introduced: '1.17'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - calendar
  - operations
  - date
  detection:
    primary:
      ast_type: call
      match:
        module: Calendar
        function_in: &id002
        - before?
        - after?
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        module: Calendar
        function_in: *id002
      replace:
        note: Calendar operations — elixir 1.17+
  verification:
    re_detect: true
  test:
    before: 'Calendar.before?(date1, date2)

      '
    after: 'Date.compare(date1, date2) == :lt

      '
