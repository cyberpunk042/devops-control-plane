- id: elixir.1_12.map_filter_reject
  language: elixir
  feature_name: Map.filter/reject
  introduced: '1.13'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - map
  - filter
  - reject
  detection:
    primary:
      ast_type: call
      match:
        module: Map
        function_in: &id001
        - filter
        - reject
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        module: Map
        function_in: *id001
      replace:
        note: Map.filter/reject — elixir 1.13+
  verification:
    re_detect: true
  test:
    before: 'Map.filter(map, fn {_k, v} -> v > 0 end)

      '
    after: 'map |> Enum.filter(fn {_k, v} -> v > 0 end) |> Map.new()

      '
