# Elixir — push to 600

- id: elixir.1_12.map_filter_reject
  language: elixir
  feature_name: "Map.filter/reject"
  introduced: "1.13"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [map, filter, reject]
  detection:
    primary:
      ast_type: call
      match: { module: Map, function_in: [filter, reject] }
  fix:
    strategy: manual
    manual_instructions: "Use Enum.filter/reject on Map.to_list then Map.new."
  verification: { re_detect: true }
  test:
    before: |
      Map.filter(map, fn {_k, v} -> v > 0 end)
    after: |
      map |> Enum.filter(fn {_k, v} -> v > 0 end) |> Map.new()

- id: elixir.1_14.debugging_improvements
  language: elixir
  feature_name: "debugging improvements"
  introduced: "1.14"
  category: stdlib
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [debug, improvements]
  detection:
    primary:
      ast_type: call
      match: { function: dbg }
  fix:
    strategy: no_fix_needed
  verification: { re_detect: false }
  test:
    before: |
      dbg(value)
    after: |
      IO.inspect(value)

