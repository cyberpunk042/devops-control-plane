- id: elixir.1_17.calendar_operations
  language: elixir
  feature_name: "Calendar operations"
  introduced: "1.17"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [calendar, operations, date]
  detection:
    primary:
      ast_type: call
      match: { module: Calendar, function_in: ["before?", "after?"] }
  fix:
    strategy: manual
    manual_instructions: "Use Date.compare/2 manually."
  verification: { re_detect: true }
  test:
    before: |
      Calendar.before?(date1, date2)
    after: |
      Date.compare(date1, date2) == :lt
