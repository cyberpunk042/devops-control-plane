# Elixir — final for 1000

- id: elixir.1_17.json_module
  language: elixir
  feature_name: "JSON module (stdlib)"
  introduced: "1.18"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [json, stdlib, module]
  detection: { primary: { ast_type: call, match: { module: JSON } } }
  fix: { strategy: manual, manual_instructions: "Use Jason or Poison library." }
  verification: { re_detect: true }
  test: { before: "JSON.encode!(data)\n", after: "Jason.encode!(data)\n" }

