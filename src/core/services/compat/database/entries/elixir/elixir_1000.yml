- id: elixir.1_15.map_intersect
  language: elixir
  feature_name: "Map.intersect/2"
  introduced: "1.15"
  category: stdlib
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [map, intersect, set]
  detection: { primary: { ast_type: call, match: { module: Map, function: intersect } } }
  fix: { strategy: manual, manual_instructions: "Manual: for k <- Map.keys(a), Map.has_key?(b, k), into: %{}, do: {k, a[k]}" }
  verification: { re_detect: true }
  test: { before: "Map.intersect(a, b)\n", after: "# Manual intersection\n" }
