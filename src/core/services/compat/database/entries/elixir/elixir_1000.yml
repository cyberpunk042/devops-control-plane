- id: elixir.1_17.json_module
  language: elixir
  feature_name: JSON module (stdlib)
  introduced: '1.18'
  category: stdlib
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - json
  - stdlib
  - module
  detection:
    primary:
      ast_type: call
      match:
        module: JSON
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call
        module: JSON
      replace:
        note: JSON module (stdlib) — elixir 1.18+
  verification:
    re_detect: true
  test:
    before: 'JSON.encode!(data)

      '
    after: 'Jason.encode!(data)

      '
