- id: js.es2015.symbol_hasinstance
  language: javascript
  feature_name: Symbol.hasInstance
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - symbol
  - hasInstance
  - instanceof
  detection:
    primary:
      ast_type: computed_property_name
      match:
        expression_contains: Symbol.hasInstance
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: computed_property_name
        expression_contains: Symbol.hasInstance
      replace:
        note: Symbol.hasInstance — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'static [Symbol.hasInstance](obj) { return typeof obj === ''number'';
      }

      '
    after: '// Remove custom instanceof

      '
