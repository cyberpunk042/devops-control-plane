# Node.js runtime-specific APIs

- id: node.18.fetch
  language: javascript
  feature_name: "global fetch()"
  introduced: "ES2022"
  category: node_api
  description: "Built-in fetch API in Node.js 18+"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [fetch, http, node]
  detection:
    primary:
      ast_type: call_expression
      match:
        function: fetch
  fix:
    strategy: manual
    manual_instructions: |
      Use node-fetch package:
        npm install node-fetch
        const fetch = require('node-fetch');
      Or use the built-in http/https modules.
    backport:
      package: node-fetch
      install_command: "npm install node-fetch@2"
  verification:
    re_detect: true
  test:
    before: |
      const resp = await fetch('https://api.example.com/data');
    after: |
      const fetch = require('node-fetch');
      const resp = await fetch('https://api.example.com/data');

- id: node.16.abort_controller
  language: javascript
  feature_name: "AbortController (global)"
  introduced: "ES2021"
  category: node_api
  description: "Built-in AbortController in Node.js 16+"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [abort, controller, node]
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor: AbortController
  fix:
    strategy: manual
    manual_instructions: |
      Use abort-controller package:
        npm install abort-controller
        const { AbortController } = require('abort-controller');
    backport:
      package: abort-controller
      install_command: "npm install abort-controller"
  verification:
    re_detect: true
  test:
    before: |
      const controller = new AbortController();
    after: |
      const { AbortController } = require('abort-controller');
      const controller = new AbortController();

- id: node.16.blob
  language: javascript
  feature_name: "Blob (global)"
  introduced: "ES2022"
  category: node_api
  description: "Built-in Blob in Node.js 18+"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [blob, binary, node]
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor: Blob
  fix:
    strategy: manual
    manual_instructions: "Use buffer-based alternatives or the 'blob-polyfill' package."
  verification:
    re_detect: true
  test:
    before: |
      const blob = new Blob(['hello'], { type: 'text/plain' });
    after: |
      const { Blob } = require('buffer');
      const blob = new Blob(['hello'], { type: 'text/plain' });

- id: node.18.structuredclone
  language: javascript
  feature_name: "structuredClone()"
  introduced: "ES2022"
  category: node_api
  description: "Built-in deep clone function"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags: [clone, deep, structured]
  detection:
    primary:
      ast_type: call_expression
      match:
        function: structuredClone
  fix:
    strategy: manual
    manual_instructions: |
      Use JSON parse/stringify for simple objects:
        structuredClone(obj) → JSON.parse(JSON.stringify(obj))
      Or use lodash _.cloneDeep for complex objects.
  verification:
    re_detect: true
  test:
    before: |
      const copy = structuredClone(original);
    after: |
      const copy = JSON.parse(JSON.stringify(original));

- id: node.20.import_meta_resolve
  language: javascript
  feature_name: "import.meta.resolve()"
  introduced: "ES2024"
  category: node_api
  description: "Resolve module specifiers from import.meta"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [import, resolve, module]
  detection:
    primary:
      ast_type: call_expression
      match:
        object_chain: "import.meta"
        method: resolve
  fix:
    strategy: manual
    manual_instructions: "Use require.resolve() or createRequire()."
  verification:
    re_detect: true
  test:
    before: |
      const path = import.meta.resolve('./config.json');
    after: |
      import { createRequire } from 'module';
      const require = createRequire(import.meta.url);
      const path = require.resolve('./config.json');
