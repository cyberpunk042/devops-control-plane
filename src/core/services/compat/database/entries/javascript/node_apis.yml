- id: node.18.fetch
  language: javascript
  feature_name: global fetch()
  introduced: ES2022
  category: node_api
  description: Built-in fetch API in Node.js 18+
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - fetch
  - http
  - node
  detection:
    primary:
      ast_type: call_expression
      match:
        function: fetch
  fix:
    strategy: rewrite_expression
    backport:
      package: node-fetch
      install_command: npm install node-fetch@2
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        function: fetch
      replace:
        note: global fetch() — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const resp = await fetch(''https://api.example.com/data'');

      '
    after: 'const fetch = require(''node-fetch'');

      const resp = await fetch(''https://api.example.com/data'');

      '
