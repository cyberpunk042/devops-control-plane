- id: node.20.import_meta_resolve
  language: javascript
  feature_name: import.meta.resolve()
  introduced: ES2024
  category: node_api
  description: Resolve module specifiers from import.meta
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - import
  - resolve
  - module
  detection:
    primary:
      ast_type: call_expression
      match:
        object_chain: import.meta
        method: resolve
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object_chain: import.meta
        method: resolve
      replace:
        note: import.meta.resolve() — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'const path = import.meta.resolve(''./config.json'');

      '
    after: 'import { createRequire } from ''module'';

      const require = createRequire(import.meta.url);

      const path = require.resolve(''./config.json'');

      '
