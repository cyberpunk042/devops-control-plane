# JavaScript — final push to 500

- id: js.es2015.promise_constructor
  language: javascript
  feature_name: "Promise constructor"
  introduced: "ES2015"
  category: es2015
  description: "new Promise((resolve, reject) => {})"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [promise, constructor]
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor: Promise
  fix:
    strategy: manual
    manual_instructions: "Use es6-promise polyfill."
  verification:
    re_detect: true
  test:
    before: |
      const p = new Promise((resolve) => setTimeout(resolve, 100));
    after: |
      require('es6-promise').polyfill();

- id: js.es2015.array_species
  language: javascript
  feature_name: "Symbol.species"
  introduced: "ES2015"
  category: es2015
  description: "Control constructor used for derived objects"
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags: [symbol, species, subclass]
  detection:
    primary:
      ast_type: computed_property_name
      match:
        expression_contains: "Symbol.species"
  fix:
    strategy: manual
    manual_instructions: "Remove Symbol.species getter. Override specific methods instead."
  verification:
    re_detect: true
  test:
    before: |
      static get [Symbol.species]() { return Array; }
    after: |
      // Override map/filter methods directly

- id: js.es2015.typed_arrays_extensions
  language: javascript
  feature_name: "TypedArray.from/of"
  introduced: "ES2015"
  category: es2015
  description: "Static factory methods for typed arrays"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [typedarray, from, of]
  detection:
    primary:
      ast_type: call_expression
      match:
        method_in: [from, of]
  fix:
    strategy: manual
    manual_instructions: "Create typed array and copy values manually."
  verification:
    re_detect: true
  test:
    before: |
      const u8 = Uint8Array.from([1, 2, 3]);
    after: |
      var u8 = new Uint8Array(3); u8[0]=1; u8[1]=2; u8[2]=3;

- id: js.es2020.optional_chaining_call
  language: javascript
  feature_name: "optional chaining call (?.())"
  introduced: "ES2020"
  category: es2020
  description: "Optional function call: obj.method?.()"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [optional, chaining, call]
  detection:
    primary:
      ast_type: optional_chain_expression
  fix:
    strategy: manual
    manual_instructions: "obj.method?.() → obj.method && obj.method()"
  verification:
    re_detect: true
  test:
    before: |
      obj.callback?.();
    after: |
      obj.callback && obj.callback();

- id: js.es2022.object_hasown
  language: javascript
  feature_name: "Object.hasOwn()"
  introduced: "ES2022"
  category: es2022
  description: "Replacement for Object.prototype.hasOwnProperty"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [object, hasown, property]
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Object
        method: hasOwn
  fix:
    strategy: manual
    manual_instructions: "Object.hasOwn(obj, prop) → Object.prototype.hasOwnProperty.call(obj, prop)"
  verification:
    re_detect: true
  test:
    before: |
      if (Object.hasOwn(obj, 'key')) { use(obj.key); }
    after: |
      if (Object.prototype.hasOwnProperty.call(obj, 'key')) { use(obj.key); }

- id: js.es2015.tail_position
  language: javascript
  feature_name: "proper tail position"
  introduced: "ES2015"
  category: es2015
  description: "Tail call optimization in strict mode"
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [tail_call, optimization]
  detection:
    primary:
      ast_type: return_statement
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: |
      return recurse(n-1);
    after: |
      return recurse(n-1);

- id: php.8_2.dnf_types
  language: php
  feature_name: "DNF types ((A&B)|C)"
  introduced: "8.2"
  category: syntax
  description: "Disjunctive Normal Form types"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [types, dnf, intersection]
  detection:
    primary:
      ast_type: disjunctive_normal_form_type
  fix:
    strategy: manual
    manual_instructions: "Remove compound type. Use PHPDoc."
  verification:
    re_detect: true
  test:
    before: |
      function process((A&B)|C $input): void {}
    after: |
      /** @param A&B|C $input */
      function process($input): void {}

- id: ruby.3_3.range_reverse_each
  language: ruby
  feature_name: "Range#reverse_each on non-integer"
  introduced: "3.3"
  category: stdlib
  description: "reverse_each works on all comparable ranges"
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags: [range, reverse, iteration]
  detection:
    primary:
      ast_type: call
      match:
        method: reverse_each
  fix:
    strategy: manual
    manual_instructions: "Use .to_a.reverse.each for non-integer ranges."
  verification:
    re_detect: true
  test:
    before: |
      ("a".."z").reverse_each { |c| puts c }
    after: |
      ("a".."z").to_a.reverse.each { |c| puts c }

- id: elixir.1_15.set_operations_enum
  language: elixir
  feature_name: "Enum set-like operations"
  introduced: "1.15"
  category: stdlib
  description: "New Enum functions for set operations"
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [enum, set, operations]
  detection:
    primary:
      ast_type: call
      match:
        module: Enum
        function_in: [product, zip_with]
  fix:
    strategy: manual
    manual_instructions: "Implement with Enum.flat_map or manual loops."
  verification:
    re_detect: true
  test:
    before: |
      Enum.product([[1,2], [3,4]])
    after: |
      for a <- [1,2], b <- [3,4], do: {a, b}

- id: go.1_23.range_over_int
  language: go
  feature_name: "range over integer (1.22+)"
  introduced: "1.22"
  category: syntax
  description: "for i := range N"
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [range, integer, loop]
  detection:
    primary:
      ast_type: for_statement
      match:
        range_over_int: true
  fix:
    strategy: manual
    manual_instructions: "for i := range N → for i := 0; i < N; i++"
  verification:
    re_detect: true
  test:
    before: |
      for i := range 10 { fmt.Println(i) }
    after: |
      for i := 0; i < 10; i++ { fmt.Println(i) }

- id: java.21.scoped_values
  language: java
  feature_name: "ScopedValue (preview)"
  introduced: "21"
  category: api
  description: "Scoped values for structured concurrency"
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [scoped, concurrency, preview]
  detection:
    primary:
      ast_type: import_declaration
      match:
        path_contains: "java.lang.ScopedValue"
  fix:
    strategy: manual
    manual_instructions: "Use ThreadLocal instead."
  verification:
    re_detect: true
  test:
    before: |
      import java.lang.ScopedValue;
    after: |
      // Use ThreadLocal

- id: java.21.structured_concurrency
  language: java
  feature_name: "StructuredTaskScope (preview)"
  introduced: "21"
  category: api
  description: "Structured concurrency API"
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [structured, concurrency, preview]
  detection:
    primary:
      ast_type: import_declaration
      match:
        path_contains: "StructuredTaskScope"
  fix:
    strategy: manual
    manual_instructions: "Use ExecutorService with Future."
  verification:
    re_detect: true
  test:
    before: |
      import java.util.concurrent.StructuredTaskScope;
    after: |
      import java.util.concurrent.ExecutorService;

- id: ts.5_4.noinfer
  language: typescript
  feature_name: "NoInfer<T> utility type"
  introduced: "5.4"
  category: ts5
  description: "Prevent inference at specific positions"
  direction: downgrade
  severity: warning
  error_type: type_error
  tags: [noinfer, type, utility]
  detection:
    primary:
      ast_type: type_reference
      match:
        name: NoInfer
  fix:
    strategy: manual
    manual_instructions: "Remove NoInfer wrapper — accept wider inference."
  verification:
    re_detect: true
  test:
    before: |
      function createConfig<T>(defaults: T, overrides: NoInfer<T>): T { ... }
    after: |
      function createConfig<T>(defaults: T, overrides: T): T { ... }
