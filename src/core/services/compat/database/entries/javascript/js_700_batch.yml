# JavaScript batch — 700

- id: js.es2015.regexp_flags
  language: javascript
  feature_name: "RegExp.prototype.flags"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [regexp, flags, property]
  detection:
    primary: { ast_type: member_expression, match: { property: flags } }
  fix: { strategy: manual, manual_instructions: "Use regex.toString().match(/[gimsuy]*$/)[0]." }
  verification: { re_detect: true }
  test: { before: "const f = /test/gi.flags;\n", after: "var f = /test/gi.toString().match(/[gimsuy]*$/)[0];\n" }

