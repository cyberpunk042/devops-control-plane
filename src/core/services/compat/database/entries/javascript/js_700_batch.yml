- id: js.es2019.array_flat_depth
  language: javascript
  feature_name: "Array.prototype.flat(depth)"
  introduced: "ES2019"
  category: es2019
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [array, flat, depth]
  detection:
    primary: { ast_type: call_expression, match: { method: flat } }
  fix: { strategy: manual, manual_instructions: "Use recursive flatten function." }
  verification: { re_detect: true }
