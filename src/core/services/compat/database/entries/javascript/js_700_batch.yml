- id: js.es2015.regexp_flags
  language: javascript
  feature_name: RegExp.prototype.flags
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - regexp
  - flags
  - property
  detection:
    primary:
      ast_type: member_expression
      match:
        property: flags
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: member_expression
        property: flags
      replace:
        note: RegExp.prototype.flags — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const f = /test/gi.flags;

