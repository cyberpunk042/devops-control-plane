# JavaScript — final for 800

- id: js.es2015.for_of_iterators
  language: javascript
  feature_name: "for...of with custom iterators"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [for_of, iterator, custom]
  detection: { primary: { ast_type: for_in_statement, match: { kind: of } } }
  fix: { strategy: manual, manual_instructions: "Use toArray() and for loop." }
  verification: { re_detect: true }
  test: { before: "for (const x of iter) {}\n", after: "var arr = iter.toArray(); for (var i=0;i<arr.length;i++) {}\n" }

