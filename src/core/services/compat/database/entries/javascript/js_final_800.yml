- id: js.es2020.nullish_assign_2
  language: javascript
  feature_name: nullish coalescing in assignments
  introduced: ES2020
  category: es2020
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - nullish
  - coalescing
  - assign
  detection:
    primary:
      ast_type: binary_expression
      match:
        operator: ??
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: binary_expression
        operator: ??
      replace:
        note: nullish coalescing in assignments — javascript ES2020+
  verification:
    re_detect: true
  test:
    before: 'const v = a ?? b;

      '
    after: 'var v = (a !== null && a !== undefined) ? a : b;

      '
- id: js.es2023.find_last_index
  language: javascript
  feature_name: Array.prototype.findLastIndex()
  introduced: ES2023
  category: es2023
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - array
  - findLast
  - index
  detection:
    primary:
      ast_type: call_expression
      match:
        method: findLastIndex
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: findLastIndex
      replace:
        note: Array.prototype.findLastIndex() — javascript ES2023+
  verification:
    re_detect: true
  test:
    before: 'const idx = arr.findLastIndex(fn);

      '
    after: 'var idx=-1; for(var i=arr.length-1;i>=0;i--){if(fn(arr[i])){idx=i;break}}

      '
