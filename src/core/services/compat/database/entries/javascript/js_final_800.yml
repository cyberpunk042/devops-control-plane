- id: js.es2024.set_difference
  language: javascript
  feature_name: "Set.prototype.difference()"
  introduced: "ES2024"
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [set, difference]
  detection: { primary: { ast_type: call_expression, match: { method: difference } } }
  fix: { strategy: manual, manual_instructions: "new Set([...a].filter(x => !b.has(x)))" }
  verification: { re_detect: true }
  test: { before: "const d = setA.difference(setB);\n", after: "var d = new Set([...setA].filter(function(x){return !setB.has(x)}));\n" }

