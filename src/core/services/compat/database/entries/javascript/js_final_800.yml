- id: js.es2015.for_of_iterators
  language: javascript
  feature_name: for...of with custom iterators
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - for_of
  - iterator
  - custom
  detection:
    primary:
      ast_type: for_in_statement
      match:
        kind: of
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: for_in_statement
        kind: of
      replace:
        note: for...of with custom iterators — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'for (const x of iter) {}

      '
    after: 'var arr = iter.toArray(); for (var i=0;i<arr.length;i++) {}

      '
- id: js.es2015.class_accessor
  language: javascript
  feature_name: class getter/setter
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - getter
  - setter
  detection:
    primary:
      ast_type: method_definition
      match:
        kind_in: &id001
        - get
        - set
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_definition
        kind_in: *id001
      replace:
        note: class getter/setter — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'class C { get x() { return 1; } }

      '
    after: 'function C(){} Object.defineProperty(C.prototype,''x'',{get:function(){return
      1}});

      '
