  tags: [nullish, coalescing, assign]
  detection: { primary: { ast_type: binary_expression, match: { operator: "??" } } }
  fix: { strategy: manual, manual_instructions: "x ?? y → (x !== null && x !== undefined) ? x : y" }
  verification: { re_detect: true }
  test: { before: "const v = a ?? b;\n", after: "var v = (a !== null && a !== undefined) ? a : b;\n" }

- id: js.es2023.find_last_index
