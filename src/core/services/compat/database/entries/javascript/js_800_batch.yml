- id: js.es2015.class_extends_expr
  language: javascript
  feature_name: class extends expression
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - extends
  - expression
  detection:
    primary:
      ast_type: class_declaration
      match:
        has_extends: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: class_declaration
        has_extends: true
      replace:
        note: class extends expression — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'class Foo extends Bar {}

      '
    after: 'function Foo(){Bar.call(this)}

      Foo.prototype=Object.create(Bar.prototype);

      '
- id: js.es2015.computed_method_names
  language: javascript
  feature_name: computed method names
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - computed
  - method
  - name
  detection:
    primary:
      ast_type: method_definition
      match:
        has_computed_key: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_definition
        has_computed_key: true
      replace:
        note: computed method names — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const obj = { [key]() {} };

      '
    after: 'var obj = {}; obj[key] = function() {};

      '
