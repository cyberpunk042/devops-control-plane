# JavaScript batch — 800

- id: js.es2015.class_extends_expr
  language: javascript
  feature_name: "class extends expression"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [class, extends, expression]
  detection: { primary: { ast_type: class_declaration, match: { has_extends: true } } }
  fix: { strategy: manual, manual_instructions: "Use prototype chain." }
  verification: { re_detect: true }
  test: { before: "class Foo extends Bar {}\n", after: "function Foo(){Bar.call(this)}\nFoo.prototype=Object.create(Bar.prototype);\n" }

