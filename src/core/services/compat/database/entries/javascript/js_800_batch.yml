  error_type: runtime_error
  tags:
  - set
  - union
  - method
  detection:
    primary:
      ast_type: call_expression
      match:
        method: union
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: union
      replace:
        note: Set.prototype.union() — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'const u = setA.union(setB);

      '
    after: 'var u = new Set([...setA, ...setB]);

      '
