      '
- id: js.es2018.rest_object
  language: javascript
  feature_name: object rest in destructuring
  introduced: ES2018
  category: es2018
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - rest
  - object
  - destructuring
  detection:
    primary:
      ast_type: rest_pattern
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: rest_pattern
      replace:
        note: object rest in destructuring — javascript ES2018+
  verification:
    re_detect: false
  test:
    before: 'const {a, ...rest} = obj;

      '
    after: 'var a=obj.a; var rest={}; Object.keys(obj).forEach(function(k){if(k!==''a'')rest[k]=obj[k]});

      '
- id: js.es2019.object_from_entries
  language: javascript
  feature_name: Object.fromEntries()
  introduced: ES2019
  category: es2019
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - object
  - fromEntries
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Object
        method: fromEntries
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Object
        method: fromEntries
      replace:
        note: Object.fromEntries() — javascript ES2019+
  verification:
    re_detect: true
  test:
    before: 'Object.fromEntries(pairs);

      '
    after: 'pairs.reduce(function(o,p){o[p[0]]=p[1];return o},{});

      '
