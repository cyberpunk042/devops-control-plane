- id: js.es2018.rest_object
  language: javascript
  feature_name: "object rest in destructuring"
  introduced: "ES2018"
  category: es2018
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [rest, object, destructuring]
  detection: { primary: { ast_type: rest_pattern } }
  fix: { strategy: manual, manual_instructions: "Manually extract remaining properties." }
