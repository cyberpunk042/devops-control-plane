# JavaScript — last for 900

- id: js.es2015.unicode_regex
  language: javascript
  feature_name: "Unicode in identifiers"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags: [unicode, identifiers]
  detection: { primary: { ast_type: identifier } }
  fix: { strategy: no_fix_needed }
  verification: { re_detect: false }
  test: { before: "const π = Math.PI;\n", after: "const pi = Math.PI;\n" }

- id: js.es2015.well_known_symbol_tostringtag
  language: javascript
  feature_name: "Symbol.toStringTag"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [symbol, toStringTag]
  detection: { primary: { ast_type: computed_property_name, match: { expression_contains: "Symbol.toStringTag" } } }
  fix: { strategy: manual, manual_instructions: "Override toString() method." }
  verification: { re_detect: true }
  test: { before: "get [Symbol.toStringTag]() { return 'MyClass'; }\n", after: "toString() { return '[object MyClass]'; }\n" }

- id: js.es2015.well_known_symbol_toprimitive
  language: javascript
  feature_name: "Symbol.toPrimitive"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [symbol, toPrimitive]
  detection: { primary: { ast_type: computed_property_name, match: { expression_contains: "Symbol.toPrimitive" } } }
  fix: { strategy: manual, manual_instructions: "Use valueOf() and toString()." }
  verification: { re_detect: true }
  test: { before: "[Symbol.toPrimitive](hint) { return hint === 'number' ? this.value : this.name; }\n", after: "valueOf() { return this.value; } toString() { return this.name; }\n" }

