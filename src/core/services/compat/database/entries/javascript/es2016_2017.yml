- id: js.es2016.array_includes_typed
  language: javascript
  feature_name: TypedArray.prototype.includes()
  introduced: ES2016
  category: es2016
  description: includes() on typed arrays
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - typedarray
  - includes
  detection:
    primary:
      ast_type: call_expression
      match:
        method: includes
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: includes
      replace:
        note: TypedArray.prototype.includes() — javascript ES2016+
  verification:
    re_detect: true
  test:
    before: 'const found = uint8.includes(0xFF);

      '
    after: 'const found = uint8.indexOf(0xFF) !== -1;

      '
- id: js.es2017.async_generator
  language: javascript
  feature_name: async generator functions
  introduced: ES2017
  category: es2017
  description: async function* generators
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - async
  - generator
  - function
  detection:
    primary:
      ast_type: generator_function_declaration
      match:
        async: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: generator_function_declaration
        async: true
      replace:
        note: async generator functions — javascript ES2017+
  verification:
    re_detect: true
  test:
    before: "async function* readChunks(stream) {\n  for await (const chunk of stream)\
      \ yield chunk;\n}\n"
    after: "async function readChunks(stream) {\n  const chunks = [];\n  // manual\
      \ async iteration\n  return chunks;\n}\n"
- id: js.es2017.object_keys_order
  language: javascript
  feature_name: Object property order guarantee
  introduced: ES2017
  category: es2017
  description: Integer keys first (sorted), then string keys (insertion order)
  direction: downgrade
  severity: info
  error_type: behavioral_change
  tags:
  - object
  - order
  - keys
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Object
        method: keys
  fix:
    strategy: no_fix_needed
  verification:
    re_detect: false
  test:
    before: 'const keys = Object.keys(obj);

      '
    after: 'const keys = Object.keys(obj);

      '
- id: js.es2015.proxy
  language: javascript
  feature_name: Proxy
  introduced: ES2015
  category: es2015
  description: Meta-programming with Proxy objects
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - proxy
  - metaprogramming
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor: Proxy
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: new_expression
        constructor: Proxy
      replace:
        note: Proxy — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const handler = { get: (target, prop) => prop in target ? target[prop]
      : 42 };

      const proxy = new Proxy({}, handler);

      '
    after: '// Use Object.defineProperty for computed properties

      '
