- id: js.es2015.array_find
  language: javascript
  feature_name: Array.prototype.find/findIndex
  introduced: ES2015
  category: es2015
  description: Find element matching a predicate
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - array
  - find
  - method
  detection:
    primary:
      ast_type: call_expression
      match:
        method_in: &id002
        - find
        - findIndex
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method_in: *id002
      replace:
        note: Array.prototype.find/findIndex — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const user = users.find(u => u.id === targetId);

      '
    after: 'var user; for (var i = 0; i < users.length; i++) { if (users[i].id ===
      targetId) { user = users[i]; break; } }

      '
