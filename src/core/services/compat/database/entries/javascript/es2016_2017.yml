- id: js.es2015.number_methods
  language: javascript
  feature_name: Number.isFinite/isNaN/isInteger/isSafeInteger
  introduced: ES2015
  category: es2015
  description: Static Number methods
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - number
  - methods
  - static
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Number
        method_in: &id001
        - isFinite
        - isNaN
        - isInteger
        - isSafeInteger
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Number
        method_in: *id001
      replace:
        note: Number.isFinite/isNaN/isInteger/isSafeInteger — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'if (Number.isFinite(value)) { process(value); }

      '
    after: 'if (typeof value === ''number'' && isFinite(value)) { process(value);
      }

      '
- id: js.es2015.array_from
  language: javascript
