# JavaScript batch — 900

- id: js.es2015.class_expression
  language: javascript
  feature_name: "class expression"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [class, expression]
  detection: { primary: { ast_type: class } }
  fix: { strategy: manual, manual_instructions: "Convert to constructor function." }
  verification: { re_detect: true }
  test: { before: "const Foo = class {};\n", after: "var Foo = function() {};\n" }

