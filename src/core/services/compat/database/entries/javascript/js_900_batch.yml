- id: js.es2024.promise_try
  language: javascript
  feature_name: "Promise.try()"
  introduced: "ES2025"
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [promise, try, sync]
  detection: { primary: { ast_type: call_expression, match: { object: Promise, method: try } } }
  fix: { strategy: manual, manual_instructions: "Promise.try(fn) → new Promise(resolve => resolve(fn()))" }
  verification: { re_detect: true }
  test: { before: "Promise.try(() => compute())\n", after: "new Promise(resolve => resolve(compute()))\n" }

