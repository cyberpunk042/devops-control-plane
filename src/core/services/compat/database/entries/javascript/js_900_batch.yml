- id: js.es2015.class_expression
  language: javascript
  feature_name: class expression
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - expression
  detection:
    primary:
      ast_type: class
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: class
      replace:
        note: class expression — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const Foo = class {};

      '
    after: 'var Foo = function() {};

      '
