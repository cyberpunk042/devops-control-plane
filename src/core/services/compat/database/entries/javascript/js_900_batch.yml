    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: arguments
        has_trailing_comma: true
      replace:
        note: trailing commas in arguments — javascript ES2017+
  verification:
    re_detect: true
  test:
    before: 'foo(a, b,);

      '
    after: 'foo(a, b);

      '
- id: js.es2019.json_stringify_wellformed
