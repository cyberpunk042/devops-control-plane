- id: js.es2015.array_copywithin
  language: javascript
  feature_name: Array.prototype.copyWithin()
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - array
  - copyWithin
  detection:
    primary:
      ast_type: call_expression
      match:
        method: copyWithin
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: copyWithin
      replace:
        note: Array.prototype.copyWithin() — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'arr.copyWithin(0, 3, 5);

      '
    after: '// Manual splice + copy

      '
