- id: js.es2021.logical_assignment
  language: javascript
  feature_name: logical assignment (&&=, ||=, ??=)
  introduced: ES2021
  category: es2021
  description: Logical assignment operators
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - operator
  - assignment
  detection:
    primary:
      ast_type: assignment_expression
      match:
        operator_in:
        - '&&='
        - '||='
        - ??=
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_logical_assignment
      find:
        operator_in:
        - '&&='
        - '||='
        - ??=
      replace:
        template_and: '{left} = {left} && {right}'
        template_or: '{left} = {left} || {right}'
        template_nullish: '{left} = ({left} !== null && {left} !== undefined) ? {left}
          : {right}'
  verification:
    re_detect: true
  test:
    before: 'config.debug &&= isDevMode();

      config.name ||= ''default'';

      config.timeout ??= 3000;

      '
    after: 'config.debug = config.debug && isDevMode();

      config.name = config.name || ''default'';

      config.timeout = (config.timeout !== null && config.timeout !== undefined) ?
      config.timeout : 3000;

      '
- id: js.es2021.replaceall
  language: javascript
  feature_name: String.prototype.replaceAll()
  introduced: ES2021
  category: es2021
  description: Replace all occurrences of a string
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - string
  - method
  detection:
    primary:
      ast_type: call_expression
      match:
        method: replaceAll
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: replaceAll
      replace:
        template: '{receiver}.split({arg}).join({arg2})'
  verification:
    re_detect: true
  test:
    before: 'const clean = input.replaceAll(''-'', ''_'');

      '
    after: 'const clean = input.split(''-'').join(''_'');

      '
- id: js.es2021.promise_any
  language: javascript
  feature_name: Promise.any()
  introduced: ES2021
  category: es2021
  description: Resolves when any promise resolves, rejects when all reject
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - promise
  - async
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Promise
        method: any
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Promise
        method: any
      replace:
        note: Promise.any() — javascript ES2021+
  verification:
    re_detect: true
  test:
    before: 'const first = await Promise.any([fetch(url1), fetch(url2)]);

      '
    after: 'const first = await Promise.any([fetch(url1), fetch(url2)]);

      '
