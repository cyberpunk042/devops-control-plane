- id: js.es2022.top_level_await
  language: javascript
  feature_name: top-level await
  introduced: ES2022
  category: es2022
  description: await at module top level without wrapping in async function
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - async
  - await
  - module
  detection:
    primary:
      ast_type: await_expression
      context: module_level
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: await_expression
      replace:
        note: top-level await — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const config = await loadConfig();

      export default config;

      '
    after: "let config;\n(async () => {\n  config = await loadConfig();\n})();\nexport\
      \ default config;\n"
- id: js.es2022.array_at
  language: javascript
  feature_name: Array.prototype.at()
  introduced: ES2022
  category: es2022
  description: Access array elements with negative indices
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - array
  - method
  detection:
    primary:
      ast_type: call_expression
      match:
        method: at
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        method: at
      replace:
        template: '{receiver}[{arg} < 0 ? {receiver}.length + {arg} : {arg}]'
  verification:
    re_detect: true
  test:
    before: 'const last = arr.at(-1);

      '
    after: 'const last = arr[-1 < 0 ? arr.length + -1 : -1];

      '
- id: js.es2022.error_cause
  language: javascript
  feature_name: Error cause
  introduced: ES2022
  category: es2022
  description: Pass cause option when creating errors
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - error
  - cause
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor_in: &id001
        - Error
        - TypeError
        - RangeError
        - SyntaxError
        - ReferenceError
        has_options_arg: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: new_expression
        constructor_in: *id001
        has_options_arg: true
      replace:
        note: Error cause — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'throw new Error("Failed", { cause: originalError });

      '
    after: 'const err = new Error("Failed");

      err.cause = originalError;

      throw err;

      '
- id: js.es2022.class_static_block
  language: javascript
  feature_name: class static initialization block
  introduced: ES2022
  category: es2022
  description: static { } block in class body for complex initialization
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - static
  - initialization
  detection:
    primary:
      ast_type: static_block
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: static_block
      replace:
        note: class static initialization block — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: "class Config {\n  static debug;\n  static { Config.debug = process.env.DEBUG\
      \ === 'true'; }\n}\n"
    after: "class Config {\n  static debug;\n}\nConfig.debug = process.env.DEBUG ===\
      \ 'true';\n"
- id: js.es2023.findlast
  language: javascript
  feature_name: Array.prototype.findLast()
  introduced: ES2023
  category: es2023
  description: Find the last matching element in an array
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - array
  - method
  - search
  detection:
    primary:
      ast_type: call_expression
      match:
        method_in: &id002
        - findLast
        - findLastIndex
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method_in: *id002
      replace:
        note: Array.prototype.findLast() — javascript ES2023+
  verification:
    re_detect: true
  test:
    before: 'const lastEven = numbers.findLast(n => n % 2 === 0);

      '
    after: 'const lastEven = [...numbers].reverse().find(n => n % 2 === 0);

      '
- id: js.es2023.change_array_by_copy
  language: javascript
  feature_name: toSorted/toReversed/toSpliced/with
  introduced: ES2023
  category: es2023
  description: Non-mutating array methods
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - array
  - method
  - immutable
  detection:
    primary:
      ast_type: call_expression
      match:
        method_in: &id003
        - toSorted
        - toReversed
        - toSpliced
    alternatives:
    - ast_type: call_expression
      match:
        method: with
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method_in: *id003
      replace:
        note: toSorted/toReversed/toSpliced/with — javascript ES2023+
  verification:
    re_detect: true
  test:
    before: 'const sorted = data.toSorted((a, b) => a - b);

      '
    after: 'const sorted = [...data].sort((a, b) => a - b);

      '
