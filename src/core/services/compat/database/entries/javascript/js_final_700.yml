- id: js.es2015.regexp_unicode
  language: javascript
  feature_name: RegExp u flag
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - regexp
  - unicode
  - flag
  detection:
    primary:
      ast_type: regex
      match:
        flags_contains: u
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: regex
        flags_contains: u
      replace:
        note: RegExp u flag — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: '/\u{1F600}/u.test(str);

      '
    after: '/\uD83D\uDE00/.test(str);

      '
