- id: js.es2024.temporal
  language: javascript
  feature_name: "Temporal API (proposal)"
  introduced: "ES2025"
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [temporal, date, time]
  detection:
    primary: { ast_type: member_expression, match: { object: Temporal } }
  fix: { strategy: manual, manual_instructions: "Use Luxon, date-fns, or moment.js." }
