  detection:
    primary:
      ast_type: call_expression
      match:
        object: Object
        method: values
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Object
        method: values
      replace:
        note: Object.values() — javascript ES2017+
  verification:
    re_detect: true
  test:
    before: 'Object.values(obj);

      '
    after: 'Object.keys(obj).map(function(k){return obj[k]});

      '
- id: js.es2018.rest_properties
  language: javascript
  feature_name: rest properties in destructuring
  introduced: ES2018
  category: es2018
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - rest
  - destructuring
  - object
  detection:
    primary:
      ast_type: rest_pattern
      context: object_pattern
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: rest_pattern
      replace:
        note: rest properties in destructuring — javascript ES2018+
  verification:
    re_detect: true
  test:
    before: 'const { a, ...rest } = obj;

      '
    after: 'var a = obj.a; var rest = {}; for(var k in obj) if(k!==''a'') rest[k]=obj[k];

      '
