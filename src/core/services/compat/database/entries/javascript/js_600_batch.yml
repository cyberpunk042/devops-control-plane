        method_in: &id001
        - isWellFormed
        - toWellFormed
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method_in: *id001
      replace:
        note: String.prototype.isWellFormed/toWellFormed — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'if (str.isWellFormed()) { safe(str); }

      '
    after: 'try { encodeURIComponent(str); safe(str); } catch(e) {}

      '
