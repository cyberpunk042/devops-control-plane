- id: js.es2015.iterator_return
  language: javascript
  feature_name: Iterator.return()
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - iterator
  - return
  - protocol
  detection:
    primary:
      ast_type: call_expression
      match:
        method: return
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: return
      replace:
        note: Iterator.return() — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'iter.return();

      '
    after: '// Manual cleanup

      '
