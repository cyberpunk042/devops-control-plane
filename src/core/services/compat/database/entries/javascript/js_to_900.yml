- id: js.es2015.re_export
  language: javascript
  feature_name: re-export (export from)
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - export
  - from
  - reexport
  detection:
    primary:
      ast_type: export_statement
      match:
        has_source: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: export_statement
        has_source: true
      replace:
        note: re-export (export from) — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'export { foo } from ''./bar'';

      '
    after: 'module.exports.foo = require(''./bar'').foo;

      '
