      find:
        ast_type: export_statement
      replace:
        note: named exports — javascript ES2015+
  verification:
    re_detect: false
  test:
    before: 'export function foo() {}

      '
    after: 'module.exports.foo = function() {};

      '
- id: js.es2015.import_named
  language: javascript
  feature_name: named imports
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - import
  - named
  - module
  detection:
    primary:
      ast_type: import_statement
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        ast_type: import_statement
      replace:
        note: named imports — javascript ES2015+
  verification:
    re_detect: false
  test:
    before: 'import { foo } from ''bar'';

      '
    after: 'const { foo } = require(''bar'');

      '
