- id: js.es2022.private_static_methods
  language: javascript
  feature_name: private static methods
  introduced: ES2022
  category: es2022
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - private
  - static
  detection:
    primary:
      ast_type: method_definition
      match:
        is_static: true
        has_private_name: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_definition
        is_static: true
        has_private_name: true
      replace:
        note: private static methods — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'class Foo { static #helper() {} }

      '
    after: 'function _helper() {} class Foo {}

      '
- id: js.es2024.decorator_metadata
  language: javascript
  feature_name: decorator metadata API
  introduced: ES2024
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - decorator
  - metadata
  detection:
    primary:
      ast_type: member_expression
      match:
        object: Symbol
        property: metadata
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: member_expression
        object: Symbol
        property: metadata
      replace:
        note: decorator metadata API — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'Symbol.metadata

      '
    after: 'const metadata = new WeakMap();

      '
- id: js.node.timers_promises
  language: javascript
  feature_name: timers/promises
  introduced: ES2022
  category: node_api
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - timers
  - promises
  - node
  detection:
    primary:
      ast_type: import_statement
      match:
        source_contains: timers/promises
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        ast_type: import_statement
      replace:
        note: timers/promises — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'import { setTimeout } from ''timers/promises'';

      '
    after: 'const { promisify } = require(''util'');

      const setTimeout = promisify(require(''timers'').setTimeout);

      '
