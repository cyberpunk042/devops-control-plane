- id: js.es2015.iterable_destructuring
  language: javascript
  feature_name: iterable destructuring
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - iterable
  - destructuring
  detection:
    primary:
      ast_type: array_pattern
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: array_pattern
      replace:
        note: iterable destructuring — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const [a, b] = arr;

      '
    after: 'var a = arr[0], b = arr[1];

      '
- id: js.es2015.default_export
  language: javascript
  feature_name: export default
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - export
  - default
  - module
  detection:
    primary:
      ast_type: export_statement
      match:
        is_default: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: export_statement
        is_default: true
      replace:
        note: export default — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'export default class Foo {}

      '
    after: 'module.exports = function Foo() {};

      '
- id: js.es2015.named_export
  language: javascript
  feature_name: named exports
  introduced: ES2015
  category: es2015
  direction: downgrade
