# JavaScript — push to 900

- id: js.es2015.iterable_destructuring
  language: javascript
  feature_name: "iterable destructuring"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [iterable, destructuring]
  detection: { primary: { ast_type: array_pattern } }
  fix: { strategy: manual, manual_instructions: "Manual index access." }
  verification: { re_detect: true }
  test: { before: "const [a, b] = arr;\n", after: "var a = arr[0], b = arr[1];\n" }

- id: js.es2015.default_export
  language: javascript
  feature_name: "export default"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [export, default, module]
  detection: { primary: { ast_type: export_statement, match: { is_default: true } } }
  fix: { strategy: manual, manual_instructions: "module.exports = value;" }
  verification: { re_detect: true }
  test: { before: "export default class Foo {}\n", after: "module.exports = function Foo() {};\n" }

- id: js.es2015.named_export
  language: javascript
  feature_name: "named exports"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [export, named, module]
  detection: { primary: { ast_type: export_statement } }
  fix: { strategy: manual, manual_instructions: "module.exports.name = value;" }
  verification: { re_detect: false }
  test: { before: "export function foo() {}\n", after: "module.exports.foo = function() {};\n" }

- id: js.es2015.import_named
  language: javascript
  feature_name: "named imports"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [import, named, module]
  detection: { primary: { ast_type: import_statement } }
  fix: { strategy: manual, manual_instructions: "const { name } = require('module');" }
  verification: { re_detect: false }
  test: { before: "import { foo } from 'bar';\n", after: "const { foo } = require('bar');\n" }

- id: js.es2015.import_default
  language: javascript
  feature_name: "default import"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [import, default, module]
  detection: { primary: { ast_type: import_statement } }
  fix: { strategy: manual, manual_instructions: "const mod = require('module');" }
  verification: { re_detect: false }
  test: { before: "import React from 'react';\n", after: "const React = require('react');\n" }

- id: js.es2015.import_star
  language: javascript
  feature_name: "namespace import (* as)"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [import, namespace, star]
  detection: { primary: { ast_type: import_statement } }
  fix: { strategy: manual, manual_instructions: "const mod = require('module');" }
  verification: { re_detect: false }
  test: { before: "import * as utils from './utils';\n", after: "const utils = require('./utils');\n" }

- id: js.es2015.re_export
  language: javascript
  feature_name: "re-export (export from)"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [export, from, reexport]
  detection: { primary: { ast_type: export_statement, match: { has_source: true } } }
  fix: { strategy: manual, manual_instructions: "const x = require('mod'); module.exports.x = x;" }
  verification: { re_detect: true }
  test: { before: "export { foo } from './bar';\n", after: "module.exports.foo = require('./bar').foo;\n" }

- id: js.es2020.export_star_as
  language: javascript
  feature_name: "export * as namespace"
  introduced: "ES2020"
  category: es2020
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [export, namespace, star]
  detection: { primary: { ast_type: export_statement, match: { has_namespace: true } } }
  fix: { strategy: manual, manual_instructions: "module.exports.ns = require('mod');" }
  verification: { re_detect: true }
  test: { before: "export * as ns from './mod';\n", after: "module.exports.ns = require('./mod');\n" }

- id: js.es2022.private_static_methods
  language: javascript
  feature_name: "private static methods"
  introduced: "ES2022"
  category: es2022
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [class, private, static]
  detection: { primary: { ast_type: method_definition, match: { is_static: true, has_private_name: true } } }
  fix: { strategy: manual, manual_instructions: "Use module-scoped function." }
  verification: { re_detect: true }
  test: { before: "class Foo { static #helper() {} }\n", after: "function _helper() {} class Foo {}\n" }

- id: js.es2024.decorator_metadata
  language: javascript
  feature_name: "decorator metadata API"
  introduced: "ES2024"
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [decorator, metadata]
  detection: { primary: { ast_type: member_expression, match: { object: Symbol, property: metadata } } }
  fix: { strategy: manual, manual_instructions: "Use WeakMap for metadata storage." }
  verification: { re_detect: true }
  test: { before: "Symbol.metadata\n", after: "const metadata = new WeakMap();\n" }

- id: js.node.timers_promises
  language: javascript
  feature_name: "timers/promises"
  introduced: "ES2022"
  category: node_api
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [timers, promises, node]
  detection: { primary: { ast_type: import_statement, match: { source_contains: "timers/promises" } } }
  fix: { strategy: manual, manual_instructions: "Use promisify(setTimeout)." }
  verification: { re_detect: true }
  test: { before: "import { setTimeout } from 'timers/promises';\n", after: "const { promisify } = require('util');\nconst setTimeout = promisify(require('timers').setTimeout);\n" }
