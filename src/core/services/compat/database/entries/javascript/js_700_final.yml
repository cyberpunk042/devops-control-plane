# JavaScript — final for 700

- id: js.es2015.promise_then
  language: javascript
  feature_name: "Promise.prototype.then"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [promise, then]
  detection:
    primary: { ast_type: call_expression, match: { method: then } }
  fix: { strategy: manual, manual_instructions: "Use callback pattern." }
  verification: { re_detect: false }
  test: { before: "p.then(ok, err);\n", after: "p.then(ok, err);\n" }

