- id: js.es2015.promise_then
  language: javascript
  feature_name: Promise.prototype.then
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - promise
  - then
  detection:
    primary:
      ast_type: call_expression
      match:
        method: then
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: then
      replace:
        note: Promise.prototype.then — javascript ES2015+
  verification:
    re_detect: false
  test:
    before: 'p.then(ok, err);

      '
    after: 'p.then(ok, err);

      '
