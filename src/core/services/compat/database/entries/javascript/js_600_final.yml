- id: js.es2024.map_groupby
  language: javascript
  feature_name: Map.groupBy()
  introduced: ES2024
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - map
  - group
  - method
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Map
        method: groupBy
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Map
        method: groupBy
      replace:
        note: Map.groupBy() — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'const grouped = Map.groupBy(items, fn);

      '
    after: 'const grouped = items.reduce((m, i) => { const k = fn(i); m.has(k) ? m.get(k).push(i)
      : m.set(k, [i]); return m; }, new Map());

      '
- id: js.node.test_runner
  language: javascript
  feature_name: node:test built-in test runner
  introduced: ES2022
  category: node_api
  direction: downgrade
  severity: error
  error_type: import_error
  tags:
  - node
  - test
  - runner
  detection:
    primary:
      ast_type: import_statement
      match:
        source_contains: node:test
    alternatives:
    - ast_type: call_expression
      match:
        function: require
        arg_contains: node:test
  fix:
    strategy: conditional_import
    transforms:
    - type: conditional_import
      find:
        ast_type: import_statement
      replace:
        note: node:test built-in test runner — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'import { test, describe } from ''node:test'';

      '
    after: 'const { describe, it: test } = require(''mocha'');

      '
