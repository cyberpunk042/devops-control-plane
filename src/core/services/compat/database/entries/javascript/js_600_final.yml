- id: js.es2015.generator_return_value
  language: javascript
  feature_name: "generator return value"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [generator, return, value]
  detection:
    primary:
      ast_type: generator_function
  fix:
    strategy: manual
    manual_instructions: "Convert to state machine or array builder."
  verification: { re_detect: true }
  test:
    before: |
      function* range(n) { for (let i = 0; i < n; i++) yield i; }
    after: |
      function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }

- id: js.es2015.array_from_mapfn
  language: javascript
  feature_name: "Array.from with mapFn"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [array, from, map]
  detection:
    primary:
      ast_type: call_expression
      match: { object: Array, method: from }
  fix:
    strategy: manual
    manual_instructions: "Use Array.prototype.map.call() or manual loop."
  verification: { re_detect: true }
  test:
    before: |
      const nums = Array.from({length: 5}, (_, i) => i);
    after: |
      var nums = []; for (var i = 0; i < 5; i++) nums.push(i);
