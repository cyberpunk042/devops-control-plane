      throw new Error("failed", { cause: err });
    after: |
      const e = new Error("failed"); e.cause = err; throw e;

- id: js.es2024.map_groupby
  language: javascript
  feature_name: "Map.groupBy()"
  introduced: "ES2024"
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [map, group, method]
  detection:
    primary:
      ast_type: call_expression
      match: { object: Map, method: groupBy }
  fix:
    strategy: manual
    manual_instructions: "Use reduce() to group into a Map."
  verification: { re_detect: true }
  test:
    before: |
      const grouped = Map.groupBy(items, fn);
    after: |
      const grouped = items.reduce((m, i) => { const k = fn(i); m.has(k) ? m.get(k).push(i) : m.set(k, [i]); return m; }, new Map());

- id: js.node.test_runner
  language: javascript
  feature_name: "node:test built-in test runner"
  introduced: "ES2022"
  category: node_api
  direction: downgrade
  severity: error
  error_type: import_error
  tags: [node, test, runner]
  detection:
    primary:
      ast_type: import_statement
      match: { source_contains: "node:test" }
    alternatives:
      - ast_type: call_expression
        match: { function: require, arg_contains: "node:test" }
  fix:
    strategy: manual
    manual_instructions: "Use jest, mocha, or tap."
  verification: { re_detect: true }
  test:
    before: |
      import { test, describe } from 'node:test';
    after: |
      const { describe, it: test } = require('mocha');

