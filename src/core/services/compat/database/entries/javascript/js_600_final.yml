- id: js.es2015.weakmap_methods
  language: javascript
  feature_name: WeakMap methods
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - weakmap
  - methods
  detection:
    primary:
      ast_type: call_expression
      match:
        method_in: &id001
        - has
        - get
        - set
        - delete
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method_in: *id001
      replace:
        note: WeakMap methods — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'weakmap.set(key, value);

      '
    after: '// Use Map with manual cleanup

      '
