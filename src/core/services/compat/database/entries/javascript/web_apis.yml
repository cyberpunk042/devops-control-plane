- id: js.web.urlpattern
  language: javascript
  feature_name: URLPattern
  introduced: ES2024
  category: node_api
  description: Pattern matching for URLs
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - url
  - pattern
  - routing
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor: URLPattern
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: new_expression
        constructor: URLPattern
      replace:
        note: URLPattern — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'const pattern = new URLPattern({ pathname: ''/users/:id'' });

      '
    after: 'const { pathToRegexp } = require(''path-to-regexp'');

      '
- id: js.web.url_canparse
  language: javascript
  feature_name: URL.canParse()
  introduced: ES2024
  category: node_api
  description: Check if string is a valid URL without throwing
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - url
  - validation
  - parse
  detection:
    primary:
      ast_type: call_expression
      match:
        object: URL
        method: canParse
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: URL
        method: canParse
      replace:
        note: URL.canParse() — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'if (URL.canParse(input)) { process(new URL(input)); }

      '
    after: 'let isValid; try { new URL(input); isValid = true; } catch { isValid =
      false; }

      if (isValid) { process(new URL(input)); }

      '
- id: js.web.navigator_useragentdata
  language: javascript
  feature_name: navigator.userAgentData
  introduced: ES2022
  category: node_api
  description: Structured user agent information
  direction: downgrade
  severity: warning
  error_type: runtime_error
  tags:
  - navigator
  - useragent
  - browser
  detection:
    primary:
      ast_type: member_expression
      match:
        object: navigator
        property: userAgentData
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: member_expression
        object: navigator
        property: userAgentData
      replace:
        note: navigator.userAgentData — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const mobile = navigator.userAgentData.mobile;

      '
    after: 'const mobile = /Mobile|Android/.test(navigator.userAgent);

      '
- id: js.web.compression_streams
  language: javascript
  feature_name: CompressionStream/DecompressionStream
  introduced: ES2022
  category: node_api
  description: Built-in compression using streams
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - compression
  - stream
  - gzip
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor_in: &id001
        - CompressionStream
        - DecompressionStream
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: new_expression
        constructor_in: *id001
      replace:
        note: CompressionStream/DecompressionStream — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const cs = new CompressionStream(''gzip'');

      '
    after: 'const zlib = require(''zlib'');

      '
- id: js.web.readable_stream
  language: javascript
  feature_name: ReadableStream (global)
  introduced: ES2022
  category: node_api
  description: Web Streams API globally available
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - stream
  - readable
  - web
  detection:
    primary:
      ast_type: new_expression
      match:
        constructor: ReadableStream
  fix:
    strategy: rewrite_expression
    backport:
      package: web-streams-polyfill
      install_command: npm install web-streams-polyfill
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: new_expression
        constructor: ReadableStream
      replace:
        note: ReadableStream (global) — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const stream = new ReadableStream({ pull(controller) { ... } });

      '
    after: 'const { Readable } = require(''stream'');

      '
- id: js.web.crypto_randomuuid
  language: javascript
  feature_name: crypto.randomUUID()
  introduced: ES2022
  category: node_api
  description: Generate UUID v4
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - crypto
  - uuid
  - random
  detection:
    primary:
      ast_type: call_expression
      match:
        method: randomUUID
  fix:
    strategy: rewrite_expression
    backport:
      package: uuid
      install_command: npm install uuid
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: randomUUID
      replace:
        note: crypto.randomUUID() — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const id = crypto.randomUUID();

      '
    after: 'const { v4: uuidv4 } = require(''uuid'');

      const id = uuidv4();

      '
- id: js.web.at_method_string
  language: javascript
  feature_name: String.prototype.at()
  introduced: ES2022
  category: es2022
  description: Access string characters with negative indices
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - string
  - at
  - method
  detection:
    primary:
      ast_type: call_expression
      match:
        method: at
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: at
      replace:
        note: String.prototype.at() — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const last = str.at(-1);

      '
    after: 'const last = str.charAt(str.length - 1);

      '
