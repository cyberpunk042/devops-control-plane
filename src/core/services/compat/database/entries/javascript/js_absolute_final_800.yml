# JavaScript — absolute final for 800

- id: js.es2015.class_static_methods
  language: javascript
  feature_name: "class static methods"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [class, static, methods]
  detection: { primary: { ast_type: method_definition, match: { is_static: true } } }
  fix: { strategy: manual, manual_instructions: "Move to function on constructor: Foo.method = function() {}" }
  verification: { re_detect: true }
  test: { before: "class Foo { static bar() {} }\n", after: "function Foo(){} Foo.bar = function(){};\n" }

- id: js.es2015.class_constructor
  language: javascript
  feature_name: "class constructor()"
  introduced: "ES2015"
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags: [class, constructor]
  detection: { primary: { ast_type: method_definition, match: { kind: constructor } } }
  fix: { strategy: manual, manual_instructions: "Use constructor function pattern." }
  verification: { re_detect: true }
  test: { before: "class Foo { constructor(x) { this.x = x; } }\n", after: "function Foo(x) { this.x = x; }\n" }

