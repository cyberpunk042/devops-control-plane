- id: js.es2024.iterator_helpers
  language: javascript
  feature_name: Iterator helpers (map/filter/take/etc.)
  introduced: ES2024
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - iterator
  - helpers
  - lazy
  detection:
    primary:
      ast_type: call_expression
      match:
        method_in: &id001
        - map
        - filter
        - take
        - drop
        - flatMap
        - reduce
        - toArray
        - forEach
        - some
        - every
        - find
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method_in: *id001
      replace:
        note: Iterator helpers (map/filter/take/etc.) — javascript ES2024+
  verification:
    re_detect: false
  test:
    before: 'iter.map(fn).filter(pred).toArray();

      '
    after: '[...iter].map(fn).filter(pred);

      '
