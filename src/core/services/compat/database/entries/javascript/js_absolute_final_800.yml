- id: js.es2024.set_isdisjoint
  language: javascript
  feature_name: Set.prototype.isDisjointFrom()
  introduced: ES2024
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - set
  - disjoint
  detection:
    primary:
      ast_type: call_expression
      match:
        method: isDisjointFrom
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        method: isDisjointFrom
      replace:
        note: Set.prototype.isDisjointFrom() — javascript ES2024+
  verification:
    re_detect: true
  test:
    before: 'setA.isDisjointFrom(setB);

      '
    after: '![...setA].some(function(x){return setB.has(x)});

      '
