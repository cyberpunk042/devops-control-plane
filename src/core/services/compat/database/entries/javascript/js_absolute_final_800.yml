- id: js.es2024.set_isdisjoint
  language: javascript
  feature_name: "Set.prototype.isDisjointFrom()"
  introduced: "ES2024"
  category: es2024
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags: [set, disjoint]
  detection: { primary: { ast_type: call_expression, match: { method: isDisjointFrom } } }
  fix: { strategy: manual, manual_instructions: "![...a].some(x => b.has(x))" }
  verification: { re_detect: true }
  test: { before: "setA.isDisjointFrom(setB);\n", after: "![...setA].some(function(x){return setB.has(x)});\n" }

- id: js.es2015.promise_catch
