- id: js.es2015.class_static_methods
  language: javascript
  feature_name: class static methods
  introduced: ES2015
  category: es2015
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - static
  - methods
  detection:
    primary:
      ast_type: method_definition
      match:
        is_static: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_definition
        is_static: true
      replace:
        note: class static methods — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'class Foo { static bar() {} }

      '
    after: 'function Foo(){} Foo.bar = function(){};

      '
