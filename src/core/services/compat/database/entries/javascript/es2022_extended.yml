- id: js.es2022.private_fields
  language: javascript
  feature_name: class private fields (#)
  introduced: ES2022
  category: es2022
  description: 'Private class fields with # prefix'
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - private
  - fields
  detection:
    primary:
      ast_type: private_property_identifier
      match: {}
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: private_property_identifier
      replace:
        note: class private fields (#) — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: "class Counter {\n  #count = 0;\n  increment() { this.#count++; }\n  get\
      \ value() { return this.#count; }\n}\n"
    after: "class Counter {\n  constructor() { this._count = 0; }\n  increment() {\
      \ this._count++; }\n  get value() { return this._count; }\n}\n"
- id: js.es2022.private_methods
  language: javascript
  feature_name: class private methods (#method)
  introduced: ES2022
  category: es2022
  description: 'Private class methods with # prefix'
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - class
  - private
  - methods
  detection:
    primary:
      ast_type: method_definition
      match:
        has_private_name: true
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: method_definition
        has_private_name: true
      replace:
        note: class private methods (#method) — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: "class Service {\n  #validate(data) { return data.length > 0; }\n  process(data)\
      \ { if (this.#validate(data)) { work(data); } }\n}\n"
    after: "class Service {\n  _validate(data) { return data.length > 0; }\n  process(data)\
      \ { if (this._validate(data)) { work(data); } }\n}\n"
- id: js.es2022.in_private
  language: javascript
  feature_name: private field 'in' check (#field in obj)
  introduced: ES2022
  category: es2022
  description: Check if private field exists on an object
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - private
  - in
  - check
  detection:
    primary:
      ast_type: binary_expression
      match:
        operator: in
        left_type: private_property_identifier
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: binary_expression
        operator: in
        left_type: private_property_identifier
      replace:
        note: private field 'in' check (#field in obj) — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'if (#brand in obj) { handle(obj); }

      '
    after: 'try { obj.brand; handle(obj); } catch(e) {}

      '
- id: js.es2022.regexp_d_flag
  language: javascript
  feature_name: RegExp d flag (hasIndices)
  introduced: ES2022
  category: es2022
  description: Match indices in regex results
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - regex
  - indices
  - flag
  detection:
    primary:
      ast_type: regex
      match:
        flags_contains: d
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: regex
        flags_contains: d
      replace:
        note: RegExp d flag (hasIndices) — javascript ES2022+
  verification:
    re_detect: true
  test:
    before: 'const match = /(?<name>\w+)/d.exec(str);

      const [start, end] = match.indices.groups.name;

      '
    after: 'const match = /(?<name>\w+)/.exec(str);

      const start = match.index;

      const end = start + match[0].length;

      '
