- id: js.es2015.number_epsilon
  language: javascript
  feature_name: Number.EPSILON/MAX_SAFE_INTEGER/MIN_SAFE_INTEGER
  introduced: ES2015
  category: es2015
  description: Number constants for precision and safety
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_name
  tags:
  - number
  - constants
  - precision
  detection:
    primary:
      ast_type: member_expression
      match:
        object: Number
        property_in: &id002
        - EPSILON
        - MAX_SAFE_INTEGER
        - MIN_SAFE_INTEGER
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: member_expression
        object: Number
        property_in: *id002
      replace:
        note: Number.EPSILON/MAX_SAFE_INTEGER/MIN_SAFE_INTEGER — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'if (Math.abs(a - b) < Number.EPSILON) { equal(); }

      '
    after: 'Number.EPSILON = Number.EPSILON || 2.220446049250313e-16;

      if (Math.abs(a - b) < Number.EPSILON) { equal(); }

      '
