# JavaScript Promise/async patterns across versions

- id: js.es2015.promise_race
  language: javascript
  feature_name: "Promise.race()"
  introduced: "ES2015"
  category: es2015
  description: "Race between multiple promises"
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags: [promise, race, async]
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Promise
        method: race
  fix:
    strategy: manual
    manual_instructions: "Use es6-promise polyfill or callback-based race pattern."
  verification:
    re_detect: true
  test:
    before: |
      const first = await Promise.race([fetch(url1), fetch(url2)]);
    after: |
      require('es6-promise').polyfill();
      var first = await Promise.race([fetch(url1), fetch(url2)]);

- id: js.es2015.promise_all
  language: javascript
  feature_name: "Promise.all()"
  introduced: "ES2015"
  category: es2015
