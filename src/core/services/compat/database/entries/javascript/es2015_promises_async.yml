- id: js.es2020.promise_allsettled_2
  language: javascript
  feature_name: Promise.allSettled() usage patterns
  introduced: ES2020
  category: es2020
  description: Common allSettled patterns for error handling
  direction: downgrade
  severity: error
  error_type: runtime_error
  tags:
  - promise
  - allsettled
  - error_handling
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Promise
        method: allSettled
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Promise
        method: allSettled
      replace:
        note: Promise.allSettled() usage patterns — javascript ES2020+
  verification:
    re_detect: true
  test:
    before: 'const results = await Promise.allSettled(tasks);

      const failures = results.filter(r => r.status === ''rejected'');

      '
    after: "const results = await Promise.all(tasks.map(function(p) {\n  return p.then(function(v)\
      \ { return {status:'fulfilled',value:v}; },\n                function(e) { return\
      \ {status:'rejected',reason:e}; });\n}));\n"
- id: js.es2015.iterator_for_of
  language: javascript
  feature_name: for...of with iterables
  introduced: ES2015
  category: es2015
  description: Iterate over any iterable (Set, Map, generators, etc.)
  direction: downgrade
  severity: error
  error_type: syntax_error
  tags:
  - iterator
  - for_of
  - iterable
  detection:
    primary:
      ast_type: for_in_statement
      match:
        kind: of
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_syntax
      find:
        ast_type: for_in_statement
        kind: of
      replace:
        note: for...of with iterables — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'for (const item of set) { process(item); }

      '
    after: 'set.forEach(function(item) { process(item); });

      '
