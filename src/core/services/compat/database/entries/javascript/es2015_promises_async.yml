- id: js.es2015.promise_race
  language: javascript
  feature_name: Promise.race()
  introduced: ES2015
  category: es2015
  description: Race between multiple promises
  direction: downgrade
  severity: error
  error_type: runtime_error
  error_subtype: missing_method
  tags:
  - promise
  - race
  - async
  detection:
    primary:
      ast_type: call_expression
      match:
        object: Promise
        method: race
  fix:
    strategy: rewrite_expression
    transforms:
    - type: rewrite_method_call
      find:
        ast_type: call_expression
        object: Promise
        method: race
      replace:
        note: Promise.race() — javascript ES2015+
  verification:
    re_detect: true
  test:
    before: 'const first = await Promise.race([fetch(url1), fetch(url2)]);

      '
    after: 'require(''es6-promise'').polyfill();

      var first = await Promise.race([fetch(url1), fetch(url2)]);

      '
